>Semana 23<\/h1><p class=\"tema\">Ferramentas e tecnologias NoSQL<\/p><p class=\"frase\">Instalar e dar os primeiros comandos<\/p><\/div><h2>① <b>As 4 ferramentas:<\/b> <i>Como acessar<\/i><\/h2><p><b>MongoDB:<\/b> Documento. <code>mongod<\/code> (servidor) e <code>mongosh<\/code> ou Compass. Porta 27017.<\/p><p><b>Cassandra:<\/b> Colunas. <code>cassandra -f<\/code> e <code>cqlsh<\/code>. Teste com <code>nodetool status<\/code>. Exige Java JDK 8+ e Python.<\/p><p><b>Redis:<\/b> Chave-valor. <code>redis-server<\/code> e <code>redis-cli<\/code>. Teste: <code>PING<\/code> responde <code>PONG<\/code>.<\/p><p><b>Neo4j:<\/b> Grafo. Neo4j Browser em localhost:7474.<\/p><p><b>Sem instalar:<\/b> onecompiler.com (Redis), AstraDB (Cassandra na nuvem), Atlas (MongoDB).<\/p><h2>② <b>MongoDB e Cassandra:<\/b> <i>Primeiras estruturas<\/i><\/h2><p><b>MongoDB:<\/b> Banco → coleção → documento. Não há FK: a aplicação confere.<\/p><p><b>Referências:<\/b> Economizam espaço e a mudança é feita em um lugar só.<\/p><p><b>Keyspace:<\/b> Parecido com um banco de dados. Nasce com a estratégia de replicação.<\/p><p><b>replication_factor 3:<\/b> 3 cópias de cada dado.<\/p><p><b>Estratégia:<\/b> SimpleStrategy para testes. NetworkTopologyStrategy para produção com vários data centers.<\/p><p><b>CQL:<\/b> Parece SQL, mas sem JOIN e sem FK.<\/p><pre style=\"height:128px\"><code>use estoque\ndb.produtos.find({ estoque: { $gt: 15 } })\n\nCREATE KEYSPACE ecommerce\n  WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};<\/code><\/pre><h2>③ <b>Redis:<\/b> <i>Chave-valor na memória<\/i><\/h2><p><b>Velocidade:<\/b> Vive na RAM. Ideal para cache, sessão e contadores.<\/p><p><b>Persistência RDB:<\/b> Grava \"fotos\" no disco para sobreviver a um reinício.<\/p><pre style=\"height:128px\"><code>SET user_count 100     # cria ou atualiza\nGET user_count         # \"100\"\nINCR user_count        # 101\nEXISTS user_count      # 1 = existe, 0 = não existe\nEXPIRE page_visits 3600   # some em 1 hora<\/code><\/pre><h2>④ <b>Neo4j:<\/b> <i>Nós, relacionamentos e Cypher<\/i><\/h2><p><b>Notação:<\/b> <code>( )<\/code> = nó, <code>[:TIPO]<\/code> = relacionamento, <code>-&gt;<\/code> = direção.<\/p><p><b>Cuidado:<\/b> <code>CREATE (u)-[:LIKES]-&gt;(p)<\/code> sem <code>MATCH<\/code> cria nós novos e vazios.<\/p><pre style=\"height:96px\"><code>CREATE (u:User {name: 'John Doe', age: 28})\nMATCH (u:User {name: 'John Doe'}), (p:Post {title: 'Post sobre Grafos'})\nCREATE (u)-[:LIKES]-&gt;(p)<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Cada ferramenta tem seu shell e sua linguagem: mongosh (MongoDB), cqlsh (CQL), redis-cli (comandos) e Neo4j Browser (Cypher). Antes de digitar, confira em qual banco ou keyspace você está.<\/p>", "qs": [{ "q": "Qual é a principal vantagem do Redis em relação aos bancos de dados tradicionais em disco?", "o": ["Permite persistir dados em discos.", "Armazena dados em memória.", "Armazena dados permanentemente.", "Oferece suporte nativo para transações complexas, como bancos relacionais."], "t": "per" }, { "q": "Qual comando do Redis é utilizado para verificar se uma chave existe no banco de dados?", "o": ["GET", "DEL", "SET", "EXISTS"], "t": "per" }, { "q": "Qual é a vantagem de usar a expiração de chaves no Redis?", "o": ["Permite que os dados sejam armazenados permanentemente.", "Permite que dados temporários expirem com o tempo.", "Garante que os dados armazenados sejam persistidos em disco.", "Impede que dados sejam sobrescritos por novos valores."], "t": "per" }, { "q": "Qual é o cliente de linha de comando atual do MongoDB?", "o": ["mongo", "mongosh", "cqlsh", "redis-cli"], "t": "mc" }, { "q": "Como testar se o Redis está funcionando?", "o": ["Enviar PING e receber PONG", "Rodar nodetool status", "Abrir localhost:7474", "Rodar db.produtos.find()"], "t": "mc" }, { "q": "O que replication_factor 3 significa no Cassandra?", "o": ["3 tabelas por keyspace", "3 usuários conectados", "3 cópias de cada dado", "3 consultas por segundo"], "t": "mc" }, { "q": "No Cypher, como se representa um relacionamento?", "o": ["(:TIPO)", "{TIPO}", "<TIPO>", "[:TIPO]"], "t": "mc" }, { "q": "O que o comando db.produtos.find({ estoque: { $gt: 15 } }) faz?", "o": ["Apaga produtos com estoque acima de 15", "Atualiza o estoque para 15", "Busca produtos com estoque maior que 15", "Cria 15 produtos novos"], "t": "mc" }, { "q": "Escreva os comandos Redis para criar um contador de visitas com valor 1, somar mais uma visita e fazer a chave expirar em 1 hora.", "o": null, "t": "ab" }, { "q": "Para cada situação diga a ferramenta: catálogo com campos variados, dado temporário em milissegundos, quem segue quem.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Operações em bancos NoSQL", "frase": "CRUD, agregação e estruturas", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Operações em bancos NoSQL<\/p><p class=\"frase\">CRUD, agregação e estruturas<\/p><\/div><h2>① <b>MongoDB: CRUD:<\/b> <i>Criar, ler, alterar, apagar<\/i><\/h2><p><b>Create:<\/b> <code>insertOne<\/code> / <code>insertMany<\/code>.<\/p><p><b>Read:<\/b> <code>find()<\/code> / <code>find({filtro})<\/code>. Parecido com SELECT WHERE.<\/p><p><b>Update:<\/b> <code>updateOne<\/code> / <code>updateMany<\/code> com <code>$set<\/code> ou <code>$inc<\/code>.<\/p><p><b>Delete:<\/b> <code>deleteOne<\/code> / <code>deleteMany<\/code> pelo filtro.<\/p><p><b>Comparação:<\/b> <code>{ preco: { $gt: 3000 } }<\/code>. Operadores: <code>$gt $gte $lt $lte<\/code>.<\/p><p><b>Perigo:<\/b> <code>updateMany<\/code> ou <code>deleteMany<\/code> com filtro vazio <code>{}<\/code> afeta TODOS os documentos.<\/p><h2>② <b>MongoDB: índices e agregação:<\/b> <i>Esteira de dados<\/i><\/h2><p><b>Índice:<\/b> Sumário do banco. Acelera consultas, mas ocupa memória e pesa na escrita.<\/p><p><b>Estágios:<\/b> <code>$match<\/code> filtra, <code>$lookup<\/code> junta coleções, <code>$unwind<\/code> abre um array, <code>$group<\/code> agrupa, <code>$sort<\/code> ordena, <code>$project<\/code> escolhe campos.<\/p><p><b>Atenção ao $:<\/b> <code>\"regiao\"<\/code> é texto fixo. <code>\"$regiao\"<\/code> é o campo.<\/p><pre style=\"height:128px\"><code>db.Vendas.createIndex({ dataVenda: 1 })\ndb.Vendas.aggregate([\n  { $group: { _id: \"$regiao\",\n              totalVendas: { $sum: \"$precoTotal\" } } }\n])<\/code><\/pre><h2>③ <b>Cassandra:<\/b> <i>Uma tabela por consulta<\/i><\/h2><p><b>Desnormalizar:<\/b> Sem JOIN, cria-se uma tabela por consulta, repetindo dados.<\/p><p><b>Partition key:<\/b> Decide o nó.<\/p><p><b>Clustering key:<\/b> Ordena dentro da partição.<\/p><p><b>Custo:<\/b> Atualizar o cliente exige mexer em vários lugares.<\/p><p><b>Filtro:<\/b> Filtrar por coluna fora da chave sem índice dá erro.<\/p><h2>④ <b>Redis:<\/b> <i>As 4 estruturas<\/i><\/h2><p><b>String:<\/b> <code>SET produto:123:nome \"Camiseta\"<\/code>. Valor simples.<\/p><p><b>Lista:<\/b> <code>LPUSH vendidos \"Calça\"<\/code> e <code>LRANGE vendidos 0 -1<\/code>. Ordenada, com repetição.<\/p><p><b>Conjunto:<\/b> <code>SADD categorias:roupas \"Calças\"<\/code>. Sem repetição.<\/p><p><b>Hash:<\/b> <code>HSET produto:123 nome \"Camiseta\" preco 39.99<\/code>. Vários campos numa chave.<\/p><p><b>Scripts Lua:<\/b> Rodam no servidor de forma atômica. Ideal para compra que confere e baixa o estoque.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> No MongoDB pense em esteira (cada estágio entrega para o próximo). No Cassandra pense em qual pergunta esta tabela responde. No Redis escolha a estrutura pelo jeito que o dado é usado.<\/p>", "qs": [{ "q": "Qual é a principal vantagem do Redis em relação aos bancos de dados tradicionais em disco?", "o": ["Persistir dados em discos, o que é mais rápido que os bancos de dados em disco.", "Dar suporte nativo para transações complexas, como bancos de dados relacionais.", "Armazenar dados permanentemente, igual aos bancos de dados tradicionais.", "Armazenar dados em memória, permitindo acessos muito mais rápidos."], "t": "per" }, { "q": "Qual comando do Redis é utilizado para verificar se uma chave existe no banco de dados?", "o": ["EXISTS", "GET", "SET", "DEL"], "t": "per" }, { "q": "Qual é a vantagem de usar a expiração de chaves no Redis?", "o": ["Permitir que dados sejam armazenados permanentemente.", "Otimizar o uso de memória e desempenho.", "Garantir que os dados armazenados no Redis sejam persistidos em disco.", "Impedir que dados sejam sobrescritos por novos valores."], "t": "per" }, { "q": "Qual operador é usado para alterar campos em um updateOne do MongoDB?", "o": ["$match", "$set", "$group", "$unwind"], "t": "mc" }, { "q": "O que acontece ao rodar deleteMany({}) em uma coleção?", "o": ["Nada, o filtro está vazio", "Apaga só o primeiro documento", "Apaga todos os documentos da coleção", "Cria um backup automático"], "t": "mc" }, { "q": "No pipeline de agregação, qual estágio junta coleções, como um JOIN?", "o": ["$match", "$sort", "$project", "$lookup"], "t": "mc" }, { "q": "No Cassandra, qual é a função da partition key?", "o": ["Decidir em qual nó o dado fica", "Criptografar a tabela", "Ordenar os usuários por nome", "Fazer JOIN entre tabelas"], "t": "mc" }, { "q": "Qual estrutura do Redis é a melhor para guardar vários campos de um produto na mesma chave?", "o": ["Lista", "Conjunto", "Hash", "String"], "t": "mc" }, { "q": "Escreva uma consulta MongoDB que encontre produtos com preço maior que 100 e outra que aumente em 5 o estoque do produto \"Caderno\".", "o": null, "t": "ab" }, { "q": "Por que no Cassandra é comum repetir dados em várias tabelas? Qual é o custo disso?", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Arquitetura e escalabilidade NoSQL", "frase": "Replicar protege, dividir faz crescer", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Arquitetura e escalabilidade NoSQL<\/p><p class=\"frase\">Replicar protege, dividir faz crescer<\/p><\/div><h2>① <b>MongoDB: replica set:<\/b> <i>Alta disponibilidade<\/i><\/h2><p><b>Primário:<\/b> Recebe as escritas.<\/p><p><b>Secundários:<\/b> Copiam os dados e servem de reserva.<\/p><p><b>Eleição (failover):<\/b> O primário caiu, um secundário vira primário. Até lá, escritas ficam indisponíveis.<\/p><p><b>Retorno:<\/b> O nó que volta entra como secundário e sincroniza sozinho.<\/p><pre style=\"height:128px\"><code>rs.initiate({ _id: \"rs0\", members: [\n  { _id: 0, host: \"localhost:27017\" },\n  { _id: 1, host: \"localhost:27018\" },\n  { _id: 2, host: \"localhost:27019\" } ] })\nrs.status()<\/code><\/pre><h2>② <b>MongoDB: sharding:<\/b> <i>Escala horizontal<\/i><\/h2><p><b>mongos:<\/b> Roteador das consultas.<\/p><p><b>Config servers:<\/b> Mapa do cluster.<\/p><p><b>Shards:<\/b> Guardam os pedaços.<\/p><p><b>Chave hashed:<\/b> Espalha os documentos por igual.<\/p><p><b>Rebalanceamento:<\/b> Novo shard entra e o MongoDB rebalanceia sozinho. Se um shard falha, só os dados dele ficam indisponíveis.<\/p><p><b>Replicação x sharding:<\/b> Copia para disponibilidade x divide para escalar. Na prática se usam os dois.<\/p><pre style=\"height:64px\"><code>sh.enableSharding(\"shopwide\")\nsh.shardCollection(\"shopwide.pedidos\", { clienteId: \"hashed\" })<\/code><\/pre><h2>③ <b>Cassandra:<\/b> <i>Anel de nós iguais<\/i><\/h2><p><b>Anel:<\/b> Não há primário. O hash da partition key decide o nó.<\/p><p><b>cassandra.yaml:<\/b> <code>cluster_name<\/code>, <code>num_tokens<\/code> e <code>seeds<\/code>.<\/p><p><b>Novo nó:<\/b> As partições são redistribuídas automaticamente, sem parar o sistema.<\/p><p><b>nodetool:<\/b> <code>status<\/code> nós no ar, <code>ring<\/code> divisão dos dados, <code>repair<\/code> sincroniza réplicas.<\/p><h2>④ <b>Redis:<\/b> <i>Crescer na memória<\/i><\/h2><p><b>Vertical:<\/b> Mais RAM/CPU num servidor. Tem limite físico.<\/p><p><b>Redis Cluster:<\/b> Divide os dados em 16.384 hash slots entre os nós.<\/p><p><b>Failover:<\/b> Promove uma réplica se o primário cair.<\/p><p><b>Pipelines:<\/b> Vários comandos numa única ida ao servidor.<\/p><p><b>maxmemory-policy:<\/b> Regra para quando a memória enche.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> A decisão mais importante da escala horizontal é a chave (shard key no MongoDB, partition key no Cassandra). É ela que define se os dados se espalham por igual.<\/p>", "qs": [{ "q": "O que é o particionamento de dados no Cassandra?", "o": ["O particionamento distribui os dados de maneira uniforme entre os nós.", "O particionamento cria cópias de dados como um clone em todos os nós.", "O particionamento distribui os dados entre os nós com base em uma chave de partição.", "O particionamento organiza dados exclusivamente por data."], "t": "per" }, { "q": "Qual é a função principal da replicação no Cassandra?", "o": ["Tornar os dados acessíveis apenas por um único nó.", "Duplicar dados para alta disponibilidade e tolerância.", "Armazenar tudo em um nó e acelerar as consultas.", "Ajudar na indexação e nas buscas em tabelas grandes."], "t": "per" }, { "q": "O que acontece quando um novo nó é adicionado ao Cassandra?", "o": ["Remove os dados dos nós e redistribui igualmente.", "Armazena dados de um subconjunto de partições.", "Redistribui dados entre os nós de forma eficiente.", "Inicia vazio; outros pausam até redistribuir dados."], "t": "per" }, { "q": "Em um replica set, quem recebe as escritas?", "o": ["Todos os nós ao mesmo tempo", "O nó primário", "O config server", "O mongos"], "t": "mc" }, { "q": "O que acontece quando o primário cai?", "o": ["Ocorre uma eleição e um secundário vira primário", "Todos os dados são apagados", "As escritas continuam sem nenhuma pausa", "O cluster precisa ser reinstalado"], "t": "mc" }, { "q": "Qual é o papel do mongos?", "o": ["Guardar os pedaços dos dados", "Fazer backup semanal", "Rotear as consultas no cluster", "Criptografar as senhas"], "t": "mc" }, { "q": "Como o Cassandra decide em qual nó guardar um dado?", "o": ["Pelo nó mais novo do cluster", "Pelo nome do administrador", "Sempre no nó primário", "Pelo hash da partition key"], "t": "mc" }, { "q": "Em quantos hash slots o Redis Cluster divide os dados?", "o": ["1.024", "8.192", "16.384", "65.536"], "t": "mc" }, { "q": "O que pode acontecer se a chave de shard escolhida concentrar quase todos os dados em um nó? Explique.", "o": null, "t": "ab" }, { "q": "Explique a diferença entre replicação e sharding usando uma comparação do dia a dia.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Segurança, backup e recuperação", "frase": "Proteger e saber voltar", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Segurança, backup e recuperação<\/p><p class=\"frase\">Proteger e saber voltar<\/p><\/div><h2>① <b>Os 4 pilares:<\/b> <i>Quem, o quê e como<\/i><\/h2><p><b>Autenticação:<\/b> Quem é você? Login com usuário e senha.<\/p><p><b>Autorização:<\/b> O que pode fazer? Roles como <code>read<\/code> e <code>readWrite<\/code>.<\/p><p><b>Criptografia e hash:<\/b> O dado está protegido? bcrypt, TLS, dados em repouso.<\/p><p><b>Auditoria:<\/b> Quem fez o quê? <code>auditLog<\/code>, logs CSV.<\/p><p><b>Sistemas legados:<\/b> Software antigo ainda essencial, com falhas conhecidas. Saída comum: adicionar camadas de segurança.<\/p><h2>② <b>MongoDB e AstraDB:<\/b> <i>Usuários e permissões<\/i><\/h2><p><b>createUser:<\/b> Cria o usuário com suas roles. Crie o admin ANTES de ligar <code>authorization<\/code>.<\/p><p><b>Roles:<\/b> <code>grantRolesToUser<\/code> concede, <code>revokeRolesFromUser<\/code> retira.<\/p><p><b>bcrypt:<\/b> <code>bcrypt.hash(password, 10)<\/code> gera hash de mão única. A senha nunca fica em texto puro.<\/p><p><b>AstraDB:<\/b> Roles em 3 níveis, TLS e criptografia em repouso já ativos e logs em Settings › Security.<\/p><pre style=\"height:128px\"><code>use techsecure\ndb.createUser({ user: \"viewer\",\n  pwd: passwordPrompt(),\n  roles: [{ role: \"read\", db: \"techsecure\" }] })<\/code><\/pre><h2>③ <b>Backup e recuperação:<\/b> <i>Completo e incremental<\/i><\/h2><p><b>Completo:<\/b> Copia tudo.<\/p><p><b>Incremental:<\/b> Só as mudanças desde o último backup.<\/p><p><b>Estratégia mista:<\/b> Completo semanal ou mensal + incrementais frequentes.<\/p><p><b>Cassandra:<\/b> <code>nodetool snapshot empresa<\/code>, <code>incremental_backups: true<\/code> no cassandra.yaml e <code>nodetool refresh<\/code> para carregar.<\/p><p><b>Automação:<\/b> Medusa no Cassandra. <code>backup.bat<\/code> + Agendador no Windows.<\/p><pre style=\"height:96px\"><code>mongodump --out ./backup-completo\nmongodump --db ecommerce --collection orders --out ./backup-incremental\nmongorestore --drop ./backup-completo<\/code><\/pre><h2>④ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>Confusão:<\/b> Trocar autenticação (quem é) por autorização (o que pode).<\/p><p><b>Bloqueio:<\/b> Ligar <code>authorization<\/code> antes de criar o admin: ninguém entra.<\/p><p><b>Senha:<\/b> Salvar em texto puro.<\/p><p><b>Comandos:<\/b> <code>nodetool backup<\/code> e <code>nodetool restore<\/code> não existem.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Backup que nunca foi restaurado não é confiável: simule a falha, restaure e confira os dados. E dê a cada usuário só a permissão de que ele precisa.<\/p>", "qs": [{ "q": "Qual é a principal diferença entre o backup completo (snapshot) e o backup incremental no Cassandra?", "o": ["O primeiro armazena apenas dados novos, e o incremental captura todos os dados.", "O primeiro captura todos os dados, o segundo, apenas as alterações desde o último backup.", "O primeiro é mais eficiente em termos de espaço, enquanto o incremental é mais demorado.", "O primeiro é feito manualmente, enquanto o incremental é automático."], "t": "per" }, { "q": "Qual comando é utilizado no Apache Cassandra para realizar um backup completo (snapshot)?", "o": ["nodetool snapshot", "nodetool backup", "cqlsh snapshot", "nodetool restore"], "t": "per" }, { "q": "Quando se utiliza o backup incremental no Cassandra, o que precisa ser configurado no cassandra.yaml?", "o": ["A opção snapshot_frequency deve ser configurada para true.", "A opção backup_type deve ser configurada como incremental.", "A opção incremental_backups deve ser configurada como true.", "A opção incremental_backups deve ser configurada como false."], "t": "per" }, { "q": "\"O que este usuário pode fazer no banco?\" é uma pergunta sobre:", "o": ["Autenticação", "Autorização", "Auditoria", "Replicação"], "t": "mc" }, { "q": "Por que usar bcrypt para senhas?", "o": ["Porque gera um hash de mão única", "Porque deixa a senha mais curta", "Porque guarda a senha em texto puro", "Porque acelera as consultas"], "t": "mc" }, { "q": "O que pode acontecer ao ligar authorization antes de criar o admin?", "o": ["O banco fica mais rápido", "Os dados são duplicados", "Ninguém consegue entrar", "O backup roda sozinho"], "t": "mc" }, { "q": "Qual ferramenta faz o backup de um banco MongoDB?", "o": ["nodetool snapshot", "mongostat", "rs.status", "mongodump"], "t": "mc" }, { "q": "O que a estratégia mista de backup combina?", "o": ["Dois bancos relacionais", "Backup completo periódico e incrementais frequentes", "Backup e exclusão dos dados", "Dois usuários com a mesma senha"], "t": "mc" }, { "q": "Crie o plano de backup de uma escola: o que faria, com qual frequência e como testaria a recuperação.", "o": null, "t": "ab" }, { "q": "Em um sistema escolar, que permissões daria a um aluno, um professor e um administrador? Por quê?", "o": null, "t": "ab" }] }, { "n": 27, "tema": "Performance e monitoramento NoSQL", "frase": "Medir, diagnosticar, corrigir", "html": "<div data-flow><h1>Semana 27<\/h1><p class=\"tema\">Performance e monitoramento NoSQL<\/p><p class=\"frase\">Medir, diagnosticar, corrigir<\/p><\/div><h2>① <b>Métricas que importam:<\/b> <i>Olhe tudo junto<\/i><\/h2><p><b>Latência:<\/b> Tempo de leitura e escrita. Alerta quando sobe.<\/p><p><b>Throughput:<\/b> Operações por segundo. Alerta quando não acompanha a carga.<\/p><p><b>CPU e memória:<\/b> Sobrecarga do servidor. Alerta acima de 80%.<\/p><p><b>Working set:<\/b> Dados ativos na RAM. Alerta quando não cabe na memória.<\/p><p><b>Outras:<\/b> Tamanho dos índices, conexões ativas, locks e page faults.<\/p><h2>② <b>Ferramentas:<\/b> <i>Ver o que acontece<\/i><\/h2><p><b>MongoDB:<\/b> Atlas Performance Advisor sugere índices. Também <code>mongostat<\/code> (operações/s) e <code>mongotop<\/code> (tempo por coleção).<\/p><p><b>Cassandra:<\/b> JMX Exporter → Prometheus (localhost:9090) → Grafana (localhost:3000).<\/p><p><b>Boas práticas:<\/b> Alertas para limites críticos, acompanhar tendências e testes de carga em homologação.<\/p><h2>③ <b>MongoDB: consulta lenta:<\/b> <i>Do COLLSCAN ao IXSCAN<\/i><\/h2><p><b>Profiler:<\/b> <code>db.setProfilingLevel(2)<\/code> registra tudo. Não deixe no nível 2 em produção.<\/p><p><b>explain:<\/b> <code>nReturned<\/code> documentos, <code>executionTimeMillis<\/code> tempo, <code>winningPlan<\/code> plano escolhido.<\/p><p><b>COLLSCAN x IXSCAN:<\/b> Varreu a coleção inteira x usou índice.<\/p><p><b>Resultado:<\/b> No material: categoria de 650 ms para 5 ms com índice.<\/p><p><b>Pipeline lento:<\/b> Dividir em partes, tirar etapas redundantes e usar <code>$match<\/code> cedo.<\/p><pre style=\"height:96px\"><code>db.products.find({ category: \"eletrônicos\" }).explain(\"executionStats\")\ndb.products.createIndex({ category: 1 })\ndb.products.createIndex({ price: 1, created_at: -1 })<\/code><\/pre><h2>④ <b>Cassandra:<\/b> <i>Otimizar modelando pela consulta<\/i><\/h2><p><b>Partition key:<\/b> <code>customer_id<\/code> deixa as transações do cliente juntas.<\/p><p><b>Clustering key:<\/b> <code>transaction_date<\/code> ordena por data.<\/p><p><b>TRACING ON:<\/b> Mostra o caminho e o tempo da consulta.<\/p><p><b>ALLOW FILTERING:<\/b> Filtrar fora da chave varre o cluster todo.<\/p><pre style=\"height:128px\"><code>CREATE TABLE transactions_by_customer (\n  customer_id UUID, transaction_date TIMESTAMP,\n  product_id UUID, amount INT,\n  PRIMARY KEY (customer_id, transaction_date)\n) WITH CLUSTERING ORDER BY (transaction_date DESC);<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Otimização segue 3 passos: medir (métricas e ferramentas), diagnosticar (explain, profiler, TRACING ON) e corrigir (índices certos e chaves pensadas para a consulta). Compare sempre o antes e o depois.<\/p>", "qs": [{ "q": "O que a função explain() no MongoDB permite que você faça?", "o": ["Exibir todos os dados armazenados em uma coleção.", "Explicar o tempo de execução e o plano de execução de uma consulta.", "Criar índices automaticamente para melhorar o desempenho das consultas.", "Excluir documentos que não atendem aos critérios da consulta."], "t": "per" }, { "q": "Qual é o principal benefício de usar índices no MongoDB?", "o": ["Melhorar a eficiência das consultas, tornando-as mais rápidas.", "Reduzir o tamanho do banco de dados.", "Armazenar os dados de forma mais compacta.", "Tornar a replicação de dados mais eficiente."], "t": "per" }, { "q": "O que o operador $unwind faz em um pipeline de agregação no MongoDB?", "o": ["Cria um índice em um campo específico.", "Filtra documentos com base em um valor de campo específico.", "Ordena os documentos em ordem crescente.", "Desagrega um array, retornando um documento para cada elemento."], "t": "per" }, { "q": "O que o throughput mede?", "o": ["O tamanho do disco", "As operações por segundo", "O número de índices", "A quantidade de usuários cadastrados"], "t": "mc" }, { "q": "No explain do MongoDB, o que COLLSCAN indica?", "o": ["Que um índice foi usado", "Que a consulta foi cancelada", "Que a coleção inteira foi varrida", "Que os dados foram apagados"], "t": "mc" }, { "q": "Qual é o risco de criar índice em todos os campos?", "o": ["Pesar na escrita e na memória", "Apagar os dados antigos", "Impedir qualquer consulta", "Desligar o banco"], "t": "mc" }, { "q": "Qual comando mostra o caminho de uma consulta no Cassandra?", "o": ["EXPLAIN", "mongotop", "db.setProfilingLevel", "TRACING ON"], "t": "mc" }, { "q": "Qual a ordem do monitoramento com Prometheus e Grafana no Cassandra?", "o": ["Grafana → JMX Exporter → Prometheus", "JMX Exporter → Prometheus → Grafana", "Prometheus → Grafana → JMX Exporter", "Grafana → Prometheus → JMX Exporter"], "t": "mc" }, { "q": "Uma consulta por categoria demora 650 ms e o explain mostra COLLSCAN. Diga o que você faria e escreva o comando.", "o": null, "t": "ab" }, { "q": "Por que olhar uma única métrica pode enganar? Dê um exemplo.", "o": null, "t": "ab" }] }, { "n": 28, "tema": "Casos de uso e aplicações NoSQL", "frase": "Cada banco no seu problema", "html": "<div data-flow><h1>Semana 28<\/h1><p class=\"tema\">Casos de uso e aplicações NoSQL<\/p><p class=\"frase\">Cada banco no seu problema<\/p><\/div><h2>① <b>MongoDB:<\/b> <i>Aplicações web e big data<\/i><\/h2><p><b>Web:<\/b> Bom para perfis de usuários e dados com campos variados.<\/p><p><b>Big data:<\/b> Guarda logs de acesso com modelagem documental flexível.<\/p><p><b>Consultas:<\/b> Operadores para filtrar, buscar e contar registros.<\/p><pre style=\"height:64px\"><code>db.perfis.insertOne({ nome: \"Ana\", interesses: [\"jogos\", \"música\"] })\ndb.logs.find({ status: 500 }).count()<\/code><\/pre><h2>② <b>Cassandra:<\/b> <i>Grande volume, sempre disponível<\/i><\/h2><p><b>Quando usar:<\/b> Bilhões de eventos de logs, mensagens, recomendações e sessões distribuídas.<\/p><p><b>DataStax Astra:<\/b> Plataforma em nuvem que facilita o uso do Cassandra.<\/p><p><b>Sessões:<\/b> Um e-commerce pode guardar sessões de usuários de forma distribuída.<\/p><pre style=\"height:224px\"><code>CREATE TABLE iot_data.user_sessions (\n  session_id UUID PRIMARY KEY,\n  user_id TEXT,\n  created_at TIMESTAMP,\n  last_activity TIMESTAMP\n);\nINSERT INTO iot_data.user_sessions (session_id, user_id, created_at, last_activity)\nVALUES (uuid(), 'user_123', toTimestamp(now()), toTimestamp(now()));<\/code><\/pre><h2>③ <b>Redis:<\/b> <i>Velocidade e tarefas assíncronas<\/i><\/h2><p><b>Cache:<\/b> Reduz acessos ao banco de dados e melhora o desempenho.<\/p><p><b>Tarefas assíncronas:<\/b> Processa trabalhos em segundo plano.<\/p><p><b>Casos reais:<\/b> E-commerces e plataformas de autenticação.<\/p><h2>④ <b>Neo4j:<\/b> <i>O valor está nas conexões<\/i><\/h2><p><b>Rede profissional:<\/b> Usuários, posts e tópicos conectados por relacionamentos.<\/p><p><b>Relacionamentos:<\/b> <code>FOLLOWS<\/code> seguir, <code>LIKES<\/code> curtir, <code>INTERESTED_IN<\/code> interesse, <code>HAS_TOPIC<\/code> tópico.<\/p><p><b>Recomendação:<\/b> Amigos de amigos são encontrados com conexões indiretas.<\/p><pre style=\"height:96px\"><code>MATCH (u:User {name: 'Ana'})-[:FOLLOWS]-&gt;(f)-[:FOLLOWS]-&gt;(s)\nWHERE NOT (u)-[:FOLLOWS]-&gt;(s) AND u &lt;&gt; s\nRETURN DISTINCT s.name<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Não existe banco melhor: existe o banco certo para cada problema. Pergunte primeiro como o dado será usado e só depois escolha a ferramenta.<\/p>", "qs": [{ "q": "Qual relacionamento indica um usuário seguindo outro?", "o": ["(:User)-[:FOLLOWS]->(:User)", "(:User)-[:LIKES]->(:Post)", "(:User)-[:SHARED]->(:Topic)", "(:User)-[:TAGGED]->(:User)"], "t": "per" }, { "q": "O que a consulta MATCH (u:User)-[:INTERESTED_IN]->(t) retorna?", "o": ["Usuários e conexões mútuas.", "Usuários e postagens curtidas.", "Usuários e seus interesses.", "Postagens populares no grafo."], "t": "per" }, { "q": "Qual consulta sugere conexões com amigos de amigos?", "o": ["MATCH (p:Post)-[:HAS_TOPIC]->(t:Topic)", "MATCH (u)-[:FOLLOWS]->(f)-[:FOLLOWS]->(s)", "MATCH (u)-[:LIKES]->(p:Post)", "MATCH (u)-[:SHARED]->(p:Post)"], "t": "per" }, { "q": "Uma empresa precisa guardar bilhões de logs por dia em servidores pelo mundo. Qual banco é o mais adequado?", "o": ["Neo4j", "Cassandra", "Redis", "Excel"], "t": "mc" }, { "q": "Qual é um uso típico do Redis em uma aplicação?", "o": ["Guardar fotos em alta resolução para sempre", "Desenhar grafos de relacionamento", "Fazer cache para reduzir acessos ao banco", "Substituir a linguagem de programação"], "t": "mc" }, { "q": "Para guardar perfis de usuários com campos variados, qual banco se encaixa melhor?", "o": ["MongoDB", "Cassandra com replicação zero", "Redis com lista", "Nenhum banco de dados"], "t": "mc" }, { "q": "O que é o DataStax Astra?", "o": ["Um editor de código", "Um modelo de linguagem", "Um shell do Redis", "Uma plataforma em nuvem para usar Cassandra"], "t": "mc" }, { "q": "Qual banco é o mais indicado para sugerir \"pessoas que você talvez conheça\"?", "o": ["Redis", "Cassandra", "Neo4j", "MongoDB com um único documento"], "t": "mc" }, { "q": "Pense em um aplicativo de streaming de música. Indique onde usaria MongoDB, Redis e Neo4j e explique cada escolha.", "o": null, "t": "ab" }, { "q": "Escreva uma consulta Cypher que mostre os nomes das pessoas que a usuária Ana segue.", "o": null, "t": "ab" }] }] }, { "id": "pdsma", "sigla": "PDSMA", "nome": "Processos de Desenvolvimento de Software e Metodologias Ágeis", "cor": "#7a3fb0", "semanas": [{ "n": 21, "tema": "Cultura DevOps e feedback contínuo", "frase": "Do muro da confusão à esteira automática", "html": "<div data-flow><h1>Semana 21<\/h1><p class=\"tema\">Cultura DevOps e feedback contínuo<\/p><p class=\"frase\">Do muro da confusão à esteira automática<\/p><\/div><h2>① <b>Origem do DevOps e CALMS:<\/b> <i>Um time só, do commit à produção<\/i><\/h2><p><b>Wall of confusion:<\/b> Dev quer mudar rápido, Ops quer estabilidade. O erro aparece tarde e um culpa o outro. É conflito de objetivos + falta de comunicação.<\/p><p><b>Do Ágil ao DevOps:<\/b> O Ágil encurtou as entregas, mas elas paravam na porta da operação. DevOps integra pessoas, processos e tecnologia.<\/p><p><b>Cultura (C):<\/b> Responsabilidade compartilhada. O sistema é do time todo.<\/p><p><b>Automação (A):<\/b> Automatizar o repetitivo para evitar erro humano.<\/p><p><b>Lean (L):<\/b> Cortar desperdício e espera.<\/p><p><b>Medição (M):<\/b> Decidir com dados, não com opinião.<\/p><p><b>Compartilhar (S):<\/b> Ferramentas, acertos e principalmente falhas.<\/p><h2>② <b>Pipeline de feedback:<\/b> <i>A esteira que valida cada mudança<\/i><\/h2><p><b>Etapas:<\/b> Commit/push → build (o sistema monta?) → teste (faz o que deveria?) → resultado e alerta ao time.<\/p><p><b>Fail fast:<\/b> Melhor o erro aparecer em 2 minutos na esteira do que em 2 dias no cliente. Quanto mais tarde, mais caro.<\/p><p><b>Integração contínua (CI):<\/b> Integrar o código várias vezes ao dia, sempre validado pela esteira (GitHub Actions, Jenkins).<\/p><p><b>Teste ≠ monitoramento:<\/b> O teste verifica o comportamento. O monitoramento torna a falha visível.<\/p><pre style=\"height:64px\"><code>Soma devolve 5 para 2 + 2\nBuild ✅ OK   →   Teste ❌ Falha   →   Deploy? NÃO<\/code><\/pre><h2>③ <b>Métricas DORA:<\/b> <i>Provar a melhoria com dados<\/i><\/h2><p><b>Lead time:<\/b> Do commit até a produção. Menor é melhor.<\/p><p><b>Deployment frequency:<\/b> Nº de deploys ÷ período. Maior é melhor.<\/p><p><b>MTTR:<\/b> Tempo médio para restaurar: soma dos tempos ÷ nº de incidentes. Menor é melhor.<\/p><p><b>Change fail rate:<\/b> Deploys com falha ÷ total × 100. Menor é melhor.<\/p><p><b>Equilíbrio:<\/b> Velocidade = lead time + frequência. Estabilidade = MTTR + CFR.<\/p><p><b>Do número à ação:<\/b> Lead time alto → procure espera. MTTR alto → monitoramento. CFR alto → testes automatizados.<\/p><pre style=\"height:96px\"><code>Incidentes de 2 h e 3 h      →  MTTR = (2 + 3) / 2 = 2,5 h\n2 falhas em 8 deploys        →  CFR  = 2 / 8 × 100 = 25%\n8 deploys em 2 semanas       →  frequência = 4 por semana<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Fazer menos deploys não reduz falhas, só junta mais mudanças em cada entrega. O caminho é o contrário: entregas pequenas, frequentes e testadas automaticamente.<\/p>", "qs": [{ "q": "O que melhor define o conceito de Wall of confusion no contexto pré-DevOps?", "o": ["Barreira física em data centers para proteger servidores.", "Erro complexo que impede a compilação do código-fonte.", "Conflito de objetivos e falta de comunicação entre Devs e Ops.", "Estratégia de rede para impedir acesso de usuários externos."], "t": "per" }, { "q": "O que caracteriza um pipeline de feedback no DevOps?", "o": ["Um manual de instruções entregue ao cliente final.", "Um processo automático de validação do código a cada alteração.", "Uma reunião semanal para discutir erros do projeto.", "O canal de suporte pelo qual o cliente reclama de bugs."], "t": "per" }, { "q": "Como um time DevOps pode reduzir drasticamente o change fail rate?", "o": ["Fazendo menos deploys por mês.", "Aumentando o número de desenvolvedores no time.", "Implementando testes automatizados e automação de build.", "Pedindo para o cliente testar o código primeiro."], "t": "per" }, { "q": "O que significa o A do CALMS?", "o": ["Avaliação", "Automação", "Arquitetura", "Agilidade"], "t": "mc" }, { "q": "O que a ideia de fail fast defende?", "o": ["Lançar sem testar para ganhar tempo", "Falhar de propósito em produção", "Descobrir o erro o quanto antes", "Evitar qualquer mudança no código"], "t": "mc" }, { "q": "Um time teve incidentes de 1 h, 2 h e 3 h. Qual é o MTTR?", "o": ["1 h", "2 h", "3 h", "6 h"], "t": "mc" }, { "q": "Em 10 deploys, 3 falharam. Qual é o change fail rate?", "o": ["3%", "7%", "13%", "30%"], "t": "mc" }, { "q": "O que a integração contínua faz?", "o": ["Integra o código várias vezes ao dia, validando na esteira", "Junta o código uma vez por mês, à mão", "Substitui os desenvolvedores", "Elimina a necessidade de testes"], "t": "mc" }, { "q": "Uma equipe tem CFR de 40%. Diga qual ação você recomendaria e por quê.", "o": null, "t": "ab" }, { "q": "Explique por que no DevOps o sistema é responsabilidade do time todo. O que muda em relação ao muro da confusão?", "o": null, "t": "ab" }] }, { "n": 22, "tema": "Infraestrutura como Código com Terraform", "frase": "Infraestrutura em arquivo de texto", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Infraestrutura como Código com Terraform<\/p><p class=\"frase\">Infraestrutura em arquivo de texto<\/p><\/div><h2>① <b>IaC, providers e o ciclo:<\/b> <i>Descrever em vez de clicar<\/i><\/h2><p><b>Na mão:<\/b> Clicar em telas esquece etapas e não dá para repetir.<\/p><p><b>IaC:<\/b> Servidores, redes e regras descritos em arquivos de texto. É documentação executável.<\/p><p><b>Terraform:<\/b> Lê arquivos em HCL e cria a infraestrutura real.<\/p><p><b>provider:<\/b> ONDE. A ponte com a plataforma (AWS, Azure, Google Cloud).<\/p><p><b>resource:<\/b> O QUÊ. Tipo, nome e configuração do recurso.<\/p><p><b>Ciclo:<\/b> <code>init<\/code> prepara → <code>plan<\/code> mostra o que vai mudar → <code>apply<\/code> executa.<\/p><pre style=\"height:128px\"><code>provider \"aws\" { region = \"us-east-1\" }\n\nresource \"aws_vpc\" \"principal\" {\n  cidr_block = \"10.0.0.0/16\"\n}<\/code><\/pre><h2>② <b>Módulos e workspaces:<\/b> <i>Um código, vários ambientes<\/i><\/h2><p><b>Problema:<\/b> Dois arquivos quase iguais, para dev e prod. Toda mudança é repetida.<\/p><p><b>Módulo:<\/b> Peça reutilizável: grupo de recursos numa pasta. O que muda vira variável.<\/p><p><b>Workspace:<\/b> Mesmo código com estados separados por ambiente. Ex: t3.small em prod, t2.micro em dev.<\/p><p><b>Resumo:<\/b> Módulo organiza e reaproveita. Workspace separa os ambientes.<\/p><h2>③ <b>Stack completa:<\/b> <i>Tudo numa única execução<\/i><\/h2><p><b>Stack 2-tier:<\/b> Rede (VPC e sub-redes), compute (AutoScaling), ALB (balanceador) e banco (RDS).<\/p><p><b>Dependências:<\/b> Primeiro a rede. O ALB depende do compute. O banco depende só da rede.<\/p><p><b>Conexão:<\/b> Um módulo entrega um output e outro usa como entrada.<\/p><p><b>Ordem:<\/b> Um único <code>apply<\/code> cria tudo. O Terraform calcula a ordem sozinho.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Nunca pule o plan. Ele mostra o que será criado, alterado ou destruído antes de acontecer. Infraestrutura em arquivo é infraestrutura que dá para revisar, repetir e versionar.<\/p>", "qs": [{ "q": "Qual comando do Terraform mostra o que será criado antes da aplicação real?", "o": ["terraform destroy", "terraform plan", "terraform output", "terraform validate"], "t": "per" }, { "q": "Ao usar módulos e workspaces no Terraform, qual combinação ajuda mais a evitar repetição e a separar dev de prod?", "o": ["Copiar arquivos para cada ambiente.", "Usar módulo e mudar só comentários.", "Deixar tudo em um único bloco.", "Criar módulo e usar workspaces."], "t": "per" }, { "q": "Ao montar uma stack completa com módulos no Terraform, qual prática ajuda mais a garantir organização e escalabilidade?", "o": ["Colocar tudo em um único arquivo.", "Copiar código para cada recurso.", "Separar em módulos com responsabilidades.", "Criar arquivos sem padrão definido."], "t": "per" }, { "q": "O que é Infraestrutura como Código (IaC)?", "o": ["Programar aplicativos para celular", "Descrever a infraestrutura em arquivos de texto executáveis", "Instalar servidores só por telas gráficas", "Escrever manuais em PDF"], "t": "mc" }, { "q": "No Terraform, o que define ONDE a infraestrutura será criada?", "o": ["O provider", "O resource", "O output", "O comentário"], "t": "mc" }, { "q": "Qual é a ordem correta dos comandos do Terraform?", "o": ["apply → plan → init", "plan → init → apply", "init → plan → apply", "init → apply → plan"], "t": "mc" }, { "q": "O que é um módulo no Terraform?", "o": ["Um tipo de servidor físico", "Um arquivo de senhas", "Um comando para apagar recursos", "Uma peça reutilizável com um grupo de recursos"], "t": "mc" }, { "q": "Na stack 2-tier, o ALB depende de quem?", "o": ["Apenas do banco", "Do compute, pois precisa de destino", "De ninguém", "Do workspace de dev"], "t": "mc" }, { "q": "Explique por que o terraform plan é comparado a conferir o carrinho antes de pagar.", "o": null, "t": "ab" }, { "q": "Sua empresa precisa criar um ambiente de homologação igual ao de produção. Como você faria usando Terraform, sem duplicar código?", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Docker Fundamentals", "frase": "Empacotar, isolar e limitar", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Docker Fundamentals<\/p><p class=\"frase\">Empacotar, isolar e limitar<\/p><\/div><h2>① <b>Namespaces e cgroups:<\/b> <i>Isolar e limitar<\/i><\/h2><p><b>Contêiner:<\/b> A aplicação empacotada com tudo que precisa. Acaba com o \"funciona na minha máquina\".<\/p><p><b>Namespaces:<\/b> Isolamento. Cada contêiner enxerga só seus processos, rede, usuários e arquivos.<\/p><p><b>cgroups:<\/b> Limites. Definem quanto cada contêiner pode usar de CPU, memória e outros recursos.<\/p><p><b>Teste rápido:<\/b> Limite de memória ou CPU → cgroups. Processo vê só a sua rede → namespaces.<\/p><h2>② <b>Imagem enxuta:<\/b> <i>Multi-stage, slim e distroless<\/i><\/h2><p><b>Imagem:<\/b> O molde do contêiner. Grande demais ocupa espaço, atrasa o deploy e aumenta a superfície de ataque.<\/p><p><b>Slim:<\/b> Tira pacotes desnecessários, mantém ferramentas básicas.<\/p><p><b>Distroless:<\/b> Tira até o terminal e o instalador de pacotes. Produção com foco em segurança.<\/p><p><b>Multi-stage:<\/b> Compila numa imagem completa e a imagem final recebe só o resultado.<\/p><pre style=\"height:224px\"><code>FROM node:20 AS build\nWORKDIR /app\nCOPY . .\nRUN npm install &amp;&amp; npm run build\n\nFROM gcr.io/distroless/nodejs20-debian12\nCOPY --from=build /app/dist /app\nCMD [\"/app/server.js\"]<\/code><\/pre><h2>③ <b>Compose, redes e logs:<\/b> <i>Vários contêineres juntos<\/i><\/h2><p><b>Docker Compose:<\/b> Define e sobe vários contêineres a partir de um único arquivo (serviços, portas, volumes, redes).<\/p><p><b>Rede bridge:<\/b> Os contêineres conversam entre si, isolados do resto da máquina. O app chama o banco pelo nome do serviço.<\/p><p><b>Logs:<\/b> O \"diário\" do contêiner. Mostram qual parte falhou.<\/p><p><b>Onde olhar:<\/b> App não acessa o banco → logs do app e do banco.<\/p><pre style=\"height:160px\"><code>services:\n  app:\n    build: .\n    ports: [\"3000:3000\"]\n  banco:\n    image: postgres:16<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> No multi-stage, a etapa de build pode ser bagunçada, mas a imagem final tem que sair limpa, leve e segura. Isolar (namespaces) e limitar (cgroups) são coisas diferentes, e o contêiner precisa das duas.<\/p>", "qs": [{ "q": "Qual afirmação descreve melhor a diferença entre namespaces e cgroups?", "o": ["Namespaces apagam arquivos; cgroups criam rede.", "Namespaces isolam; cgroups controlam recursos.", "Namespaces substituem Docker; cgroups substituem Linux.", "Namespaces e cgroups fazem exatamente a mesma coisa."], "t": "per" }, { "q": "Qual é uma vantagem de usar multi-stage e imagens distroless?", "o": ["Aumentar a quantidade de ferramentas no contêiner.", "Guardar todos os arquivos temporários do build.", "Misturar build e execução na mesma etapa.", "Deixar a imagem menor e com menos itens desnecessários."], "t": "per" }, { "q": "Qual é uma função do Docker Compose?", "o": ["Substituir completamente o sistema operacional.", "Impedir comunicação entre serviços.", "Organizar vários contêineres em um mesmo ambiente.", "Apagar automaticamente todos os logs."], "t": "per" }, { "q": "Qual recurso do Linux limita o uso de memória de um contêiner?", "o": ["Namespaces", "cgroups", "Compose", "Distroless"], "t": "mc" }, { "q": "Um contêiner não consegue ver os processos de outro. Isso é papel de:", "o": ["Namespaces", "cgroups", "Logs", "Volumes"], "t": "mc" }, { "q": "O que uma imagem distroless retira?", "o": ["A aplicação", "O código compilado", "O terminal e o instalador de pacotes", "As variáveis do sistema"], "t": "mc" }, { "q": "Por que imagens grandes são um problema?", "o": ["Porque rodam só em celulares", "Porque não aceitam logs", "Porque não podem ter rede", "Porque atrasam o deploy e aumentam a superfície de ataque"], "t": "mc" }, { "q": "Como o app acessa o banco dentro da rede bridge do Compose?", "o": ["Pelo IP público da internet", "Pelo pendrive do servidor", "Pelo nome do serviço", "Por uma planilha compartilhada"], "t": "mc" }, { "q": "O app não consegue acessar o banco em um ambiente com Docker Compose. Descreva como você investigaria o problema.", "o": null, "t": "ab" }, { "q": "Explique a vantagem do multi-stage com uma comparação do dia a dia.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Kubernetes Essentials", "frase": "Você descreve o que quer", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Kubernetes Essentials<\/p><p class=\"frase\">Você descreve o que quer<\/p><\/div><h2>① <b>Arquitetura:<\/b> <i>Quem decide e quem executa<\/i><\/h2><p><b>Kubernetes:<\/b> Orquestra contêineres: automatiza deploy, escala, recuperação de falhas e gerenciamento num cluster.<\/p><p><b>Control Plane (Master):<\/b> Decide. Guarda o estado do cluster e escolhe onde cada app roda.<\/p><p><b>Workers:<\/b> Executam os pods com as aplicações.<\/p><p><b>kube-API:<\/b> Porta de entrada: recebe comandos e manifestos.<\/p><p><b>Pod:<\/b> Menor unidade executável. Um ou mais contêineres que compartilham rede e armazenamento.<\/p><p><b>Declarativo:<\/b> O manifesto descreve o estado desejado. O Kubernetes compara com o atual e corrige.<\/p><p><b>Caminho:<\/b> Usuário → Ingress → Service → Pods.<\/p><h2>② <b>Deployment, Service e ConfigMap:<\/b> <i>Manter, acessar e configurar<\/i><\/h2><p><b>Stateless:<\/b> Não guarda estado no contêiner. Pod cai, outro sobe e nada se perde.<\/p><p><b>Deployment:<\/b> Mantém vários pods e recria os que falham.<\/p><p><b>Service:<\/b> Endereço fixo mesmo com pods trocando.<\/p><p><b>ConfigMap:<\/b> Configuração fora da imagem (porta, URL, ambiente).<\/p><p><b>Rolling update:<\/b> Troca os pods aos poucos, sem parar tudo.<\/p><p><b>Rollback:<\/b> Volta rápido para a versão anterior.<\/p><pre style=\"height:160px\"><code>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: meu-app\nspec:\n  replicas: 3     # estado desejado: 3 cópias<\/code><\/pre><h2>③ <b>Escala e rollout:<\/b> <i>Ajustar à carga<\/i><\/h2><p><b>Escala manual:<\/b> A equipe define as réplicas. Serve para carga previsível.<\/p><p><b>HPA:<\/b> Horizontal Pod Autoscaler. CPU alta → mais pods. CPU baixa → menos pods.<\/p><p><b>Rollout:<\/b> Publicar a nova versão em etapas. Acompanhe pods, resposta do app e métricas.<\/p><p><b>Escalar ≠ rollout:<\/b> Escalar muda a quantidade de pods. Rollout troca a versão.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> No Kubernetes você descreve o que quer, não cada passo. Pod caiu? O Deployment recria. Pods mudaram? O Service continua no mesmo endereço. Mudou configuração? Fica no ConfigMap, não na imagem.<\/p>", "qs": [{ "q": "No Kubernetes, o que faz um manifesto declarativo?", "o": ["Apaga automaticamente o cluster.", "Substitui a necessidade da kube-API.", "Descreve o estado desejado do recurso.", "Cria somente máquinas virtuais."], "t": "per" }, { "q": "Qual recurso do Kubernetes é mais indicado para guardar configurações separadas do código da aplicação?", "o": ["Pod", "Service", "Node", "ConfigMap"], "t": "per" }, { "q": "Qual é a principal função do HPA no Kubernetes?", "o": ["Ajustar automaticamente a quantidade de pods.", "Criar apenas máquinas virtuais.", "Substituir todos os services do cluster.", "Impedir atualizações da aplicação."], "t": "per" }, { "q": "Qual é a menor unidade executável do Kubernetes?", "o": ["Cluster", "Node", "Pod", "Service"], "t": "mc" }, { "q": "Quem escolhe onde cada aplicação vai rodar?", "o": ["Os usuários finais", "O Control Plane", "O ConfigMap", "O navegador"], "t": "mc" }, { "q": "Qual objeto mantém 3 cópias do app e recria pods que falham?", "o": ["Ingress", "ConfigMap", "Secret de log", "Deployment"], "t": "mc" }, { "q": "O que o Service oferece?", "o": ["Um endereço estável, mesmo com pods sendo trocados", "Uma imagem Docker menor", "Um backup do banco de dados", "Um novo cluster a cada acesso"], "t": "mc" }, { "q": "Qual a diferença entre escalar e rollout?", "o": ["São a mesma coisa", "Escalar troca a versão; rollout muda a quantidade", "Escalar muda a quantidade de pods; rollout troca a versão", "Os dois apagam o cluster"], "t": "mc" }, { "q": "Explique com suas palavras o que é o modelo declarativo do Kubernetes e dê um exemplo.", "o": null, "t": "ab" }, { "q": "Em um site de vendas na Black Friday, por que usar HPA em vez de escala manual?", "o": null, "t": "ab" }] }, { "n": 25, "tema": "SRE, SLI/SLO e error budget", "frase": "Confiabilidade virou número", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">SRE, SLI/SLO e error budget<\/p><p class=\"frase\">Confiabilidade virou número<\/p><\/div><h2>① <b>SRE e toil:<\/b> <i>Automatizar em vez de apagar incêndio<\/i><\/h2><p><b>SRE:<\/b> Usa programação, automação e monitoramento para manter sistemas estáveis e confiáveis.<\/p><p><b>DevOps x SRE:<\/b> DevOps é a cultura de entrega. SRE garante que continue funcionando bem depois da entrega.<\/p><p><b>Toil:<\/b> Trabalho operacional manual, repetitivo e automatizável. O Google recomenda no máximo 50% do tempo nisso.<\/p><p><b>Caso:<\/b> APIs de pagamento caem em promoções. Mais gente no plantão não resolve. Problema recorrente pede solução estrutural.<\/p><h2>② <b>SLI, SLO e SLA:<\/b> <i>Medir, definir meta, prometer<\/i><\/h2><p><b>SLI:<\/b> Indicador. Mede o comportamento real. Ex: % de requisições corretas.<\/p><p><b>SLO:<\/b> Objetivo. A meta do indicador. Ex: 99,9% corretas.<\/p><p><b>SLA:<\/b> Acordo em contrato com o cliente, com penalidade. Costuma ser mais folgado que o SLO.<\/p><p><b>Erro comum:<\/b> SLI é o que aconteceu. SLO é o que a equipe quer que aconteça.<\/p><pre style=\"height:64px\"><code>10.000 requisições, 9.990 corretas  →  SLI = 99,9%\n9.850 em até 300 ms                  →  SLI de latência = 98,5%<\/code><\/pre><h2>③ <b>Error budget:<\/b> <i>A margem de falha permitida<\/i><\/h2><p><b>Cálculo:<\/b> 100% − SLO. Com SLO de 99,9%, o budget é 0,1%.<\/p><p><b>Em minutos:<\/b> Mês de 30 dias = 43.200 min. 0,1% = 43,2 min de indisponibilidade aceitável.<\/p><p><b>Por que não 100%?:<\/b> Meta perfeita travaria qualquer mudança.<\/p><p><b>Verde (até 50%):<\/b> Releases seguem normalmente.<\/p><p><b>Amarela (50% a 100%):<\/b> Releases com mais revisão e cautela.<\/p><p><b>Vermelha (acima de 100%):<\/b> Congelar releases não emergenciais e focar em estabilidade.<\/p><pre style=\"height:64px\"><code>32 min consumidos de 43,2 min  ≈ 74%  →  faixa amarela\n47 min consumidos de 43,2 min  ≈ 109% →  faixa vermelha<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> O error budget transforma a briga \"lançar rápido x não quebrar\" numa decisão com dados. Sobrou budget? Dá para inovar. Acabou? Estabilidade primeiro. Toil alto é sinal de que falta automação, não de que falta gente.<\/p>", "qs": [{ "q": "O que melhor representa toil em SRE?", "o": ["Planejamento de interface do sistema.", "Trabalho repetitivo e manual na operação.", "Criação de identidade visual.", "Troca de linguagem de programação."], "t": "per" }, { "q": "Quando a equipe define que 99,9% das requisições devem funcionar corretamente, isso representa o quê?", "o": ["Um tipo de deploy", "Um alerta manual", "Um log de erro", "Um SLO"], "t": "per" }, { "q": "Se um serviço tem SLO mensal de 99,9%, o error budget representa o quê?", "o": ["O total de deploys do mês.", "O número de incidentes resolvidos.", "A margem aceitável de falha.", "O tempo médio de um release."], "t": "per" }, { "q": "O que é um SLI?", "o": ["Um indicador que mede o comportamento real do serviço", "Um contrato com multa", "Um servidor de backup", "Uma equipe de plantão"], "t": "mc" }, { "q": "Qual destes é um exemplo de toil?", "o": ["Criar um script de automação", "Definir um novo SLO", "Reiniciar o mesmo serviço na mão toda semana", "Estudar um novo framework"], "t": "mc" }, { "q": "Com SLO de 99,5%, qual é o error budget?", "o": ["0,05%", "0,5%", "5%", "99,5%"], "t": "mc" }, { "q": "De 20.000 requisições, 19.900 foram corretas. Qual é o SLI?", "o": ["95%", "98,5%", "99%", "99,5%"], "t": "mc" }, { "q": "O budget mensal estourou (acima de 100%). Qual decisão a política indica?", "o": ["Lançar mais funções", "Ignorar e seguir normalmente", "Congelar releases não emergenciais e focar em estabilidade", "Mudar a meta para 0%"], "t": "mc" }, { "q": "Com SLO de 99,9% em um mês de 30 dias, a equipe teve 30 min de indisponibilidade. Em qual faixa ela está? Mostre a conta.", "o": null, "t": "ab" }, { "q": "Dê um exemplo de toil na sua rotina (escola, casa ou projeto) e explique como poderia automatizá-lo.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "DevSecOps: segurança integrada ao pipeline", "frase": "Segurança desde o começo", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">DevSecOps: segurança integrada ao pipeline<\/p><p class=\"frase\">Segurança desde o começo<\/p><\/div><h2>① <b>Shift-left e SAST:<\/b> <i>Antes do merge<\/i><\/h2><p><b>Shift-left security:<\/b> Aplicar segurança desde o início do desenvolvimento, com correção mais rápida e menor custo.<\/p><p><b>SAST:<\/b> Teste estático. Analisa o código sem executar. Ex: senha escrita no código. Ferramentas: SonarQube, Bandit.<\/p><p><b>SAST no PR:<\/b> O pipeline analisa antes da aprovação e bloqueia o merge até corrigir.<\/p><p><b>Scan de dependências:<\/b> Bibliotecas e pacotes com falha conhecida.<\/p><p><b>DAST:<\/b> Analisa a aplicação em execução.<\/p><h2>② <b>Segurança do contêiner:<\/b> <i>Imagem e runtime<\/i><\/h2><p><b>CVE:<\/b> Vulnerabilidade conhecida e registrada publicamente.<\/p><p><b>Scan da imagem:<\/b> O Trivy acha CVEs e pacotes afetados antes do deploy.<\/p><p><b>Severidade:<\/b> CRITICAL, HIGH, MEDIUM. Define o que corrigir primeiro.<\/p><p><b>Hardening:<\/b> Blindar: reduzir vulnerabilidades e permissões desnecessárias.<\/p><p><b>Na imagem:<\/b> Imagem base enxuta, remover dependências e atualizar componentes vulneráveis.<\/p><p><b>No runtime:<\/b> Não rodar como root, limitar privilégios e revisar permissões.<\/p><p><b>Erro comum:<\/b> O scan só encontra. Segurança = imagem corrigida + mínimo de privilégio.<\/p><pre style=\"height:64px\"><code>trivy image minha-app:1.0\n# 5 vulnerabilidades: CRITICAL 1, HIGH 2, MEDIUM 2<\/code><\/pre><h2>③ <b>DAST e IaC scanning:<\/b> <i>App rodando e infraestrutura<\/i><\/h2><p><b>OWASP ZAP:<\/b> DAST. Testa a aplicação em execução. Ex: alerta de XSS na página de login.<\/p><p><b>XSS:<\/b> Falha que permite injetar código malicioso numa página.<\/p><p><b>Checkov:<\/b> Revisa arquivos Terraform antes de criar. Ex: S3 com leitura pública.<\/p><p><b>Camadas:<\/b> Código (SAST), bibliotecas, imagem (Trivy), infraestrutura (Checkov) e app rodando (ZAP).<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Cada ferramenta olha uma camada. Uma não substitui a outra, nenhuma garante zero vulnerabilidades e nenhuma dispensa revisão humana. Quanto mais cedo a falha aparece, mais barato é corrigir.<\/p>", "qs": [{ "q": "Qual é a principal vantagem de usar SAST no Pull Request?", "o": ["Substituir todo teste manual.", "Encontrar falhas antes do merge.", "Apagar dependências inseguras sozinho.", "Publicar direto em produção."], "t": "per" }, { "q": "Qual ação mais ajuda na redução do risco em segurança de contêiner já no início do processo?", "o": ["Aumentar o tamanho da imagem.", "Rodar tudo como root.", "Ignorar CVEs baixos e altos juntos.", "Escanear a imagem e revisar privilégios."], "t": "per" }, { "q": "Quando a equipe usa ZAP e Checkov no mesmo pipeline, qual é a principal vantagem?", "o": ["Substituir todo tipo de teste.", "Garantir que não existam vulnerabilidades.", "Verificar tanto a aplicação quanto a infraestrutura.", "Eliminar a necessidade de revisão humana."], "t": "per" }, { "q": "O que significa shift-left security?", "o": ["Fazer segurança só depois do deploy", "Aplicar segurança desde o início do desenvolvimento", "Mover os servidores de lugar", "Trocar a linguagem do projeto"], "t": "mc" }, { "q": "O que o SAST analisa?", "o": ["O código-fonte, sem executar o programa", "Apenas a aplicação rodando", "O consumo de energia do servidor", "A velocidade da internet"], "t": "mc" }, { "q": "O que é uma CVE?", "o": ["Uma ferramenta de deploy", "Um tipo de banco de dados", "Uma vulnerabilidade conhecida e registrada publicamente", "Um comando do Docker"], "t": "mc" }, { "q": "Qual ferramenta encontra um bucket S3 público em um arquivo Terraform antes da criação?", "o": ["OWASP ZAP", "Trivy", "Grafana", "Checkov"], "t": "mc" }, { "q": "O que é hardening?", "o": ["Aumentar a imagem do contêiner", "Dar mais permissões a todos", "Reduzir vulnerabilidades e permissões desnecessárias", "Apagar os logs do sistema"], "t": "mc" }, { "q": "Um dev deixou uma senha escrita no código. Explique como o SAST no Pull Request ajudaria nessa situação.", "o": null, "t": "ab" }, { "q": "Por que rodar um scan de imagem não significa que o contêiner está seguro?", "o": null, "t": "ab" }] }] }, { "id": "pm", "sigla": "PM", "nome": "Programação Mobile", "cor": "#b3216a", "semanas": [{ "n": 22, "tema": "Configurações iniciais para publicação", "frase": "Preparar o app para as lojas", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Configurações iniciais para publicação<\/p><p class=\"frase\">Preparar o app para as lojas<\/p><\/div><h2>① <b>Contas e requisitos:<\/b> <i>Google Play e App Store<\/i><\/h2><p><b>Google Play Console:<\/b> Publica apps Android, mostra métricas e permite monetizar. Taxa única.<\/p><p><b>Apple Developer Program:<\/b> Publica em iOS, iPadOS e macOS. Libera Xcode, TestFlight e App Store Connect. Taxa anual.<\/p><p><b>Conta Apple:<\/b> Individual (seu nome na loja) ou Empresa (exige D-U-N-S Number).<\/p><p><b>Políticas Google:<\/b> Sem conteúdo de ódio ou violência, só permissões essenciais e uso dos dados informado.<\/p><p><b>Políticas Apple:<\/b> Seguir o Human Interface Guidelines, app sem bugs, sem conteúdo duplicado nem APIs privadas.<\/p><p><b>Documentos:<\/b> Política de privacidade (obrigatória se coleta dados) e termos de uso.<\/p><h2>② <b>Assinatura e pacote:<\/b> <i>Provar que o app é seu<\/i><\/h2><p><b>Assinar:<\/b> Provar que o app é seu e não foi alterado. A loja só aceita atualizações com a mesma chave.<\/p><p><b>Android:<\/b> Keystore (sua chave) ou assinatura gerenciada pelo Google. Formato AAB obrigatório desde 2021.<\/p><p><b>iOS:<\/b> Certificado Development (testes) e Distribution (publicação) + provisioning profile.<\/p><p><b>Package:<\/b> O package/bundleIdentifier é o \"CPF\" do app na loja. Não muda depois de publicado.<\/p><pre style=\"height:128px\"><code>\"version\": \"1.0.0\",\n\"android\": { \"package\": \"br.edu.exemplo.estudamais\" },\n\"ios\": { \"bundleIdentifier\": \"br.edu.exemplo.estudamais\" }\n\neas build -p android     # gera o AAB assinado<\/code><\/pre><h2>③ <b>Recursos visuais e ficha:<\/b> <i>A vitrine do app<\/i><\/h2><p><b>Ícone:<\/b> Google 512 × 512 px PNG. Apple 1024 × 1024 px sem transparência.<\/p><p><b>Capturas:<\/b> Telas principais, para cada dispositivo suportado.<\/p><p><b>Vídeo:<\/b> Opcional. Google = link do YouTube. Apple = upload direto.<\/p><p><b>Ficha da loja:<\/b> Nome com 30 caracteres. Google: descrição curta 80 e completa 4.000. Apple: subtítulo 30 e palavras-chave 100.<\/p><h2>④ <b>Testes e debugging:<\/b> <i>Antes de publicar<\/i><\/h2><p><b>Beta:<\/b> TestFlight (iOS) e testes internos ou fechados do Play Console.<\/p><p><b>Firebase Test Lab:<\/b> Testa em aparelhos reais na nuvem.<\/p><p><b>Debugging:<\/b> Logs, depuração remota no aparelho real, priorizar erros críticos e teste de regressão.<\/p><p><b>Erro comum:<\/b> Pedir permissões \"por garantia\" ou usar termos como \"nº 1\" na descrição.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Guarde o keystore e a senha com backup, fora do repositório. Sem eles você não consegue mais atualizar o seu app.<\/p>", "qs": [{ "q": "Qual é a importância de criar um ícone de aplicação de alta qualidade para as lojas de aplicativos?", "o": ["É o primeiro elemento visual que atrai usuários.", "Só é obrigatório para a App Store, mas não para o Google Play.", "É apenas estético e não afeta a aceitação do app.", "É usado apenas em testes beta, não na versão final."], "t": "per" }, { "q": "O que deve ser priorizado ao criar screenshots para um aplicativo?", "o": ["Mostrar telas com designs atraentes e funcionalidades.", "Usar apenas imagens genéricas, sem conexão com o app.", "Criar screenshots apenas para smartphones, ignorando tablets.", "Reutilizar imagens de redes sociais sem adaptá-las."], "t": "per" }, { "q": "Qual é a principal diferença na submissão de vídeos promocionais para o Google Play e a App Store?", "o": ["O Google Play exige upload direto; a App Store usa links.", "A App Store permite vídeos curtos; o Google Play, de até 10 min.", "No Google Play, o vídeo vai pelo YouTube; na App Store, direto.", "O Google Play não exige vídeos; a App Store exige obrigatoriamente."], "t": "per" }, { "q": "Qual a diferença de cobrança entre as contas de desenvolvedor?", "o": ["Google tem taxa única; Apple tem taxa anual", "As duas são sempre gratuitas", "Google cobra por mês; Apple é gratuita", "As duas cobram por download"], "t": "mc" }, { "q": "Qual formato de publicação é obrigatório no Google Play desde 2021?", "o": ["APK", "IPA", "AAB", "ZIP"], "t": "mc" }, { "q": "O que acontece se você perder o keystore do app?", "o": ["A loja cria outro sozinha", "O app fica mais rápido", "Nada muda", "Você não consegue mais atualizar o app"], "t": "mc" }, { "q": "Qual ferramenta faz testes beta em iOS?", "o": ["Play Console", "TestFlight", "Firebase Analytics", "Gradle"], "t": "mc" }, { "q": "Por que um app pode ser rejeitado por pedir localização?", "o": ["Porque nenhum app pode usar localização", "Porque o ícone está grande", "Porque pediu uma permissão sem realmente usá-la", "Porque a versão começa em 1.0.0"], "t": "mc" }, { "q": "Crie o nome (até 30 caracteres) e a descrição curta (até 80 caracteres) para um app da sua escolha.", "o": null, "t": "ab" }, { "q": "Explique por que o package não pode mudar depois da publicação.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Preparativos finais para publicação", "frase": "Rápido, seguro e fácil de usar", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Preparativos finais para publicação<\/p><p class=\"frase\">Rápido, seguro e fácil de usar<\/p><\/div><h2>① <b>Performance:<\/b> <i>Medir e otimizar<\/i><\/h2><p><b>Medir:<\/b> Tempo de carregamento, memória, CPU e bateria.<\/p><p><b>Gargalos:<\/b> Processamento pesado, renderização da interface e rede ou API pesada.<\/p><p><b>Profiling:<\/b> Android Profiler e Xcode Instruments mostram o uso de recursos em tempo real.<\/p><p><b>Otimizar:<\/b> Lazy loading (carregar só quando aparece), compressão de imagens, caching e API devolvendo menos dados.<\/p><h2>② <b>Segurança:<\/b> <i>Encontrar falhas e proteger dados<\/i><\/h2><p><b>Análise estática:<\/b> SonarQube, Checkmarx.<\/p><p><b>Pentest:<\/b> Teste de invasão com OWASP ZAP ou Burp Suite.<\/p><p><b>Engenharia reversa:<\/b> Ofuscar com ProGuard. A assinatura digital garante que o pacote não foi alterado.<\/p><p><b>SQL Injection e XSS:<\/b> Validar e tratar toda entrada do usuário.<\/p><p><b>Criptografia:<\/b> Dados em trânsito: TLS. Dados guardados: AES.<\/p><p><b>Senhas:<\/b> Hash com salt (bcrypt), nunca texto puro.<\/p><p><b>Login:<\/b> MFA (senha + código) e tokens OAuth/JWT.<\/p><p><b>API:<\/b> Rate limiting contra DoS.<\/p><pre style=\"height:96px\"><code>// valor do usuário vai como parâmetro (?), nunca concatenado\ndb.getFirstAsync('SELECT * FROM materias WHERE id = ?', [id]);\n// Errado: '... WHERE id = ' + id<\/code><\/pre><h2>③ <b>Usabilidade:<\/b> <i>Testar com gente de verdade<\/i><\/h2><p><b>Qualitativa:<\/b> Entrevistas, grupos focais e observação.<\/p><p><b>Quantitativa:<\/b> Testes A/B, heatmaps e métricas.<\/p><p><b>Ciclo:<\/b> Planejar → observar → coletar → priorizar (frequência × impacto) → ajustar → testar de novo.<\/p><h2>④ <b>Build e release:<\/b> <i>Automatizar a entrega<\/i><\/h2><p><b>Build:<\/b> Gradle e Xcode Build System. O Fastlane automatiza build e release.<\/p><p><b>CI/CD:<\/b> Commit → build → testes → segurança/assinatura → artefato → loja, sem trabalho manual.<\/p><p><b>Prazo:<\/b> Falha grave perto do lançamento? Segurança vem antes do prazo.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Antes de publicar, rode o app num celular mais simples: o que trava lá é o que vai gerar avaliação negativa.<\/p>", "qs": [{ "q": "Qual estratégia é mais eficaz para melhorar o tempo de resposta de um aplicativo que apresenta lentidão no carregamento de imagens?", "o": ["Implementar compressão de imagens e lazy loading.", "Aumentar a resolução das imagens para melhorar a qualidade.", "Carregar todas as imagens simultaneamente na inicialização do app.", "Desabilitar o caching para garantir que sempre sejam carregadas imagens atualizadas."], "t": "per" }, { "q": "Qual ferramenta ou método é mais indicado para identificar pontos de dificuldade na navegação de um aplicativo durante testes de usabilidade?", "o": ["Heatmaps para identificar áreas de maior interação.", "Testes unitários para validar o funcionamento das funções.", "Testes de performance para medir tempo de resposta.", "Revisão de código para detectar falhas na lógica."], "t": "per" }, { "q": "Qual ferramenta ou prática auxilia na automação do build e release de aplicativos mobile, garantindo um processo de publicação mais seguro e eficiente?", "o": ["Utilizar o Fastlane para automatizar as etapas de build e release.", "Realizar o build manualmente na IDE a cada atualização.", "Ajustar manualmente o código-fonte para cada nova versão.", "Concentrar os esforços apenas em testes de usabilidade."], "t": "per" }, { "q": "O que é lazy loading?", "o": ["Carregar tudo ao abrir o app", "Carregar o conteúdo só quando ele aparece", "Desligar as imagens do aplicativo", "Atrasar o app de propósito"], "t": "mc" }, { "q": "Qual ferramenta mostra o uso de recursos do app Android em tempo real?", "o": ["Android Profiler", "TestFlight", "Fastlane", "ProGuard"], "t": "mc" }, { "q": "Como evitar SQL Injection em uma consulta?", "o": ["Concatenar o texto do usuário na consulta", "Aumentar a memória do banco", "Passar o valor como parâmetro (?)", "Desligar o login do app"], "t": "mc" }, { "q": "Como as senhas devem ser guardadas?", "o": ["Em texto puro", "Em um arquivo público", "No nome da tabela", "Com hash e salt, usando bcrypt"], "t": "mc" }, { "q": "O que é MFA?", "o": ["Um formato de imagem", "Login com mais de um fator, como senha e código", "Um tipo de teste beta", "Uma ferramenta de build"], "t": "mc" }, { "q": "Um app demora para abrir porque carrega 200 imagens de uma vez. Proponha duas otimizações e explique cada uma.", "o": null, "t": "ab" }, { "q": "Explique, com um exemplo simples, o que aconteceria se um app concatenasse o texto do usuário em um comando SQL.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Submissão e revisão de aplicativos", "frase": "Enviar, responder e melhorar", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Submissão e revisão de aplicativos<\/p><p class=\"frase\">Enviar, responder e melhorar<\/p><\/div><h2>① <b>Processo de submissão:<\/b> <i>Três etapas<\/i><\/h2><p><b>Preparar:<\/b> Capturas, vídeo, descrições e revisão de compatibilidade, desempenho e segurança.<\/p><p><b>Enviar:<\/b> Metadados: versão, changelog e política de privacidade.<\/p><p><b>Revisão:<\/b> Responder às solicitações dos revisores.<\/p><p><b>Ferramentas:<\/b> Play Console e App Store Connect mostram status e rejeições.<\/p><p><b>Boas práticas:<\/b> Documentar, revisão cruzada (dev + design + QA) e cronograma com folga.<\/p><h2>② <b>Feedback da revisão:<\/b> <i>Analisar e responder<\/i><\/h2><p><b>Analisar:<\/b> Classificar por criticidade e achar padrões.<\/p><p><b>Responder:<\/b> Reconhecer os pontos e propor plano e prazos, com transparência.<\/p><p><b>Implementar:<\/b> Corrigir, fazer testes de regressão e reenviar.<\/p><p><b>Acompanhar:<\/b> Monitorar se a correção funcionou.<\/p><h2>③ <b>Correções em produção:<\/b> <i>Quando o app já está no ar<\/i><\/h2><p><b>Identificar:<\/b> Firebase Crashlytics, Sentry, New Relic, feedback dos usuários e métricas.<\/p><p><b>Corrigir:<\/b> Reproduzir o erro, isolar com logs, revisar em equipe e lançar patch incremental.<\/p><p><b>Regressão:<\/b> Jest (JavaScript), Espresso (Android), XCTest (iOS).<\/p><p><b>Crise:<\/b> Ex: débito duplicado. Manutenção + rollback + aviso aos usuários.<\/p><h2>④ <b>Próxima versão:<\/b> <i>Priorizar com critério<\/i><\/h2><p><b>Coletar ideias:<\/b> Usuários, equipe, mercado e concorrentes (Miro, Trello).<\/p><p><b>Matriz impacto × esforço:<\/b> Impacto alto + pouco esforço = fazer já.<\/p><p><b>Planejar:<\/b> Roadmap com prazos. Scrum ou Kanban em ciclos curtos.<\/p><p><b>Deploy x release:<\/b> Deploy = colocar o código no ar. Release = liberar a função para o usuário.<\/p><pre style=\"height:64px\"><code>Fazer já: lembrete de prova        Planejar: sincronizar com a nuvem\nSe sobrar tempo: temas de cor      Evitar: rede social interna<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Ao ser rejeitado, leia o motivo, corrija só o que foi pedido e explique a correção no campo de comentários ao revisor.<\/p>", "qs": [{ "q": "Qual é o principal objetivo da análise de feedback em revisões de aplicativos?", "o": ["Identificar falhas e priorizar ações corretivas.", "Coletar apenas dados quantitativos sem interpretação.", "Ignorar opiniões divergentes da equipe.", "Responder automaticamente aos feedbacks sem avaliação."], "t": "per" }, { "q": "Qual é a estratégia mais eficaz para responder aos revisores de forma transparente e construtiva?", "o": ["Ignorar os feedbacks negativos e focar apenas os positivos.", "Adiar respostas e evitar novas perguntas.", "Reconhecer os pontos e propor um plano.", "Implementar mudanças sem comunicar os revisores."], "t": "per" }, { "q": "Qual etapa é fundamental na implementação de melhorias baseadas nos feedbacks dos revisores?", "o": ["Realizar testes de regressão e monitorar os resultados das correções.", "Submeter o app sem checar mudanças.", "Apenas atualizar a documentação, sem alterar o código.", "Deixar só uma equipe cuidar da melhoria."], "t": "per" }, { "q": "Qual ferramenta monitora falhas de um app em produção?", "o": ["Miro", "Firebase Crashlytics", "Trello", "Gradle"], "t": "mc" }, { "q": "Por que fazer testes de regressão antes de reenviar um app?", "o": ["Porque a correção de uma tela pode quebrar outra", "Porque a loja exige um vídeo novo", "Porque deixam o ícone melhor", "Porque substituem a política de privacidade"], "t": "mc" }, { "q": "Na matriz impacto × esforço, o que fazer com algo de alto impacto e pouco esforço?", "o": ["Evitar", "Deixar para quando sobrar tempo", "Fazer já", "Apagar do roadmap"], "t": "mc" }, { "q": "Qual a diferença entre deploy e release?", "o": ["São a mesma coisa", "Deploy é o nome do app; release é o ícone", "Release vem sempre antes de escrever o código", "Deploy coloca o código no ar; release libera a função ao usuário"], "t": "mc" }, { "q": "Em uma crise como débito duplicado, qual é a resposta adequada?", "o": ["Esperar os usuários reclamarem mais", "Manutenção, rollback e aviso aos usuários", "Apagar as avaliações negativas", "Lançar uma nova função de marketing"], "t": "mc" }, { "q": "Seu app foi rejeitado por pedir acesso à câmera sem usar. Escreva a mensagem que enviaria ao revisor depois de corrigir.", "o": null, "t": "ab" }, { "q": "Classifique na matriz impacto × esforço duas ideias para um app escolar e justifique.", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Estratégias de marketing para aplicativos", "frase": "Ser encontrado e medir o resultado", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Estratégias de marketing para aplicativos<\/p><p class=\"frase\">Ser encontrado e medir o resultado<\/p><\/div><h2>① <b>ASO:<\/b> <i>Ser encontrado na loja<\/i><\/h2><p><b>ASO:<\/b> App Store Optimization. Otimizar a ficha do app na loja.<\/p><p><b>Palavras-chave:<\/b> Pesquisar, usar no título e na descrição e atualizar com as tendências.<\/p><p><b>Descrição:<\/b> Clara, com benefícios e diferenciais, em tópicos e subtítulos.<\/p><p><b>Benchmarking:<\/b> Olhar concorrentes para achar oportunidades de diferenciação.<\/p><pre style=\"height:96px\"><code>Título: Estuda+: Planner de Estudos (27/30)\nCurta:  Organize matérias, provas e tempo de estudo com Pomodoro. (56/80)\nChaves: planner de estudos, agenda escolar, pomodoro, organizar provas<\/code><\/pre><h2>② <b>Marketing digital:<\/b> <i>Falar com o público certo<\/i><\/h2><p><b>Canal:<\/b> Escolher pelo perfil do público: Google Ads, Instagram, YouTube, LinkedIn.<\/p><p><b>Campanha:<\/b> Objetivo claro, benefícios, storytelling e criativos.<\/p><p><b>KPIs:<\/b> Taxa de conversão, custo por aquisição (CPA) e ROI.<\/p><p><b>Teste A/B:<\/b> Comparar duas versões e ficar com a melhor.<\/p><h2>③ <b>Redes sociais:<\/b> <i>Engajar<\/i><\/h2><p><b>Persona:<\/b> Definir quem é o público e escolher suas redes.<\/p><p><b>Formatos:<\/b> Vídeos, infográficos, posts, stories e storytelling.<\/p><p><b>Engajamento:<\/b> Curtidas, comentários, compartilhamentos, alcance e melhores horários.<\/p><h2>④ <b>Métricas:<\/b> <i>Interpretar e ajustar<\/i><\/h2><p><b>Ferramentas:<\/b> Google Analytics, Firebase Analytics, Mixpanel e dashboards.<\/p><p><b>Interpretar:<\/b> Números + opiniões. Segmentar usuários e priorizar a métrica do objetivo.<\/p><p><b>Ajustar:<\/b> Rever canais e mensagens, testes A/B e ciclos semanais.<\/p><p><b>Erro comum:<\/b> Medir só downloads. Se baixam e não usam, a retenção mostra o problema.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Escolha a métrica pelo objetivo: crescer → downloads e CPA. Manter usuários → retenção, churn e LTV.<\/p>", "qs": [{ "q": "Qual é a principal vantagem de selecionar as plataformas de marketing de acordo com o perfil do público-alvo?", "o": ["Garante a viralização dos anúncios automaticamente.", "Aumenta o alcance geral, independentemente do perfil.", "Otimiza o investimento e atinge usuários com maior potencial de conversão.", "Minimiza a necessidade de analisar os resultados da campanha."], "t": "per" }, { "q": "Na criação de campanhas para aplicativos, qual dos seguintes elementos é mais essencial para garantir uma comunicação eficaz?", "o": ["Um orçamento elevado.", "A definição de objetivos claros e a utilização de storytelling.", "O uso de jargões técnicos sem adaptação ao público.", "A exclusividade de um único formato de anúncio."], "t": "per" }, { "q": "Qual é a principal função dos KPIs (Key Performance Indicators) na análise de campanhas digitais para aplicativos?", "o": ["Medir a eficácia das ações e orientar ajustes para melhorar os resultados.", "Garantir que todas as campanhas tenham o mesmo desempenho.", "Servir apenas para justificar o orçamento da campanha.", "Eliminar a necessidade de testes A/B."], "t": "per" }, { "q": "O que significa ASO?", "o": ["Otimização do app na loja", "Análise de sistema operacional", "Armazenamento seguro online", "Atualização sem ocorrência"], "t": "mc" }, { "q": "Qual é a métrica mais adequada para saber se os usuários continuam usando o app?", "o": ["Número de cliques no anúncio", "Tamanho do ícone", "Retenção", "Quantidade de hashtags"], "t": "mc" }, { "q": "O que é CPA?", "o": ["Conta padrão do aplicativo", "Custo por aquisição", "Código para atualização", "Capturas por aparelho"], "t": "mc" }, { "q": "Para que serve um teste A/B?", "o": ["Testar o app em dois idiomas obrigatórios", "Trocar a conta de desenvolvedor", "Aprovar o app nas duas lojas", "Comparar duas versões e ficar com a melhor"], "t": "mc" }, { "q": "Um app tem muitos downloads, mas quase ninguém volta a usar. O que isso indica?", "o": ["A campanha não precisa de ajustes", "Há um problema de retenção a investigar", "O app está pronto e não precisa mudar", "O ASO precisa ser desligado"], "t": "mc" }, { "q": "Crie uma ficha ASO para um app da sua escolha: título, descrição curta e quatro palavras-chave.", "o": null, "t": "ab" }, { "q": "Defina a persona de um app de estudos e diga qual rede social você usaria para divulgá-lo. Justifique.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Planejamento de lançamento", "frase": "Lançar não é o fim", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Planejamento de lançamento<\/p><p class=\"frase\">Lançar não é o fim<\/p><\/div><h2>① <b>Cronograma:<\/b> <i>Sete fases<\/i><\/h2><p><b>Fases:<\/b> Planejamento → desenvolvimento → teste alfa (interno) → teste beta (grupo restrito) → pré-lançamento → lançamento → pós-lançamento.<\/p><p><b>Ferramentas:<\/b> Trello, Asana, Jira e Microsoft Project com gráfico de Gantt.<\/p><p><b>Prazos:<\/b> Realistas, com margem de segurança e checkpoints.<\/p><p><b>Prazo impossível:<\/b> Lançar um MVP e melhorar depois.<\/p><pre style=\"height:128px\"><code>13/11  0.1.0        abas + CRUD\n19/11  0.2.0        modo foco\n27/11  0.3.0        estatísticas\n04/12  1.0.0-rc.1   beta com colegas\n11/12  1.0.0        Demo Day<\/code><\/pre><h2>② <b>Pré-lançamento:<\/b> <i>Criar expectativa<\/i><\/h2><p><b>Expectativa:<\/b> Landing page com pré-cadastro, vídeo teaser (10 a 30 s) e demonstração ao vivo.<\/p><p><b>Promoções:<\/b> Acesso antecipado, descontos e gamificação.<\/p><p><b>Feedback antecipado:<\/b> Beta fechado, formulários e comunidade (Telegram, Discord).<\/p><p><b>Early adopters:<\/b> Os primeiros usuários.<\/p><h2>③ <b>Influenciadores:<\/b> <i>Credibilidade vale mais que número<\/i><\/h2><p><b>Escolher:<\/b> Nicho alinhado, engajamento (vale mais que seguidores), credibilidade e valores.<\/p><p><b>Formatos:<\/b> Testes, conteúdo patrocinado, desafios e lives.<\/p><p><b>Medir:<\/b> Downloads, engajamento, menções e cupom por influenciador.<\/p><h2>④ <b>Feedback pós-lançamento:<\/b> <i>Ouvir, separar e agir<\/i><\/h2><p><b>Ouvir:<\/b> Avaliações nas lojas, suporte, redes, comunidades e pesquisas no app.<\/p><p><b>Separar:<\/b> Bugs (urgente), sugestões, dúvidas frequentes e elogios.<\/p><p><b>Ferramentas:<\/b> Análise de sentimentos, Zendesk, Freshdesk.<\/p><p><b>Agir:<\/b> Priorizar por impacto, corrigir, publicar changelog e responder as avaliações.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Lançar não é o fim: reserve tempo no cronograma para o pós-lançamento e corrija o que os primeiros usuários encontrarem.<\/p>", "qs": [{ "q": "Qual das seguintes etapas NÃO faz parte de um cronograma de lançamento de aplicativos?", "o": ["Planejamento.", "Testes beta.", "Fase de manutenção pós-lançamento.", "Desenvolvimento de hardware."], "t": "per" }, { "q": "Qual ferramenta é mais indicada para criar um cronograma visual com prazos e dependências?", "o": ["Slack", "Microsoft Project", "Google Docs", "GitHub"], "t": "per" }, { "q": "Como evitar atrasos no cronograma de lançamento de um aplicativo?", "o": ["Usar uma ferramenta de gestão e definir checkpoints regulares.", "Definir prazos flexíveis e abrir mão de monitoramento.", "Evitar comunicação frequente para não sobrecarregar a equipe.", "Focar somente o marketing e ignorar os testes do produto."], "t": "per" }, { "q": "Qual a diferença entre teste alfa e teste beta?", "o": ["Alfa é interno; beta é com um grupo restrito de usuários", "Alfa é depois do lançamento; beta é antes do código", "Os dois são feitos só pela loja", "Alfa é para iOS; beta é para Android"], "t": "mc" }, { "q": "Qual recurso mostra prazos e dependências de forma visual?", "o": ["Hashtag", "Changelog", "Gráfico de Gantt", "Keystore"], "t": "mc" }, { "q": "O que deve pesar mais na escolha de um influenciador?", "o": ["O maior número de seguidores", "O engajamento e o nicho alinhado ao app", "A quantidade de carros que ele tem", "O tamanho do nome de usuário"], "t": "mc" }, { "q": "Quem são os early adopters?", "o": ["Os revisores da loja", "Os concorrentes do app", "Os donos da plataforma", "Os primeiros usuários do app"], "t": "mc" }, { "q": "O que fazer se o prazo de lançamento for impossível?", "o": ["Cortar os testes", "Publicar com bugs críticos", "Lançar um MVP e melhorar depois", "Desistir do projeto"], "t": "mc" }, { "q": "Escreva uma resposta educada para a avaliação: \"O app trava ao abrir. Péssimo!\".", "o": null, "t": "ab" }, { "q": "Monte um mini cronograma do seu projeto com pelo menos três entregas e suas datas.", "o": null, "t": "ab" }] }, { "n": 27, "tema": "Gerenciamento de versões e atualizações", "frase": "Evoluir sem quebrar", "html": "<div data-flow><h1>Semana 27<\/h1><p class=\"tema\">Gerenciamento de versões e atualizações<\/p><p class=\"frase\">Evoluir sem quebrar<\/p><\/div><h2>① <b>Git:<\/b> <i>Registrar e colaborar<\/i><\/h2><p><b>Controle de versão:<\/b> Registra cada mudança, permite trabalho em equipe e voltar atrás.<\/p><p><b>Plataformas:<\/b> GitHub, GitLab, Bitbucket.<\/p><p><b>Branch:<\/b> Desenvolver isolado → revisão (pull request) → merge no main.<\/p><pre style=\"height:160px\"><code>git init\ngit add .\ngit commit -m \"adiciona aba de estatísticas\"\ngit checkout -b nova-feature\ngit push origin main\ngit revert &lt;commit&gt;<\/code><\/pre><h2>② <b>Versionamento semântico:<\/b> <i>MAJOR.MINOR.PATCH<\/i><\/h2><p><b>MAJOR:<\/b> Quebra compatibilidade (2.3.1 → 3.0.0).<\/p><p><b>MINOR:<\/b> Função nova (2.3.1 → 2.4.0).<\/p><p><b>PATCH:<\/b> Correção (2.3.1 → 2.3.2).<\/p><p><b>Changelog:<\/b> Lista o que mudou em cada versão.<\/p><pre style=\"height:96px\"><code>## [1.0.0] — 11/12/2026\n### Corrigido\n- Busca agora espera 300 ms de pausa antes de consultar.<\/code><\/pre><h2>③ <b>Atualizações:<\/b> <i>Incrementais e de segurança<\/i><\/h2><p><b>Incremental:<\/b> Pequenas melhorias e correções sem grandes mudanças.<\/p><p><b>Feature flag:<\/b> Liga e desliga função sem nova versão. Ex: Firebase Remote Config.<\/p><p><b>Canary release:<\/b> Primeiro para poucos usuários.<\/p><p><b>
