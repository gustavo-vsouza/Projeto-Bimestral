<body>
    <title>Atividades do Técnico DS</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600&family=Kalam:wght@400;700&display=swap">
    <style>
        /* Layout: mesa de estudo com pastas de arquivo; dentro de cada pasta, semanas; a lousa é uma folha de caderno pautada */
        :root {
            --bg: #e6eaf2;
            --surface: #f7f8fb;
            --line: #c6cedd;
            --fg: #1a2233;
            --soft: #566078;
            --ink: #1c3390;
            --red: #c8262b;
            --ok: #0b7a5e;
            --warn: #fff3d6;
            --warnfg: #6b4a00;
            --okbg: #dcf3ea;
            --okfg: #07573f;
            --tab: #fff;
            --hand: 'Kalam', 'Comic Sans MS', cursive;
            --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #141a28;
                --surface: #1d2536;
                --line: #35405a;
                --fg: #e8ecf5;
                --soft: #a3aec6;
                --ink: #a9bcff;
                --red: #ff8d8a;
                --ok: #5fd3ae;
                --warn: #3d3113;
                --warnfg: #ffdf97;
                --okbg: #12382d;
                --okfg: #a8ecd3;
                --tab: #262f44;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #141a28;
            --surface: #1d2536;
            --line: #35405a;
            --fg: #e8ecf5;
            --soft: #a3aec6;
            --ink: #a9bcff;
            --red: #ff8d8a;
            --ok: #5fd3ae;
            --warn: #3d3113;
            --warnfg: #ffdf97;
            --okbg: #12382d;
            --okfg: #a8ecd3;
            --tab: #262f44;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 17px/1.55 var(--body);
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            padding-block: 24px 64px
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        .top {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .top h1 {
            font: 700 34px/1.15 var(--hand);
            color: var(--ink);
            margin: 0;
            text-wrap: balance
        }

        .top p {
            margin: 0;
            color: var(--soft)
        }

        .crumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            color: var(--soft);
            font-size: 15px
        }

        .crumbs a {
            color: var(--ink);
            text-underline-offset: 3px
        }

        .folders {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 26px 18px;
            padding-top: 14px
        }

        .folder {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 150px;
            padding: 18px 16px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 5px solid var(--c);
            border-radius: 0 8px 8px 8px;
            color: var(--fg);
            text-decoration: none
        }

        .folder::before {
            content: attr(data-sigla);
            position: absolute;
            left: -1px;
            top: -29px;
            height: 25px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            background: var(--c);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: .06em;
            border-radius: 7px 7px 0 0
        }

        .folder:hover,
        .folder:focus-visible {
            transform: translateY(-2px)
        }

        .folder strong {
            font-size: 19px;
            line-height: 1.25
        }

        .folder span {
            color: var(--soft);
            font-size: 15px;
            margin-top: auto
        }

        .weeks {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .week {
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 5px solid var(--c);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--fg);
            text-decoration: none
        }

        .week:hover,
        .week:focus-visible {
            border-color: var(--c)
        }

        .week b.n {
            font: 700 23px/1 var(--hand);
            color: var(--ink)
        }

        .week .t {
            min-width: 0
        }

        .week .t strong {
            display: block;
            line-height: 1.3
        }

        .week .t small {
            color: var(--soft);
            font-size: 15px
        }

        .chip {
            font-size: 14px;
            padding: 2px 9px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--soft);
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        .chip.done {
            background: var(--okbg);
            color: var(--okfg);
            border-color: transparent
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--line)
        }

        .tabs button {
            font: 700 16px var(--body);
            padding: 9px 18px;
            background: transparent;
            color: var(--soft);
            border: 1px solid transparent;
            border-bottom: 0;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            margin-bottom: -2px
        }

        .tabs button[aria-selected="true"] {
            background: var(--tab);
            color: var(--ink);
            border-color: var(--line);
            border-bottom: 2px solid var(--tab)
        }

        .paper {
            border-radius: 2px;
            box-shadow: 0 1px 3px rgba(20, 30, 60, .22)
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px
        }

        .who {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 12px
        }

        label.f {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-weight: 700;
            font-size: 15px;
            min-width: 0
        }

        input[type=text],
        textarea {
            font: 16px/1.5 var(--body);
            color: var(--fg);
            background: var(--tab);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 9px 11px;
            width: 100%
        }

        textarea {
            min-height: 120px;
            resize: vertical
        }

        h3.sec {
            font: 700 22px/1.2 var(--hand);
            color: var(--red);
            margin: 8px 0 0
        }

        .sec-note {
            margin: -14px 0 0;
            color: var(--soft);
            font-size: 15px
        }

        fieldset.q {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 8px;
            padding: 14px 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0
        }

        fieldset.q.miss {
            border-color: var(--red);
            box-shadow: 0 0 0 1px var(--red)
        }

        .q legend {
            display: contents
        }

        .q .num {
            font-weight: 700;
            color: var(--ink);
            margin-right: 4px
        }

        .q .enun {
            font-weight: 700;
            overflow-wrap: anywhere
        }

        .opt {
            display: grid;
            grid-template-columns: 22px 24px minmax(0, 1fr);
            gap: 4px;
            align-items: start;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            overflow-wrap: anywhere
        }

        .opt:hover {
            background: var(--bg)
        }

        .opt input {
            margin: 4px 0 0;
            width: 17px;
            height: 17px;
            accent-color: var(--ink)
        }

        .opt b {
            color: var(--soft)
        }

        .bar {
            position: sticky;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 4px 14px rgba(20, 30, 60, .18)
        }

        .bar span {
            font-variant-numeric: tabular-nums;
            color: var(--soft)
        }

        button.copy {
            font: 700 17px var(--body);
            background: var(--ink);
            color: var(--surface);
            border: 0;
            border-radius: 8px;
            padding: 11px 22px;
            cursor: pointer
        }

        .msg {
            border-radius: 8px;
            padding: 12px 14px
        }

        .msg.ok {
            background: var(--okbg);
            color: var(--okfg)
        }

        .msg.bad {
            background: var(--warn);
            color: var(--warnfg)
        }

        .msg strong {
            display: block;
            font-size: 18px
        }

        textarea#fallback {
            min-height: 220px
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px
        }

        @media(max-width:560px) {
            .who {
                grid-template-columns: 1fr
            }

            .week {
                grid-template-columns: 64px minmax(0, 1fr)
            }

            .week .chip {
                grid-column: 2;
                justify-self: start
            }

            .top h1 {
                font-size: 29px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }

        .paper {
            --rule: #c9d6ea;
            --red: #c8262b;
            --ink: #1c3390;
            --margin: #efa3a3;
            --sheet: #fdfdfb;
            --codebg: #f3f5fa;
            --codefg: #1d2740;
            position: relative;
            background-color: var(--sheet);
            color: var(--ink);
            font-family: 'Kalam', 'Comic Sans MS', cursive;
            font-size: 19px;
            line-height: 32px;
            padding: 48px 28px 32px 84px;
            background-image: linear-gradient(90deg, transparent 62px, var(--margin) 62px, var(--margin) 64px, transparent 64px), repeating-linear-gradient(180deg, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
            background-position: 0 0, 0 9px
        }

        .paper h1 {
            font: 700 40px/64px 'Kalam', 'Comic Sans MS', cursive;
            margin: 0;
            color: var(--ink);
            font-style: italic
        }

        .paper .tema {
            margin: 0;
            color: var(--ink);
            font-weight: 700
        }

        .paper .frase {
            margin: 0;
            color: var(--red)
        }

        .paper h2 {
            font: inherit;
            margin: 32px 0 0;
            color: var(--red)
        }

        .paper h2 b {
            font-size: 22px
        }

        .paper h2 i {
            font-style: normal
        }

        .paper p {
            margin: 0
        }

        .paper p b {
            color: var(--red)
        }

        .paper code {
            font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
            font-size: .76em;
            color: #0d6b52;
            font-weight: 600;
            overflow-wrap: anywhere
        }

        .paper pre {
            margin: 0;
            box-sizing: border-box;
            background: var(--codebg);
            color: var(--codefg);
            font: 500 12.5px/24px 'JetBrains Mono', ui-monospace, Consolas, monospace;
            border-left: 3px solid var(--ink);
            padding: 0 12px;
            overflow-x: auto;
            display: flex;
            align-items: center
        }

        .paper pre code {
            color: inherit;
            font: inherit;
            overflow-wrap: normal;
            white-space: pre
        }

        .paper p.ex,
        .paper p.alerta {
            padding-left: 24px
        }

        .paper p.ex b {
            color: #0d6b52
        }

        .paper .dica {
            margin-top: 32px
        }

        .paper .dica b {
            color: var(--red)
        }

        @media(max-width:560px) {
            .paper {
                font-size: 17px;
                padding: 32px 12px 32px 40px;
                background-image: linear-gradient(90deg, transparent 28px, var(--margin) 28px, var(--margin) 30px, transparent 30px), repeating-linear-gradient(180deg, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
                background-position: 0 0, 0 25px
            }

            .paper h1 {
                font-size: 32px
            }
        }
    </style>
    <div class="wrap" id="app"></div>
    <script>
        const DATA = [{ "id": "ia", "sigla": "IA", "nome": "Inteligência Artificial", "cor": "#3b5bdb", "semanas": [{ "n": 21, "tema": "Ferramentas e orquestração", "frase": "Fazer a IA agir, não só responder", "html": "<div data-flow><h1>Semana 21<\/h1><p class=\"tema\">Ferramentas e orquestração<\/p><p class=\"frase\">Fazer a IA agir, não só responder<\/p><\/div><h2>① <b>Function calling:<\/b> <i>O modelo pede, o sistema executa<\/i><\/h2><p><b>Agente:<\/b> Sistema com LLM que decide ações e usa ferramentas para cumprir uma tarefa.<\/p><p><b>Function calling:<\/b> O modelo escolhe a função e gera os parâmetros em JSON =&gt; o sistema executa e devolve o resultado. O modelo não executa nada sozinho.<\/p><p><b>Fluxo:<\/b> Cadastro das funções → análise da pergunta → geração da chamada → execução e resposta.<\/p><p><b>Definição de função:<\/b> Nome, descrição e parâmetros (tipo e obrigatoriedade). Ideia-chave: bem descrita = chamada precisa.<\/p><pre style=\"height:96px\"><code>Pergunta: \"O pedido #4721 já foi despachado?\"\n{\"funcao\": \"rastrear_pedido\", \"parametros\": {\"pedido\": \"4721\"}}\nO sistema consulta a API, devolve o status e o modelo escreve a resposta.<\/code><\/pre><h2>② <b>Frameworks de orquestração:<\/b> <i>Peças que trabalham juntas<\/i><\/h2><p><b>Framework:<\/b> Organiza agentes, ferramentas, memória e execução. (Ex: LangChain, AutoGen)<\/p><p><b>Agente:<\/b> Decide o que fazer.<\/p><p><b>Ferramentas:<\/b> Funções que o agente pode chamar.<\/p><p><b>Memória:<\/b> Curto prazo = conversa atual. Longo prazo = dados do usuário entre sessões.<\/p><p><b>Executor:<\/b> Roda o ciclo pensa → age → observa → decide.<\/p><p><b>Significado x palavra-chave:<\/b> Regra por palavra falha com sinônimos (\"fatura\" no lugar de \"nota fiscal\"). O LLM decide pelo significado.<\/p><h2>③ <b>Sistemas multiagentes:<\/b> <i>Uma equipe em vez de um faz-tudo<\/i><\/h2><p><b>Monolítico x multiagente:<\/b> Um agente faz tudo x vários especialistas, cada um com papel, ferramentas e contexto.<\/p><p><b>Orquestrador (manager):<\/b> Decompõe a tarefa, delega aos agentes (executores), passa o contexto e junta os resultados.<\/p><p><b>Handoff:<\/b> Cada agente recebe uma entrada, produz algo e entrega ao próximo (requisitos → código → testes → deploy).<\/p><p><b>Vantagens:<\/b> Quem produz não revisa o próprio trabalho, menos contexto por agente, etapas em paralelo e rastreabilidade do erro.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Se a informação está fora da conversa (dados de hoje, de uma empresa, de um usuário), o modelo não sabe: ele precisa de uma ferramenta. Sem ela, o risco é inventar.<\/p>", "qs": [{ "q": "Um agente recebe o texto: “Qual a previsão do tempo para São Paulo amanhã?” O modelo identifica a necessidade de uma API externa. Qual é o próximo passo correto no fluxo de function calling?", "o": ["Gerar uma resposta aproximada com base no treinamento.", "Selecionar a função e gerar parâmetros estruturados.", "Retreinar o modelo com dados meteorológicos atuais.", "Solicitar ao usuário que consulte a API diretamente."], "t": "per" }, { "q": "Em um framework de orquestração, um agente recebe a tarefa “Pesquise sobre energia solar e escreva um resumo”. Qual sequência descreve corretamente seu fluxo de execução?", "o": ["LLM → embedding → vector store → resposta", "Usuário → fine-tuning → modelo → saída", "API → memória → retriever → modelo base", "Agente → ferramentas → LLM → resposta final"], "t": "per" }, { "q": "Em um sistema multiagente, o orquestrador recebe a tarefa “criar e revisar um relatório financeiro trimestral“. Qual é sua principal responsabilidade nesse fluxo?", "o": ["Substituir o LLM base por um modelo mais eficiente.", "Armazenar o histórico de todas as conversas geradas.", "Executar diretamente todas as etapas do relatório.", "Decompor a tarefa e delegar a agentes especializados."], "t": "per" }, { "q": "No function calling, quem de fato executa a função?", "o": ["O próprio modelo de linguagem", "O sistema (programa) que recebeu a chamada", "O usuário que fez a pergunta", "O banco vetorial do projeto"], "t": "mc" }, { "q": "O que o modelo gera ao decidir usar uma função?", "o": ["Um novo arquivo de treinamento", "Um relatório em PDF", "Uma instrução estruturada, geralmente em JSON", "Uma cópia do banco de dados"], "t": "mc" }, { "q": "Qual item NÃO faz parte de uma boa definição de função?", "o": ["Nome da função", "Descrição do que ela faz", "Parâmetros, com tipo e obrigatoriedade", "A cor da interface do chat"], "t": "mc" }, { "q": "Por que um sistema só com palavras-chave falha quando o usuário troca \"nota fiscal\" por \"fatura\"?", "o": ["Porque ele compara o termo, não o significado", "Porque \"fatura\" é uma palavra proibida", "Porque a memória de longo prazo apagou o termo", "Porque o JSON não aceita essa palavra"], "t": "mc" }, { "q": "No handoff entre agentes, o que acontece?", "o": ["Todos os agentes respondem ao usuário ao mesmo tempo", "O orquestrador apaga o trabalho do agente anterior", "Um agente entrega o que produziu para o próximo continuar", "O modelo base é trocado por outro"], "t": "mc" }, { "q": "Escolha uma tarefa do dia a dia que um assistente não consegue resolver sozinho (ex.: saber o horário do ônibus). Escreva o nome da função que ele deveria chamar e quais parâmetros ela receberia.", "o": null, "t": "ab" }, { "q": "Explique com suas palavras por que dividir uma tarefa entre agentes especializados pode ser melhor do que usar um único agente que faz tudo.", "o": null, "t": "ab" }] }, { "n": 22, "tema": "Projeto prático: concepção e arquitetura", "frase": "Pensar antes de programar", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Projeto prático: concepção e arquitetura<\/p><p class=\"frase\">Pensar antes de programar<\/p><\/div><h2>① <b>Do problema aos requisitos:<\/b> <i>Comece pelo problema, não pela tecnologia<\/i><\/h2><p><b>Quando usar IA generativa:<\/b> Boa para linguagem natural, dúvidas variadas, resumos e ideias.<\/p><p><b>Quando não usar:<\/b> Regras fixas e exatas (calcular imposto, validar CPF, somar planilha). Código comum é mais barato e confiável.<\/p><p><b>Problema bem definido:<\/b> Diz quem é o usuário, qual a dificuldade e que resultado se espera. Ex: \"clientes esperam 40 min para rastrear um pedido\".<\/p><p><b>Requisito funcional:<\/b> O que o sistema faz (consultar pedidos, recomendar conteúdo, fazer login).<\/p><p><b>Requisito não funcional:<\/b> Como ele funciona (responder em até 3 s, proteger dados, funcionar 24 h).<\/p><p><b>MVP:<\/b> Primeira versão só com o essencial para validar a ideia. Métricas dizem se deu certo (de 40 min para menos de 1 min).<\/p><h2>② <b>Equipe de agentes:<\/b> <i>Caso: assistente da EstudaMais<\/i><\/h2><p><b>Agente:<\/b> Modelo de linguagem + instruções + ferramentas, agindo em etapas para um objetivo.<\/p><p><b>Orquestrador:<\/b> Identifica a intenção, delega e consolida a resposta final. Coordena, não executa.<\/p><p><b>Dúvidas:<\/b> Responde sobre o conteúdo dos cursos usando RAG. Entrega a resposta com a fonte.<\/p><p><b>Recomendação:<\/b> Usa o banco de progresso e o catálogo para sugerir o próximo conteúdo.<\/p><p><b>Exercícios:<\/b> Gera questões de prática com gabarito.<\/p><p><b>Progresso:<\/b> Informa o desempenho do aluno.<\/p><p><b>Custo de especializar:<\/b> Mais peças, mais tempo e mais custo. Só divida quando fizer sentido.<\/p><h2>③ <b>Arquitetura:<\/b> <i>Como as peças se conectam<\/i><\/h2><p><b>Componentes:<\/b> Interface (chat), orquestrador, agentes, RAG, memória, ferramentas e modelo de linguagem.<\/p><p><b>RAG:<\/b> A pergunta vira vetor, o sistema busca trechos do material e o modelo responde com base neles.<\/p><p><b>RAG ≠ memória:<\/b> RAG traz o conhecimento geral do curso. Memória guarda a conversa (curto prazo) e os dados do aluno (longo prazo).<\/p><p><b>Sem exagero:<\/b> O RAG reduz respostas inventadas, mas não elimina. Base desatualizada gera resposta errada.<\/p><pre style=\"height:128px\"><code>Aluno: \"O que é chave primária?\"\nInterface → Orquestrador (\"é dúvida conceitual\") → Agente de Dúvidas\n→ RAG busca a apostila de BD → Modelo gera a resposta\n→ Orquestrador consolida → Interface mostra ao aluno<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Se não dá para medir, não dá para saber se funcionou. Todo requisito não funcional precisa de um critério verificável (\"até 3 segundos\", e não \"rápido\").<\/p>", "qs": [{ "q": "Em um projeto de IA, a afirmação “O sistema deve responder em até 3 segundos\" é exemplo de qual tipo de requisito?", "o": ["Requisito funcional, pois descreve uma função.", "Requisito não funcional ligado à qualidade.", "Critério de sucesso de negócio do projeto.", "Restrição de escopo da primeira entrega."], "t": "per" }, { "q": "Em um sistema multiagente, um agente recebe a tarefa, divide-a em subtarefas e as distribui aos demais agentes. Qual é o papel desse agente?", "o": ["Agente especialista em uma tarefa única.", "Agente de memória, que guarda o histórico", "Agente de borda, que processa dados locais.", "Agente orquestrador, que coordena os demais."], "t": "per" }, { "q": "No design de uma arquitetura agêntica, qual componente recupera os documentos relevantes de uma base de conhecimento para fundamentar as respostas do modelo?", "o": ["O componente de recuperação do RAG.", "A memória de curto prazo da conversa.", "A ferramenta de chamada de função.", "O orquestrador de fluxo entre os agentes."], "t": "per" }, { "q": "Qual destas tarefas é melhor resolver com código comum, e não com IA generativa?", "o": ["Resumir um texto longo", "Responder dúvidas variadas de alunos", "Validar se um CPF é válido", "Sugerir ideias para um projeto"], "t": "mc" }, { "q": "Qual frase descreve melhor um problema bem definido?", "o": ["A empresa quer usar IA", "Precisamos de um chatbot moderno", "Clientes esperam 40 minutos para rastrear um pedido", "Vamos usar o modelo mais novo do mercado"], "t": "mc" }, { "q": "O que é um MVP?", "o": ["A primeira versão só com o essencial para validar a ideia", "A versão final, com todas as funções prontas", "Um tipo de banco vetorial", "O agente mais importante do sistema"], "t": "mc" }, { "q": "O sistema da EstudaMais precisa lembrar quais dificuldades o aluno teve em sessões anteriores. Qual componente cuida disso?", "o": ["A interface do chat", "A memória de longo prazo", "O RAG do material do curso", "O agente de Exercícios"], "t": "mc" }, { "q": "Qual é um erro comum ao criar requisitos não funcionais?", "o": ["Definir um tempo máximo de resposta", "Colocar um número verificável", "Escrever apenas \"o sistema deve ser rápido\"", "Citar a disponibilidade do sistema"], "t": "mc" }, { "q": "Pense em um problema real da sua escola. Escreva-o em uma frase dizendo quem é o usuário, qual é a dificuldade e qual meta medível você quer alcançar.", "o": null, "t": "ab" }, { "q": "Para esse problema, liste um requisito funcional e um requisito não funcional.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Projeto prático: desenvolvimento I", "frase": "O assistente sai do papel", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Projeto prático: desenvolvimento I<\/p><p class=\"frase\">O assistente sai do papel<\/p><\/div><h2>① <b>Ambiente de desenvolvimento:<\/b> <i>Funcionar em qualquer máquina<\/i><\/h2><p><b>Ambiente virtual:<\/b> Uma \"caixa\" de bibliotecas por projeto. Evita que um projeto quebre o outro.<\/p><p><b>requirements.txt:<\/b> Lista de bibliotecas e versões. Quem chega no projeto instala tudo de uma vez.<\/p><p><b>ModuleNotFoundError:<\/b> Biblioteca não instalada, lista ausente ou ambiente errado.<\/p><p><b>Chave de API:<\/b> É senha. Fica no <code>.env<\/code> (lida com <code>os.getenv<\/code>), e o <code>.env<\/code> vai para o <code>.gitignore<\/code>. Nunca no código, nunca no GitHub.<\/p><p><b>Pastas:<\/b> <code>src/<\/code> código, <code>data/<\/code> documentos, <code>notebooks/<\/code> testes, <code>README.md<\/code> instruções.<\/p><pre style=\"height:64px\"><code>python -m venv .venv\npip install -r requirements.txt<\/code><\/pre><h2>② <b>Agente de Dúvidas v1:<\/b> <i>Regras, ainda sem entender<\/i><\/h2><p><b>Classe do agente:<\/b> Tem o método <code>responder()<\/code>, que usa <code>.lower()<\/code> e <code>if/elif<\/code> para escolher a resposta.<\/p><p><b>Limitação:<\/b> Compara o texto exato. \"o que é python\" (sem ?) ou \"me explica Python\" já falham. O agente não entende, só segue regras.<\/p><h2>③ <b>RAG e memória:<\/b> <i>Buscar e lembrar<\/i><\/h2><p><b>RAG:<\/b> Geração aumentada por recuperação. Antes de responder, o agente busca trechos relevantes numa base de documentos.<\/p><p><b>Busca simulada:<\/b> Na aula, procura o título do documento dentro da pergunta.<\/p><p><b>RAG real:<\/b> Textos viram embeddings num banco vetorial (ex: Chroma) e a busca é por significado.<\/p><p><b>Memória de curto prazo:<\/b> Lista com as perguntas da conversa atual.<\/p><p><b>Persistência:<\/b> Gravar em arquivo (<code>memoria.json<\/code>) faz o histórico sobreviver ao fim da sessão.<\/p><pre style=\"height:96px\"><code>if doc[\"titulo\"].lower() in pergunta:\n    # \"O que é Python?\" encontra o documento \"Python\"\n    # \"estrutura de repetição\" NÃO encontra \"Estruturas de repetição\"<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Memória lembra a conversa. RAG busca nos documentos. São funções diferentes e complementares.<\/p>", "qs": [{ "q": "Em um projeto de IA, qual prática evita que diferentes projetos tenham conflito entre as versões das bibliotecas que utilizam?", "o": ["Instalar todas as bibliotecas globalmente.", "Usar um ambiente virtual por projeto.", "Atualizar o Python a cada projeto novo.", "Manter os códigos em pastas separadas."], "t": "per" }, { "q": "Em um agente programado em Python, qual estrutura foi utilizada para decidir qual resposta retornar ao usuário?", "o": ["A memória da conversa.", "O banco vetorial.", "O histórico do navegador.", "As estruturas condicionais if e elif."], "t": "per" }, { "q": "Em um agente de IA, qual é a diferença essencial entre memória de curto prazo e o componente de RAG?", "o": ["RAG é mais rápido que memória nas consultas.", "Ambos os componentes são equivalentes.", "Memória guarda conversa; RAG busca documentos.", "Memória cria embeddings, mas RAG não."], "t": "per" }, { "q": "Para que serve o arquivo requirements.txt?", "o": ["Guardar as chaves de API do projeto", "Listar as bibliotecas necessárias e suas versões", "Registrar as conversas do agente", "Substituir o ambiente virtual"], "t": "mc" }, { "q": "Onde a chave de API deve ficar em um projeto?", "o": ["Escrita direto no código, para facilitar", "No README.md, para a equipe ver", "No arquivo .env, que vai para o .gitignore", "Em um comentário dentro do src/"], "t": "mc" }, { "q": "Um colega rodou o projeto e apareceu ModuleNotFoundError. Qual é a causa mais provável?", "o": ["O agente não entendeu a pergunta", "A temperatura do modelo está alta", "O RAG não encontrou o documento", "A biblioteca não está instalada no ambiente usado"], "t": "mc" }, { "q": "Por que o Agente de Dúvidas v1 falha com \"me explica Python\"?", "o": ["Porque compara texto com regras fixas, sem entender o significado", "Porque o Python não aceita perguntas", "Porque a chave de API expirou", "Porque o método lower() apaga a pergunta"], "t": "mc" }, { "q": "No RAG real, o que permite buscar por significado?", "o": ["Procurar o título exato do documento", "Usar apenas if e elif", "Embeddings guardados em um banco vetorial", "Aumentar o tamanho do arquivo .env"], "t": "mc" }, { "q": "Por que subir o arquivo .env para o GitHub é um risco? O que poderia acontecer com o projeto?", "o": null, "t": "ab" }, { "q": "Um aluno pergunta ao agente \"e como faço isso?\" logo depois de falar sobre listas. Explique por que a memória de curto prazo é importante nessa situação.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Projeto prático: desenvolvimento II", "frase": "Agentes conectados e código seguro", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Projeto prático: desenvolvimento II<\/p><p class=\"frase\">Agentes conectados e código seguro<\/p><\/div><h2>① <b>Orquestração:<\/b> <i>O maestro do sistema<\/i><\/h2><p><b>Orquestração:<\/b> Coordenar as partes para trabalharem juntas, na ordem certa: quem executa, quando entra e como a informação circula.<\/p><p><b>Lógica de orquestração:<\/b> Distribui tarefas, gerencia o fluxo, trata falhas e junta os resultados. Parecido com microsserviços.<\/p><p><b>Full-stack:<\/b> Interface → back-end → orquestrador → agentes → APIs.<\/p><pre style=\"height:128px\"><code>def orquestrador(texto):\n    entrada = agente_entrada(texto)\n    tipo = agente_analise(entrada)   # CLIMA ou HORA\n    return agente_resposta(tipo)<\/code><\/pre><h2>② <b>Ferramentas externas:<\/b> <i>Dados reais fora da conversa<\/i><\/h2><p><b>Tool:<\/b> Função que consulta uma API, um banco de dados ou executa uma ação.<\/p><p><b>Fluxo:<\/b> Usuário → agente → API externa → agente → resposta final.<\/p><p><b>Quando usar:<\/b> Quando a tarefa exige consultar algo fora da conversa.<\/p><p><b>Erro tratado:<\/b> Se a API devolver erro, o agente responde com uma mensagem clara. Ex: \"CEP não encontrado.\"<\/p><pre style=\"height:160px\"><code>def consultar_cep(cep):\n    url = f\"https://viacep.com.br/ws/{cep}/json/\"\n    return requests.get(url).json()\n\n# agente_endereco(\"01001000\")\n# \"O CEP pertence a Praça da Sé, São Paulo - SP.\"<\/code><\/pre><h2>③ <b>Git para colaborar:<\/b> <i>Mudar sem quebrar a main<\/i><\/h2><p><b>Branch:<\/b> Linha separada para desenvolver a melhoria sem mexer na <code>main<\/code>.<\/p><p><b>Commit:<\/b> Registra cada passo, com mensagem clara.<\/p><p><b>Merge:<\/b> Integra a melhoria na <code>main<\/code> depois de testada.<\/p><pre style=\"height:128px\"><code>git checkout -b ajuste\ngit add .\ngit commit -m \"melhora a comunicação entre agentes\"\ngit checkout main\ngit merge ajuste<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Git não é só salvar arquivo: é o jeito de a equipe mudar o código com segurança. Nada instável vai direto para a main.<\/p>", "qs": [{ "q": "Qual é a principal função da lógica de orquestração em um sistema com vários agentes?", "o": ["Eliminar a necessidade de back-end.", "Coordenar o fluxo entre os agentes.", "Fazer todos os agentes responderem juntos.", "Substituir toda a interface do sistema."], "t": "per" }, { "q": "Em um sistema com agentes, a conexão com uma ferramenta externa faz mais sentido quando?", "o": ["O agente só precisa conversar.", "O sistema quer responder sem dados.", "O agente deve ignorar APIs.", "A tarefa exige consultar algo fora da conversa."], "t": "per" }, { "q": "Quando uma equipe quer corrigir a comunicação entre agentes sem mexer direto na versão principal, o que faz mais sentido?", "o": ["Editar tudo direto na main.", "Apagar o histórico anterior.", "Criar uma branch para a melhoria.", "Evitar registrar commits."], "t": "per" }, { "q": "O que a lógica de orquestração faz em um sistema com agentes?", "o": ["Treina um novo modelo de linguagem", "Distribui tarefas, controla o fluxo e junta os resultados", "Desenha a interface do aplicativo", "Substitui as APIs externas"], "t": "mc" }, { "q": "Na prática da aula, qual a ordem de chamada dos agentes?", "o": ["agente_resposta → agente_analise → agente_entrada", "agente_analise → agente_resposta → agente_entrada", "agente_entrada → agente_analise → agente_resposta", "agente_resposta → agente_entrada → agente_analise"], "t": "mc" }, { "q": "O que é uma ferramenta (tool) para um agente?", "o": ["Uma função que consulta dados externos ou executa uma ação", "Um novo modelo de linguagem", "Um comentário no código", "Uma branch do Git"], "t": "mc" }, { "q": "Qual comando cria uma branch chamada ajuste e já entra nela?", "o": ["git merge ajuste", "git commit -m \"ajuste\"", "git add ajuste", "git checkout -b ajuste"], "t": "mc" }, { "q": "No exemplo da API ViaCEP, o que o agente deve fazer quando o CEP não existe?", "o": ["Inventar um endereço parecido", "Encerrar o programa com erro", "Informar que o CEP não foi encontrado", "Apagar a função consultar_cep"], "t": "mc" }, { "q": "Dê um exemplo de pergunta que um agente só consegue responder usando uma API externa e diga qual API ou tipo de dado ele precisaria consultar.", "o": null, "t": "ab" }, { "q": "Explique, em ordem, o que sua equipe faria no Git para testar uma melhoria sem correr o risco de quebrar a versão principal.", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Projeto prático: testes e refinamento", "frase": "Rápido não é o mesmo que certo", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Projeto prático: testes e refinamento<\/p><p class=\"frase\">Rápido não é o mesmo que certo<\/p><\/div><h2>① <b>Testar o agente:<\/b> <i>Com método, não no achismo<\/i><\/h2><p><b>Usabilidade:<\/b> Experiência. Resposta clara, fácil de entender, útil e no contexto.<\/p><p><b>Confiabilidade:<\/b> Informação correta. Consistente, sem contradições, sem invenções e estável.<\/p><p><b>Teste por script:<\/b> Roteiro com pergunta → comportamento esperado → observação → registro. Dá para repetir depois de cada ajuste.<\/p><p><b>Bug x alucinação:<\/b> Bug é erro de funcionamento. Alucinação é resposta inventada ou sem base, muitas vezes dita com confiança.<\/p><p><b>Ciclo:<\/b> Testar → registrar → ajustar → testar de novo. Registre prompt, resposta, problema e evidência.<\/p><h2>② <b>Ajustar prompt e parâmetros:<\/b> <i>Controlar a resposta<\/i><\/h2><p><b>Prompt específico:<\/b> Tarefa clara + público + formato + limites (\"não fale do que não foi perguntado\").<\/p><p><b>Temperatura:<\/b> Baixa = respostas previsíveis e focadas. Alta = criativas e variadas.<\/p><p><b>Top-p:<\/b> Limita as opções às palavras mais prováveis. Baixo = foco. Alto = variedade.<\/p><p><b>Valor técnico:<\/b> Para explicações técnicas, valores baixos (ex: 0.2) funcionam melhor.<\/p><p><b>Cuidado:<\/b> Temperatura baixa não elimina alucinação. Se o modelo não sabe, ele pode errar mesmo assim.<\/p><pre style=\"height:128px\"><code>Agente: \"Variável é uma função que roda automaticamente\n         e controla a internet do sistema.\"  → alucinação\nCorreção: prompt pedindo definição curta + exemplo (idade = 16)\n          temperatura 0.2, testar de novo e registrar antes/depois<\/code><\/pre><h2>③ <b>Feedback do usuário:<\/b> <i>Correto ainda pode ser ruim<\/i><\/h2><p><b>Por que ouvir:<\/b> Resposta correta pode ser curta, robótica ou pouco útil.<\/p><p><b>Feedback:<\/b> Orienta ajustes de tom, formato e utilidade.<\/p><p><b>Melhoria contínua:<\/b> Versão inicial → versão técnica corrigida → versão final após feedback.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Uma resposta bem escrita também pode estar errada. Desconfie do tom confiante e confira com um gabarito.<\/p>", "qs": [{ "q": "Em um teste baseado em script, o que ajuda a avaliar melhor a resposta do agente?", "o": ["Fazer perguntas aleatórias sem registro.", "Ter roteiro e comportamento esperado.", "Ignorar erros pequenos.", "Avaliar só o tamanho da resposta."], "t": "per" }, { "q": "Ao tentar reduzir alucinações em uma resposta técnica simples, qual ajuste tende a ajudar mais?", "o": ["Maior aleatoriedade da resposta.", "Deixar o prompt mais vago.", "Pedir que o agente fale livremente do tema.", "Especificar melhor a tarefa."], "t": "per" }, { "q": "Depois de corrigir uma resposta do agente, o que o feedback do usuário ajuda a fazer?", "o": ["Encerrar os testes imediatamente.", "Melhorar só a cor da interface.", "Ajustar a experiência e a forma de resposta.", "Ignorar a etapa de validação técnica."], "t": "per" }, { "q": "Qual a diferença entre usabilidade e confiabilidade em um agente?", "o": ["Usabilidade é a experiência; confiabilidade é a informação correta", "As duas significam a mesma coisa", "Usabilidade mede velocidade; confiabilidade mede custo", "Usabilidade é do back-end; confiabilidade é da interface"], "t": "mc" }, { "q": "O agente diz, com muita segurança, algo que não existe. Isso é:", "o": ["Um erro de compilação", "Uma alucinação", "Uma branch", "Um requisito funcional"], "t": "mc" }, { "q": "Para uma explicação técnica precisa, qual configuração costuma funcionar melhor?", "o": ["Temperatura bem alta", "Top-p alto com prompt vago", "Temperatura baixa, como 0.2", "Remover o prompt do sistema"], "t": "mc" }, { "q": "O que deve ser registrado no ciclo de testes?", "o": ["Apenas as respostas que deram certo", "Somente a cor da interface", "Nada, para não atrasar a equipe", "Prompt, resposta, problema encontrado e evidência"], "t": "mc" }, { "q": "O que torna um prompt mais específico?", "o": ["Ser o mais curto possível", "Pedir para o agente falar livremente", "Informar tarefa, público, formato e limites", "Repetir a mesma palavra várias vezes"], "t": "mc" }, { "q": "Reescreva o prompt \"fale sobre listas\" para que ele fique específico. Indique público, formato e limite de tamanho.", "o": null, "t": "ab" }, { "q": "Monte um caso de teste para um agente de dúvidas: escreva a pergunta e o comportamento esperado.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Projeto prático: deploy e apresentação", "frase": "Do meu computador para o mundo", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Projeto prático: deploy e apresentação<\/p><p class=\"frase\">Do meu computador para o mundo<\/p><\/div><h2>① <b>Pronto para o mercado:<\/b> <i>Funcionar só no meu PC não basta<\/i><\/h2><p><b>Critérios:<\/b> Funcionamento sem erros, implantação simples, organização (arquivos, banco, documentação) e apresentação clara.<\/p><p><b>Portabilidade:<\/b> Onde o software funciona (vários ambientes).<\/p><p><b>Escalabilidade:<\/b> Quanto ele aguenta crescer sem perder desempenho nem explodir custos.<\/p><h2>② <b>Conteinerização com Docker:<\/b> <i>A aplicação viaja com tudo que precisa<\/i><\/h2><p><b>Conteinerizar:<\/b> Empacotar a aplicação com bibliotecas, dependências e configurações para rodar igual em qualquer máquina ou nuvem.<\/p><p><b>Fluxo:<\/b> Aplicação → Dockerfile (a receita) → imagem (<code>docker build<\/code>) → contêiner (<code>docker run<\/code>) → cloud (deploy).<\/p><p><b>Dockerfile:<\/b> <code>FROM<\/code> imagem base, <code>WORKDIR<\/code> pasta de trabalho, <code>COPY<\/code> copia o projeto, <code>RUN<\/code> instala dependências, <code>CMD<\/code> executa.<\/p><pre style=\"height:224px\"><code>FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install -r requirements.txt\nCMD [\"python\", \"src/main.py\"]\n\ndocker build -t estudamais .\ndocker run --env-file .env estudamais<\/code><\/pre><p><b>Segredos:<\/b> As chaves entram na hora de rodar, não dentro da imagem.<\/p><h2>③ <b>Pitch e carreira:<\/b> <i>Mostrar o projeto e o próximo passo<\/i><\/h2><p><b>Pitch:<\/b> Problema → solução → resultado, com demonstração funcionando.<\/p><p><b>Credibilidade:<\/b> Mostrar a melhoria técnica (ex: contêiner) fortalece a apresentação.<\/p><p><b>Carreira em IA:<\/b> Pense em competências, não só em cargos.<\/p><p><b>Plano:<\/b> Onde estou (o que sei) → onde quero chegar (atuação) → próximo passo concreto (estudo, prática, portfólio).<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> O ambiente virtual isola as bibliotecas. O contêiner leva o ambiente inteiro junto. Os dois atacam o mesmo problema: \"na minha máquina funciona\".<\/p>", "qs": [{ "q": "Qual etapa garante que a aplicação rode da mesma forma em diferentes ambientes?", "o": ["Alterar o layout do sistema.", "Conteinerizar a aplicação.", "Apresentar o projeto em slides.", "Criar novas funcionalidades."], "t": "per" }, { "q": "Em um pitch de produto digital, o que fortalece mais a apresentação da solução?", "o": ["Falar apenas que a ideia é boa.", "Mostrar só o nome do projeto.", "Usar muitos efeitos no slide.", "Explicar o problema, a solução e os benefícios."], "t": "per" }, { "q": "Ao planejar uma carreira em IA, o que ajuda mais a construir um próximo passo realista?", "o": ["Escolher um cargo sem olhar habilidades.", "Copiar o plano de outra pessoa.", "Mapear competências e definir uma meta.", "Esperar dominar tudo antes de começar."], "t": "per" }, { "q": "O que é portabilidade?", "o": ["A quantidade de usuários que o sistema suporta", "A capacidade de o software funcionar em vários ambientes", "O tamanho do arquivo Dockerfile", "A velocidade da internet do usuário"], "t": "mc" }, { "q": "Qual instrução do Dockerfile define a imagem base?", "o": ["FROM", "COPY", "CMD", "WORKDIR"], "t": "mc" }, { "q": "Qual é a ordem correta do fluxo com Docker?", "o": ["Contêiner → imagem → Dockerfile", "Imagem → Dockerfile → contêiner", "Dockerfile → imagem → contêiner", "Dockerfile → contêiner → imagem"], "t": "mc" }, { "q": "Por que as chaves de API não devem ficar dentro da imagem?", "o": ["Porque a imagem não aceita texto", "Porque deixam a imagem mais lenta", "Porque o Docker apaga as chaves", "Porque quem tiver a imagem teria acesso a elas"], "t": "mc" }, { "q": "Qual é a estrutura recomendada para um pitch?", "o": ["Nome do projeto → agradecimento → fim", "Problema → solução → resultado", "Código completo → lista de bibliotecas", "Efeitos visuais → música → logo"], "t": "mc" }, { "q": "Monte seu plano de carreira em IA em 3 linhas: onde você está hoje, onde quer chegar e qual é o seu próximo passo concreto.", "o": null, "t": "ab" }, { "q": "Explique para alguém que não é de TI, em poucas frases, o problema que o contêiner resolve.", "o": null, "t": "ab" }] }] }, { "id": "llp", "sigla": "LLP", "nome": "Lógica e Linguagem de Programação", "cor": "#0b7a5e", "semanas": [{ "n": 21, "tema": "Programando com menu no terminal", "frase": "Menu, funções e validação", "html": "<div data-flow><h1>Semana 21<\/h1><p class=\"tema\">Programando com menu no terminal<\/p><p class=\"frase\">Menu, funções e validação<\/p><\/div><h2>① <b>Como um programa com menu funciona:<\/b> <i>Sempre o mesmo fluxo<\/i><\/h2><p><b>Fluxo:<\/b> Todo programa com menu repete quatro etapas, como um caixa eletrônico: recebe a sua escolha (entrada), decide o que fazer com ela (decisão), executa a tarefa (processamento) e mostra o resultado (saída). Depois, volta para o começo e espera a próxima escolha.<\/p><p class=\"ex\"><b>No código:<\/b> <code>input()<\/code> é a entrada, <code>if/elif/else<\/code> é a decisão, as funções fazem o processamento e <code>print()<\/code> é a saída.<\/p><p><b>input():<\/b> É o jeito de o programa \"ouvir\" o usuário: mostra uma mensagem e fica esperando a pessoa digitar e apertar Enter. O que volta é sempre texto, mesmo que a pessoa digite um número.<\/p><p class=\"ex\"><b>Por isso:<\/b> compare a opção com <code>\"1\"<\/code> (texto). <code>opcao == 1<\/code> nunca é verdadeiro, porque o texto \"1\" e o número 1 são coisas diferentes para o Python.<\/p><p><b>Decisão (if/elif/else):<\/b> O programa compara a opção com cada alternativa, de cima para baixo, e executa só o primeiro bloco cuja condição for verdadeira; os outros são pulados. O <code>else<\/code> pega tudo o que não foi previsto, por isso é o lugar certo para o aviso \"Opção inválida\".<\/p><h2>② <b>Repetição e funções:<\/b> <i>O menu que não fecha sozinho<\/i><\/h2><p><b>while:<\/b> Sem repetição, o programa executa uma vez e termina. <code>while continuar:<\/code> quer dizer \"enquanto continuar for verdadeiro, repita este bloco\". A cada volta o menu aparece de novo e uma nova opção é lida.<\/p><p><b>Variável de controle:<\/b> <code>continuar<\/code> começa valendo <code>True<\/code>. Só a opção 0 muda o valor para <code>False<\/code>. Na próxima verificação, o <code>while<\/code> percebe que a condição ficou falsa e sai do loop: o programa termina.<\/p><pre style=\"height:320px\"><code>produtos = []\ncontinuar = True\nwhile continuar:\n    mostrar_menu()\n    opcao = input(\"Escolha: \")\n    if opcao == \"1\":\n        cadastrar_produto(produtos)\n    elif opcao == \"2\":\n        consultar_produto(produtos)\n    elif opcao == \"0\":\n        continuar = False\n    else:\n        print(\"Opção inválida.\")<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> tudo o que está recuado (indentado) abaixo do <code>while<\/code> se repete. Como o <code>input<\/code> está lá dentro, o programa pergunta de novo a cada volta.<\/p><p><b>Função (def):<\/b> É um bloco de código com nome que executa uma tarefa. Você escreve uma vez com <code>def<\/code> e usa quantas vezes quiser chamando pelo nome, como uma receita: escrita uma vez, usada sempre que precisar.<\/p><p><b>Uma função, uma responsabilidade:<\/b> <code>mostrar_menu()<\/code> só mostra o menu; <code>cadastrar_produto()<\/code> só cadastra. Se algo der errado no cadastro, você já sabe exatamente onde procurar.<\/p><p class=\"ex\"><b>O menu é o recepcionista:<\/b> ele não faz o trabalho, só encaminha para a função certa. Para o sistema crescer, crie a função nova e acrescente um <code>elif<\/code> que a chama.<\/p><h2>③ <b>Parâmetros, validação e consulta:<\/b> <i>Papelaria Ponto Certo<\/i><\/h2><p><b>Parâmetro:<\/b> É a informação que a função recebe para trabalhar, escrita entre os parênteses. Em <code>cadastrar_produto(produtos)<\/code>, a função recebe a mesma lista que o programa principal usa e acrescenta o produto nela.<\/p><p class=\"ex\"><b>Por que não criar a lista dentro da função?<\/b> porque <code>produtos = []<\/code> lá dentro criaria uma lista nova e vazia a cada cadastro, e tudo o que foi cadastrado antes se perderia.<\/p><p><b>Validar:<\/b> É conferir se o dado faz sentido antes de usar. Numa loja não existe preço zero ou negativo, então o programa não deve aceitar esse valor.<\/p><pre style=\"height:192px\"><code>preco_valido = False\nwhile not preco_valido:\n    preco = float(input(\"Preço (&gt; 0): \"))\n    if preco &gt; 0:\n        preco_valido = True\n    else:\n        print(\"Preço inválido.\")<\/code><\/pre><p class=\"ex\"><b>Por que while e não if?<\/b> o <code>if<\/code> avisaria uma vez e seguiria com o preço errado. O <code>while<\/code> pede de novo quantas vezes for preciso, até o preço ser válido. Leia <code>not preco_valido<\/code> como \"enquanto o preço NÃO for válido\".<\/p><p><b>Consulta:<\/b> Para achar um produto, o programa olha a lista item por item, a partir do índice 0, comparando o nome. <code>while i &lt; len(produtos) and not encontrado:<\/code> continua enquanto ainda há itens para olhar E o produto ainda não foi achado.<\/p><p class=\"ex\"><b>As duas condições juntas:<\/b> a primeira impede de passar do fim da lista (o que daria erro); a segunda encerra a busca assim que o produto aparece, sem olhar o resto à toa.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem e como evitar<\/i><\/h2><p><b>Opção lida fora do while:<\/b> Se o <code>input<\/code> fica antes do loop, o menu se repete com a mesma opção para sempre. Tudo o que deve acontecer a cada volta precisa estar indentado dentro do <code>while<\/code>.<\/p><p><b>Variável que nunca muda:<\/b> Sem <code>continuar = False<\/code> ou <code>preco_valido = True<\/code>, a condição do <code>while<\/code> nunca fica falsa e o loop não termina. No terminal, Ctrl+C interrompe.<\/p><p><b>Nome diferente:<\/b> <code>def cadastrar_produto<\/code> e chamada <code>cadastra_produto()<\/code> são nomes diferentes para o Python, que mostra NameError. Copie o nome exato.<\/p><p><b>Indentação:<\/b> O recuo é o que diz ao Python o que está dentro do quê. Um <code>if<\/code> sem recuo fica fora do <code>while<\/code> e só executa depois que o loop acaba.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Em todo while, pergunte: o que faz essa condição ficar falsa? Se nada dentro do loop muda a variável da condição, o programa nunca sai dele.<\/p>", "qs": [{ "q": "Após receber a opção de saque, o programa consulta o saldo, verifica se há valor disponível e mostra uma mensagem. Qual etapa define se o saque pode continuar?", "o": ["Entrada da opção.", "Decisão sobre o saldo.", "Processamento do saldo.", "Repetição do menu."], "t": "per" }, { "q": "Um programa possui funções para cadastrar, consultar e sair. O usuário digita a opção 8, que não existe no menu. O que o programa deve fazer antes de chamar uma função?", "o": ["Executar a primeira função disponível.", "Validar a entrada informada pelo usuário.", "Encerrar o programa imediatamente.", "Exibir o menu novamente."], "t": "per" }, { "q": "O que garante que o menu de um programa continue sendo exibido até que o usuário escolha encerrar o programa?", "o": ["O número de opções que o menu possui.", "A estrutura de repetição (loop) que envolve o menu.", "O tamanho do texto exibido na tela.", "A velocidade de digitação do usuário."], "t": "per" }, { "q": "O que a função input() sempre devolve?", "o": ["Um número inteiro", "Um texto (string)", "Uma lista", "Um valor verdadeiro ou falso"], "t": "mc" }, { "q": "No menu, qual comparação está correta para a opção 1?", "o": ["if opcao = 1:", "if opcao == 1:", "if opcao == \"1\":", "if \"opcao\" == 1:"], "t": "mc" }, { "q": "O que acontece se a leitura da opção ficar fora do while?", "o": ["O menu repete sem perguntar de novo", "O programa fica mais rápido", "O Python corrige sozinho", "A lista de produtos é apagada"], "t": "mc" }, { "q": "Por que passar a lista como parâmetro em cadastrar_produto(produtos)?", "o": ["Para deixar o programa mais curto", "Porque input() exige uma lista", "Para evitar o uso de funções", "Para acrescentar na mesma lista usada pelo programa"], "t": "mc" }, { "q": "O que causa um loop infinito no menu?", "o": ["Ter muitas opções", "Usar print dentro do while", "Nada mudar a variável da condição do while", "Usar elif em vez de if"], "t": "mc" }, { "q": "Escreva como você adicionaria a opção \"3 - Listar produtos\" no menu. Mostre o trecho do if/elif que seria acrescentado.", "o": null, "t": "ab" }, { "q": "Explique com suas palavras por que validar a entrada do usuário é importante. Dê um exemplo da Papelaria.", "o": null, "t": "ab" }] }, { "n": 22, "tema": "Agenda e cadastros em memória", "frase": "Listas, índices e cadastro", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Agenda e cadastros em memória<\/p><p class=\"frase\">Listas, índices e cadastro<\/p><\/div><h2>① <b>Listas e índices:<\/b> <i>Vários valores sob um único nome<\/i><\/h2><p><b>Lista:<\/b> Pense numa prateleira com espaços numerados: cada espaço guarda um item e a prateleira inteira tem um nome. <code>produtos = []<\/code> cria essa prateleira, ainda vazia. Sem lista, você precisaria de uma variável para cada produto (<code>produto1<\/code>, <code>produto2<\/code>...) e nem saberia quantas criar.<\/p><p><b>Operações:<\/b> <code>produtos.append(\"Caneta\")<\/code> coloca no fim; <code>len(produtos)<\/code> diz quantos itens existem; <code>produtos.insert(0, \"Lápis\")<\/code> coloca na primeira posição e empurra os outros uma casa; <code>produtos.remove(\"Caneta\")<\/code> retira o item com esse valor.<\/p><p><b>Índice:<\/b> É o número da posição de cada item. A contagem começa em 0, não em 1: o primeiro item é <code>produtos[0]<\/code>, o segundo é <code>produtos[1]<\/code>. Numa lista de 3 itens, o último é <code>produtos[2]<\/code>, ou seja, sempre <code>len(lista) - 1<\/code>.<\/p><pre style=\"height:128px\"><code>produtos = [\"Caderno\", \"Caneta\", \"Borracha\"]\nprint(produtos[0])     # Caderno\nprint(produtos[2])     # Borracha\nprint(len(produtos))   # 3\nprint(produtos[3])     # IndexError: não existe posição 3<\/code><\/pre><p><b>Memória:<\/b> A lista vive na memória do computador enquanto o programa está aberto, como anotações num quadro branco. Fechou o programa, o quadro é apagado. Para guardar de verdade é preciso gravar em arquivo (assunto da semana 25).<\/p><h2>② <b>Lista de listas:<\/b> <i>Cada produto é [nome, preco]<\/i><\/h2><p><b>Ideia:<\/b> Um produto tem mais de uma informação: nome e preço. Então cada produto vira uma lista pequena <code>[nome, preco]<\/code>, e todas ficam dentro da lista grande <code>produtos<\/code>. Funciona como uma tabela: cada linha é um produto e cada coluna é um campo.<\/p><pre style=\"height:128px\"><code>produtos = [[\"Caneta\", 2.50], [\"Caderno\", 18.90]]\nprint(produtos[0])      # ['Caneta', 2.5]\nprint(produtos[0][0])   # Caneta\nprint(produtos[1][1])   # 18.9<\/code><\/pre><p class=\"ex\"><b>Como ler produtos[1][0]:<\/b> o primeiro colchete escolhe a linha (o 2º produto); o segundo escolhe a coluna (o campo 0, o nome). Resultado: \"Caderno\".<\/p><p><b>Por que lista e não tupla?<\/b> Uma tupla, como <code>(\"Caneta\", 2.50)<\/code>, não pode ser alterada depois de criada. A lista pode. Como o sistema vai precisar mudar o preço com <code>produto[1] = novo_preco<\/code>, usamos lista.<\/p><h2>③ <b>Cadastrar, consultar e listar:<\/b> <i>As três operações de todo cadastro<\/i><\/h2><p><b>Cadastrar:<\/b> Pedir os dados, montar <code>[nome, preco]<\/code> e acrescentar com <code>append<\/code>. A cada cadastro, a lista cresce um item.<\/p><p><b>Consultar:<\/b> Procurar um item específico. Numa lista simples de nomes, <code>if \"Caneta\" in produtos:<\/code> resolve. Numa lista de listas, é preciso percorrer e comparar <code>produto[0]<\/code> (o nome) de cada produto, porque o <code>in<\/code> procuraria a lista inteira <code>[\"Caneta\", 2.5]<\/code>, e não só o nome.<\/p><p><b>Listar:<\/b> Mostrar todos os itens. <code>for produto in produtos:<\/code> passa por cada item, um de cada vez, sem você precisar controlar índice nenhum.<\/p><pre style=\"height:192px\"><code>def listar_produtos(produtos):\n    if len(produtos) == 0:\n        print(\"Nenhum produto cadastrado.\")\n        return\n    for i, produto in enumerate(produtos, start=1):\n        print(f\"{i}. {produto[0]} - R$ {produto[1]:.2f}\")\n    print(f\"Total de produtos: {len(produtos)}\")<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> primeiro trata o caso especial (lista vazia) e sai da função com <code>return<\/code>; <code>enumerate(produtos, start=1)<\/code> entrega o número e o produto juntos, começando em 1 para ficar natural para quem usa; <code>:.2f<\/code> mostra o preço com duas casas decimais.<\/p><p><b>.lower():<\/b> Transforma o texto em minúsculas. O Python diferencia \"Caneta\" de \"caneta\", então comparamos <code>produto[0].lower() == nome.lower()<\/code>: as duas versões ficam iguais antes da comparação.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem e como evitar<\/i><\/h2><p><b>IndexError:<\/b> Acontece ao pedir uma posição que não existe, como <code>produtos[3]<\/code> numa lista de 3 itens. Lembre: o último índice é <code>len(lista) - 1<\/code>.<\/p><p><b>Produto x campo:<\/b> <code>produtos[0]<\/code> é o produto inteiro <code>['Caneta', 2.5]<\/code>; <code>produtos[0][0]<\/code> é só o nome. Usar o errado mostra colchetes na tela ou faz a comparação nunca dar certo.<\/p><p><b>.lower() de um lado só:<\/b> <code>\"Caneta\" == \"caneta\".lower()<\/code> continua falso, porque o lado esquerdo ainda tem C maiúsculo. Aplique nos dois lados.<\/p><p><b>Lista vazia:<\/b> Esquecer de tratar a lista vazia faz a listagem mostrar só \"Total de produtos: 0\", sem explicar nada ao usuário.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Guarde cada produto como lista [nome, preco], não como tupla: mais à frente o sistema precisa alterar o preço, e tupla não deixa.<\/p>", "qs": [{ "q": "O que acontece com uma lista criada apenas na memória quando o programa é encerrado?", "o": ["É salva", "É apagada", "É copiada", "É compartilhada"], "t": "per" }, { "q": "Qual operação deve ser utilizada quando o usuário deseja visualizar todos os produtos cadastrados?", "o": ["Incluir", "Validar", "Consultar", "Listar"], "t": "per" }, { "q": "A consulta percorre a lista comparando cada item. Se a repetição terminar sem encontrar o produto, o que o programa deverá fazer?", "o": ["Criar automaticamente o produto na lista", "Repetir a busca desde o início", "Informar que o produto não foi encontrado", "Encerrar sem mostrar nenhuma mensagem"], "t": "per" }, { "q": "Em uma lista com 5 itens, qual é o índice do último?", "o": ["5", "4", "6", "0"], "t": "mc" }, { "q": "Qual método acrescenta um item no fim da lista?", "o": ["insert()", "len()", "append()", "remove()"], "t": "mc" }, { "q": "Com produtos = [[\"Caneta\", 2.50], [\"Caderno\", 18.90]], o que produtos[1][0] mostra?", "o": ["Caneta", "2.50", "18.90", "Caderno"], "t": "mc" }, { "q": "O que acontece ao acessar produtos[3] em uma lista de 3 itens?", "o": ["Ocorre um IndexError", "O Python cria o item que falta", "O programa mostra o primeiro item", "A lista é apagada"], "t": "mc" }, { "q": "Para que \"caneta\" encontre \"Caneta\" na consulta, o que deve ser feito?", "o": ["Usar .lower() só no texto digitado", "Usar .lower() só no nome da lista", "Usar .lower() nos dois lados da comparação", "Trocar a lista por uma tupla"], "t": "mc" }, { "q": "Escreva o código que cria uma lista com três produtos (nome e preço) e mostra na tela apenas o preço do segundo produto.", "o": null, "t": "ab" }, { "q": "Explique por que, na listagem, é importante tratar primeiro o caso da lista vazia.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Médias, faixas e classificação", "frase": "De regra de negócio a algoritmo", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Médias, faixas e classificação<\/p><p class=\"frase\">De regra de negócio a algoritmo<\/p><\/div><h2>① <b>Da regra ao algoritmo:<\/b> <i>Regra objetiva vira código<\/i><\/h2><p><b>Regra de negócio:<\/b> É uma regra da empresa, como \"produto que vende pouco precisa de promoção\". O computador não entende \"pouco\": ele precisa de um número para comparar. Por isso a regra vira \"média menor que 10 → giro baixo\", que pode ser testada com um <code>if<\/code>.<\/p><p class=\"ex\"><b>Teste da regra:<\/b> se duas pessoas aplicarem a regra no mesmo produto e chegarem ao mesmo resultado, ela é objetiva o bastante para virar código.<\/p><p><b>Calcular x classificar:<\/b> São duas etapas separadas. Primeiro o programa calcula um número (a média); depois compara esse número com as faixas e decide a categoria. Separar as duas deixa cada parte simples e fácil de mudar.<\/p><p><b>Registro de venda:<\/b> Cada venda é uma lista <code>[nome, quantidade, data]<\/code>, por exemplo <code>[\"Caderno\", 10, \"2026-01-15\"]<\/code>. <code>item[0]<\/code> é o nome, <code>item[1]<\/code> a quantidade e <code>item[2]<\/code> a data. Saber a posição de cada campo é o que permite pegar o dado certo.<\/p><p><b>Média:<\/b> Soma das quantidades dividida pelo número de vendas: <code>sum(quantidades) / len(quantidades)<\/code>. Usar <code>len()<\/code> no lugar de um número fixo faz o cálculo funcionar com 3, 7 ou 50 vendas.<\/p><pre style=\"height:224px\"><code>def calcular_media_vendas(vendas, nome):\n    quantidades = []\n    for item in vendas:\n        if item[0] == nome:\n            quantidades.append(item[1])\n    if len(quantidades) == 0:\n        return None\n    return sum(quantidades) / len(quantidades)<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> o <code>for<\/code> passa por todas as vendas; o <code>if<\/code> filtra só as do produto pedido; o <code>append<\/code> junta as quantidades; se não sobrou nenhuma, devolve <code>None<\/code>; senão, devolve a média.<\/p><h2>② <b>Funções com return:<\/b> <i>O resultado alimenta a próxima<\/i><\/h2><p><b>return:<\/b> É a resposta da função. Quando o Python encontra <code>return<\/code>, a função para ali e entrega o valor para quem a chamou, que pode guardá-lo numa variável: <code>media = calcular_media_vendas(vendas, \"Caderno\")<\/code>.<\/p><p class=\"ex\"><b>print x return:<\/b> <code>print<\/code> só mostra na tela e o valor se perde. <code>return<\/code> entrega o valor para o programa continuar usando, por exemplo, passando para outra função.<\/p><p><b>None:<\/b> Significa \"nenhum valor\". A função devolve <code>None<\/code> quando o produto não tem vendas, porque não existe média de zero vendas (dividir por zero daria erro).<\/p><p><b>Encadeamento:<\/b> O resultado de uma função alimenta a próxima, como numa linha de montagem: a média entra na classificação, e a classificação vai para a exibição. Se a empresa mudar as faixas, só a função que classifica precisa ser alterada.<\/p><pre style=\"height:224px\"><code>def classificar_desempenho(media):\n    if media is None:\n        return \"Sem histórico\"\n    elif media &gt;= 30:\n        return \"Alto\"\n    elif media &gt;= 10:\n        return \"Médio\"\n    else:\n        return \"Baixo\"<\/code><\/pre><p class=\"ex\"><b>Por que o None vem primeiro?<\/b> comparar <code>None &gt;= 30<\/code> dá erro. Testando <code>None<\/code> antes, o programa só chega às comparações quando já tem um número.<\/p><h2>③ <b>Faixas e ranking:<\/b> <i>Ordenar e registrar<\/i><\/h2><p><b>Faixas:<\/b> Média ≥ 30 = Alto. Média ≥ 10 e &lt; 30 = Médio. Média &lt; 10 = Baixo. Sem vendas = Sem histórico.<\/p><p class=\"ex\"><b>Por que a ordem importa:<\/b> o <code>elif<\/code> só é testado se os anteriores forem falsos. Média 40 passa no primeiro teste (≥ 30) e para ali. Se o teste ≥ 10 viesse primeiro, 40 também passaria nele e viraria \"Médio\" por engano.<\/p><p><b>Ranking:<\/b> Para comparar produtos, montamos uma lista de resultados, um <code>[nome, media, desempenho]<\/code> por produto, e ordenamos pela média. Produto sem vendas entra com média 0, porque <code>None<\/code> não pode ser comparado na ordenação.<\/p><pre style=\"height:32px\"><code>resultados.sort(key=lambda item: item[1], reverse=True)<\/code><\/pre><p class=\"ex\"><b>Lendo a linha:<\/b> <code>key=lambda item: item[1]<\/code> quer dizer \"ordene olhando a posição 1 de cada resultado\", que é a média; <code>reverse=True<\/code> coloca do maior para o menor.<\/p><p><b>Arquivo:<\/b> O resultado também pode ir para um arquivo de texto. <code>\"a\"<\/code> (append) acrescenta uma linha no fim, bom para um histórico como desempenho.txt. <code>\"w\"<\/code> (write) apaga e escreve tudo de novo, bom para o ranking.txt, que deve mostrar só a versão atual.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem e como evitar<\/i><\/h2><p><b>Média errada:<\/b> Somar vendas de outros produtos. Sem o <code>if item[0] == nome<\/code>, a média mistura todos os produtos da loja.<\/p><p><b>Índice errado:<\/b> Usar <code>item[2]<\/code>, que é a data (um texto), no lugar de <code>item[1]<\/code>, a quantidade. A soma dá erro ou um resultado sem sentido.<\/p><p><b>Ordem das condições:<\/b> Testar as faixas antes de verificar <code>None<\/code> faz o programa quebrar com um produto sem vendas.<\/p><p><b>Ranking invertido:<\/b> Sem <code>reverse=True<\/code>, o <code>sort<\/code> ordena do menor para o maior e o pior produto aparece em primeiro.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Teste um produto de cada faixa, os valores-limite (10 e 30) e um produto sem vendas. Se só testar um caso médio, erros de ordem nas condições passam despercebidos.<\/p>", "qs": [{ "q": "O sistema classifica o desempenho de vendas conforme a média das quantidades vendidas. Qual trecho do algoritmo é responsável por decidir se o desempenho será \"alto\", \"médio\" ou \"baixo\"?", "o": ["A estrutura condicional.", "A leitura dos valores de entrada.", "O cálculo da média.", "A exibição do resultado."], "t": "per" }, { "q": "Um algoritmo de desempenho de vendas foi organizado em partes: calcular a média, classificar o resultado e exibir a informação. Se a empresa mudar as faixas (por exemplo, médio a partir de 12), qual parte do algoritmo precisa ser alterada?", "o": ["A parte que calcula a média das quantidades.", "A parte que compara média com faixas de desempenho.", "A parte que exibe o resultado.", "Todas, porque o programa depende das faixas."], "t": "per" }, { "q": "Por que organizar o processamento em funções facilita consultar diferentes produtos?", "o": ["Evita o menu.", "Dispensa testes.", "Guarda os dados.", "Reaproveita a lógica."], "t": "per" }, { "q": "Qual regra pode ser transformada diretamente em código?", "o": ["O produto vende pouco", "O produto está indo bem", "Média menor que 10 é giro baixo", "O cliente gosta do produto"], "t": "mc" }, { "q": "Qual fórmula calcula corretamente a média de uma lista de quantidades?", "o": ["sum(quantidades) / 3", "sum(quantidades) / len(quantidades)", "len(quantidades) / sum(quantidades)", "sum(quantidades) * len(quantidades)"], "t": "mc" }, { "q": "Um produto com média 10 é classificado como:", "o": ["Alto", "Baixo", "Médio", "Sem histórico"], "t": "mc" }, { "q": "O que a função calcular_media_vendas devolve para um produto sem vendas?", "o": ["None", "0", "\"Baixo\"", "Um erro no programa"], "t": "mc" }, { "q": "Em resultados.sort(key=lambda item: item[1], reverse=True), o que reverse=True faz?", "o": ["Apaga os menores valores", "Ordena por nome", "Inverte o texto dos nomes", "Coloca o maior valor primeiro"], "t": "mc" }, { "q": "Calcule a média de um produto com as vendas 12, 18 e 30 e diga em qual faixa ele fica. Mostre a conta.", "o": null, "t": "ab" }, { "q": "Por que a verificação de None precisa vir antes das outras condições na função classificar_desempenho?", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Quiz e desafios no terminal", "frase": "O programa conversa com quem usa", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Quiz e desafios no terminal<\/p><p class=\"frase\">O programa conversa com quem usa<\/p><\/div><h2>① <b>Programa interativo:<\/b> <i>Perguntar, receber, verificar, responder<\/i><\/h2><p><b>Interativo:<\/b> É o programa que conversa com o usuário em etapas, como um jogo de perguntas: pergunta, espera a resposta, confere e diz se acertou. Cada pergunta do quiz repete esse mesmo ciclo.<\/p><p class=\"ex\"><b>No código:<\/b> <code>input<\/code> pergunta e recebe, a resposta fica guardada numa variável, o <code>if<\/code> verifica e o <code>print<\/code> responde.<\/p><pre style=\"height:224px\"><code>pontos = 0\nresposta = input(\"Quanto é 7 + 3? \")\nif resposta == \"10\":\n    print(\"Certo!\")\n    pontos = pontos + 1\nelse:\n    print(\"Errado!\")\nprint(\"Sua pontuação:\", pontos)<\/code><\/pre><p><b>Variável de estado:<\/b> É a memória do jogo: guarda algo que muda durante a interação e precisa ser lembrado de uma pergunta para a outra, como os pontos. Regra prática: crie antes do loop, atualize dentro, mostre depois.<\/p><p class=\"ex\"><b>Por que antes do loop?<\/b> se <code>pontos = 0<\/code> ficar dentro do loop, o placar volta a zero a cada pergunta, como um placar que se apaga sozinho a cada gol.<\/p><p><b>Comparar texto:<\/b> O Python compara texto letra por letra, levando em conta maiúsculas, acentos e espaços. \"Brasilia\", \"Brasília\" e \"brasilia \" são três textos diferentes. <code>.strip()<\/code> tira os espaços das pontas e <code>.lower()<\/code> deixa tudo minúsculo, evitando marcar como errada uma resposta certa.<\/p><h2>② <b>for ou while?<\/b> <i>Depende de saber quantas vezes repetir<\/i><\/h2><p><b>for:<\/b> Use quando você sabe quantas vezes vai repetir: fazer 3 perguntas, passar por todos os produtos de uma lista. <code>for i in range(3):<\/code> executa três vezes, com <code>i<\/code> valendo 0, 1 e 2.<\/p><p><b>while:<\/b> Use quando a repetição depende de algo acontecer: o jogador acertar, as tentativas acabarem, o usuário escolher sair. O <code>while<\/code> confere a condição antes de cada volta.<\/p><pre style=\"height:192px\"><code>tentativas = 3\nwhile tentativas &gt; 0:\n    if input(\"5 x 6 = \") == \"30\":\n        print(\"Certo!\")\n        tentativas = 0\n    else:\n        tentativas = tentativas - 1<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>tentativas<\/code> começa em 3. Errou: diminui 1 (3 → 2 → 1 → 0). Acertou: vira 0 na hora. Quando chega a 0, <code>tentativas &gt; 0<\/code> fica falso e o loop termina.<\/p><p><b>Loop infinito:<\/b> Acontece quando nada dentro do <code>while<\/code> muda a variável da condição. Se o <code>else<\/code> não diminuísse <code>tentativas<\/code>, ela ficaria em 3 para sempre e o programa perguntaria sem parar. No terminal, Ctrl+C interrompe.<\/p><h2>③ <b>Listas paralelas:<\/b> <i>O mesmo índice liga os dados<\/i><\/h2><p><b>Ligação pelo índice:<\/b> São duas listas que andam juntas: a pergunta da posição 0 tem a resposta da posição 0, e assim por diante. Funcionam como duas colunas da mesma tabela. Se a ordem de uma mudar, as respostas ficam trocadas.<\/p><pre style=\"height:224px\"><code>perguntas = [\"Quanto é 7 + 8?\", \"Capital do Brasil?\"]\nrespostas = [\"15\", \"brasilia\"]\npontos = 0                          # antes do loop\nfor i in range(len(perguntas)):\n    resposta = input(perguntas[i] + \" \")\n    if resposta.strip().lower() == respostas[i]:\n        pontos = pontos + 1         # dentro do loop\nprint(\"Você acertou\", pontos)       # depois do loop<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>range(len(perguntas))<\/code> gera um índice para cada pergunta, mesmo que a lista cresça; a cada volta, <code>i<\/code> escolhe a pergunta e a resposta certa correspondente.<\/p><p><b>Mensagem final:<\/b> Depois do loop o placar já está completo, então é a hora de decidir a mensagem com <code>if/elif/else<\/code>. Teste da condição mais específica para a mais ampla.<\/p><p class=\"ex\"><b>Exemplo:<\/b> <code>if pontos == 5<\/code> antes de <code>elif pontos &gt;= 3<\/code>, que vem antes de <code>elif pontos &gt;= 1<\/code>. Se <code>pontos &gt;= 1<\/code> viesse primeiro, quem acertou tudo receberia \"Foi por pouco!\".<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem e como evitar<\/i><\/h2><p><b>Placar zerando:<\/b> Criar <code>pontos = 0<\/code> dentro do loop: ele volta a zero a cada pergunta e o resultado final mostra no máximo 1.<\/p><p><b>Placar repetido:<\/b> Colocar o resultado final indentado dentro do loop faz a pontuação aparecer a cada pergunta, com valores parciais. Tire o recuo para ele rodar só no fim.<\/p><p><b>Tentativas:<\/b> Não diminuir <code>tentativas<\/code> no <code>else<\/code> gera loop infinito, porque a condição nunca fica falsa.<\/p><p><b>Ordem:<\/b> Testar <code>pontos &gt;= 1<\/code> antes de <code>pontos == 3<\/code>: a condição ampla \"engole\" as específicas, que nunca chegam a ser testadas.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Antes de escrever o loop, pergunte: eu sei quantas vezes vai repetir? Sim → for. Não, depende de algo acontecer → while.<\/p>", "qs": [{ "q": "Em um quiz no terminal, qual ordem descreve melhor o fluxo de uma pergunta?", "o": ["Receber, perguntar, responder, verificar", "Perguntar, receber, verificar, responder", "Verificar, perguntar, receber, responder", "Responder, verificar, receber, perguntar"], "t": "per" }, { "q": "Quando usar while em vez de for?", "o": ["Quando o código tiver input.", "Quando a repetição depender de uma condição.", "Quando quisermos imprimir na tela.", "Quando o programa tiver só uma variável."], "t": "per" }, { "q": "Por que duas listas que caminham juntas precisam da mesma ordem?", "o": ["Porque o Python exige ordem alfabética.", "Porque o mesmo índice liga os itens correspondentes.", "Porque o for só aceita listas iguais.", "Porque listas só funcionam com o mesmo tamanho de nome."], "t": "per" }, { "q": "O que é uma variável de estado?", "o": ["Uma variável que nunca muda", "Uma informação que muda durante a interação, como os pontos", "Uma variável que só existe dentro de funções", "O nome do estado onde o programa roda"], "t": "mc" }, { "q": "Onde a variável pontos deve ser criada em um quiz?", "o": ["Antes do loop", "Dentro do loop", "Depois do loop", "Dentro do if"], "t": "mc" }, { "q": "Qual estrutura é mais indicada para percorrer todos os itens de uma lista de perguntas?", "o": ["if", "else", "while com condição desconhecida", "for"], "t": "mc" }, { "q": "O que resposta.strip().lower() faz?", "o": ["Soma os pontos do jogador", "Converte o texto em número", "Tira os espaços das pontas e deixa tudo minúsculo", "Apaga a resposta do usuário"], "t": "mc" }, { "q": "Se pontos == 3 for testado depois de pontos >= 1, o que acontece?", "o": ["O programa dá erro de sintaxe", "A mensagem de pontuação máxima nunca aparece", "O placar é zerado", "O loop se repete para sempre"], "t": "mc" }, { "q": "Escreva o código de um quiz com uma pergunta, que dê ao jogador 2 tentativas para acertar.", "o": null, "t": "ab" }, { "q": "Explique a diferença entre o placar ficar dentro do loop e depois dele. O que muda na tela?", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Do menu ao sistema completo", "frase": "Dados que sobrevivem ao fechar o programa", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Do menu ao sistema completo<\/p><p class=\"frase\">Dados que sobrevivem ao fechar o programa<\/p><\/div><h2>① <b>Partes do sistema:<\/b> <i>Cada uma com seu papel<\/i><\/h2><p><b>Sistema em partes:<\/b> Um sistema funciona como uma loja: o atendente (menu) recebe o pedido e chama quem resolve; cada funcionário (função) faz uma tarefa; o estoque e o caderno de vendas (listas) guardam as informações; e o arquivo é o registro que continua guardado depois que a loja fecha.<\/p><p><b>Menu:<\/b> Só coordena: mostra as opções, lê a escolha e chama a função certa. Não calcula, não grava e não procura nada sozinho.<\/p><p><b>Catálogo x histórico:<\/b> <code>produtos<\/code> é o catálogo: o que a loja vende agora, com o preço atual. <code>vendas<\/code> é o histórico: o que já aconteceu. Cadastrar um produto não cria vendas dele; por isso um produto novo aparece na consulta, mas fica \"Sem histórico\" no desempenho.<\/p><p><b>Memória x arquivo:<\/b> A lista é o agora: rápida, mas some ao fechar o programa. O arquivo é o depois: fica gravado no computador. <code>produto[1] = 19.90<\/code> muda só a memória; para a mudança sobreviver, é preciso regravar o arquivo.<\/p><h2>② <b>Arquivos CSV:<\/b> <i>Uma linha por registro<\/i><\/h2><p><b>with open:<\/b> Abre um arquivo e garante que ele seja fechado no fim do bloco, mesmo se acontecer um erro. Formato: <code>with open(nome, modo, encoding=\"utf-8\") as arquivo:<\/code>. O <code>encoding=\"utf-8\"<\/code> evita problemas com acentos.<\/p><p><b>Modos:<\/b> <code>\"w\"<\/code> (write) cria o arquivo ou apaga o conteúdo e escreve de novo. <code>\"a\"<\/code> (append) acrescenta no final sem apagar. <code>\"r\"<\/code> (read) só lê.<\/p><p class=\"ex\"><b>Quando usar cada um:<\/b> para regravar a lista inteira depois de uma mudança, <code>\"w\"<\/code>; para ir somando linhas a um histórico, <code>\"a\"<\/code>; para carregar os dados ao abrir o programa, <code>\"r\"<\/code>.<\/p><p><b>CSV:<\/b> É um arquivo de texto em que cada linha é um registro e os campos são separados por um caractere, aqui o ponto e vírgula: <code>Caderno;18.50<\/code>. Dá para abrir no bloco de notas e até no Excel.<\/p><pre style=\"height:128px\"><code>def salvar_produtos(produtos):\n    with open(\"produtos.csv\", \"w\", encoding=\"utf-8\") as arquivo:\n        for produto in produtos:\n            arquivo.write(f\"{produto[0]};{produto[1]:.2f}\\n\")<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> para cada produto da lista, escreve uma linha com o nome e o preço separados por <code>;<\/code>. O <code>\\n<\/code> no fim pula para a linha de baixo.<\/p><p><b>Carregar:<\/b> É o caminho de volta: ler o arquivo e montar a lista de novo. Cada linha passa por três passos: <code>strip()<\/code> tira o <code>\\n<\/code> do fim, <code>split(\";\")<\/code> separa os campos e <code>float()<\/code> transforma o preço, que veio como texto, em número. Chame no início do programa.<\/p><pre style=\"height:224px\"><code>def carregar_produtos():\n    produtos = []\n    if not os.path.exists(\"produtos.csv\"):\n        return produtos\n    with open(\"produtos.csv\", \"r\", encoding=\"utf-8\") as arquivo:\n        for linha in arquivo:\n            partes = linha.strip().split(\";\")\n            produtos.append([partes[0], float(p
