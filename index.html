artes[1])])\n    return produtos<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>os.path.exists<\/code> confere se o arquivo já existe (na primeira execução ainda não existe, e abrir com <code>\"r\"<\/code> daria erro). A linha <code>\"Caderno;18.50\\n\"<\/code> vira <code>[\"Caderno\", \"18.50\"]<\/code> e depois <code>[\"Caderno\", 18.5]<\/code>. Precisa de <code>import os<\/code> no topo.<\/p><p><b>Complemento:<\/b> Se o usuário digitar \"abc\" no preço, <code>float(\"abc\")<\/code> gera um <code>ValueError<\/code> e o programa fecha. <code>try/except ValueError<\/code> tenta converter e, se falhar, executa o plano B (uma mensagem de erro) sem quebrar o programa.<\/p><h2>③ <b>Alterar, registrar e cancelar:<\/b> <i>Quem faz o quê<\/i><\/h2><p><b>alterar_produto():<\/b> Segue uma ordem que protege os dados: localizar o produto → pedir os dados novos → validar → alterar a lista → salvar em produtos.csv. Se a validação falhar, nada é gravado.<\/p><p><b>registrar_venda():<\/b> Só aceita produto que existe no catálogo e quantidade maior que zero. Passou na validação: acrescenta em <code>vendas<\/code> e regrava vendas.csv.<\/p><p><b>cancelar_venda():<\/b> Mostra as vendas numeradas a partir de 1 para o usuário escolher, confere se o número existe e remove com <code>vendas.pop(numero - 1)<\/code>. Depois regrava vendas.csv.<\/p><p class=\"ex\"><b>Por que numero - 1?<\/b> na tela a contagem começa em 1 (mais natural para quem usa), mas na lista o índice começa em 0. A venda nº 1 está na posição 0.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem e como evitar<\/i><\/h2><p><b>Gravar antes de validar:<\/b> O dado errado vai para o arquivo e continua lá na próxima execução. Valide primeiro, grave por último.<\/p><p><b>Esquecer de regravar:<\/b> Alterar a lista sem chamar <code>salvar_produtos()<\/code>: tudo parece certo até fechar o programa, e a mudança some.<\/p><p><b>Modo errado:<\/b> Usar <code>\"w\"<\/code> quando queria acrescentar apaga todo o conteúdo anterior do arquivo.<\/p><p><b>Sem carregar:<\/b> Gravar, mas não chamar <code>carregar_produtos()<\/code> ao abrir: o arquivo está certo, mas o programa começa com a lista vazia ou com a antiga.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> O teste definitivo de persistência é fechar o programa, abrir de novo e listar. Se a mudança sumiu, falta gravar depois de alterar ou carregar no início.<\/p>", "qs": [{ "q": "O menu chama uma função que altera uma lista e, em seguida, outra função que lê uma lista diferente. A segunda não encontra informação do item recém-incluído. O que isso mostra?", "o": ["O menu deixou de chamar as funções.", "O fluxo impediu o programa de voltar ao menu.", "As duas listas não foram atualizadas juntas.", "A função de consulta apagou o item cadastrado."], "t": "per" }, { "q": "Em um programa modularizado, qual escolha organiza melhor a alteração de dados e a gravação em arquivo?", "o": ["O menu altera a lista e grava o CSV sozinho.", "O CSV substitui a lista durante toda a execução.", "A função certa altera e grava o arquivo dela.", "Uma função só mexe em produtos, vendas e menu."], "t": "per" }, { "q": "Em um programa que usa listas em memória e arquivos, por que salvar o arquivo depois de uma alteração?", "o": ["Para reabrir o menu com outra opção.", "Para criar uma nova lista em memória.", "Para manter a mudança nas próximas execuções.", "Para apagar dados antigos do programa."], "t": "per" }, { "q": "Qual a diferença entre catálogo e histórico na Papelaria?", "o": ["Catálogo é o que a loja vende; histórico é o que já foi vendido", "Os dois guardam exatamente os mesmos dados", "Catálogo só existe em arquivo; histórico só em memória", "Catálogo guarda clientes; histórico guarda senhas"], "t": "mc" }, { "q": "Qual modo de abertura apaga o conteúdo e escreve de novo?", "o": ["\"a\"", "\"r\"", "\"w\"", "\"x\""], "t": "mc" }, { "q": "Em uma linha \"Caderno;18.50\", o que linha.strip().split(\";\") devolve?", "o": ["\"Caderno18.50\"", "[\"Caderno\", \"18.50\"]", "[\"Caderno;18.50\"]", "18.50"], "t": "mc" }, { "q": "Depois de alterar um produto, o que falta para a mudança continuar ao reabrir?", "o": ["Chamar mostrar_menu()", "Fechar o terminal", "Criar uma nova lista vazia", "Salvar a lista no arquivo CSV"], "t": "mc" }, { "q": "Quando carregar_produtos() deve ser chamada?", "o": ["No início do programa", "Só quando o usuário sair", "Depois de cada print", "Nunca, o Python carrega sozinho"], "t": "mc" }, { "q": "Descreva, em ordem, os passos da função alterar_produto, do momento em que o usuário digita o nome até a gravação.", "o": null, "t": "ab" }, { "q": "O usuário alterou o preço do Caderno, fechou o programa e o preço antigo voltou. Quais podem ser as causas?", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Organizar e apresentar o projeto", "frase": "Funcionar não basta", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Organizar e apresentar o projeto<\/p><p class=\"frase\">Funcionar não basta<\/p><\/div><h2>① <b>Legibilidade:<\/b> <i>Código que outra pessoa entende<\/i><\/h2><p><b>Por quê:<\/b> Código é lido muito mais vezes do que é escrito: por você na semana que vem, por um colega, pelo professor. Um programa que funciona, mas que ninguém entende, faz qualquer mudança simples demorar e correr o risco de quebrar outra parte.<\/p><p><b>Nome de função:<\/b> O nome é a primeira explicação do código. Uma função chamada <code>classificar_produto<\/code> que pede o nome, calcula, classifica, exibe e grava esconde quatro das cinco tarefas. Um bom nome descreve o que a função faz de verdade.<\/p><p><b>Nome no índice:<\/b> <code>produto[0]<\/code> funciona, mas obriga quem lê a lembrar que 0 é o nome. Criar <code>nome = produto[0]<\/code> e <code>preco = produto[1]<\/code> faz o código se explicar sozinho.<\/p><pre style=\"height:160px\"><code># antes\nprint(f\"{produto[0]} - R$ {produto[1]:.2f}\")\n# depois\nnome = produto[0]\npreco = produto[1]\nprint(f\"{nome} - R$ {preco:.2f}\")<\/code><\/pre><p><b>Responsabilidade única:<\/b> Cada função faz uma coisa bem definida. Se para explicar uma função você precisa usar \"e\" várias vezes (\"pede e calcula e grava\"), ela provavelmente deveria ser dividida.<\/p><h2>② <b>Refatoração:<\/b> <i>Melhorar sem mudar o comportamento<\/i><\/h2><p><b>Refatorar:<\/b> É reorganizar o código por dentro sem mudar o que ele faz por fora. Como arrumar um guarda-roupa: as roupas são as mesmas, mas fica mais fácil achar cada uma. O usuário não percebe diferença; quem mantém o código percebe.<\/p><p><b>Trecho repetido vira função:<\/b> Se a mesma lógica aparece em dois ou três lugares, qualquer mudança futura precisa ser feita em todos, e é fácil esquecer um. Extraindo para uma função, a mudança acontece em um lugar só.<\/p><p><b>Funções de apoio:<\/b> Devolvem o resultado com <code>return<\/code> e não imprimem nada. Assim, quem chama decide o que fazer com ele: mostrar na tela, gravar ou usar em outro cálculo.<\/p><p class=\"ex\"><b>Três exemplos:<\/b> <code>formatar_produto(nome, preco)<\/code> monta o texto; <code>buscar_produto(produtos, nome)<\/code> devolve o produto ou <code>None<\/code>; <code>validar_preco(texto)<\/code> devolve o número ou <code>None<\/code>.<\/p><pre style=\"height:320px\"><code>def buscar_produto(produtos, nome):\n    for produto in produtos:\n        if produto[0].lower() == nome.lower():\n            return produto\n    return None\n\ndef consultar_produto(produtos):\n    nome = input(\"Nome do produto: \").strip()\n    produto = buscar_produto(produtos, nome)\n    if produto is None:\n        print(\"Produto não encontrado.\")\n    else:\n        print(formatar_produto(produto[0], produto[1]))<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>buscar_produto<\/code> só procura e devolve. <code>consultar_produto<\/code> chama a busca, usa o <code>None<\/code> para saber se achou e chama <code>formatar_produto<\/code> para exibir. Cada função tem uma tarefa, e a busca pode ser reaproveitada em alterar e registrar venda.<\/p><h2>③ <b>Testes, revisão e apresentação:<\/b> <i>Fechar o projeto<\/i><\/h2><p><b>Testes:<\/b> Testar é provar que o programa faz o que deveria. Planeje antes (mínimo 6 testes), anotando a entrada e o resultado esperado. Inclua casos que devem dar certo e casos de erro, como preço negativo ou produto inexistente.<\/p><p class=\"ex\"><b>Exemplo de teste:<\/b> entrada: consultar \"lapis\" com o Lápis cadastrado. Esperado: \"Lápis - R$ 1.50\". Resultado obtido: igual ao esperado? ✓ ou ✗.<\/p><p><b>Checklist:<\/b> Cadastrar, consultar, alterar, registrar venda, cancelar venda, ver o ranking, fechar e reabrir o programa.<\/p><p><b>Revisão em pares:<\/b> Outra pessoa lê o seu código com um checklist: nomes claros? trecho repetido? comentários úteis? passa nos testes? Uma boa sugestão diz o que mudar e por quê.<\/p><p class=\"ex\"><b>Feedback útil:<\/b> \"Renomeie <code>f<\/code> para <code>calcular_media<\/code>: o nome atual não diz o que ela faz.\" Feedback vazio: \"Está bom.\"<\/p><p><b>Apresentação:<\/b> Cerca de 3 minutos explicando como o sistema funciona: o menu, os dados que guarda, as validações e como as partes se conectam. Mostre o programa rodando em vez de ler o código linha por linha.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem e como evitar<\/i><\/h2><p><b>Repetição que fica:<\/b> Criar a função nova e manter a lógica antiga repetida: o código cresce em vez de diminuir. Substitua os trechos antigos pela chamada da função.<\/p><p><b>print na função de apoio:<\/b> Um <code>print<\/code> dentro de <code>buscar_produto()<\/code> obriga toda chamada a mostrar algo na tela, mesmo quando só se queria saber se o produto existe.<\/p><p><b>Muitas mudanças de uma vez:<\/b> Se algo quebrar, você não sabe qual das mudanças causou o problema. Mude uma coisa, teste, e só então siga.<\/p><p><b>Feedback vazio:<\/b> Dizer só \"está bom\" na revisão não ajuda o colega a melhorar. Aponte algo específico e explique o motivo.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Refatore uma coisa por vez e rode os mesmos testes depois de cada mudança. Se o resultado mudou, a refatoração alterou o comportamento: volte e corrija.<\/p>", "qs": [{ "q": "O que mais ajuda outra pessoa a entender um programa simples que já funciona?", "o": ["Acrescentar o maior número possível de opções no menu.", "Esconder várias tarefas atrás de um nome curto.", "Usar nomes que descrevem a tarefa resumidamente.", "Copiar o mesmo trecho em todo lugar para “garantir”."], "t": "per" }, { "q": "As funções consultar_produto() e listar_produtos() exibem cada produto do mesmo jeito, repetindo código. Qual é a melhor solução?", "o": ["Criar uma função formatar_produto() e chamá-la nas duas.", "Excluir uma das duas funções do programa.", "Copiar o trecho de exibição em cada função separadamente.", "Deixar como está, já que o programa funciona."], "t": "per" }, { "q": "Uma equipe encontrou a mesma lógica de busca de produto em várias funções. Qual mudança representa melhor uma refatoração?", "o": ["Copiar a lógica para nova função e manter as antigas.", "Unir todas as funções do sistema em uma função maior.", "Alterar o menu para que a busca aconteça só uma vez.", "Criar uma função de busca e usá-la onde necessário."], "t": "per" }, { "q": "O que é refatorar?", "o": ["Adicionar novas funções ao sistema", "Melhorar a organização sem mudar o comportamento", "Reescrever tudo em outra linguagem", "Apagar os testes do programa"], "t": "mc" }, { "q": "Qual nome de função é mais claro?", "o": ["f1()", "fazer_coisas()", "calcular_media_vendas()", "teste2()"], "t": "mc" }, { "q": "O que buscar_produto(produtos, nome) deve devolver quando não encontra?", "o": ["None", "Uma mensagem com print", "O primeiro produto da lista", "Um novo produto vazio"], "t": "mc" }, { "q": "O que significa responsabilidade única?", "o": ["Só uma pessoa pode alterar o código", "O programa só pode ter uma função", "Cada arquivo só pode ter uma linha", "Cada função faz uma coisa bem definida"], "t": "mc" }, { "q": "Qual é um bom comentário em uma revisão em pares?", "o": ["Está bom", "Não gostei", "A função salvar pode ser dividida em duas partes", "Faz de novo"], "t": "mc" }, { "q": "Monte 3 casos de teste para a Papelaria. Para cada um, diga a ação e o resultado esperado.", "o": null, "t": "ab" }, { "q": "Encontre uma repetição que poderia existir no sistema da Papelaria e explique como uma função resolveria isso.", "o": null, "t": "ab" }] }] }, { "id": "mdbd", "sigla": "MDBD", "nome": "Modelagem e Desenvolvimento de Banco de Dados", "cor": "#b4470f", "semanas": [{ "n": 22, "tema": "Introdução aos bancos NoSQL", "frase": "Não só SQL", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Introdução aos bancos NoSQL<\/p><p class=\"frase\">Não só SQL<\/p><\/div><h2>① <b>O que é NoSQL e por que ele surgiu:<\/b> <i>Quando a tabela não dá conta<\/i><\/h2><p><b>NoSQL:<\/b> Quer dizer <i>Not Only SQL<\/i>, “não só SQL”. É uma família de bancos que guarda dados sem obrigar tudo a caber na mesma tabela e que foi pensada desde o início para rodar em vários servidores ao mesmo tempo. Ele não veio para acabar com o banco relacional: os dois convivem, cada um no problema em que é melhor.<\/p><p><b>Por que surgiu:<\/b> Pense numa rede social: milhões de curtidas por minuto, posts com foto, com vídeo ou só com texto, gente acessando do mundo inteiro. Numa tabela rígida, cada formato novo obriga a mudar a estrutura, e o único jeito de aguentar mais acessos é comprar um servidor cada vez maior e mais caro. O NoSQL nasceu para esse cenário: muito dado, chegando muito rápido e em formatos variados.<\/p><p class=\"ex\"><b>Três tipos de dado:<\/b> estruturado é o que cabe certinho numa tabela (CPF, preço); semiestruturado tem campos que mudam de um registro para outro, como um JSON; não estruturado é foto, áudio e texto livre.<\/p><h2>② <b>Os 4 tipos de NoSQL:<\/b> <i>Cada um resolve um problema<\/i><\/h2><p><b>Chave-valor (Redis):<\/b> Funciona como um guarda-volumes: você entrega a chave e recebe na hora o que está guardado nela, sem procurar nada. Por isso é rapidíssimo e muito usado para sessão de login, carrinho de compras e cache.<\/p><p><b>Documento (MongoDB):<\/b> Cada registro é uma ficha completa em formato JSON, e uma ficha pode ter campos que a outra não tem. Combina com catálogo de produtos, perfis e posts, em que cada item é um pouco diferente do outro.<\/p><p><b>Colunas (Cassandra):<\/b> Os dados são agrupados por uma chave e espalhados por muitos servidores, aguentando gravar milhões de registros por segundo. É o banco típico de sensores (IoT), logs e histórico de cliques.<\/p><p><b>Grafo (Neo4j):<\/b> Guarda coisas (nós) e as ligações entre elas (arestas). Quando a pergunta é sobre conexões, como “amigos de amigos” ou “quem comprou isto também comprou aquilo”, ele responde seguindo as ligações. É a escolha natural para redes sociais e recomendações.<\/p><p class=\"ex\"><b>SQL x NoSQL:<\/b> o relacional tem esquema fixo, cresce trocando por uma máquina maior e garante consistência forte (transações ACID), ligando tabelas com FK e JOIN. O NoSQL tem esquema flexível, cresce somando máquinas e muitas vezes aceita consistência eventual.<\/p><h2>③ <b>Arquitetura distribuída:<\/b> <i>Vários servidores, um só sistema<\/i><\/h2><p><b>Nó e cluster:<\/b> Cada servidor é um nó, e o conjunto de nós trabalhando juntos é o cluster. Para uma empresa global, a grande vantagem é ter os dados perto de cada usuário, o que diminui o tempo de resposta (latência), e continuar no ar mesmo se um nó cair (alta disponibilidade). Distribuir não acaba com as falhas de hardware: só faz o sistema aguentar melhor quando elas acontecem.<\/p><p><b>Vertical ou horizontal:<\/b> Escalar na vertical é colocar mais memória e processador na mesma máquina: funciona, mas é caro e tem limite físico. Escalar na horizontal é adicionar mais máquinas dividindo os dados e a carga, como abrir mais caixas no supermercado em vez de pedir para um único caixa trabalhar mais rápido. Quando usuários e dados não param de crescer, como na rede social DataConnect, a saída é a horizontal.<\/p><p><b>Replicação e sharding:<\/b> Replicação é manter cópias dos MESMOS dados em vários nós, como guardar a mesma foto no celular e na nuvem: se um falhar, a outra continua lá. Sharding é DIVIDIR os dados entre os nós, como separar os alunos da escola em várias salas: cada servidor cuida só de uma parte.<\/p><p class=\"ex\"><b>Síncrona ou assíncrona:<\/b> a replicação síncrona só confirma a gravação depois que as cópias foram feitas (mais segura, mais lenta); a assíncrona confirma na hora e copia logo depois (mais rápida, mas a cópia pode ficar um instante atrasada).<\/p><p><b>Consistência eventual:<\/b> Os nós podem ficar diferentes por alguns instantes, mas logo chegam ao mesmo valor. Isso não atrapalha num contador de curtidas; já num saldo bancário, um valor errado por um segundo não é aceitável.<\/p><h2>④ <b>Modelar em NoSQL:<\/b> <i>Embutir ou referenciar?<\/i><\/h2><p><b>Embutir:<\/b> É colocar um dado dentro do outro quando eles são sempre lidos juntos e um pertence ao outro. Os itens de um pedido só fazem sentido dentro do pedido, então ficam embutidos: uma única leitura traz o pedido completo, sem JOIN.<\/p><p><b>Referenciar:<\/b> É guardar só o ID quando o dado é compartilhado ou pode crescer sem limite. O mesmo cliente aparece em vários pedidos, então cada pedido guarda apenas <code>cliente_id<\/code>. Se o cliente trocar de telefone, a mudança é feita em um lugar só.<\/p><pre style=\"height:192px\"><code>db.Pedidos.insertOne({\n  pedido_id: 1,\n  cliente_id: 1,\n  status: \"Processando\",\n  itens: [ { produto_id: 101, quantidade: 2,\n             preco_unitario: 3500.00 } ]\n})<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> não foi preciso criar a coleção antes: ela nasce no primeiro <code>insertOne<\/code>. <code>cliente_id<\/code> é só uma referência, e o array <code>itens<\/code> está embutido. Como o MongoDB não tem chave estrangeira, quem confere se o cliente 1 existe é a aplicação.<\/p><p><b>Arquitetura híbrida:<\/b> Um mesmo sistema pode usar os dois mundos. Pagamentos e pedidos ficam no relacional, onde nada pode dar errado; catálogo, avaliações e histórico de cliques podem ficar no NoSQL, onde o volume e a variedade são grandes.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Antes de escolher o banco, pergunte: como esse dado vai ser lido e o que não pode dar errado? Dinheiro e estoque → relacional. Volume e formatos variados → NoSQL. Sistemas grandes costumam combinar os dois.<\/p>", "qs": [{ "q": "Qual é a principal vantagem de uma arquitetura distribuída em bancos de dados NoSQL para uma empresa global?", "o": ["Maior consistência dos dados em todos os nós.", "Melhor latência e disponibilidade em várias regiões.", "Menor necessidade de infraestrutura e servidores.", "Eliminação completa de falhas de hardware."], "t": "per" }, { "q": "A escalabilidade horizontal, característica dos bancos NoSQL, envolve principalmente:", "o": ["Adicionar novos servidores para distribuir dados e carga.", "Aumentar a capacidade de um único servidor.", "Reduzir o número de cópias de dados no sistema.", "Remover automaticamente dados desatualizados."], "t": "per" }, { "q": "Qual das seguintes abordagens de escalabilidade seria mais eficaz para lidar com o aumento do volume de dados e usuários da DataConnect?", "o": ["Escalabilidade vertical.", "Replicação síncrona.", "Escalabilidade horizontal.", "Escalabilidade em camadas."], "t": "per" }, { "q": "O que significa NoSQL?", "o": ["Sem nenhum uso de SQL", "Not Only SQL (não só SQL)", "Novo SQL", "Banco sem dados estruturados"], "t": "mc" }, { "q": "Qual tipo de banco NoSQL é mais indicado para redes sociais e recomendações?", "o": ["Chave-valor", "Colunas", "Documento", "Grafo"], "t": "mc" }, { "q": "Qual a diferença entre replicação e sharding?", "o": ["Replicação copia os dados; sharding divide os dados", "Replicação divide os dados; sharding copia os dados", "As duas apagam dados antigos", "As duas só existem em bancos relacionais"], "t": "mc" }, { "q": "Aumentar a memória e o processador do mesmo servidor é:", "o": ["Sharding", "Escala horizontal", "Escala vertical", "Consistência eventual"], "t": "mc" }, { "q": "Em um pedido no MongoDB, quando faz sentido embutir os itens?", "o": ["Quando os itens são usados por mil coleções", "Quando são sempre lidos junto com o pedido", "Quando crescem sem limite", "Nunca, o MongoDB não permite"], "t": "mc" }, { "q": "Para um aplicativo de delivery, escolha um dado que deve ficar em banco relacional e outro que pode ficar em NoSQL. Justifique.", "o": null, "t": "ab" }, { "q": "Explique com um exemplo do dia a dia o que é consistência eventual.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Ferramentas e tecnologias NoSQL", "frase": "Instalar e dar os primeiros comandos", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Ferramentas e tecnologias NoSQL<\/p><p class=\"frase\">Instalar e dar os primeiros comandos<\/p><\/div><h2>① <b>As 4 ferramentas:<\/b> <i>Cada uma com seu terminal<\/i><\/h2><p><b>Servidor e cliente:<\/b> Todo banco tem duas partes: o servidor, que fica ligado guardando os dados, e o cliente, o terminal onde você digita os comandos. A ordem é sempre a mesma: primeiro liga o servidor, depois abre o cliente para conversar com ele.<\/p><p><b>MongoDB:<\/b> O servidor é o <code>mongod<\/code> (porta 27017) e o cliente é o <code>mongosh<\/code>, ou o Compass, que é visual. O comando antigo <code>mongo<\/code> foi descontinuado.<\/p><p><b>Cassandra:<\/b> Liga com <code>cassandra -f<\/code>, que mostra os logs no próprio terminal, e o cliente é o <code>cqlsh<\/code>. Antes ele precisa do Java JDK 8+ configurado na variável JAVA_HOME e do Python, que o cqlsh usa por baixo. Para ver se os nós estão no ar: <code>nodetool status<\/code>.<\/p><p><b>Redis e Neo4j:<\/b> <code>redis-server<\/code> liga o Redis e <code>redis-cli<\/code> abre o terminal; o teste mais simples é digitar <code>PING<\/code>: se ele responder <code>PONG<\/code>, está funcionando. O Neo4j, instalado ou via Docker, é usado pelo navegador, no Neo4j Browser (localhost:7474).<\/p><p class=\"ex\"><b>Sem instalar nada:<\/b> onecompiler.com roda Redis no navegador, AstraDB é o Cassandra na nuvem e Atlas é o MongoDB na nuvem.<\/p><h2>② <b>MongoDB e Cassandra:<\/b> <i>As primeiras estruturas<\/i><\/h2><p><b>Organização do MongoDB:<\/b> É banco → coleção → documento, parecido com banco → tabela → linha. <code>use estoque<\/code> entra no banco, que é criado de verdade quando o primeiro dado é gravado. <code>find<\/code> busca documentos, e o filtro <code>{ estoque: { $gt: 15 } }<\/code> quer dizer “estoque maior que 15” (<code>$gt<\/code> vem de <i>greater than<\/i>).<\/p><p><b>Referências:<\/b> O produto guarda só <code>categoria_id<\/code> em vez de repetir o nome da categoria em cada produto. Assim se economiza espaço e, se a categoria mudar de nome, a mudança é feita em um único lugar, sem risco de ficar um nome diferente em cada produto.<\/p><p><b>Keyspace:<\/b> No Cassandra, o keyspace faz o papel do banco de dados, mas já nasce dizendo quantas cópias de cada dado o cluster vai manter. <code>replication_factor: 3<\/code> significa cada dado guardado em 3 nós diferentes: mesmo que 2 caiam, o dado continua acessível.<\/p><p><b>Estratégia de replicação:<\/b> <code>SimpleStrategy<\/code> serve para testes e para um único data center. <code>NetworkTopologyStrategy<\/code> é a de produção, quando a empresa tem data centers em lugares diferentes e quer escolher quantas cópias ficam em cada um.<\/p><pre style=\"height:128px\"><code>use estoque\ndb.produtos.find({ estoque: { $gt: 15 } })\n\nCREATE KEYSPACE ecommerce\n  WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};<\/code><\/pre><p class=\"ex\"><b>CQL:<\/b> a linguagem do Cassandra se parece muito com SQL (<code>CREATE<\/code>, <code>INSERT<\/code>, <code>SELECT<\/code>), mas não tem JOIN nem chave estrangeira.<\/p><h2>③ <b>Redis:<\/b> <i>Chave-valor na memória<\/i><\/h2><p><b>Por que é tão rápido:<\/b> O Redis guarda os dados na memória RAM, e não no disco. Ler da RAM é como pegar algo que está em cima da mesa; ler do disco é ir buscar no armário. Por isso ele responde em milissegundos e é usado para cache, sessões e contadores.<\/p><p><b>Expiração:<\/b> Com <code>EXPIRE<\/code>, a chave some sozinha depois de um tempo. É perfeito para dados temporários, como um código de verificação que vale 5 minutos ou uma sessão de login: a memória é liberada sem ninguém precisar apagar nada.<\/p><p><b>Persistência RDB:<\/b> Como a RAM se apaga quando o servidor desliga, o Redis pode tirar “fotos” dos dados de tempos em tempos e salvar no disco (no redis.conf, linhas como <code>save 900 1<\/code>). Assim os dados sobrevivem a um reinício.<\/p><pre style=\"height:128px\"><code>SET user_count 100\nGET user_count\nINCR user_count\nDEL user_count\nEXISTS user_count<\/code><\/pre><p class=\"ex\"><b>Lendo os comandos:<\/b> <code>SET<\/code> cria a chave com o valor 100, <code>GET<\/code> lê o valor, <code>INCR<\/code> soma 1 (vira 101), <code>DEL<\/code> apaga a chave e <code>EXISTS<\/code> responde 1 se a chave existe ou 0 se não existe. Cuidado: <code>GET<\/code> lê o valor, mas quem testa se a chave existe é o <code>EXISTS<\/code>.<\/p><h2>④ <b>Neo4j:<\/b> <i>Desenhando o grafo com texto<\/i><\/h2><p><b>A ideia:<\/b> No grafo, cada coisa é um nó (um usuário, um post) e cada ligação é um relacionamento com nome e direção (o usuário CURTIU o post). A linguagem Cypher desenha isso com símbolos: parênteses para nós, colchetes para relacionamentos e seta para a direção.<\/p><pre style=\"height:96px\"><code>CREATE (u:User {name: 'John Doe', age: 28})\nCREATE (p:Post {title: 'Post sobre Grafos'})\nMATCH (u:User {name: 'John Doe'}), (p:Post {title: 'Post sobre Grafos'})\nCREATE (u)-[:LIKES]-&gt;(p)<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>(u:User {name: 'John Doe'})<\/code> é um nó com o rótulo User e a propriedade name. <code>-[:LIKES]-&gt;<\/code> é a seta “curtiu”, saindo do usuário e chegando no post.<\/p><p><b>Por que usar MATCH:<\/b> Para ligar dois nós que já existem, primeiro é preciso encontrá-los com <code>MATCH<\/code> e só depois criar a ligação. Um <code>CREATE (u)-[:LIKES]-&gt;(p)<\/code> sozinho não procura nada: ele cria dois nós novos e vazios e liga um ao outro.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Cada ferramenta tem seu shell e sua linguagem: mongosh (MongoDB), cqlsh (CQL), redis-cli (comandos) e Neo4j Browser (Cypher). Antes de digitar, confira em qual banco ou keyspace você está.<\/p>", "qs": [{ "q": "Qual é a principal vantagem do Redis em relação aos bancos de dados tradicionais em disco?", "o": ["Permite persistir dados em discos.", "Armazena dados em memória.", "Armazena dados permanentemente.", "Oferece suporte nativo para transações complexas, como bancos relacionais."], "t": "per" }, { "q": "Qual comando do Redis é utilizado para verificar se uma chave existe no banco de dados?", "o": ["GET", "DEL", "SET", "EXISTS"], "t": "per" }, { "q": "Qual é a vantagem de usar a expiração de chaves no Redis?", "o": ["Permite que os dados sejam armazenados permanentemente.", "Permite que dados temporários expirem com o tempo.", "Garante que os dados armazenados sejam persistidos em disco.", "Impede que dados sejam sobrescritos por novos valores."], "t": "per" }, { "q": "Qual é o cliente de linha de comando atual do MongoDB?", "o": ["mongo", "mongosh", "cqlsh", "redis-cli"], "t": "mc" }, { "q": "Como testar se o Redis está funcionando?", "o": ["Enviar PING e receber PONG", "Rodar nodetool status", "Abrir localhost:7474", "Rodar db.produtos.find()"], "t": "mc" }, { "q": "O que replication_factor 3 significa no Cassandra?", "o": ["3 tabelas por keyspace", "3 usuários conectados", "3 cópias de cada dado", "3 consultas por segundo"], "t": "mc" }, { "q": "No Cypher, como se representa um relacionamento?", "o": ["(:TIPO)", "{TIPO}", "<TIPO>", "[:TIPO]"], "t": "mc" }, { "q": "O que o comando db.produtos.find({ estoque: { $gt: 15 } }) faz?", "o": ["Apaga produtos com estoque acima de 15", "Atualiza o estoque para 15", "Busca produtos com estoque maior que 15", "Cria 15 produtos novos"], "t": "mc" }, { "q": "Escreva os comandos Redis para criar um contador de visitas com valor 1, somar mais uma visita e fazer a chave expirar em 1 hora.", "o": null, "t": "ab" }, { "q": "Para cada situação diga a ferramenta: catálogo com campos variados, dado temporário em milissegundos, quem segue quem.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Operações em bancos NoSQL", "frase": "CRUD, agregação e estruturas", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Operações em bancos NoSQL<\/p><p class=\"frase\">CRUD, agregação e estruturas<\/p><\/div><h2>① <b>MongoDB: CRUD:<\/b> <i>Criar, ler, alterar e apagar<\/i><\/h2><p><b>CRUD:<\/b> São as quatro operações que todo sistema faz com dados: <i>Create<\/i> (inserir), <i>Read<\/i> (ler), <i>Update<\/i> (alterar) e <i>Delete<\/i> (apagar). No MongoDB, cada uma tem duas versões: a terminada em <i>One<\/i> age só no primeiro documento encontrado, e a terminada em <i>Many<\/i> age em todos os que combinam com o filtro.<\/p><p><b>Filtro:<\/b> O primeiro objeto dos comandos diz QUEM vai ser afetado, como o WHERE do SQL. Para comparar não se escreve <code>&gt;<\/code> ou <code>&lt;<\/code>: usam-se operadores, como <code>$gt<\/code> (maior), <code>$gte<\/code> (maior ou igual), <code>$lt<\/code> (menor) e <code>$lte<\/code> (menor ou igual).<\/p><p><b>Alterar:<\/b> O <code>updateOne<\/code> recebe dois objetos: quem alterar e o que fazer. <code>$set<\/code> troca o valor de um campo; <code>$inc<\/code> soma um número ao valor atual (com número negativo, subtrai).<\/p><pre style=\"height:128px\"><code>db.Produtos.insertOne({ nome: \"Laptop Gamer\", preco: 5000, estoque: 10 })\ndb.Produtos.find({ estoque: { $lte: 5 } })\ndb.Produtos.updateOne({ nome: \"Laptop Gamer\" }, { $set: { preco: 4800 } })\ndb.Produtos.updateMany({ categoria: \"Computadores\" }, { $inc: { estoque: -1 } })\ndb.Produtos.deleteOne({ nome: \"Laptop Gamer\" })<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> o <code>find<\/code> traz os produtos com estoque menor ou igual a 5; o <code>updateOne<\/code> troca o preço do Laptop; o <code>updateMany<\/code> tira 1 do estoque de todos os computadores.<\/p><p class=\"ex\"><b>Cuidado:<\/b> <code>deleteMany({})<\/code> e <code>updateMany({})<\/code> com filtro vazio combinam com TODOS os documentos: o primeiro apaga a coleção inteira e o segundo altera tudo.<\/p><h2>② <b>MongoDB: índices e agregação:<\/b> <i>Sumário e esteira<\/i><\/h2><p><b>Índice:<\/b> Funciona como o sumário de um livro. Sem índice, o banco lê documento por documento até achar o que procura; com índice, vai direto ao lugar certo. O preço é que cada índice ocupa memória e toda gravação também precisa atualizar os índices, por isso eles são criados para as consultas mais usadas, e não para todos os campos.<\/p><p><b>Pipeline de agregação:<\/b> É uma esteira de fábrica: os documentos entram, passam por estágios em sequência e cada estágio entrega o resultado para o próximo. <code>$match<\/code> filtra (como o WHERE), <code>$lookup<\/code> junta outra coleção (como o JOIN), <code>$unwind<\/code> abre uma lista em vários documentos, <code>$group<\/code> agrupa e calcula com <code>$sum<\/code> ou <code>$avg<\/code>, <code>$sort<\/code> ordena e <code>$project<\/code> escolhe os campos que saem no resultado.<\/p><pre style=\"height:128px\"><code>db.Vendas.createIndex({ dataVenda: 1 })\ndb.Vendas.aggregate([\n  { $group: { _id: \"$regiao\",\n              totalVendas: { $sum: \"$precoTotal\" } } }\n])<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> o índice em <code>dataVenda<\/code> acelera relatórios por período (1 = ordem crescente). O <code>$group<\/code> junta as vendas da mesma região e soma o <code>precoTotal<\/code> de cada grupo. O cifrão é o que diz “use o valor do campo”: sem ele, <code>\"regiao\"<\/code> seria só um texto fixo e tudo cairia num grupo só.<\/p><h2>③ <b>Cassandra:<\/b> <i>Uma tabela para cada pergunta<\/i><\/h2><p><b>Desnormalizar:<\/b> O Cassandra não tem JOIN. Em vez de separar cliente e pedido em tabelas ligadas por chave estrangeira, cria-se uma tabela pensada para a pergunta que o sistema faz, como “quais são os pedidos deste cliente?”, repetindo nela o nome e o e-mail do cliente. A leitura fica rápida porque tudo está num lugar só.<\/p><p><b>O custo:<\/b> Dado repetido dá mais trabalho para manter: se o cliente troca de e-mail, é preciso atualizar todas as tabelas em que ele aparece. É uma troca consciente: mais trabalho na escrita para ganhar leituras rápidas.<\/p><p><b>Partition key e clustering key:<\/b> Em <code>PRIMARY KEY (cliente_id, data_pedido)<\/code>, a primeira parte é a partition key: o Cassandra calcula um código (hash) com ela para decidir em qual nó o dado vai morar, e os pedidos do mesmo cliente ficam juntos. A segunda é a clustering key: ela ordena os pedidos por data dentro dessa partição.<\/p><p class=\"ex\"><b>Por isso:<\/b> buscar <code>WHERE cliente_id = ...<\/code> é rápido, mas filtrar por uma coluna fora da chave, como <code>status<\/code>, dá erro ou exige <code>ALLOW FILTERING<\/code>, que varre o cluster inteiro.<\/p><h2>④ <b>Redis:<\/b> <i>Escolha a estrutura pelo uso<\/i><\/h2><p><b>String:<\/b> Um valor simples numa chave, como <code>SET produto:123:nome \"Camiseta\"<\/code>. Os dois-pontos no nome da chave são só uma convenção para organizar.<\/p><p><b>Lista:<\/b> Uma fila ordenada que aceita repetição. <code>LPUSH<\/code> coloca um item no começo e <code>LRANGE vendidos 0 -1<\/code> mostra do primeiro ao último. Serve para históricos e filas.<\/p><p><b>Conjunto:<\/b> Guarda valores sem repetição e sem ordem, como as categorias de uma loja. <code>SADD<\/code> adiciona e <code>SISMEMBER<\/code> responde 1 se o valor está no conjunto ou 0 se não está.<\/p><p><b>Hash:<\/b> Guarda vários campos dentro de uma mesma chave, como uma ficha: <code>HSET produto:123 nome \"Camiseta\" preco 39.99 estoque 100<\/code>. É a melhor opção quando o dado é um objeto com vários atributos.<\/p><p><b>Scripts Lua:<\/b> Rodam dentro do servidor de forma atômica: nada interrompe o script no meio. Numa compra, o script confere o estoque e baixa a quantidade de uma vez só, sem o risco de duas pessoas levarem o último item ao mesmo tempo.<\/p><p class=\"ex\"><b>Memória é limitada:<\/b> como tudo fica na RAM, dados temporários devem ganhar prazo com <code>EXPIRE<\/code>. A expiração libera memória e mantém o Redis rápido.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> No MongoDB pense em esteira (cada estágio entrega para o próximo). No Cassandra pense em qual pergunta esta tabela responde. No Redis escolha a estrutura pelo jeito que o dado é usado.<\/p>", "qs": [{ "q": "Qual é a principal vantagem do Redis em relação aos bancos de dados tradicionais em disco?", "o": ["Persistir dados em discos, o que é mais rápido que os bancos de dados em disco.", "Dar suporte nativo para transações complexas, como bancos de dados relacionais.", "Armazenar dados permanentemente, igual aos bancos de dados tradicionais.", "Armazenar dados em memória, permitindo acessos muito mais rápidos."], "t": "per" }, { "q": "Qual comando do Redis é utilizado para verificar se uma chave existe no banco de dados?", "o": ["EXISTS", "GET", "SET", "DEL"], "t": "per" }, { "q": "Qual é a vantagem de usar a expiração de chaves no Redis?", "o": ["Permitir que dados sejam armazenados permanentemente.", "Otimizar o uso de memória e desempenho.", "Garantir que os dados armazenados no Redis sejam persistidos em disco.", "Impedir que dados sejam sobrescritos por novos valores."], "t": "per" }, { "q": "Qual operador é usado para alterar campos em um updateOne do MongoDB?", "o": ["$match", "$set", "$group", "$unwind"], "t": "mc" }, { "q": "O que acontece ao rodar deleteMany({}) em uma coleção?", "o": ["Nada, o filtro está vazio", "Apaga só o primeiro documento", "Apaga todos os documentos da coleção", "Cria um backup automático"], "t": "mc" }, { "q": "No pipeline de agregação, qual estágio junta coleções, como um JOIN?", "o": ["$match", "$sort", "$project", "$lookup"], "t": "mc" }, { "q": "No Cassandra, qual é a função da partition key?", "o": ["Decidir em qual nó o dado fica", "Criptografar a tabela", "Ordenar os usuários por nome", "Fazer JOIN entre tabelas"], "t": "mc" }, { "q": "Qual estrutura do Redis é a melhor para guardar vários campos de um produto na mesma chave?", "o": ["Lista", "Conjunto", "Hash", "String"], "t": "mc" }, { "q": "Escreva uma consulta MongoDB que encontre produtos com preço maior que 100 e outra que aumente em 5 o estoque do produto \"Caderno\".", "o": null, "t": "ab" }, { "q": "Por que no Cassandra é comum repetir dados em várias tabelas? Qual é o custo disso?", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Arquitetura e escalabilidade NoSQL", "frase": "Replicar protege, dividir faz crescer", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Arquitetura e escalabilidade NoSQL<\/p><p class=\"frase\">Replicar protege, dividir faz crescer<\/p><\/div><h2>① <b>MongoDB: replica set:<\/b> <i>Sempre tem um reserva<\/i><\/h2><p><b>Como funciona:<\/b> Um replica set é um grupo de servidores MongoDB com os mesmos dados. Só um deles, o primário, recebe as gravações; os secundários copiam tudo o que acontece no primário e ficam prontos para assumir, como o goleiro reserva que acompanha o jogo do banco.<\/p><p><b>Eleição:<\/b> Se o primário cai, os secundários conversam entre si e, em alguns segundos, elegem um novo primário (isso se chama <i>failover<\/i>). Enquanto a eleição acontece, ninguém consegue gravar; depois, o sistema volta a funcionar sem intervenção.<\/p><p><b>Volta do nó:<\/b> Quando o antigo primário volta, ele entra como secundário e copia sozinho tudo o que perdeu enquanto esteve fora.<\/p><pre style=\"height:128px\"><code>rs.initiate({ _id: \"rs0\", members: [\n  { _id: 0, host: \"localhost:27017\" },\n  { _id: 1, host: \"localhost:27018\" },\n  { _id: 2, host: \"localhost:27019\" } ] })\nrs.status()<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>rs.initiate<\/code> cria o grupo rs0 com três servidores, um em cada porta. <code>rs.status()<\/code> mostra quem é PRIMARY, quem é SECONDARY e até onde cada um já copiou (<code>optime<\/code>).<\/p><h2>② <b>MongoDB: sharding:<\/b> <i>Dividir para crescer<\/i><\/h2><p><b>A ideia:<\/b> Quando uma coleção fica grande demais para um servidor, ela é cortada em pedaços (shards), cada um guardado em um servidor diferente. É como uma biblioteca que não cabe numa sala só: os livros de A a M ficam numa sala e os de N a Z, em outra.<\/p><p><b>As peças:<\/b> O <code>mongos<\/code> é o recepcionista: recebe cada consulta e sabe para qual shard encaminhar. Os config servers guardam o mapa de onde está cada pedaço. Os shards guardam os dados de fato.<\/p><p><b>Chave de shard:<\/b> É o campo usado para decidir para onde vai cada documento. Com <code>{ clienteId: \"hashed\" }<\/code>, o MongoDB embaralha os valores com um cálculo (hash) e os documentos se espalham por igual entre os shards. Se a chave for mal escolhida, quase tudo pode cair num shard só, que fica sobrecarregado enquanto os outros ficam parados.<\/p><pre style=\"height:64px\"><code>sh.enableSharding(\"shopwide\")\nsh.shardCollection(\"shopwide.pedidos\", { clienteId: \"hashed\" })<\/code><\/pre><p class=\"ex\"><b>Replicação x sharding:<\/b> replicação COPIA os dados para proteger contra falhas; sharding DIVIDE os dados para aguentar crescer. Em produção se usam os dois juntos, e quando um shard novo entra, o MongoDB rebalanceia os pedaços sozinho.<\/p><h2>③ <b>Cassandra:<\/b> <i>Um anel sem chefe<\/i><\/h2><p><b>Anel de nós iguais:<\/b> No Cassandra não existe primário: todos os nós têm o mesmo papel e formam um anel. Assim não há um ponto único de falha, ou seja, nenhum servidor do qual todos dependam.<\/p><p><b>Particionamento:<\/b> Para saber onde guardar uma linha, o Cassandra calcula o hash da partition key (por exemplo, <code>device_id<\/code>) e o resultado aponta uma posição no anel. Cada nó é dono de algumas faixas do anel (<code>num_tokens<\/code>), então cada dado tem um endereço certo.<\/p><p><b>Replicação:<\/b> Com <code>replication_factor: 2<\/code>, cada partição fica em dois nós. Se um cair, o outro responde: duplicar os dados é o que garante alta disponibilidade e tolerância a falhas.<\/p><p><b>Crescer:<\/b> Quando um nó novo entra no cluster, ele assume algumas faixas do anel e as partições são redistribuídas automaticamente, sem parar o sistema.<\/p><p class=\"ex\"><b>Configurar e conferir:<\/b> no <code>cassandra.yaml<\/code>, todos os nós usam o mesmo <code>cluster_name<\/code> e apontam para um nó semente (<code>seeds<\/code>) para se encontrarem. <code>nodetool status<\/code> mostra quem está no ar, <code>nodetool ring<\/code> mostra como os dados estão divididos e <code>nodetool repair<\/code> sincroniza as réplicas.<\/p><h2>④ <b>Redis:<\/b> <i>Crescer sem perder velocidade<\/i><\/h2><p><b>Vertical:<\/b> A primeira saída é dar mais RAM e processador para o servidor, mas toda máquina tem um limite físico.<\/p><p><b>Redis Cluster:<\/b> Para crescer na horizontal, o Redis Cluster divide as chaves em 16.384 <i>hash slots<\/i>, como gavetas numeradas, e distribui essas gavetas entre os nós. Cada chave cai sempre na mesma gaveta, então o cluster sabe exatamente em qual nó procurá-la.<\/p><p><b>Réplicas e failover:<\/b> Cada nó principal pode ter réplicas, que ajudam nas leituras. Se o principal falha, uma réplica é promovida automaticamente e o serviço continua.<\/p><p class=\"ex\"><b>Ajustes finos:<\/b> pipelines mandam vários comandos numa ida só ao servidor, economizando tempo de rede; <code>maxmemory-policy<\/code> define o que o Redis faz quando a memória enche, como apagar as chaves usadas há mais tempo.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> A decisão mais importante da escala horizontal é a chave (shard key no MongoDB, partition key no Cassandra). É ela que define se os dados se espalham por igual.<\/p>", "qs": [{ "q": "O que é o particionamento de dados no Cassandra?", "o": ["O particionamento distribui os dados de maneira uniforme entre os nós.", "O particionamento cria cópias de dados como um clone em todos os nós.", "O particionamento distribui os dados entre os nós com base em uma chave de partição.", "O particionamento organiza dados exclusivamente por data."], "t": "per" }, { "q": "Qual é a função principal da replicação no Cassandra?", "o": ["Tornar os dados acessíveis apenas por um único nó.", "Duplicar dados para alta disponibilidade e tolerância.", "Armazenar tudo em um nó e acelerar as consultas.", "Ajudar na indexação e nas buscas em tabelas grandes."], "t": "per" }, { "q": "O que acontece quando um novo nó é adicionado ao Cassandra?", "o": ["Remove os dados dos nós e redistribui igualmente.", "Armazena dados de um subconjunto de partições.", "Redistribui dados entre os nós de forma eficiente.", "Inicia vazio; outros pausam até redistribuir dados."], "t": "per" }, { "q": "Em um replica set, quem recebe as escritas?", "o": ["Todos os nós ao mesmo tempo", "O nó primário", "O config server", "O mongos"], "t": "mc" }, { "q": "O que acontece quando o primário cai?", "o": ["Ocorre uma eleição e um secundário vira primário", "Todos os dados são apagados", "As escritas continuam sem nenhuma pausa", "O cluster precisa ser reinstalado"], "t": "mc" }, { "q": "Qual é o papel do mongos?", "o": ["Guardar os pedaços dos dados", "Fazer backup semanal", "Rotear as consultas no cluster", "Criptografar as senhas"], "t": "mc" }, { "q": "Como o Cassandra decide em qual nó guardar um dado?", "o": ["Pelo nó mais novo do cluster", "Pelo nome do administrador", "Sempre no nó primário", "Pelo hash da partition key"], "t": "mc" }, { "q": "Em quantos hash slots o Redis Cluster divide os dados?", "o": ["1.024", "8.192", "16.384", "65.536"], "t": "mc" }, { "q": "O que pode acontecer se a chave de shard escolhida concentrar quase todos os dados em um nó? Explique.", "o": null, "t": "ab" }, { "q": "Explique a diferença entre replicação e sharding usando uma comparação do dia a dia.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Segurança, backup e recuperação", "frase": "Proteger e saber voltar", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Segurança, backup e recuperação<\/p><p class=\"frase\">Proteger e saber voltar<\/p><\/div><h2>① <b>Os 4 pilares da segurança:<\/b> <i>Quem, o quê, como e quando<\/i><\/h2><p><b>Autenticação:<\/b> Responde “quem é você?”. É o login com usuário e senha. Sem ela, qualquer pessoa que descobrisse o endereço do banco conseguiria entrar.<\/p><p><b>Autorização:<\/b> Responde “o que você pode fazer?”. Depois de entrar, cada usuário recebe papéis (<i>roles<\/i>): <code>read<\/code> só consulta, <code>readWrite<\/code> consulta e altera. Numa loja seria assim: o caixa consulta preços, o gerente altera preços e só o dono cadastra funcionários.<\/p><p><b>Criptografia e hash:<\/b> Protegem o dado mesmo que alguém consiga chegar até ele. O TLS embaralha o que viaja pela rede, a criptografia em repouso protege o que está gravado no disco e as senhas são guardadas como hash.<\/p><p><b>Auditoria:<\/b> Responde “quem fez o quê e quando?”. Um registro (log) de acessos e operações permite investigar um problema depois que ele aconteceu.<\/p><p class=\"ex\"><b>Sistemas legados:<\/b> são programas antigos que a empresa ainda usa e não pode simplesmente desligar, mas que rodam em versões com falhas de segurança conhecidas. Uma saída comum é protegê-los com camadas extras de segurança em vez de reescrever tudo.<\/p><h2>② <b>Usuários e permissões:<\/b> <i>MongoDB e AstraDB<\/i><\/h2><p><b>A ordem certa:<\/b> Primeiro se cria o usuário administrador, com o banco ainda aberto. Só depois se liga <code>authorization: enabled<\/code> no <code>mongod.cfg<\/code> e se reinicia o serviço. Se a ordem for invertida, o banco passa a exigir o login de um administrador que não existe e ninguém consegue entrar.<\/p><p><b>Roles:<\/b> <code>createUser<\/code> cria o usuário já com seus papéis; <code>grantRolesToUser<\/code> concede um papel depois e <code>revokeRolesFromUser<\/code> retira. A regra é dar a cada pessoa só a permissão de que ela precisa.<\/p><pre style=\"height:96px\"><code>use techsecure\ndb.createUser({ user: \"viewer\",\n  pwd: passwordPrompt(),\n  roles: [{ role: \"read\", db: \"techsecure\" }] })<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> o usuário viewer é criado no banco techsecure só com a role <code>read<\/code>. <code>passwordPrompt()<\/code> pede a senha na hora, sem deixá-la escrita no código.<\/p><p><b>Senhas com bcrypt:<\/b> Senha nunca é guardada como texto. <code>bcrypt.hash(password, 10)<\/code> transforma a senha num hash, um código de mão única: dá para conferir se a senha digitada gera o mesmo hash, mas não dá para voltar do hash para a senha. Se o banco vazar, as senhas continuam protegidas.<\/p><p><b>AstraDB:<\/b> No Cassandra na nuvem, os usuários são convidados com roles em três níveis (organização, banco/keyspace/tabela e API). TLS e criptografia em repouso já vêm ativados, e os logs ficam em Settings › Security.<\/p><h2>③ <b>Backup e recuperação:<\/b> <i>Saber voltar atrás<\/i><\/h2><p><b>Completo x incremental:<\/b> O backup completo copia tudo, como fotografar a casa inteira. O incremental copia só o que mudou desde o último backup, como fotografar apenas o cômodo que foi reformado: é menor e mais rápido, mas depende do completo para restaurar.<\/p><p><b>Estratégia mista:<\/b> Um backup completo de tempos em tempos (por semana ou por mês) mais incrementais frequentes junta segurança com economia de tempo e espaço.<\/p><p><b>MongoDB:<\/b> <code>mongodump<\/code> faz o backup e <code>mongorestore<\/code> traz os dados de volta; <code>--drop<\/code> apaga o que está no banco antes de restaurar. Um arquivo <code>backup.bat<\/code> no Agendador de Tarefas do Windows automatiza a rotina.<\/p><pre style=\"height:96px\"><code>mongodump --out ./backup-completo\nmongodump --db ecommerce --collection orders --out ./backup-incremental\nmongorestore --drop ./backup-completo<\/code><\/pre><p><b>Cassandra:<\/b> <code>nodetool snapshot empresa<\/code> tira o backup completo. Para o incremental, liga-se <code>incremental_backups: true<\/code> no <code>cassandra.yaml<\/code>. Na restauração, os arquivos do snapshot são copiados para a pasta da tabela e carregados com <code>nodetool refresh<\/code>. A ferramenta Medusa automatiza o processo.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Por que acontecem<\/i><\/h2><p><b>Confundir os pilares:<\/b> Autenticação prova quem a pessoa é; autorização define o que ela pode fazer. Um usuário pode entrar no banco (autenticado) e mesmo assim não ter permissão para apagar nada.<\/p><p><b>Senha em texto puro:<\/b> Se o banco vazar, todas as contas vazam junto. É exatamente para isso que existe o hash.<\/p><p><b>Comandos que não existem:<\/b> <code>nodetool backup<\/code> e <code>nodetool restore<\/code> não existem. O backup completo do Cassandra é feito com <code>nodetool snapshot<\/code>.<\/p><p><b>Backup nunca testado:<\/b> Só dá para saber se um backup funciona restaurando. Simule a falha num ambiente de teste, restaure e confira os dados.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Backup que nunca foi restaurado não é confiável: simule a falha, restaure e confira os dados. E dê a cada usuário só a permissão de que ele precisa.<\/p>", "qs": [{ "q": "Qual é a principal diferença entre o backup completo (snapshot) e o backup incremental no Cassandra?", "o": ["O primeiro armazena apenas dados novos, e o incremental captura todos os dados.", "O primeiro captura todos os dados, o segundo, apenas as alterações desde o último backup.", "O primeiro é mais eficiente em termos de espaço, enquanto o incremental é mais demorado.", "O primeiro é feito manualmente, enquanto o incremental é automático."], "t": "per" }, { "q": "Qual comando é utilizado no Apache Cassandra para realizar um backup completo (snapshot)?", "o": ["nodetool snapshot", "nodetool backup", "cqlsh snapshot", "nodetool restore"], "t": "per" }, { "q": "Quando se utiliza o backup incremental no Cassandra, o que precisa ser configurado no cassandra.yaml?", "o": ["A opção snapshot_frequency deve ser configurada para true.", "A opção backup_type deve ser configurada como incremental.", "A opção incremental_backups deve ser configurada como true.", "A opção incremental_backups deve ser configurada como false."], "t": "per" }, { "q": "\"O que este usuário pode fazer no banco?\" é uma pergunta sobre:", "o": ["Autenticação", "Autorização", "Auditoria", "Replicação"], "t": "mc" }, { "q": "Por que usar bcrypt para senhas?", "o": ["Porque gera um hash de mão única", "Porque deixa a senha mais curta", "Porque guarda a senha em texto puro", "Porque acelera as consultas"], "t": "mc" }, { "q": "O que pode acontecer ao ligar authorization antes de criar o admin?", "o": ["O banco fica mais rápido", "Os dados são duplicados", "Ninguém consegue entrar", "O backup roda sozinho"], "t": "mc" }, { "q": "Qual ferramenta faz o backup de um banco MongoDB?", "o": ["nodetool snapshot", "mongostat", "rs.status", "mongodump"], "t": "mc" }, { "q": "O que a estratégia mista de backup combina?", "o": ["Dois bancos relacionais", "Backup completo periódico e incrementais frequentes", "Backup e exclusão dos dados", "Dois usuários com a mesma senha"], "t": "mc" }, { "q": "Crie o plano de backup de uma escola: o que faria, com qual frequência e como testaria a recuperação.", "o": null, "t": "ab" }, { "q": "Em um sistema escolar, que permissões daria a um aluno, um professor e um administrador? Por quê?", "o": null, "t": "ab" }] }, { "n": 27, "tema": "Performance e monitoramento NoSQL", "frase": "Medir, diagnosticar, corrigir", "html": "<div data-flow><h1>Semana 27<\/h1><p class=\"tema\">Performance e monitoramento NoSQL<\/p><p class=\"frase\">Medir, diagnosticar, corrigir<\/p><\/div><h2>① <b>Métricas que importam:<\/b> <i>O painel do carro<\/i><\/h2><p><b>A ideia:<\/b> Monitorar um banco é como olhar o painel de um carro: cada ponteiro mostra uma coisa diferente, e o problema só fica claro quando você olha todos juntos. Uma métrica sozinha pode passar uma impressão errada.<\/p><p><b>Latência:<\/b> É o tempo que uma operação leva para responder. Quando ela sobe, alguma coisa está travando o banco.<\/p><p><b>Throughput:<\/b> É quantas operações o banco consegue fazer por segundo. Ele mostra se o sistema está dando conta da quantidade de pedidos que chega.<\/p><p><b>CPU e memória:<\/b> Uso acima de 80% é sinal de atenção. O banco precisa de RAM para manter o <i>working set<\/i>, o conjunto de dados mais usados; quando ele não cabe na memória, o banco precisa ir ao disco (<i>page fault<\/i>) e tudo fica mais lento.<\/p><p class=\"ex\"><b>Outras métricas:<\/b> tamanho dos índices (índice demais ocupa memória), conexões ativas (muitas ao mesmo tempo formam fila) e locks (operações esperando umas pelas outras).<\/p><h2>② <b>Ferramentas:<\/b> <i>Enxergar o que está acontecendo<\/i><\/h2><p><b>MongoDB:<\/b> O Atlas Performance Advisor analisa as consultas e sugere índices. No terminal, <code>mongostat<\/code> mostra as operações por segundo ao vivo e <code>mongotop<\/code> mostra quanto tempo o banco passa em cada coleção.<\/p><p><b>Cassandra:<\/b> O monitoramento é uma corrente de três peças: o JMX Exporter tira as métricas de dentro do Cassandra, o Prometheus (localhost:9090) coleta e guarda essas medidas e o Grafana (localhost:3000) transforma tudo em gráficos.<\/p><p class=\"ex\"><b>Boas práticas:<\/b> configurar alertas para os limites críticos, acompanhar a tendência ao longo dos dias e fazer testes de carga em homologação antes de um pico de acessos, como a Black Friday.<\/p><h2>③ <b>MongoDB: consulta lenta:<\/b> <i>Do COLLSCAN ao IXSCAN<\/i><\/h2><p><b>Profiler:<\/b> <code>db.setProfilingLevel(2)<\/code> liga um gravador que registra todas as operações em <code>system.profile<\/code>. Serve para achar as consultas lentas, mas pesa no servidor: depois do diagnóstico, volte para o nível 0 ou 1.<\/p><p><b>explain:<\/b> Acrescentar <code>.explain(\"executionStats\")<\/code> no fim de uma consulta mostra como o banco a executou: <code>nReturned<\/code> (quantos documentos voltaram), <code>executionTimeMillis<\/code> (quanto tempo levou) e <code>winningPlan<\/code> (o plano escolhido).<\/p><p><b>COLLSCAN x IXSCAN:<\/b> COLLSCAN quer dizer que o banco leu a coleção inteira, documento por documento. IXSCAN quer dizer que ele usou um índice e foi direto ao que interessava. COLLSCAN numa consulta usada o tempo todo é sinal de que falta um índice.<\/p><pre style=\"height:96px\"><code>db.products.find({ brand: \"Acme\" }).explain(\"executionStats\")\ndb.products.createIndex({ brand: 1 })\ndb.products.createIndex({ price: 1, created_at: -1 })<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> o primeiro comando mostra o plano da consulta por marca; o segundo cria o índice que a acelera; o terceiro é um índice composto, que ajuda quando se filtra por preço e se ordena pela data mais recente.<\/p><p class=\"ex\"><b>Pipeline lento:<\/b> divida em partes menores, tire etapas repetidas e use <code>$match<\/code> o mais cedo possível, para que menos documentos sigam na esteira. Lembre que <code>$unwind<\/code> abre uma lista: cada item vira um documento.<\/p><h2>④ <b>Cassandra:<\/b> <i>Otimizar modelando pela consulta<\/i><\/h2><p><b>Começa no desenho:<\/b> No Cassandra, a otimização começa na criação da tabela. Uma tabela de transações com chave <code>transaction_id<\/code> obriga o banco a varrer tudo para achar as transações de um cliente.<\/p><p><b>As chaves certas:<\/b> Com <code>customer_id<\/code> como partition key, todas as transações do mesmo cliente ficam juntas, no mesmo nó. Com <code>transaction_date<\/code> como clustering key, elas ficam ordenadas por data, e buscar um período vira uma leitura direta.<\/p><pre style=\"height:128px\"><code>CREATE TABLE transactions_by_customer (\n  customer_id UUID, transaction_date TIMESTAMP,\n  product_id UUID, amount INT,\n  PRIMARY KEY (customer_id, transaction_date)\n) WITH CLUSTERING ORDER BY (transaction_date DESC);<\/code><\/pre><p class=\"ex\"><b>Diagnóstico:<\/b> o CQL não tem EXPLAIN; <code>TRACING ON<\/code> mostra o caminho e o tempo da próxima consulta. Evite <code>ALLOW FILTERING<\/code>: filtrar fora da chave varre o cluster inteiro. Índice secundário ajuda nesses casos, mas com moderação.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Otimização segue 3 passos: medir (métricas e ferramentas), diagnosticar (explain, profiler, TRACING ON) e corrigir (índices certos e chaves pensadas para a consulta). Compare sempre o antes e o depois.<\/p>", "qs": [{ "q": "O que a função explain() no MongoDB permite que você faça?", "o": ["Exibir todos os dados armazenados em uma coleção.", "Explicar o tempo de execução e o plano de execução de uma consulta.", "Criar índices automaticamente para melhorar o desempenho das consultas.", "Excluir documentos que não atendem aos critérios da consulta."], "t": "per" }, { "q": "Qual é o principal benefício de usar índices no MongoDB?", "o": ["Melhorar a eficiência das consultas, tornando-as mais rápidas.", "Reduzir o tamanho do banco de dados.", "Armazenar os dados de forma mais compacta.", "Tornar a replicação de dados mais eficiente."], "t": "per" }, { "q": "O que o operador $unwind faz em um pipeline de agregação no MongoDB?", "o": ["Cria um índice em um campo específico.", "Filtra documentos com base em um valor de campo específico.", "Ordena os documentos em ordem crescente.", "Desagrega um array, retornando um documento para cada elemento."], "t": "per" }, { "q": "O que o throughput mede?", "o": ["O tamanho do disco", "As operações por segundo", "O número de índices", "A quantidade de usuários cadastrados"], "t": "mc" }, { "q": "No explain do MongoDB, o que COLLSCAN indica?", "o": ["Que um índice foi usado", "Que a consulta foi cancelada", "Que a coleção inteira foi varrida", "Que os dados foram apagados"], "t": "mc" }, { "q": "Qual é o risco de criar índice em todos os campos?", "o": ["Pesar na escrita e na memória", "Apagar os dados antigos", "Impedir qualquer consulta", "Desligar o banco"], "t": "mc" }, { "q": "Qual comando mostra o caminho de uma consulta no Cassandra?", "o": ["EXPLAIN", "mongotop", "db.setProfilingLevel", "TRACING ON"], "t": "mc" }, { "q": "Qual a ordem do monitoramento com Prometheus e Grafana no Cassandra?", "o": ["Grafana → JMX Exporter → Prometheus", "JMX Exporter → Prometheus → Grafana", "Prometheus → Grafana → JMX Exporter", "Grafana → Prometheus → JMX Exporter"], "t": "mc" }, { "q": "Uma consulta por categoria demora 650 ms e o explain mostra COLLSCAN. Diga o que você faria e escreva o comando.", "o": null, "t": "ab" }, { "q": "Por que olhar uma única métrica pode enganar? Dê um exemplo.", "o": null, "t": "ab" }] }, { "n": 28, "tema": "Casos de uso e aplicações NoSQL", "frase": "Cada banco no seu problema", "html": "<div data-flow><h1>Semana 28<\/h1><p class=\"tema\">Casos de uso e aplicações NoSQL<\/p><p class=\"frase\">Cada banco no seu problema<\/p><\/div><h2>① <b>MongoDB:<\/b> <i>Aplicações web e big data<\/i><\/h2><p><b>Aplicações web:<\/b> Perfis de usuários variam muito: um tem duas preferências, outro tem dez, outro guarda também curtidas e comentários. No MongoDB, cada perfil é um documento e pode ter os campos de que precisa, sem mudar a estrutura de todos os outros.<\/p><p><b>Big data:<\/b> Logs de acesso chegam aos milhões. O MongoDB guarda cada acesso como um documento (quem, o que fez, de qual dispositivo, a que horas), espalha a coleção entre servidores com sharding e permite analisar tudo com índices e agregações.<\/p><pre style=\"height:96px\"><code>db.users.insertOne({ nome: \"Ana\", preferencias: [\"música\", \"tecnologia\"] })\ndb.users.find({ preferencias: \"música\" })\ndb.logs.countDocuments({ dispositivo: \"mobile\" })<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> buscar <code>\"música\"<\/code> num campo que é lista encontra todos os usuários que têm esse item na lista; <code>countDocuments<\/code> conta os documentos em vez de listá-los.<\/p><h2>② <b>Cassandra:<\/b> <i>Volume gigante, sempre no ar<\/i><\/h2><p><b>Quando usar:<\/b> Bilhões de eventos por dia, vindos de servidores espalhados pelo mundo: logs, mensagens, leituras de sensores, sessões de usuários. O Cassandra cresce somando nós sem parar o sistema e não tem ponto único de falha: não existe um servidor central que, ao cair, derrube tudo.<\/p><p><b>DataStax Astra:<\/b> É uma plataforma em nuvem que entrega o Cassandra pronto para usar, sem instalar nada. Os comandos CQL são digitados no CQL Console do próprio site.<\/p><pre style=\"height:160px\"><code>CREATE TABLE iot_data.sensors (\n  sensor_id TEXT, timestamp TIMESTAMP,\n  temperature DOUBLE, humidity DOUBLE,\n  PRIMARY KEY (sensor_id, timestamp)\n) WITH CLUSTERING ORDER BY (timestamp DESC);\nSELECT * FROM iot_data.sensors WHERE sensor_id = 'sensor_01' LIMIT 10;<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> a partition key <code>sensor_id<\/code> junta as leituras do mesmo sensor; a clustering key <code>timestamp<\/code> em ordem decrescente deixa as mais recentes primeiro. Por isso pegar as 10 últimas leituras de um sensor é imediato.<\/p><h2>③ <b>Redis:<\/b> <i>Cache, sessão e fila<\/i><\/h2><p><b>Cache:<\/b> Quando alguém pede um produto, o sistema olha primeiro no Redis. Se o produto estiver lá, responde na hora; se não, busca no banco principal e guarda uma cópia no Redis com prazo de validade. Quem pedir o mesmo produto depois já recebe do cache, e o banco principal trabalha bem menos.<\/p><p><b>Sessão:<\/b> No login, o token do usuário é salvo com expiração, por exemplo, de 30 minutos. Enquanto a chave existir, a sessão vale; depois ela some sozinha e a pessoa precisa entrar de novo.<\/p><p><b>Tarefas assíncronas:<\/b> Tarefas demoradas, como enviar e-mails, entram numa lista com <code>LPUSH<\/code>, e outro processo vai tirando com <code>RPOP<\/code> e executando em segundo plano. O usuário não precisa esperar o e-mail sair para continuar usando o site.<\/p><p class=\"ex\"><b>Casos reais:<\/b> e-commerces usam o Redis para cache de produtos e carrinho; plataformas de autenticação usam para guardar sessões.<\/p><h2>④ <b>Neo4j:<\/b> <i>Recomendação pelas conexões<\/i><\/h2><p><b>O modelo:<\/b> Numa rede profissional, usuários, posts e tópicos são nós. <code>FOLLOWS<\/code> liga quem segue quem, <code>LIKES<\/code> liga o usuário ao post curtido, <code>INTERESTED_IN<\/code> liga o usuário a um tópico de interesse e <code>HAS_TOPIC<\/code> liga o post ao seu tópico.<\/p><p><b>Amigos de amigos:<\/b> Para sugerir “pessoas que você talvez conheça”, o grafo percorre duas ligações: quem a Ana segue e quem essas pessoas seguem. Depois tira da lista quem a Ana já segue e ela mesma; o que sobra são as sugestões.<\/p><pre style=\"height:96px\"><code>MATCH (u:User {name: 'Ana'})-[:FOLLOWS]-&gt;(f)-[:FOLLOWS]-&gt;(s)\nWHERE NOT (u)-[:FOLLOWS]-&gt;(s) AND u &lt;&gt; s\nRETURN DISTINCT s.name<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>WHERE NOT (u)-[:FOLLOWS]-&gt;(s)<\/code> remove quem ela já segue, <code>u &lt;&gt; s<\/code> remove a própria Ana e <code>DISTINCT<\/code> evita nomes repetidos. Do mesmo jeito, seguindo <code>INTERESTED_IN<\/code> e <code>HAS_TOPIC<\/code>, dá para recomendar posts dos tópicos de que a pessoa gosta.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Não existe banco melhor: existe o banco certo para cada problema. Pergunte primeiro como o dado será usado e só depois escolha a ferramenta.<\/p>", "qs": [{ "q": "Qual relacionamento indica um usuário seguindo outro?", "o": ["(:User)-[:FOLLOWS]->(:User)", "(:User)-[:LIKES]->(:Post)", "(:User)-[:SHARED]->(:Topic)", "(:User)-[:TAGGED]->(:User)"], "t": "per" }, { "q": "O que a consulta MATCH (u:User)-[:INTERESTED_IN]->(t) retorna?", "o": ["Usuários e conexões mútuas.", "Usuários e postagens curtidas.", "Usuários e seus interesses.", "Postagens populares no grafo."], "t": "per" }, { "q": "Qual consulta sugere conexões com amigos de amigos?", "o": ["MATCH (p:Post)-[:HAS_TOPIC]->(t:Topic)", "MATCH (u)-[:FOLLOWS]->(f)-[:FOLLOWS]->(s)", "MATCH (u)-[:LIKES]->(p:Post)", "MATCH (u)-[:SHARED]->(p:Post)"], "t": "per" }, { "q": "Uma empresa precisa guardar bilhões de logs por dia em servidores pelo mundo. Qual banco é o mais adequado?", "o": ["Neo4j", "Cassandra", "Redis", "Excel"], "t": "mc" }, { "q": "Qual é um uso típico do Redis em uma aplicação?", "o": ["Guardar fotos em alta resolução para sempre", "Desenhar grafos de relacionamento", "Fazer cache para reduzir acessos ao banco", "Substituir a linguagem de programação"], "t": "mc" }, { "q": "Para guardar perfis de usuários com campos variados, qual banco se encaixa melhor?", "o": ["MongoDB", "Cassandra com replicação zero", "Redis com lista", "Nenhum banco de dados"], "t": "mc" }, { "q": "O que é o DataStax Astra?", "o": ["Um editor de código", "Um modelo de linguagem", "Um shell do Redis", "Uma plataforma em nuvem para usar Cassandra"], "t": "mc" }, { "q": "Qual banco é o mais indicado para sugerir \"pessoas que você talvez conheça\"?", "o": ["Redis", "Cassandra", "Neo4j", "MongoDB com um único documento"], "t": "mc" }, { "q": "Pense em um aplicativo de streaming de música. Indique onde usaria MongoDB, Redis e Neo4j e explique cada escolha.", "o": null, "t": "ab" }, { "q": "Escreva uma consulta Cypher que mostre os nomes das pessoas que a usuária Ana segue.", "o": null, "t": "ab" }] }] }, { "id": "pdsma", "sigla": "PDSMA", "nome": "Processos de Desenvolvimento de Software e Metodologias Ágeis", "cor": "#7a3fb0", "semanas": [{ "n": 21, "tema": "Cultura DevOps e feedback contínuo", "frase": "Do muro da confusão à esteira automática", "html": "<div data-flow><h1>Semana 21<\/h1><p class=\"tema\">Cultura DevOps e feedback contínuo<\/p><p class=\"frase\">Do muro da confusão à esteira automática<\/p><\/div><h2>① <b>Origem do DevOps e CALMS:<\/b> <i>Um time só, do commit à produção<\/i><\/h2><p><b>Wall of confusion (muro da confusão):<\/b> Antes do DevOps, as empresas tinham dois times separados. O Desenvolvimento (Dev) é cobrado por entregar novidades rápido; a Operação (Ops) é cobrada por manter o sistema no ar sem cair. Os dois objetivos fazem sentido, mas puxam para lados opostos: toda mudança do Dev é um risco para Ops. Sem conversa, o Dev termina o código e \"joga por cima do muro\", e Ops recebe um pacote que não conhece. O erro só aparece em produção, na frente do cliente, e começa a troca de culpa.<\/p><p class=\"ex\"><b>Na prática:<\/b> o dev diz \"na minha máquina funciona!\" e Ops responde \"no servidor quebrou!\". Os dois têm razão: os ambientes eram diferentes e ninguém combinou nada antes.<\/p><p class=\"alerta\"><b>Cuidado:<\/b> o muro não é físico nem um bug no código. É conflito de objetivos + falta de comunicação.<\/p><p><b>Do Ágil ao DevOps:<\/b> O Ágil (Scrum, Kanban) aproximou o time do cliente e encurtou as entregas para ciclos de poucas semanas. Mas o fim do sprint não era o fim do caminho: a entrega ainda ficava parada na porta da operação, esperando alguém instalar. O DevOps estende a colaboração até o fim: o mesmo time cuida do código, da entrega e do funcionamento em produção, unindo pessoas, processos e tecnologia.<\/p><p class=\"ex\"><b>Antes e depois:<\/b> antes, deploy manual uma vez por mês, com a equipe de plantão torcendo para nada quebrar. Depois, deploy automático várias vezes ao dia, cada mudança pequena e verificada.<\/p><p class=\"alerta\"><b>Cuidado:<\/b> DevOps não é cargo nem ferramenta. É um jeito de trabalhar. Ferramentas ajudam, mas sem colaboração o muro continua lá.<\/p><p><b>CALMS:<\/b> São os cinco pilares que mostram se um time realmente vive DevOps. Cada letra é um hábito do time:<\/p><p><b>Cultura (C):<\/b> Responsabilidade compartilhada. Se o sistema cai, o problema é do time todo, e não \"do pessoal da infra\". Dev e Ops planejam juntos e ninguém joga trabalho por cima do muro.<\/p><p><b>Automação (A):<\/b> Tudo que se repete (compilar, testar, publicar) é feito pela máquina. Pessoas cansam, esquecem passos e erram; um script faz igual todas as vezes. Exemplo: os testes rodam sozinhos a cada mudança, sem ninguém lembrar de clicar.<\/p><p><b>Lean (L):<\/b> Enxuto: eliminar desperdício, principalmente espera. Exemplo: um código pronto parado três dias esperando aprovação por e-mail é desperdício puro, porque ninguém está se beneficiando dele.<\/p><p><b>Medição (M):<\/b> Decidir com dados, não com opinião. \"Acho que melhoramos\" não vale; \"o tempo de entrega caiu de 5 dias para 1\" vale. As métricas DORA (bloco ③) servem exatamente para isso.<\/p><p><b>Compartilhar (S):<\/b> Espalhar ferramentas, conhecimento e principalmente as falhas. Depois de um incidente, a pergunta é \"o que aprendemos?\", e não \"de quem é a culpa?\". Quem tem medo de ser punido esconde o erro, e o erro se repete.<\/p><h2>② <b>Pipeline de feedback:<\/b> <i>A esteira que valida cada mudança<\/i><\/h2><p><b>Pipeline (esteira):<\/b> Sequência de passos automáticos que roda toda vez que alguém envia código. Funciona como a esteira de uma fábrica com inspetores: cada etapa confere uma coisa e, se algo estiver errado, a esteira para antes de o produto chegar ao cliente.<\/p><p><b>Etapas:<\/b> 1) Commit/push: o dev envia a mudança para o repositório. 2) Build: o sistema é montado (compilado, dependências instaladas); a pergunta é \"o sistema monta?\". 3) Teste: testes automáticos verificam o comportamento; a pergunta é \"faz o que deveria?\". 4) Resultado e monitor: o time recebe ✅ ou ❌, com alerta no chat, no e-mail ou no repositório.<\/p><p><b>Fail fast (falhe rápido):<\/b> Erro é inevitável; o que dá para escolher é quando descobri-lo. Encontrado em 2 minutos na esteira, o dev ainda lembra o que mudou e conserta em minutos. Encontrado 2 dias depois pelo cliente, custa venda perdida, reputação e fim de semana de trabalho. Regra de ouro: quanto mais tarde o erro aparece, mais caro é corrigir.<\/p><p class=\"ex\"><b>Na prática:<\/b> deploy na sexta, o sistema cai e o erro só é descoberto na segunda: 48 horas de prejuízo por um erro que a esteira pegaria em minutos.<\/p><p><b>Integração contínua (CI):<\/b> Em vez de cada pessoa trabalhar semanas isolada e juntar tudo no fim (o que gera conflitos enormes), o time integra pequenas mudanças várias vezes ao dia, e cada integração passa pela esteira. Ferramentas comuns: GitHub Actions e Jenkins.<\/p><p><b>Teste ≠ monitoramento:<\/b> O teste verifica o comportamento antes da entrega (\"a soma dá o resultado certo?\"). O monitoramento observa o sistema já funcionando e torna a falha visível para o time agir rápido (\"o servidor caiu às 14h\"). Um não substitui o outro.<\/p><p class=\"ex\"><b>Exemplo:<\/b> alteraram a função de soma e agora 2 + 2 dá 5. Não há erro de digitação, então o build passa. Só o teste pega a conta errada, e a esteira impede o deploy:<\/p><pre style=\"height:64px\"><code>Soma devolve 5 para 2 + 2\nBuild ✅ OK   →   Teste ❌ Falha   →   Deploy? NÃO<\/code><\/pre><h2>③ <b>Métricas DORA:<\/b> <i>Provar a melhoria com dados<\/i><\/h2><p><b>Métricas DORA:<\/b> Quatro números criados pelo grupo DORA (DevOps Research and Assessment), que pesquisa times de software no mundo todo. Duas medem velocidade e duas medem estabilidade. Servem para trocar opinião por evidência: \"o time B é melhor\" vira \"o time B entrega 5 vezes mais e quebra 3 vezes menos\".<\/p><p><b>Lead time:<\/b> Quanto tempo uma mudança leva do commit até estar em produção, nas mãos do usuário. Menor é melhor. Se está alto, o código está esperando em algum lugar: revisão, testes manuais ou aprovação.<\/p><p class=\"ex\"><b>Exemplo:<\/b> commit no dia 01/04 às 9h e deploy no dia 03/04 às 15h → lead time de 54 horas.<\/p><p><b>Deployment frequency:<\/b> Quantas vezes o time entrega ao cliente num período (nº de deploys ÷ período). Maior é melhor, porque entregas frequentes são menores, mais fáceis de testar e mais fáceis de desfazer.<\/p><p><b>MTTR (Mean Time to Recovery):<\/b> Tempo médio para restaurar o serviço depois de uma falha: soma dos tempos ÷ nº de incidentes. Menor é melhor. Mede a capacidade de reagir, e não a de nunca falhar.<\/p><p><b>Change fail rate (CFR):<\/b> Porcentagem de deploys que causam falha em produção: falhas ÷ total × 100. Menor é melhor. Mede o risco que cada mudança traz.<\/p><p><b>Equilíbrio:<\/b> Velocidade (lead time + frequência) sem estabilidade (MTTR + CFR) é entregar bug rápido. Estabilidade sem velocidade é um sistema que não evolui. Times de alta performance são bons nas duas.<\/p><p><b>Do número à ação:<\/b> Cada métrica ruim aponta um remédio. Lead time alto → procure onde o código fica esperando. MTTR alto → melhore monitoramento e alertas. CFR alto → coloque testes automatizados na esteira.<\/p><p class=\"ex\"><b>Um time em 2 semanas:<\/b> veja as contas abaixo.<\/p><pre style=\"height:96px\"><code>Incidentes de 2 h e 3 h      →  MTTR = (2 + 3) / 2 = 2,5 h\n2 falhas em 8 deploys        →  CFR  = 2 / 8 × 100 = 25%\n8 deploys em 2 semanas       →  frequência = 4 por semana<\/code><\/pre><p class=\"ex\"><b>Diagnóstico:<\/b> 1 em cada 4 deploys quebra produção. O time já tem velocidade, mas falta estabilidade: a prioridade é colocar testes automatizados na esteira.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Fazer menos deploys não reduz falhas, só junta mais mudanças em cada entrega. O caminho é o contrário: entregas pequenas, frequentes e testadas automaticamente.<\/p> ", "qs": [{ "q": "O que melhor define o conceito de Wall of confusion no contexto pré-DevOps?", "o": ["Barreira física em data centers para proteger servidores.", "Erro complexo que impede a compilação do código-fonte.", "Conflito de objetivos e falta de comunicação entre Devs e Ops.", "Estratégia de rede para impedir acesso de usuários externos."], "t": "per" }, { "q": "O que caracteriza um pipeline de feedback no DevOps?", "o": ["Um manual de instruções entregue ao cliente final.", "Um processo automático de validação do código a cada alteração.", "Uma reunião semanal para discutir erros do projeto.", "O canal de suporte pelo qual o cliente reclama de bugs."], "t": "per" }, { "q": "Como um time DevOps pode reduzir drasticamente o change fail rate?", "o": ["Fazendo menos deploys por mês.", "Aumentando o número de desenvolvedores no time.", "Implementando testes automatizados e automação de build.", "Pedindo para o cliente testar o código primeiro."], "t": "per" }, { "q": "O que significa o A do CALMS?", "o": ["Avaliação", "Automação", "Arquitetura", "Agilidade"], "t": "mc" }, { "q": "O que a ideia de fail fast defende?", "o": ["Lançar sem testar para ganhar tempo", "Falhar de propósito em produção", "Descobrir o erro o quanto antes", "Evitar qualquer mudança no código"], "t": "mc" }, { "q": "Um time teve incidentes de 1 h, 2 h e 3 h. Qual é o MTTR?", "o": ["1 h", "2 h", "3 h", "6 h"], "t": "mc" }, { "q": "Em 10 deploys, 3 falharam. Qual é o change fail rate?", "o": ["3%", "7%", "13%", "30%"], "t": "mc" }, { "q": "O que a integração contínua faz?", "o": ["Integra o código várias vezes ao dia, validando na esteira", "Junta o código uma vez por mês, à mão", "Substitui os desenvolvedores", "Elimina a necessidade de testes"], "t": "mc" }, { "q": "Uma equipe tem CFR de 40%. Diga qual ação você recomendaria e por quê.", "o": null, "t": "ab" }, { "q": "Explique por que no DevOps o sistema é responsabilidade do time todo. O que muda em relação ao muro da confusão?", "o": null, "t": "ab" }] }, { "n": 22, "tema": "Infraestrutura como Código com Terraform", "frase": "Infraestrutura em arquivo de texto", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Infraestrutura como Código com Terraform<\/p><p class=\"frase\">Infraestrutura em arquivo de texto<\/p><\/div><h2>① <b>IaC, providers e o ciclo:<\/b> <i>Descrever em vez de clicar<\/i><\/h2><p><b>Na mão:<\/b> Criar servidores clicando no painel da nuvem parece rápido, mas cada clique depende da memória de alguém. Etapas são esquecidas, a ordem muda e, meses depois, ninguém sabe repetir. Cada servidor acaba um pouco diferente do outro, e \"funciona no servidor A, mas não no B\" vira rotina.<\/p><p><b>IaC (Infraestrutura como Código):<\/b> Em vez de clicar, descrevemos servidores, redes e regras em arquivos de texto. O arquivo é um passo a passo que o computador executa quantas vezes for preciso, sempre igual. Por isso se diz que é documentação executável: ele explica como a infraestrutura é e, ao mesmo tempo, cria essa infraestrutura.<\/p><p class=\"ex\"><b>Analogia:<\/b> receita de bolo escrita x \"faço de cabeça\". Com a receita, qualquer pessoa repete o mesmo bolo. E, como é texto, o arquivo vai para o Git: dá para ver quem mudou o quê e voltar atrás.<\/p><p><b>Terraform:<\/b> Ferramenta que lê esses arquivos (escritos em HCL, uma linguagem feita para ser fácil de ler) e conversa com a nuvem para criar, alterar ou apagar recursos até a realidade ficar igual ao que está escrito.<\/p><p><b>provider:<\/b> Responde ONDE. É o \"tradutor\" entre o Terraform e uma plataforma específica: AWS, Azure ou Google Cloud. Sem provider, o Terraform não sabe com quem conversar.<\/p><p><b>resource:<\/b> Responde O QUÊ. Cada resource é uma peça da infraestrutura e tem três partes: o tipo (ex.: aws_vpc, uma rede privada), um nome dado por nós (para usar depois) e a configuração (ex.: a faixa de endereços da rede).<\/p><p class=\"ex\"><b>Lendo o exemplo:<\/b> o provider diz \"use a AWS, na região us-east-1\"; o resource pede \"uma rede VPC chamada principal, com a faixa 10.0.0.0/16\".<\/p><pre style=\"height:128px\"><code>provider \"aws\" { region = \"us-east-1\" }\n\nresource \"aws_vpc\" \"principal\" {\n  cidr_block = \"10.0.0.0/16\"\n}<\/code><\/pre><p><b>Ciclo init → plan → apply:<\/b> <code>init<\/code> prepara a pasta e baixa o provider (feito uma vez, no início). <code>plan<\/code> compara o arquivo com o que já existe na nuvem e mostra o que será criado, alterado ou destruído, sem mexer em nada ainda. <code>apply<\/code> executa as mudanças de verdade.<\/p><p class=\"ex\"><b>Analogia:<\/b> o plan é conferir o carrinho antes de pagar. Se aparecer \"1 recurso será destruído\" e você não esperava isso, é ali que você para.<\/p><h2>② <b>Módulos e workspaces:<\/b> <i>Um código, vários ambientes<\/i><\/h2><p><b>Problema:<\/b> Um time tem dois arquivos quase idênticos: um para dev (desenvolvimento, onde se testa) e outro para prod (produção, que o cliente usa). Toda mudança precisa ser feita duas vezes. Um dia alguém esquece de atualizar um deles e os ambientes ficam diferentes, justamente o que a IaC queria evitar.<\/p><p><b>Módulo:<\/b> Uma peça reutilizável: um grupo de recursos que andam juntos (ex.: a rede, com VPC e sub-redes) guardado numa pasta. O que muda de um uso para outro vira variável (ex.: a faixa de endereços). Em vez de copiar o código, você \"chama\" o módulo e passa os valores.<\/p><p class=\"ex\"><b>Analogia:<\/b> é como uma função em programação: escreve uma vez e usa várias vezes, com parâmetros diferentes.<\/p><p><b>Workspace:<\/b> O mesmo código com estados separados. O estado é o registro que o Terraform guarda de tudo o que já criou. Com um workspace \"dev\" e outro \"prod\", o mesmo arquivo cria dois ambientes independentes, e o código pode se adaptar a cada um.<\/p><p class=\"ex\"><b>Na prática:<\/b> em prod, servidor maior (t3.small); em dev, servidor menor e mais barato (t2.micro). Precisa de um ambiente de homologação? Cria-se um novo workspace, sem copiar nada.<\/p><p><b>Resumo:<\/b> Módulo organiza e
