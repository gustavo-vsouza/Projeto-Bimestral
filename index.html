Testes:<\/b> Regressão, integração e compatibilidade.<\/p><p><b>Segurança:<\/b> Patch só da falha + testes. Falha crítica → atualização obrigatória. Avisar sem expor detalhes.<\/p><h2>④ <b>Comunicação:<\/b> <i>Contar o que mudou<\/i><\/h2><p><b>Canais:<\/b> Notificação no app, e-mail, redes, release notes e FAQ.<\/p><p><b>Reduzir resistência:<\/b> Tom amigável, capturas das novidades, tutorial no app e período para alternar versões.<\/p><p><b>Medir:<\/b> Pesquisa no app, avaliações nas lojas e métricas de adoção.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Versão nova deu problema? Primeiro conter (git revert ou feature flag), depois corrigir com calma.<\/p>", "qs": [{ "q": "Qual é o principal objetivo de uma atualização incremental em um aplicativo móvel?", "o": ["Substituir completamente a versão anterior do aplicativo.", "Implementar melhorias e correções sem grandes mudanças.", "Redesenhar a interface do usuário de forma radical.", "Alterar todo o código do aplicativo de uma só vez."], "t": "per" }, { "q": "Qual das ferramentas abaixo é ideal para ativar ou desativar funcionalidades sem precisar lançar uma nova versão do app?", "o": ["Firebase Remote Config", "Google Play Console", "GitHub", "Android Studio"], "t": "per" }, { "q": "O que são Feature Flags em apps?", "o": ["Etiquetas visuais para organizar o código.", "Mecanismos para ativar/desativar funções.", "Alertas automáticos para detectar falhas.", "Regras da App Store sobre apps inseguros."], "t": "per" }, { "q": "Na versão 2.3.1, qual número muda ao lançar uma função nova?", "o": ["O 2 (MAJOR)", "O 3 (MINOR)", "O 1 (PATCH)", "Nenhum deles"], "t": "mc" }, { "q": "Qual seria a próxima versão de 2.3.1 após uma correção de bug?", "o": ["2.3.2", "2.4.0", "3.0.0", "2.3.1.1"], "t": "mc" }, { "q": "O que é canary release?", "o": ["Publicar para todos ao mesmo tempo", "Apagar a versão anterior", "Liberar primeiro para poucos usuários", "Trocar o ícone do app"], "t": "mc" }, { "q": "O que é um changelog?", "o": ["O histórico de senhas", "Um gráfico de cronograma", "Uma política de privacidade", "A lista do que mudou em cada versão"], "t": "mc" }, { "q": "Como comunicar uma atualização de segurança?", "o": ["Publicar todos os detalhes da falha", "Não avisar ninguém", "Avisar os usuários sem expor detalhes da falha", "Mudar o nome do app"], "t": "mc" }, { "q": "Escreva as release notes de uma atualização com uma correção e uma função nova, em tom amigável. Indique o número da versão.", "o": null, "t": "ab" }, { "q": "Explique por que todo mundo editar direto no main é um problema e como as branches ajudam.", "o": null, "t": "ab" }] }, { "n": 28, "tema": "Análise de desempenho e melhoria contínua", "frase": "Dados guiam a evolução", "html": "<div data-flow><h1>Semana 28<\/h1><p class=\"tema\">Análise de desempenho e melhoria contínua<\/p><p class=\"frase\">Dados guiam a evolução<\/p><\/div><h2>① <b>Análise de desempenho:<\/b> <i>Entender como o app é usado<\/i><\/h2><p><b>Por quê:<\/b> Mostra o que tem melhor ou pior aceitação e onde há gargalos, para tomar boas decisões.<\/p><p><b>Firebase Analytics:<\/b> Rastreia eventos personalizados, funis e segmentações.<\/p><p><b>Google Play Console:<\/b> Desempenho, taxa de erros, ANRs e feedbacks.<\/p><p><b>App Store Connect:<\/b> Uso, crashes e retenção em iOS.<\/p><p><b>Mixpanel:<\/b> Eventos, funis e dashboards.<\/p><p><b>Instabug:<\/b> Coleta feedbacks e rastreia bugs.<\/p><p><b>Retenção:<\/b> Percentual de usuários recorrentes (D+1, D+7).<\/p><p><b>Crises:<\/b> Exigem rapidez, objetividade e coordenação entre técnica e comunicação. Planos de contingência reduzem danos.<\/p><h2>② <b>Suporte ao usuário:<\/b> <i>Canal direto com o cliente<\/i><\/h2><p><b>Help Desk:<\/b> Gestão de tickets. Zendesk, Freshdesk.<\/p><p><b>Live Chat:<\/b> Comunicação instantânea no app. Intercom, Tawk.to.<\/p><p><b>Chatbot com IA:<\/b> Automatiza dúvidas frequentes.<\/p><p><b>Base de conhecimento:<\/b> Autoatendimento com tutoriais e FAQs.<\/p><p><b>Gatilhos:<\/b> Ticket com a palavra \"emergência\" vai para o topo da fila.<\/p><p><b>SLA:<\/b> Acordo como \"responder em até 1 h em horário comercial\".<\/p><p><b>Métricas:<\/b> Tempo de resposta, satisfação e reincidência de chamadas.<\/p><h2>③ <b>Ciclo de vida do app:<\/b> <i>Evoluir ou descontinuar<\/i><\/h2><p><b>Decisão:<\/b> O ciclo de vida influencia a evolução e a descontinuação de funcionalidades.<\/p><p><b>Planejar:<\/b> Atualizações com foco em dados e objetivos estratégicos.<\/p><p><b>Comunicar:<\/b> Mudanças de forma empática e objetiva para manter a confiança.<\/p><h2>④ <b>Melhoria contínua:<\/b> <i>Feedback vira evolução<\/i><\/h2><p><b>Ciclo:<\/b> Coletar feedback de várias fontes → priorizar por valor ao usuário → agir → medir.<\/p><p><b>Sucesso:<\/b> Avaliar a melhoria com dados concretos e indicadores de performance.<\/p><pre style=\"height:96px\"><code>Dado: 37% dos usuários abandonam o app na tela de login\nAção: investigar lentidão e simplificar o login\nMedida: comparar o abandono antes e depois<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Crises também são oportunidades de melhoria: se analisadas corretamente, viram processos melhores para a próxima vez.<\/p>", "qs": [{ "q": "Qual ferramenta permite rastrear eventos personalizados?", "o": ["Google Play Console", "Firebase Analytics", "App Store Connect", "Instabug"], "t": "per" }, { "q": "Por que analisar o desempenho de um app é importante?", "o": ["Para reduzir o uso de memória do celular.", "Para melhorar o visual do aplicativo.", "Para entender o uso e tomar boas decisões.", "Para evitar que o app seja desinstalado."], "t": "per" }, { "q": "O que o Instabug permite fazer?", "o": ["Criar relatórios de retenção e funis.", "Fazer segmentações por tipo de usuário.", "Coletar feedbacks e rastrear bugs.", "Analisar eventos em dispositivos iOS."], "t": "per" }, { "q": "O que um funil de uso mostra?", "o": ["Em qual etapa os usuários abandonam o app", "A cor preferida dos usuários", "O tamanho do arquivo do app", "O preço da conta de desenvolvedor"], "t": "mc" }, { "q": "Qual tipo de ferramenta organiza tickets de suporte?", "o": ["Editor de imagens", "Help Desk", "Compilador", "Banco vetorial"], "t": "mc" }, { "q": "O que é um SLA no suporte?", "o": ["Um tipo de chatbot", "Uma linguagem de programação", "Um acordo de nível de serviço, como responder em até 1 h", "Uma tela de login"], "t": "mc" }, { "q": "O que o Google Play Console oferece para análise?", "o": ["Edição de vídeos promocionais", "Criação de código automático", "Pagamento dos influenciadores", "Dados de desempenho, taxa de erros e feedbacks"], "t": "mc" }, { "q": "Por que comunicar a descontinuação de uma função?", "o": ["Para deixar o app mais lento", "Para manter a confiança dos usuários", "Porque a loja pede um vídeo novo", "Para aumentar o tamanho do app"], "t": "mc" }, { "q": "No caso ConsultaJá, os pedidos de ajuda aumentaram e as respostas estão demorando. Proponha duas melhorias no suporte.", "o": null, "t": "ab" }, { "q": "Descreva um ciclo de melhoria para um app: qual dado analisaria, que ação faria e como mediria o sucesso.", "o": null, "t": "ab" }] }] }];
        const L = 'ABCD'; const app = document.getElementById('app');
        const S = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { } } };
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const key = (m, n) => 'resp-' + m.id + '-' + n;
        const countDone = (m, w) => { const r = S.get(key(m, w.n), {}); return w.qs.filter((q, i) => r[i] !== undefined && String(r[i]).trim() !== '').length };
        function route() {
            const h = location.hash.replace('#', ''); const [mid, sn, tab] = h.split('-');
            const m = DATA.find(x => x.id === mid);
            if (!m) return home();
            const w = m.semanas.find(x => String(x.n) === sn);
            if (!w) return pasta(m);
            semana(m, w, tab === 'atividade' ? 'atividade' : 'lousa');
            window.scrollTo(0, 0);
        }
        function home() {
            app.innerHTML = `<header class="top"><h1>Atividades do Técnico em Desenvolvimento de Sistemas</h1><p>Escolha a pasta da sua matéria. Dentro dela estão as semanas, com a lousa e a atividade.</p></header>
 <nav class="folders" aria-label="Matérias">${DATA.map(m => `<a class="folder" style="--c:${m.cor}" data-sigla="${m.sigla}" href="#${m.id}"><strong>${esc(m.nome)}</strong><span>${m.semanas.length} semanas: ${m.semanas[0].n} a ${m.semanas[m.semanas.length - 1].n}</span></a>`).join('')}</nav>`;
        }
        function pasta(m) {
            app.innerHTML = `<nav class="crumbs"><a href="#">Pastas</a><span>/</span><span>${m.sigla}</span></nav><header class="top"><h1>${esc(m.nome)}</h1></header>
 <nav class="weeks" aria-label="Semanas" style="--c:${m.cor}">${m.semanas.map(w => { const d = countDone(m, w); return `<a class="week" href="#${m.id}-${w.n}"><b class="n">Sem. ${w.n}</b><span class="t"><strong>${esc(w.tema)}</strong><small>${esc(w.frase)}</small></span><span class="chip ${d === w.qs.length ? 'done' : ''}">${d}/${w.qs.length}</span></a>` }).join('')}</nav>`;
            window.scrollTo(0, 0);
        }
        function semana(m, w, tab) {
            app.innerHTML = `<nav class="crumbs"><a href="#">Pastas</a><span>/</span><a href="#${m.id}">${m.sigla}</a><span>/</span><span>Semana ${w.n}</span></nav>
 <div class="tabs" role="tablist"><button id="t-lousa" role="tab" aria-selected="${tab === 'lousa'}">Lousa</button><button id="t-ativ" role="tab" aria-selected="${tab === 'atividade'}">Atividade</button></div><div id="view"></div>`;
            document.getElementById('t-lousa').onclick = () => { location.hash = m.id + '-' + w.n };
            document.getElementById('t-ativ').onclick = () => { location.hash = m.id + '-' + w.n + '-atividade' };
            const v = document.getElementById('view');
            if (tab === 'lousa') { v.innerHTML = `<article class="paper">${w.html}</article>`; return }
            atividade(m, w, v);
        }
        function atividade(m, w, v) {
            const k = key(m, w.n); const r = S.get(k, {}); const who = S.get('aluno', { nome: '', turma: '' });
            const qHtml = (q, i) => q.t === 'ab'
                ? `<fieldset class="q" id="q${i}"><legend></legend><label class="f" for="a${i}"><span class="enun"><span class="num">${i + 1}.</span>${esc(q.q)}</span></label><textarea id="a${i}" data-i="${i}">${esc(r[i] || '')}</textarea></fieldset>`
                : `<fieldset class="q" id="q${i}"><legend></legend><div class="enun"><span class="num">${i + 1}.</span>${esc(q.q)}</div>${q.o.map((o, j) => `<label class="opt"><input type="radio" name="r${i}" value="${j}" data-i="${i}" ${String(r[i]) === String(j) ? 'checked' : ''}><b>${L[j]})</b><span>${esc(o)}</span></label>`).join('')}</fieldset>`;
            const sec = (t, note, a, b) => `<h3 class="sec">${t}</h3>${note ? `<p class="sec-note">${note}</p>` : ''}${w.qs.slice(a, b).map((q, i) => qHtml(q, i + a)).join('')}`;
            v.innerHTML = `<form id="form" class="wrap" novalidate style="max-width:none">
 <div class="card who"><label class="f" for="nome">Seu nome completo<input type="text" id="nome" autocomplete="name" value="${esc(who.nome)}"></label><label class="f" for="turma">Turma<input type="text" id="turma" placeholder="Ex.: 2º A" value="${esc(who.turma)}"></label></div>
 ${sec('Pause e Responda', 'Perguntas das aulas da semana.', 0, 3)}${sec('Questões da semana', '', 3, 8)}${sec('Com suas palavras', 'Escreva sua resposta. Não vale copiar da lousa.', 8, 10)}
 <div id="out"></div>
 <div class="bar"><span id="prog"></span><button type="button" class="copy" id="copy">Copiar Atividade</button></div></form>`;
            const prog = () => { document.getElementById('prog').textContent = countDone(m, w) + ' de ' + w.qs.length + ' respondidas' }; prog();
            const form = document.getElementById('form');
            const save = e => { const t = e.target; if (t.dataset.i === undefined) return; const c = S.get(k, {}); c[t.dataset.i] = t.value; mem[t.dataset.i] = t.value; S.set(k, c); document.getElementById('q' + t.dataset.i).classList.remove('miss'); prog() };
            const mem = Object.assign({}, r);
            form.addEventListener('change', save); form.addEventListener('input', save);
            ['nome', 'turma'].forEach(id => document.getElementById(id).addEventListener('input', () => S.set('aluno', { nome: document.getElementById('nome').value, turma: document.getElementById('turma').value })));
            document.getElementById('copy').onclick = () => {
                const out = document.getElementById('out'); const nome = document.getElementById('nome').value.trim(), turma = document.getElementById('turma').value.trim();
                const miss = w.qs.map((q, i) => i).filter(i => { const x = mem[i]; return x === undefined || String(x).trim() === '' });
                document.querySelectorAll('.miss').forEach(e => e.classList.remove('miss')); miss.forEach(i => document.getElementById('q' + i).classList.add('miss'));
                if (!nome || !turma || miss.length) {
                    const faltas = []; if (!nome) faltas.push('seu nome'); if (!turma) faltas.push('sua turma'); if (miss.length) faltas.push((miss.length > 1 ? 'as questões ' : 'a questão ') + miss.map(i => i + 1).join(', '));
                    out.innerHTML = `<div class="msg bad" role="alert"><strong>Ainda falta preencher</strong>${esc(faltas.join(', '))}.</div>`;
                    out.scrollIntoView({ block: 'center' }); return
                }
                const txt = [`ATIVIDADE SEMANAL - ${m.nome.toUpperCase()}`, `Semana ${w.n}: ${w.tema}`, `Aluno(a): ${nome}`, `Turma: ${turma}`, `Data: ${new Date().toLocaleDateString('pt-BR')}`, ''];
                w.qs.forEach((q, i) => { txt.push(`${i + 1}. ${q.q}`); if (q.t === 'ab') txt.push('Resposta: ' + String(mem[i]).trim()); else { const j = +mem[i]; txt.push(`Resposta: ${L[j]}) ${q.o[j]}`) } txt.push('') });
                const text = txt.join('\n');
                const done = () => { out.innerHTML = `<div class="msg ok" role="status"><strong>Atividade copiada!</strong>Agora cole e envie na plataforma Educação Profissional, como registro de aula da semana feita.</div>`; out.scrollIntoView({ block: 'center' }) };
                const fail = () => { out.innerHTML = `<div class="msg bad" role="alert"><strong>Não consegui copiar sozinho</strong>Selecione o texto abaixo, copie e envie na plataforma Educação Profissional, como registro de aula da semana feita.</div><textarea id="fallback" readonly aria-label="Texto da atividade"></textarea>`; const f = document.getElementById('fallback'); f.value = text; f.focus(); f.select() };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail); else fail();
            };
        }
        window.addEventListener('hashchange', route); route();
    </script>

</body>
