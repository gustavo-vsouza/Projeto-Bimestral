    <title>Atividades do Técnico DS</title>
    <meta name="claude:viewport-fit-sides" content="cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;600&family=Kalam:wght@400;700&display=swap">
    <style>
        /* Layout: mesa de estudo com pastas de arquivo; dentro de cada pasta, semanas; a lousa é uma folha de caderno pautada */
        :root {
            --bg: #e6eaf2;
            --surface: #f7f8fb;
            --line: #c6cedd;
            --fg: #1a2233;
            --soft: #566078;
            --ink: #1c3390;
            --red: #c8262b;
            --ok: #0b7a5e;
            --warn: #fff3d6;
            --warnfg: #6b4a00;
            --okbg: #dcf3ea;
            --okfg: #07573f;
            --tab: #fff;
            --hand: 'Kalam', 'Comic Sans MS', cursive;
            --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #141a28;
                --surface: #1d2536;
                --line: #35405a;
                --fg: #e8ecf5;
                --soft: #a3aec6;
                --ink: #a9bcff;
                --red: #ff8d8a;
                --ok: #5fd3ae;
                --warn: #3d3113;
                --warnfg: #ffdf97;
                --okbg: #12382d;
                --okfg: #a8ecd3;
                --tab: #262f44;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #141a28;
            --surface: #1d2536;
            --line: #35405a;
            --fg: #e8ecf5;
            --soft: #a3aec6;
            --ink: #a9bcff;
            --red: #ff8d8a;
            --ok: #5fd3ae;
            --warn: #3d3113;
            --warnfg: #ffdf97;
            --okbg: #12382d;
            --okfg: #a8ecd3;
            --tab: #262f44;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font: 17px/1.55 var(--body);
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            padding-block: 24px 64px
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        .top {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .top h1 {
            font: 700 34px/1.15 var(--hand);
            color: var(--ink);
            margin: 0;
            text-wrap: balance
        }

        .top p {
            margin: 0;
            color: var(--soft)
        }

        .crumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            color: var(--soft);
            font-size: 15px
        }

        .crumbs a {
            color: var(--ink);
            text-underline-offset: 3px
        }

        .folders {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 26px 18px;
            padding-top: 14px
        }

        .folder {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 150px;
            padding: 18px 16px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 5px solid var(--c);
            border-radius: 0 8px 8px 8px;
            color: var(--fg);
            text-decoration: none
        }

        .folder::before {
            content: attr(data-sigla);
            position: absolute;
            left: -1px;
            top: -29px;
            height: 25px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            background: var(--c);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: .06em;
            border-radius: 7px 7px 0 0
        }

        .folder:hover,
        .folder:focus-visible {
            transform: translateY(-2px)
        }

        .folder strong {
            font-size: 19px;
            line-height: 1.25
        }

        .folder span {
            color: var(--soft);
            font-size: 15px;
            margin-top: auto
        }

        .weeks {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .week {
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 5px solid var(--c);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--fg);
            text-decoration: none
        }

        .week:hover,
        .week:focus-visible {
            border-color: var(--c)
        }

        .week b.n {
            font: 700 23px/1 var(--hand);
            color: var(--ink)
        }

        .week .t {
            min-width: 0
        }

        .week .t strong {
            display: block;
            line-height: 1.3
        }

        .week .t small {
            color: var(--soft);
            font-size: 15px
        }

        .chip {
            font-size: 14px;
            padding: 2px 9px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--soft);
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        .chip.done {
            background: var(--okbg);
            color: var(--okfg);
            border-color: transparent
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--line)
        }

        .tabs button {
            font: 700 16px var(--body);
            padding: 9px 18px;
            background: transparent;
            color: var(--soft);
            border: 1px solid transparent;
            border-bottom: 0;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            margin-bottom: -2px
        }

        .tabs button[aria-selected="true"] {
            background: var(--tab);
            color: var(--ink);
            border-color: var(--line);
            border-bottom: 2px solid var(--tab)
        }

        .paper {
            border-radius: 2px;
            box-shadow: 0 1px 3px rgba(20, 30, 60, .22)
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px
        }

        .who {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: 12px
        }

        label.f {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-weight: 700;
            font-size: 15px;
            min-width: 0
        }

        input[type=text],
        textarea {
            font: 16px/1.5 var(--body);
            color: var(--fg);
            background: var(--tab);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 9px 11px;
            width: 100%
        }

        textarea {
            min-height: 120px;
            resize: vertical
        }

        h3.sec {
            font: 700 22px/1.2 var(--hand);
            color: var(--red);
            margin: 8px 0 0
        }

        .sec-note {
            margin: -14px 0 0;
            color: var(--soft);
            font-size: 15px
        }

        fieldset.q {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 8px;
            padding: 14px 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0
        }

        fieldset.q.miss {
            border-color: var(--red);
            box-shadow: 0 0 0 1px var(--red)
        }

        .q legend {
            display: contents
        }

        .q .num {
            font-weight: 700;
            color: var(--ink);
            margin-right: 4px
        }

        .q .enun {
            font-weight: 700;
            overflow-wrap: anywhere
        }

        .opt {
            display: grid;
            grid-template-columns: 22px 24px minmax(0, 1fr);
            gap: 4px;
            align-items: start;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            overflow-wrap: anywhere
        }

        .opt:hover {
            background: var(--bg)
        }

        .opt input {
            margin: 4px 0 0;
            width: 17px;
            height: 17px;
            accent-color: var(--ink)
        }

        .opt b {
            color: var(--soft)
        }

        .bar {
            position: sticky;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 4px 14px rgba(20, 30, 60, .18)
        }

        .bar span {
            font-variant-numeric: tabular-nums;
            color: var(--soft)
        }

        button.copy {
            font: 700 17px var(--body);
            background: var(--ink);
            color: var(--surface);
            border: 0;
            border-radius: 8px;
            padding: 11px 22px;
            cursor: pointer
        }

        .msg {
            border-radius: 8px;
            padding: 12px 14px
        }

        .msg.ok {
            background: var(--okbg);
            color: var(--okfg)
        }

        .msg.bad {
            background: var(--warn);
            color: var(--warnfg)
        }

        .msg strong {
            display: block;
            font-size: 18px
        }

        textarea#fallback {
            min-height: 220px
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 2px
        }

        @media(max-width:560px) {
            .who {
                grid-template-columns: 1fr
            }

            .week {
                grid-template-columns: 64px minmax(0, 1fr)
            }

            .week .chip {
                grid-column: 2;
                justify-self: start
            }

            .top h1 {
                font-size: 29px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }

        .paper {
            --rule: #c9d6ea;
            --red: #c8262b;
            --ink: #1c3390;
            --margin: #efa3a3;
            --sheet: #fdfdfb;
            --codebg: #f3f5fa;
            --codefg: #1d2740;
            position: relative;
            background-color: var(--sheet);
            color: var(--ink);
            font-family: 'Kalam', 'Comic Sans MS', cursive;
            font-size: 19px;
            line-height: 32px;
            padding: 48px 28px 32px 84px;
            background-image: linear-gradient(90deg, transparent 62px, var(--margin) 62px, var(--margin) 64px, transparent 64px), repeating-linear-gradient(180deg, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
            background-position: 0 0, 0 9px
        }

        .paper h1 {
            font: 700 40px/64px 'Kalam', 'Comic Sans MS', cursive;
            margin: 0;
            color: var(--ink);
            font-style: italic
        }

        .paper .tema {
            margin: 0;
            color: var(--ink);
            font-weight: 700
        }

        .paper .frase {
            margin: 0;
            color: var(--red)
        }

        .paper h2 {
            font: inherit;
            margin: 32px 0 0;
            color: var(--red)
        }

        .paper h2 b {
            font-size: 22px
        }

        .paper h2 i {
            font-style: normal
        }

        .paper p {
            margin: 0
        }

        .paper p b {
            color: var(--red)
        }

        .paper code {
            font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
            font-size: .76em;
            color: #0d6b52;
            font-weight: 600;
            overflow-wrap: anywhere
        }

        .paper pre {
            margin: 0;
            box-sizing: border-box;
            background: var(--codebg);
            color: var(--codefg);
            font: 500 12.5px/24px 'JetBrains Mono', ui-monospace, Consolas, monospace;
            border-left: 3px solid var(--ink);
            padding: 0 12px;
            overflow-x: auto;
            display: flex;
            align-items: center
        }

        .paper pre code {
            color: inherit;
            font: inherit;
            overflow-wrap: normal;
            white-space: pre
        }

        .paper .dica {
            margin-top: 32px
        }

        .paper .dica b {
            color: var(--red)
        }

        @media(max-width:560px) {
            .paper {
                font-size: 17px;
                padding: 32px 12px 32px 40px;
                background-image: linear-gradient(90deg, transparent 28px, var(--margin) 28px, var(--margin) 30px, transparent 30px), repeating-linear-gradient(180deg, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
                background-position: 0 0, 0 25px
            }

            .paper h1 {
                font-size: 32px
            }
        }
    </style>
    <div class="wrap" id="app"></div>
    <script>
        const DATA = [{ "id": "ia", "sigla": "IA", "nome": "Inteligência Artificial", "cor": "#3b5bdb", "semanas": [{ "n": 21, "tema": "Ferramentas e orquestração", "frase": "Fazer a IA agir, não só responder", "html": "<div data-flow><h1>Semana 21<\/h1><p class=\"tema\">Ferramentas e orquestração<\/p><p class=\"frase\">Fazer a IA agir, não só responder<\/p><\/div><h2>① <b>Function calling:<\/b> <i>O modelo pede, o sistema executa<\/i><\/h2><p><b>Agente:<\/b> Sistema com LLM que decide ações e usa ferramentas para cumprir uma tarefa.<\/p><p><b>Function calling:<\/b> O modelo escolhe a função e gera os parâmetros em JSON =&gt; o sistema executa e devolve o resultado. O modelo não executa nada sozinho.<\/p><p><b>Fluxo:<\/b> Cadastro das funções → análise da pergunta → geração da chamada → execução e resposta.<\/p><p><b>Definição de função:<\/b> Nome, descrição e parâmetros (tipo e obrigatoriedade). Ideia-chave: bem descrita = chamada precisa.<\/p><pre style=\"height:96px\"><code>Pergunta: \"O pedido #4721 já foi despachado?\"\n{\"funcao\": \"rastrear_pedido\", \"parametros\": {\"pedido\": \"4721\"}}\nO sistema consulta a API, devolve o status e o modelo escreve a resposta.<\/code><\/pre><h2>② <b>Frameworks de orquestração:<\/b> <i>Peças que trabalham juntas<\/i><\/h2><p><b>Framework:<\/b> Organiza agentes, ferramentas, memória e execução. (Ex: LangChain, AutoGen)<\/p><p><b>Agente:<\/b> Decide o que fazer.<\/p><p><b>Ferramentas:<\/b> Funções que o agente pode chamar.<\/p><p><b>Memória:<\/b> Curto prazo = conversa atual. Longo prazo = dados do usuário entre sessões.<\/p><p><b>Executor:<\/b> Roda o ciclo pensa → age → observa → decide.<\/p><p><b>Significado x palavra-chave:<\/b> Regra por palavra falha com sinônimos (\"fatura\" no lugar de \"nota fiscal\"). O LLM decide pelo significado.<\/p><h2>③ <b>Sistemas multiagentes:<\/b> <i>Uma equipe em vez de um faz-tudo<\/i><\/h2><p><b>Monolítico x multiagente:<\/b> Um agente faz tudo x vários especialistas, cada um com papel, ferramentas e contexto.<\/p><p><b>Orquestrador (manager):<\/b> Decompõe a tarefa, delega aos agentes (executores), passa o contexto e junta os resultados.<\/p><p><b>Handoff:<\/b> Cada agente recebe uma entrada, produz algo e entrega ao próximo (requisitos → código → testes → deploy).<\/p><p><b>Vantagens:<\/b> Quem produz não revisa o próprio trabalho, menos contexto por agente, etapas em paralelo e rastreabilidade do erro.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Se a informação está fora da conversa (dados de hoje, de uma empresa, de um usuário), o modelo não sabe: ele precisa de uma ferramenta. Sem ela, o risco é inventar.<\/p>", "qs": [{ "q": "Um agente recebe o texto: “Qual a previsão do tempo para São Paulo amanhã?” O modelo identifica a necessidade de uma API externa. Qual é o próximo passo correto no fluxo de function calling?", "o": ["Gerar uma resposta aproximada com base no treinamento.", "Selecionar a função e gerar parâmetros estruturados.", "Retreinar o modelo com dados meteorológicos atuais.", "Solicitar ao usuário que consulte a API diretamente."], "t": "per" }, { "q": "Em um framework de orquestração, um agente recebe a tarefa “Pesquise sobre energia solar e escreva um resumo”. Qual sequência descreve corretamente seu fluxo de execução?", "o": ["LLM → embedding → vector store → resposta", "Usuário → fine-tuning → modelo → saída", "API → memória → retriever → modelo base", "Agente → ferramentas → LLM → resposta final"], "t": "per" }, { "q": "Em um sistema multiagente, o orquestrador recebe a tarefa “criar e revisar um relatório financeiro trimestral“. Qual é sua principal responsabilidade nesse fluxo?", "o": ["Substituir o LLM base por um modelo mais eficiente.", "Armazenar o histórico de todas as conversas geradas.", "Executar diretamente todas as etapas do relatório.", "Decompor a tarefa e delegar a agentes especializados."], "t": "per" }, { "q": "No function calling, quem de fato executa a função?", "o": ["O próprio modelo de linguagem", "O sistema (programa) que recebeu a chamada", "O usuário que fez a pergunta", "O banco vetorial do projeto"], "t": "mc" }, { "q": "O que o modelo gera ao decidir usar uma função?", "o": ["Um novo arquivo de treinamento", "Um relatório em PDF", "Uma instrução estruturada, geralmente em JSON", "Uma cópia do banco de dados"], "t": "mc" }, { "q": "Qual item NÃO faz parte de uma boa definição de função?", "o": ["Nome da função", "Descrição do que ela faz", "Parâmetros, com tipo e obrigatoriedade", "A cor da interface do chat"], "t": "mc" }, { "q": "Por que um sistema só com palavras-chave falha quando o usuário troca \"nota fiscal\" por \"fatura\"?", "o": ["Porque ele compara o termo, não o significado", "Porque \"fatura\" é uma palavra proibida", "Porque a memória de longo prazo apagou o termo", "Porque o JSON não aceita essa palavra"], "t": "mc" }, { "q": "No handoff entre agentes, o que acontece?", "o": ["Todos os agentes respondem ao usuário ao mesmo tempo", "O orquestrador apaga o trabalho do agente anterior", "Um agente entrega o que produziu para o próximo continuar", "O modelo base é trocado por outro"], "t": "mc" }, { "q": "Escolha uma tarefa do dia a dia que um assistente não consegue resolver sozinho (ex.: saber o horário do ônibus). Escreva o nome da função que ele deveria chamar e quais parâmetros ela receberia.", "o": null, "t": "ab" }, { "q": "Explique com suas palavras por que dividir uma tarefa entre agentes especializados pode ser melhor do que usar um único agente que faz tudo.", "o": null, "t": "ab" }] }, { "n": 22, "tema": "Projeto prático: concepção e arquitetura", "frase": "Pensar antes de programar", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Projeto prático: concepção e arquitetura<\/p><p class=\"frase\">Pensar antes de programar<\/p><\/div><h2>① <b>Do problema aos requisitos:<\/b> <i>Comece pelo problema, não pela tecnologia<\/i><\/h2><p><b>Quando usar IA generativa:<\/b> Boa para linguagem natural, dúvidas variadas, resumos e ideias.<\/p><p><b>Quando não usar:<\/b> Regras fixas e exatas (calcular imposto, validar CPF, somar planilha). Código comum é mais barato e confiável.<\/p><p><b>Problema bem definido:<\/b> Diz quem é o usuário, qual a dificuldade e que resultado se espera. Ex: \"clientes esperam 40 min para rastrear um pedido\".<\/p><p><b>Requisito funcional:<\/b> O que o sistema faz (consultar pedidos, recomendar conteúdo, fazer login).<\/p><p><b>Requisito não funcional:<\/b> Como ele funciona (responder em até 3 s, proteger dados, funcionar 24 h).<\/p><p><b>MVP:<\/b> Primeira versão só com o essencial para validar a ideia. Métricas dizem se deu certo (de 40 min para menos de 1 min).<\/p><h2>② <b>Equipe de agentes:<\/b> <i>Caso: assistente da EstudaMais<\/i><\/h2><p><b>Agente:<\/b> Modelo de linguagem + instruções + ferramentas, agindo em etapas para um objetivo.<\/p><p><b>Orquestrador:<\/b> Identifica a intenção, delega e consolida a resposta final. Coordena, não executa.<\/p><p><b>Dúvidas:<\/b> Responde sobre o conteúdo dos cursos usando RAG. Entrega a resposta com a fonte.<\/p><p><b>Recomendação:<\/b> Usa o banco de progresso e o catálogo para sugerir o próximo conteúdo.<\/p><p><b>Exercícios:<\/b> Gera questões de prática com gabarito.<\/p><p><b>Progresso:<\/b> Informa o desempenho do aluno.<\/p><p><b>Custo de especializar:<\/b> Mais peças, mais tempo e mais custo. Só divida quando fizer sentido.<\/p><h2>③ <b>Arquitetura:<\/b> <i>Como as peças se conectam<\/i><\/h2><p><b>Componentes:<\/b> Interface (chat), orquestrador, agentes, RAG, memória, ferramentas e modelo de linguagem.<\/p><p><b>RAG:<\/b> A pergunta vira vetor, o sistema busca trechos do material e o modelo responde com base neles.<\/p><p><b>RAG ≠ memória:<\/b> RAG traz o conhecimento geral do curso. Memória guarda a conversa (curto prazo) e os dados do aluno (longo prazo).<\/p><p><b>Sem exagero:<\/b> O RAG reduz respostas inventadas, mas não elimina. Base desatualizada gera resposta errada.<\/p><pre style=\"height:128px\"><code>Aluno: \"O que é chave primária?\"\nInterface → Orquestrador (\"é dúvida conceitual\") → Agente de Dúvidas\n→ RAG busca a apostila de BD → Modelo gera a resposta\n→ Orquestrador consolida → Interface mostra ao aluno<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Se não dá para medir, não dá para saber se funcionou. Todo requisito não funcional precisa de um critério verificável (\"até 3 segundos\", e não \"rápido\").<\/p>", "qs": [{ "q": "Em um projeto de IA, a afirmação “O sistema deve responder em até 3 segundos\" é exemplo de qual tipo de requisito?", "o": ["Requisito funcional, pois descreve uma função.", "Requisito não funcional ligado à qualidade.", "Critério de sucesso de negócio do projeto.", "Restrição de escopo da primeira entrega."], "t": "per" }, { "q": "Em um sistema multiagente, um agente recebe a tarefa, divide-a em subtarefas e as distribui aos demais agentes. Qual é o papel desse agente?", "o": ["Agente especialista em uma tarefa única.", "Agente de memória, que guarda o histórico", "Agente de borda, que processa dados locais.", "Agente orquestrador, que coordena os demais."], "t": "per" }, { "q": "No design de uma arquitetura agêntica, qual componente recupera os documentos relevantes de uma base de conhecimento para fundamentar as respostas do modelo?", "o": ["O componente de recuperação do RAG.", "A memória de curto prazo da conversa.", "A ferramenta de chamada de função.", "O orquestrador de fluxo entre os agentes."], "t": "per" }, { "q": "Qual destas tarefas é melhor resolver com código comum, e não com IA generativa?", "o": ["Resumir um texto longo", "Responder dúvidas variadas de alunos", "Validar se um CPF é válido", "Sugerir ideias para um projeto"], "t": "mc" }, { "q": "Qual frase descreve melhor um problema bem definido?", "o": ["A empresa quer usar IA", "Precisamos de um chatbot moderno", "Clientes esperam 40 minutos para rastrear um pedido", "Vamos usar o modelo mais novo do mercado"], "t": "mc" }, { "q": "O que é um MVP?", "o": ["A primeira versão só com o essencial para validar a ideia", "A versão final, com todas as funções prontas", "Um tipo de banco vetorial", "O agente mais importante do sistema"], "t": "mc" }, { "q": "O sistema da EstudaMais precisa lembrar quais dificuldades o aluno teve em sessões anteriores. Qual componente cuida disso?", "o": ["A interface do chat", "A memória de longo prazo", "O RAG do material do curso", "O agente de Exercícios"], "t": "mc" }, { "q": "Qual é um erro comum ao criar requisitos não funcionais?", "o": ["Definir um tempo máximo de resposta", "Colocar um número verificável", "Escrever apenas \"o sistema deve ser rápido\"", "Citar a disponibilidade do sistema"], "t": "mc" }, { "q": "Pense em um problema real da sua escola. Escreva-o em uma frase dizendo quem é o usuário, qual é a dificuldade e qual meta medível você quer alcançar.", "o": null, "t": "ab" }, { "q": "Para esse problema, liste um requisito funcional e um requisito não funcional.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Projeto prático: desenvolvimento I", "frase": "O assistente sai do papel", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Projeto prático: desenvolvimento I<\/p><p class=\"frase\">O assistente sai do papel<\/p><\/div><h2>① <b>Ambiente de desenvolvimento:<\/b> <i>Funcionar em qualquer máquina<\/i><\/h2><p><b>Ambiente virtual:<\/b> Uma \"caixa\" de bibliotecas por projeto. Evita que um projeto quebre o outro.<\/p><p><b>requirements.txt:<\/b> Lista de bibliotecas e versões. Quem chega no projeto instala tudo de uma vez.<\/p><p><b>ModuleNotFoundError:<\/b> Biblioteca não instalada, lista ausente ou ambiente errado.<\/p><p><b>Chave de API:<\/b> É senha. Fica no <code>.env<\/code> (lida com <code>os.getenv<\/code>), e o <code>.env<\/code> vai para o <code>.gitignore<\/code>. Nunca no código, nunca no GitHub.<\/p><p><b>Pastas:<\/b> <code>src/<\/code> código, <code>data/<\/code> documentos, <code>notebooks/<\/code> testes, <code>README.md<\/code> instruções.<\/p><pre style=\"height:64px\"><code>python -m venv .venv\npip install -r requirements.txt<\/code><\/pre><h2>② <b>Agente de Dúvidas v1:<\/b> <i>Regras, ainda sem entender<\/i><\/h2><p><b>Classe do agente:<\/b> Tem o método <code>responder()<\/code>, que usa <code>.lower()<\/code> e <code>if/elif<\/code> para escolher a resposta.<\/p><p><b>Limitação:<\/b> Compara o texto exato. \"o que é python\" (sem ?) ou \"me explica Python\" já falham. O agente não entende, só segue regras.<\/p><h2>③ <b>RAG e memória:<\/b> <i>Buscar e lembrar<\/i><\/h2><p><b>RAG:<\/b> Geração aumentada por recuperação. Antes de responder, o agente busca trechos relevantes numa base de documentos.<\/p><p><b>Busca simulada:<\/b> Na aula, procura o título do documento dentro da pergunta.<\/p><p><b>RAG real:<\/b> Textos viram embeddings num banco vetorial (ex: Chroma) e a busca é por significado.<\/p><p><b>Memória de curto prazo:<\/b> Lista com as perguntas da conversa atual.<\/p><p><b>Persistência:<\/b> Gravar em arquivo (<code>memoria.json<\/code>) faz o histórico sobreviver ao fim da sessão.<\/p><pre style=\"height:96px\"><code>if doc[\"titulo\"].lower() in pergunta:\n    # \"O que é Python?\" encontra o documento \"Python\"\n    # \"estrutura de repetição\" NÃO encontra \"Estruturas de repetição\"<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Memória lembra a conversa. RAG busca nos documentos. São funções diferentes e complementares.<\/p>", "qs": [{ "q": "Em um projeto de IA, qual prática evita que diferentes projetos tenham conflito entre as versões das bibliotecas que utilizam?", "o": ["Instalar todas as bibliotecas globalmente.", "Usar um ambiente virtual por projeto.", "Atualizar o Python a cada projeto novo.", "Manter os códigos em pastas separadas."], "t": "per" }, { "q": "Em um agente programado em Python, qual estrutura foi utilizada para decidir qual resposta retornar ao usuário?", "o": ["A memória da conversa.", "O banco vetorial.", "O histórico do navegador.", "As estruturas condicionais if e elif."], "t": "per" }, { "q": "Em um agente de IA, qual é a diferença essencial entre memória de curto prazo e o componente de RAG?", "o": ["RAG é mais rápido que memória nas consultas.", "Ambos os componentes são equivalentes.", "Memória guarda conversa; RAG busca documentos.", "Memória cria embeddings, mas RAG não."], "t": "per" }, { "q": "Para que serve o arquivo requirements.txt?", "o": ["Guardar as chaves de API do projeto", "Listar as bibliotecas necessárias e suas versões", "Registrar as conversas do agente", "Substituir o ambiente virtual"], "t": "mc" }, { "q": "Onde a chave de API deve ficar em um projeto?", "o": ["Escrita direto no código, para facilitar", "No README.md, para a equipe ver", "No arquivo .env, que vai para o .gitignore", "Em um comentário dentro do src/"], "t": "mc" }, { "q": "Um colega rodou o projeto e apareceu ModuleNotFoundError. Qual é a causa mais provável?", "o": ["O agente não entendeu a pergunta", "A temperatura do modelo está alta", "O RAG não encontrou o documento", "A biblioteca não está instalada no ambiente usado"], "t": "mc" }, { "q": "Por que o Agente de Dúvidas v1 falha com \"me explica Python\"?", "o": ["Porque compara texto com regras fixas, sem entender o significado", "Porque o Python não aceita perguntas", "Porque a chave de API expirou", "Porque o método lower() apaga a pergunta"], "t": "mc" }, { "q": "No RAG real, o que permite buscar por significado?", "o": ["Procurar o título exato do documento", "Usar apenas if e elif", "Embeddings guardados em um banco vetorial", "Aumentar o tamanho do arquivo .env"], "t": "mc" }, { "q": "Por que subir o arquivo .env para o GitHub é um risco? O que poderia acontecer com o projeto?", "o": null, "t": "ab" }, { "q": "Um aluno pergunta ao agente \"e como faço isso?\" logo depois de falar sobre listas. Explique por que a memória de curto prazo é importante nessa situação.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Projeto prático: desenvolvimento II", "frase": "Agentes conectados e código seguro", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Projeto prático: desenvolvimento II<\/p><p class=\"frase\">Agentes conectados e código seguro<\/p><\/div><h2>① <b>Orquestração:<\/b> <i>O maestro do sistema<\/i><\/h2><p><b>Orquestração:<\/b> Coordenar as partes para trabalharem juntas, na ordem certa: quem executa, quando entra e como a informação circula.<\/p><p><b>Lógica de orquestração:<\/b> Distribui tarefas, gerencia o fluxo, trata falhas e junta os resultados. Parecido com microsserviços.<\/p><p><b>Full-stack:<\/b> Interface → back-end → orquestrador → agentes → APIs.<\/p><pre style=\"height:128px\"><code>def orquestrador(texto):\n    entrada = agente_entrada(texto)\n    tipo = agente_analise(entrada)   # CLIMA ou HORA\n    return agente_resposta(tipo)<\/code><\/pre><h2>② <b>Ferramentas externas:<\/b> <i>Dados reais fora da conversa<\/i><\/h2><p><b>Tool:<\/b> Função que consulta uma API, um banco de dados ou executa uma ação.<\/p><p><b>Fluxo:<\/b> Usuário → agente → API externa → agente → resposta final.<\/p><p><b>Quando usar:<\/b> Quando a tarefa exige consultar algo fora da conversa.<\/p><p><b>Erro tratado:<\/b> Se a API devolver erro, o agente responde com uma mensagem clara. Ex: \"CEP não encontrado.\"<\/p><pre style=\"height:160px\"><code>def consultar_cep(cep):\n    url = f\"https://viacep.com.br/ws/{cep}/json/\"\n    return requests.get(url).json()\n\n# agente_endereco(\"01001000\")\n# \"O CEP pertence a Praça da Sé, São Paulo - SP.\"<\/code><\/pre><h2>③ <b>Git para colaborar:<\/b> <i>Mudar sem quebrar a main<\/i><\/h2><p><b>Branch:<\/b> Linha separada para desenvolver a melhoria sem mexer na <code>main<\/code>.<\/p><p><b>Commit:<\/b> Registra cada passo, com mensagem clara.<\/p><p><b>Merge:<\/b> Integra a melhoria na <code>main<\/code> depois de testada.<\/p><pre style=\"height:128px\"><code>git checkout -b ajuste\ngit add .\ngit commit -m \"melhora a comunicação entre agentes\"\ngit checkout main\ngit merge ajuste<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Git não é só salvar arquivo: é o jeito de a equipe mudar o código com segurança. Nada instável vai direto para a main.<\/p>", "qs": [{ "q": "Qual é a principal função da lógica de orquestração em um sistema com vários agentes?", "o": ["Eliminar a necessidade de back-end.", "Coordenar o fluxo entre os agentes.", "Fazer todos os agentes responderem juntos.", "Substituir toda a interface do sistema."], "t": "per" }, { "q": "Em um sistema com agentes, a conexão com uma ferramenta externa faz mais sentido quando?", "o": ["O agente só precisa conversar.", "O sistema quer responder sem dados.", "O agente deve ignorar APIs.", "A tarefa exige consultar algo fora da conversa."], "t": "per" }, { "q": "Quando uma equipe quer corrigir a comunicação entre agentes sem mexer direto na versão principal, o que faz mais sentido?", "o": ["Editar tudo direto na main.", "Apagar o histórico anterior.", "Criar uma branch para a melhoria.", "Evitar registrar commits."], "t": "per" }, { "q": "O que a lógica de orquestração faz em um sistema com agentes?", "o": ["Treina um novo modelo de linguagem", "Distribui tarefas, controla o fluxo e junta os resultados", "Desenha a interface do aplicativo", "Substitui as APIs externas"], "t": "mc" }, { "q": "Na prática da aula, qual a ordem de chamada dos agentes?", "o": ["agente_resposta → agente_analise → agente_entrada", "agente_analise → agente_resposta → agente_entrada", "agente_entrada → agente_analise → agente_resposta", "agente_resposta → agente_entrada → agente_analise"], "t": "mc" }, { "q": "O que é uma ferramenta (tool) para um agente?", "o": ["Uma função que consulta dados externos ou executa uma ação", "Um novo modelo de linguagem", "Um comentário no código", "Uma branch do Git"], "t": "mc" }, { "q": "Qual comando cria uma branch chamada ajuste e já entra nela?", "o": ["git merge ajuste", "git commit -m \"ajuste\"", "git add ajuste", "git checkout -b ajuste"], "t": "mc" }, { "q": "No exemplo da API ViaCEP, o que o agente deve fazer quando o CEP não existe?", "o": ["Inventar um endereço parecido", "Encerrar o programa com erro", "Informar que o CEP não foi encontrado", "Apagar a função consultar_cep"], "t": "mc" }, { "q": "Dê um exemplo de pergunta que um agente só consegue responder usando uma API externa e diga qual API ou tipo de dado ele precisaria consultar.", "o": null, "t": "ab" }, { "q": "Explique, em ordem, o que sua equipe faria no Git para testar uma melhoria sem correr o risco de quebrar a versão principal.", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Projeto prático: testes e refinamento", "frase": "Rápido não é o mesmo que certo", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Projeto prático: testes e refinamento<\/p><p class=\"frase\">Rápido não é o mesmo que certo<\/p><\/div><h2>① <b>Testar o agente:<\/b> <i>Com método, não no achismo<\/i><\/h2><p><b>Usabilidade:<\/b> Experiência. Resposta clara, fácil de entender, útil e no contexto.<\/p><p><b>Confiabilidade:<\/b> Informação correta. Consistente, sem contradições, sem invenções e estável.<\/p><p><b>Teste por script:<\/b> Roteiro com pergunta → comportamento esperado → observação → registro. Dá para repetir depois de cada ajuste.<\/p><p><b>Bug x alucinação:<\/b> Bug é erro de funcionamento. Alucinação é resposta inventada ou sem base, muitas vezes dita com confiança.<\/p><p><b>Ciclo:<\/b> Testar → registrar → ajustar → testar de novo. Registre prompt, resposta, problema e evidência.<\/p><h2>② <b>Ajustar prompt e parâmetros:<\/b> <i>Controlar a resposta<\/i><\/h2><p><b>Prompt específico:<\/b> Tarefa clara + público + formato + limites (\"não fale do que não foi perguntado\").<\/p><p><b>Temperatura:<\/b> Baixa = respostas previsíveis e focadas. Alta = criativas e variadas.<\/p><p><b>Top-p:<\/b> Limita as opções às palavras mais prováveis. Baixo = foco. Alto = variedade.<\/p><p><b>Valor técnico:<\/b> Para explicações técnicas, valores baixos (ex: 0.2) funcionam melhor.<\/p><p><b>Cuidado:<\/b> Temperatura baixa não elimina alucinação. Se o modelo não sabe, ele pode errar mesmo assim.<\/p><pre style=\"height:128px\"><code>Agente: \"Variável é uma função que roda automaticamente\n         e controla a internet do sistema.\"  → alucinação\nCorreção: prompt pedindo definição curta + exemplo (idade = 16)\n          temperatura 0.2, testar de novo e registrar antes/depois<\/code><\/pre><h2>③ <b>Feedback do usuário:<\/b> <i>Correto ainda pode ser ruim<\/i><\/h2><p><b>Por que ouvir:<\/b> Resposta correta pode ser curta, robótica ou pouco útil.<\/p><p><b>Feedback:<\/b> Orienta ajustes de tom, formato e utilidade.<\/p><p><b>Melhoria contínua:<\/b> Versão inicial → versão técnica corrigida → versão final após feedback.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Uma resposta bem escrita também pode estar errada. Desconfie do tom confiante e confira com um gabarito.<\/p>", "qs": [{ "q": "Em um teste baseado em script, o que ajuda a avaliar melhor a resposta do agente?", "o": ["Fazer perguntas aleatórias sem registro.", "Ter roteiro e comportamento esperado.", "Ignorar erros pequenos.", "Avaliar só o tamanho da resposta."], "t": "per" }, { "q": "Ao tentar reduzir alucinações em uma resposta técnica simples, qual ajuste tende a ajudar mais?", "o": ["Maior aleatoriedade da resposta.", "Deixar o prompt mais vago.", "Pedir que o agente fale livremente do tema.", "Especificar melhor a tarefa."], "t": "per" }, { "q": "Depois de corrigir uma resposta do agente, o que o feedback do usuário ajuda a fazer?", "o": ["Encerrar os testes imediatamente.", "Melhorar só a cor da interface.", "Ajustar a experiência e a forma de resposta.", "Ignorar a etapa de validação técnica."], "t": "per" }, { "q": "Qual a diferença entre usabilidade e confiabilidade em um agente?", "o": ["Usabilidade é a experiência; confiabilidade é a informação correta", "As duas significam a mesma coisa", "Usabilidade mede velocidade; confiabilidade mede custo", "Usabilidade é do back-end; confiabilidade é da interface"], "t": "mc" }, { "q": "O agente diz, com muita segurança, algo que não existe. Isso é:", "o": ["Um erro de compilação", "Uma alucinação", "Uma branch", "Um requisito funcional"], "t": "mc" }, { "q": "Para uma explicação técnica precisa, qual configuração costuma funcionar melhor?", "o": ["Temperatura bem alta", "Top-p alto com prompt vago", "Temperatura baixa, como 0.2", "Remover o prompt do sistema"], "t": "mc" }, { "q": "O que deve ser registrado no ciclo de testes?", "o": ["Apenas as respostas que deram certo", "Somente a cor da interface", "Nada, para não atrasar a equipe", "Prompt, resposta, problema encontrado e evidência"], "t": "mc" }, { "q": "O que torna um prompt mais específico?", "o": ["Ser o mais curto possível", "Pedir para o agente falar livremente", "Informar tarefa, público, formato e limites", "Repetir a mesma palavra várias vezes"], "t": "mc" }, { "q": "Reescreva o prompt \"fale sobre listas\" para que ele fique específico. Indique público, formato e limite de tamanho.", "o": null, "t": "ab" }, { "q": "Monte um caso de teste para um agente de dúvidas: escreva a pergunta e o comportamento esperado.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Projeto prático: deploy e apresentação", "frase": "Do meu computador para o mundo", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Projeto prático: deploy e apresentação<\/p><p class=\"frase\">Do meu computador para o mundo<\/p><\/div><h2>① <b>Pronto para o mercado:<\/b> <i>Funcionar só no meu PC não basta<\/i><\/h2><p><b>Critérios:<\/b> Funcionamento sem erros, implantação simples, organização (arquivos, banco, documentação) e apresentação clara.<\/p><p><b>Portabilidade:<\/b> Onde o software funciona (vários ambientes).<\/p><p><b>Escalabilidade:<\/b> Quanto ele aguenta crescer sem perder desempenho nem explodir custos.<\/p><h2>② <b>Conteinerização com Docker:<\/b> <i>A aplicação viaja com tudo que precisa<\/i><\/h2><p><b>Conteinerizar:<\/b> Empacotar a aplicação com bibliotecas, dependências e configurações para rodar igual em qualquer máquina ou nuvem.<\/p><p><b>Fluxo:<\/b> Aplicação → Dockerfile (a receita) → imagem (<code>docker build<\/code>) → contêiner (<code>docker run<\/code>) → cloud (deploy).<\/p><p><b>Dockerfile:<\/b> <code>FROM<\/code> imagem base, <code>WORKDIR<\/code> pasta de trabalho, <code>COPY<\/code> copia o projeto, <code>RUN<\/code> instala dependências, <code>CMD<\/code> executa.<\/p><pre style=\"height:224px\"><code>FROM python:3.12-slim\nWORKDIR /app\nCOPY . .\nRUN pip install -r requirements.txt\nCMD [\"python\", \"src/main.py\"]\n\ndocker build -t estudamais .\ndocker run --env-file .env estudamais<\/code><\/pre><p><b>Segredos:<\/b> As chaves entram na hora de rodar, não dentro da imagem.<\/p><h2>③ <b>Pitch e carreira:<\/b> <i>Mostrar o projeto e o próximo passo<\/i><\/h2><p><b>Pitch:<\/b> Problema → solução → resultado, com demonstração funcionando.<\/p><p><b>Credibilidade:<\/b> Mostrar a melhoria técnica (ex: contêiner) fortalece a apresentação.<\/p><p><b>Carreira em IA:<\/b> Pense em competências, não só em cargos.<\/p><p><b>Plano:<\/b> Onde estou (o que sei) → onde quero chegar (atuação) → próximo passo concreto (estudo, prática, portfólio).<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> O ambiente virtual isola as bibliotecas. O contêiner leva o ambiente inteiro junto. Os dois atacam o mesmo problema: \"na minha máquina funciona\".<\/p>", "qs": [{ "q": "Qual etapa garante que a aplicação rode da mesma forma em diferentes ambientes?", "o": ["Alterar o layout do sistema.", "Conteinerizar a aplicação.", "Apresentar o projeto em slides.", "Criar novas funcionalidades."], "t": "per" }, { "q": "Em um pitch de produto digital, o que fortalece mais a apresentação da solução?", "o": ["Falar apenas que a ideia é boa.", "Mostrar só o nome do projeto.", "Usar muitos efeitos no slide.", "Explicar o problema, a solução e os benefícios."], "t": "per" }, { "q": "Ao planejar uma carreira em IA, o que ajuda mais a construir um próximo passo realista?", "o": ["Escolher um cargo sem olhar habilidades.", "Copiar o plano de outra pessoa.", "Mapear competências e definir uma meta.", "Esperar dominar tudo antes de começar."], "t": "per" }, { "q": "O que é portabilidade?", "o": ["A quantidade de usuários que o sistema suporta", "A capacidade de o software funcionar em vários ambientes", "O tamanho do arquivo Dockerfile", "A velocidade da internet do usuário"], "t": "mc" }, { "q": "Qual instrução do Dockerfile define a imagem base?", "o": ["FROM", "COPY", "CMD", "WORKDIR"], "t": "mc" }, { "q": "Qual é a ordem correta do fluxo com Docker?", "o": ["Contêiner → imagem → Dockerfile", "Imagem → Dockerfile → contêiner", "Dockerfile → imagem → contêiner", "Dockerfile → contêiner → imagem"], "t": "mc" }, { "q": "Por que as chaves de API não devem ficar dentro da imagem?", "o": ["Porque a imagem não aceita texto", "Porque deixam a imagem mais lenta", "Porque o Docker apaga as chaves", "Porque quem tiver a imagem teria acesso a elas"], "t": "mc" }, { "q": "Qual é a estrutura recomendada para um pitch?", "o": ["Nome do projeto → agradecimento → fim", "Problema → solução → resultado", "Código completo → lista de bibliotecas", "Efeitos visuais → música → logo"], "t": "mc" }, { "q": "Monte seu plano de carreira em IA em 3 linhas: onde você está hoje, onde quer chegar e qual é o seu próximo passo concreto.", "o": null, "t": "ab" }, { "q": "Explique para alguém que não é de TI, em poucas frases, o problema que o contêiner resolve.", "o": null, "t": "ab" }] }] }, { "id": "llp", "sigla": "LLP", "nome": "Lógica e Linguagem de Programação", "cor": "#0b7a5e", "semanas": [{ "n": 21, "tema": "Programando com menu no terminal", "frase": "Menu, funções e validação", "html": "<div data-flow><h1>Semana 21<\/h1><p class=\"tema\">Programando com menu no terminal<\/p><p class=\"frase\">Menu, funções e validação<\/p><\/div><h2>① <b>Como um programa com menu funciona:<\/b> <i>Sempre o mesmo fluxo<\/i><\/h2><p><b>Fluxo:<\/b> Entrada (<code>input()<\/code>) → decisão (<code>if/elif/else<\/code>) → processamento (funções) → saída (<code>print()<\/code>).<\/p><p><b>input():<\/b> Sempre devolve texto. Compare a opção com <code>\"1\"<\/code>, não com <code>1<\/code>.<\/p><p><b>Repetição:<\/b> <code>while continuar:<\/code> faz o menu voltar depois de cada operação. Só a opção 0 muda <code>continuar = False<\/code>.<\/p><p><b>Função (def):<\/b> Reúne as instruções de uma tarefa. Uma função = uma responsabilidade.<\/p><p><b>Menu:<\/b> Só chama a função certa. Para crescer o sistema, crie a função e ligue a nova opção.<\/p><h2>② <b>Parâmetros, validação e consulta:<\/b> <i>Papelaria Ponto Certo<\/i><\/h2><p><b>Parâmetro:<\/b> <code>cadastrar_produto(produtos)<\/code> recebe a lista do programa e acrescenta nela. Lista nova a cada chamada perderia os produtos.<\/p><p><b>Validar:<\/b> Conferir a entrada antes de usar. O <code>else<\/code> avisa \"Opção inválida\" e um <code>while<\/code> pede o preço até ser maior que zero.<\/p><p><b>Consulta:<\/b> <code>while i &lt; len(produtos) and not encontrado:<\/code> para no fim da lista ou assim que encontrar.<\/p><pre style=\"height:320px\"><code>produtos = []\ncontinuar = True\nwhile continuar:\n    mostrar_menu()\n    opcao = input(\"Escolha: \")\n    if opcao == \"1\":\n        cadastrar_produto(produtos)\n    elif opcao == \"2\":\n        consultar_produto(produtos)\n    elif opcao == \"0\":\n        continuar = False\n    else:\n        print(\"Opção inválida.\")<\/code><\/pre><h2>③ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>Opção fora do while:<\/b> O menu repete sem perguntar de novo.<\/p><p><b>Esquecer de mudar a variável:<\/b> Sem <code>continuar = False<\/code> ou <code>preco_valido = True<\/code> o loop nunca termina.<\/p><p><b>Nome diferente:<\/b> Chamar a função com nome diferente do que foi criado.<\/p><p><b>Indentação:<\/b> O bloco do <code>if<\/code> acaba ficando fora do <code>while<\/code>.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Em todo while, pergunte: o que faz essa condição ficar falsa? Se nada dentro do loop muda a variável da condição, o programa nunca sai dele.<\/p>", "qs": [{ "q": "Após receber a opção de saque, o programa consulta o saldo, verifica se há valor disponível e mostra uma mensagem. Qual etapa define se o saque pode continuar?", "o": ["Entrada da opção.", "Decisão sobre o saldo.", "Processamento do saldo.", "Repetição do menu."], "t": "per" }, { "q": "Um programa possui funções para cadastrar, consultar e sair. O usuário digita a opção 8, que não existe no menu. O que o programa deve fazer antes de chamar uma função?", "o": ["Executar a primeira função disponível.", "Validar a entrada informada pelo usuário.", "Encerrar o programa imediatamente.", "Exibir o menu novamente."], "t": "per" }, { "q": "O que garante que o menu de um programa continue sendo exibido até que o usuário escolha encerrar o programa?", "o": ["O número de opções que o menu possui.", "A estrutura de repetição (loop) que envolve o menu.", "O tamanho do texto exibido na tela.", "A velocidade de digitação do usuário."], "t": "per" }, { "q": "O que a função input() sempre devolve?", "o": ["Um número inteiro", "Um texto (string)", "Uma lista", "Um valor verdadeiro ou falso"], "t": "mc" }, { "q": "No menu, qual comparação está correta para a opção 1?", "o": ["if opcao = 1:", "if opcao == 1:", "if opcao == \"1\":", "if \"opcao\" == 1:"], "t": "mc" }, { "q": "O que acontece se a leitura da opção ficar fora do while?", "o": ["O menu repete sem perguntar de novo", "O programa fica mais rápido", "O Python corrige sozinho", "A lista de produtos é apagada"], "t": "mc" }, { "q": "Por que passar a lista como parâmetro em cadastrar_produto(produtos)?", "o": ["Para deixar o programa mais curto", "Porque input() exige uma lista", "Para evitar o uso de funções", "Para acrescentar na mesma lista usada pelo programa"], "t": "mc" }, { "q": "O que causa um loop infinito no menu?", "o": ["Ter muitas opções", "Usar print dentro do while", "Nada mudar a variável da condição do while", "Usar elif em vez de if"], "t": "mc" }, { "q": "Escreva como você adicionaria a opção \"3 - Listar produtos\" no menu. Mostre o trecho do if/elif que seria acrescentado.", "o": null, "t": "ab" }, { "q": "Explique com suas palavras por que validar a entrada do usuário é importante. Dê um exemplo da Papelaria.", "o": null, "t": "ab" }] }, { "n": 22, "tema": "Agenda e cadastros em memória", "frase": "Listas, índices e cadastro", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Agenda e cadastros em memória<\/p><p class=\"frase\">Listas, índices e cadastro<\/p><\/div><h2>① <b>Listas e índices:<\/b> <i>Vários valores sob um único nome<\/i><\/h2><p><b>Lista:<\/b> <code>produtos = []<\/code> guarda vários valores sob um único nome.<\/p><p><b>Operações:<\/b> <code>append()<\/code> acrescenta no fim, <code>len()<\/code> conta, <code>insert(0, item)<\/code> põe no início, <code>remove()<\/code> retira.<\/p><p><b>Índice:<\/b> Posição do item. Começa em 0. O último é sempre <code>len(lista) - 1<\/code>.<\/p><p><b>Memória:<\/b> Os dados existem só enquanto o programa roda. Fechou sem gravar em arquivo, sumiram.<\/p><h2>② <b>Lista de listas:<\/b> <i>Cada produto é [nome, preco]<\/i><\/h2><p><b>Acesso:<\/b> <code>produtos[0]<\/code> é o 1º produto, <code>produtos[0][0]<\/code> o nome dele e <code>produtos[0][1]<\/code> o preço.<\/p><p><b>Por que lista?:<\/b> Tupla não pode ser alterada, e o sistema vai precisar mudar o preço com <code>produto[1] = novo_preco<\/code>.<\/p><pre style=\"height:128px\"><code>produtos = [[\"Caneta\", 2.50], [\"Caderno\", 18.90]]\nprint(produtos[0])      # ['Caneta', 2.5]\nprint(produtos[0][0])   # Caneta\nprint(produtos[1][1])   # 18.9<\/code><\/pre><h2>③ <b>Cadastrar, consultar e listar:<\/b> <i>As três operações de todo cadastro<\/i><\/h2><p><b>Cadastrar:<\/b> Acrescentar um item.<\/p><p><b>Consultar:<\/b> Procurar um item. Em lista de listas, percorra e compare o nome.<\/p><p><b>Listar:<\/b> Mostrar todos. Trate a lista vazia primeiro e mostre o total com <code>len()<\/code>.<\/p><p><b>.lower():<\/b> Use nos dois lados para \"caneta\" ser igual a \"Caneta\".<\/p><pre style=\"height:192px\"><code>def listar_produtos(produtos):\n    if len(produtos) == 0:\n        print(\"Nenhum produto cadastrado.\")\n        return\n    for i, produto in enumerate(produtos, start=1):\n        print(f\"{i}. {produto[0]} - R$ {produto[1]:.2f}\")\n    print(f\"Total de produtos: {len(produtos)}\")<\/code><\/pre><h2>④ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>IndexError:<\/b> Acessar <code>produtos[3]<\/code> numa lista de 3 itens.<\/p><p><b>Confusão:<\/b> Trocar o produto (<code>produtos[0]<\/code>) por um campo dele (<code>produtos[0][0]<\/code>).<\/p><p><b>Comparação:<\/b> Usar <code>.lower()<\/code> só de um lado.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Guarde cada produto como lista [nome, preco], não como tupla: mais à frente o sistema precisa alterar o preço.<\/p>", "qs": [{ "q": "O que acontece com uma lista criada apenas na memória quando o programa é encerrado?", "o": ["É salva", "É apagada", "É copiada", "É compartilhada"], "t": "per" }, { "q": "Qual operação deve ser utilizada quando o usuário deseja visualizar todos os produtos cadastrados?", "o": ["Incluir", "Validar", "Consultar", "Listar"], "t": "per" }, { "q": "A consulta percorre a lista comparando cada item. Se a repetição terminar sem encontrar o produto, o que o programa deverá fazer?", "o": ["Criar automaticamente o produto na lista", "Repetir a busca desde o início", "Informar que o produto não foi encontrado", "Encerrar sem mostrar nenhuma mensagem"], "t": "per" }, { "q": "Em uma lista com 5 itens, qual é o índice do último?", "o": ["5", "4", "6", "0"], "t": "mc" }, { "q": "Qual método acrescenta um item no fim da lista?", "o": ["insert()", "len()", "append()", "remove()"], "t": "mc" }, { "q": "Com produtos = [[\"Caneta\", 2.50], [\"Caderno\", 18.90]], o que produtos[1][0] mostra?", "o": ["Caneta", "2.50", "18.90", "Caderno"], "t": "mc" }, { "q": "O que acontece ao acessar produtos[3] em uma lista de 3 itens?", "o": ["Ocorre um IndexError", "O Python cria o item que falta", "O programa mostra o primeiro item", "A lista é apagada"], "t": "mc" }, { "q": "Para que \"caneta\" encontre \"Caneta\" na consulta, o que deve ser feito?", "o": ["Usar .lower() só no texto digitado", "Usar .lower() só no nome da lista", "Usar .lower() nos dois lados da comparação", "Trocar a lista por uma tupla"], "t": "mc" }, { "q": "Escreva o código que cria uma lista com três produtos (nome e preço) e mostra na tela apenas o preço do segundo produto.", "o": null, "t": "ab" }, { "q": "Explique por que, na listagem, é importante tratar primeiro o caso da lista vazia.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Médias, faixas e classificação", "frase": "De regra de negócio a algoritmo", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Médias, faixas e classificação<\/p><p class=\"frase\">De regra de negócio a algoritmo<\/p><\/div><h2>① <b>Da regra ao algoritmo:<\/b> <i>Regra objetiva vira código<\/i><\/h2><p><b>Regra de negócio:<\/b> Regra vaga não vira código. \"Vende pouco\" não serve. \"média &lt; 10 → giro baixo\" serve.<\/p><p><b>Calcular x classificar:<\/b> Primeiro o número (média), depois a decisão (faixa).<\/p><p><b>Média:<\/b> <code>sum(quantidades) / len(quantidades)<\/code>. Nunca divida por um número fixo.<\/p><p><b>Registro de venda:<\/b> <code>[nome, quantidade, data]<\/code>: <code>item[0]<\/code> é o nome, <code>item[1]<\/code> a quantidade e <code>item[2]<\/code> a data.<\/p><h2>② <b>Funções com return:<\/b> <i>O resultado alimenta a próxima<\/i><\/h2><p><b>return:<\/b> Devolve o resultado para quem chamou a função.<\/p><p><b>None:<\/b> Significa \"nenhum valor\" (produto sem vendas).<\/p><p><b>Encadeamento:<\/b> Média → classificação → exibição. Mudou a faixa? Altere só a função que classifica.<\/p><pre style=\"height:224px\"><code>def classificar_desempenho(media):\n    if media is None:\n        return \"Sem histórico\"\n    elif media &gt;= 30:\n        return \"Alto\"\n    elif media &gt;= 10:\n        return \"Médio\"\n    else:\n        return \"Baixo\"<\/code><\/pre><h2>③ <b>Faixas e ranking:<\/b> <i>Ordenar e registrar<\/i><\/h2><p><b>Faixas:<\/b> Média ≥ 30 = Alto. Média ≥ 10 e &lt; 30 = Médio. Média &lt; 10 = Baixo. Sem vendas = Sem histórico.<\/p><p><b>Ranking:<\/b> Monte <code>[nome, media, desempenho]<\/code> para cada produto e ordene do maior para o menor.<\/p><p><b>Arquivo:<\/b> <code>\"a\"<\/code> acrescenta uma linha (desempenho.txt). <code>\"w\"<\/code> substitui tudo (ranking.txt).<\/p><pre style=\"height:32px\"><code>resultados.sort(key=lambda item: item[1], reverse=True)<\/code><\/pre><h2>④ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>Média errada:<\/b> Somar vendas de outros produtos.<\/p><p><b>Índice errado:<\/b> Usar <code>item[2]<\/code>, que é a data.<\/p><p><b>Ordem das condições:<\/b> Testar as faixas antes de verificar <code>None<\/code>.<\/p><p><b>Ranking invertido:<\/b> Esquecer <code>reverse=True<\/code>.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Teste um produto de cada faixa, os valores-limite (10 e 30) e um produto sem vendas. Se só testar um caso médio, erros de ordem nas condições passam despercebidos.<\/p>", "qs": [{ "q": "O sistema classifica o desempenho de vendas conforme a média das quantidades vendidas. Qual trecho do algoritmo é responsável por decidir se o desempenho será \"alto\", \"médio\" ou \"baixo\"?", "o": ["A estrutura condicional.", "A leitura dos valores de entrada.", "O cálculo da média.", "A exibição do resultado."], "t": "per" }, { "q": "Um algoritmo de desempenho de vendas foi organizado em partes: calcular a média, classificar o resultado e exibir a informação. Se a empresa mudar as faixas (por exemplo, médio a partir de 12), qual parte do algoritmo precisa ser alterada?", "o": ["A parte que calcula a média das quantidades.", "A parte que compara média com faixas de desempenho.", "A parte que exibe o resultado.", "Todas, porque o programa depende das faixas."], "t": "per" }, { "q": "Por que organizar o processamento em funções facilita consultar diferentes produtos?", "o": ["Evita o menu.", "Dispensa testes.", "Guarda os dados.", "Reaproveita a lógica."], "t": "per" }, { "q": "Qual regra pode ser transformada diretamente em código?", "o": ["O produto vende pouco", "O produto está indo bem", "Média menor que 10 é giro baixo", "O cliente gosta do produto"], "t": "mc" }, { "q": "Qual fórmula calcula corretamente a média de uma lista de quantidades?", "o": ["sum(quantidades) / 3", "sum(quantidades) / len(quantidades)", "len(quantidades) / sum(quantidades)", "sum(quantidades) * len(quantidades)"], "t": "mc" }, { "q": "Um produto com média 10 é classificado como:", "o": ["Alto", "Baixo", "Médio", "Sem histórico"], "t": "mc" }, { "q": "O que a função calcular_media_vendas devolve para um produto sem vendas?", "o": ["None", "0", "\"Baixo\"", "Um erro no programa"], "t": "mc" }, { "q": "Em resultados.sort(key=lambda item: item[1], reverse=True), o que reverse=True faz?", "o": ["Apaga os menores valores", "Ordena por nome", "Inverte o texto dos nomes", "Coloca o maior valor primeiro"], "t": "mc" }, { "q": "Calcule a média de um produto com as vendas 12, 18 e 30 e diga em qual faixa ele fica. Mostre a conta.", "o": null, "t": "ab" }, { "q": "Por que a verificação de None precisa vir antes das outras condições na função classificar_desempenho?", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Quiz e desafios no terminal", "frase": "O programa conversa com quem usa", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Quiz e desafios no terminal<\/p><p class=\"frase\">O programa conversa com quem usa<\/p><\/div><h2>① <b>Programa interativo:<\/b> <i>Perguntar, receber, verificar, responder<\/i><\/h2><p><b>Interativo:<\/b> Conversa em etapas: <code>input<\/code> → variável → <code>if<\/code> → <code>print<\/code>.<\/p><p><b>Variável de estado:<\/b> Guarda o que muda durante a interação (ex: <code>pontos<\/code>). Crie antes do loop, atualize dentro, mostre depois.<\/p><p><b>Comparar texto:<\/b> É letra por letra. \"Brasilia\" ≠ \"Brasília\" ≠ \"brasilia\". Use <code>.strip().lower()<\/code> ou respostas sem acento.<\/p><h2>② <b>for ou while?:<\/b> <i>Depende de saber quantas vezes repetir<\/i><\/h2><p><b>for:<\/b> Quando você sabe quantas vezes repetir (3 perguntas, todos os itens de uma lista).<\/p><p><b>while:<\/b> Quando depende de uma condição (tentativas restantes, menu, validação).<\/p><p><b>Loop infinito:<\/b> O <code>while<\/code> testa a condição antes de cada volta. Se nada muda a variável, nunca para (Ctrl+C interrompe).<\/p><pre style=\"height:192px\"><code>tentativas = 3\nwhile tentativas &gt; 0:\n    if input(\"5 x 6 = \") == \"30\":\n        print(\"Certo!\")\n        tentativas = 0\n    else:\n        tentativas = tentativas - 1<\/code><\/pre><h2>③ <b>Listas paralelas:<\/b> <i>O mesmo índice liga os dados<\/i><\/h2><p><b>Ligação:<\/b> <code>perguntas[i]<\/code> e <code>respostas[i]<\/code> se ligam pelo mesmo índice. Precisam estar na mesma ordem.<\/p><p><b>Mensagem final:<\/b> <code>if/elif/else<\/code> depois do loop, da condição mais específica para a mais ampla.<\/p><pre style=\"height:224px\"><code>perguntas = [\"Quanto é 7 + 8?\", \"Capital do Brasil?\"]\nrespostas = [\"15\", \"brasilia\"]\npontos = 0                          # antes do loop\nfor i in range(len(perguntas)):\n    resposta = input(perguntas[i] + \" \")\n    if resposta.strip().lower() == respostas[i]:\n        pontos = pontos + 1         # dentro do loop\nprint(\"Você acertou\", pontos)       # depois do loop<\/code><\/pre><h2>④ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>Placar zerando:<\/b> Criar <code>pontos = 0<\/code> dentro do loop.<\/p><p><b>Placar repetido:<\/b> Colocar o resultado final indentado dentro do loop.<\/p><p><b>Tentativas:<\/b> Não diminuir <code>tentativas<\/code> no <code>else<\/code>.<\/p><p><b>Ordem:<\/b> Testar <code>pontos &gt;= 1<\/code> antes de <code>pontos == 3<\/code>.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Antes de escrever o loop, pergunte: eu sei quantas vezes vai repetir? Sim → for. Não, depende de algo acontecer → while.<\/p>", "qs": [{ "q": "Em um quiz no terminal, qual ordem descreve melhor o fluxo de uma pergunta?", "o": ["Receber, perguntar, responder, verificar", "Perguntar, receber, verificar, responder", "Verificar, perguntar, receber, responder", "Responder, verificar, receber, perguntar"], "t": "per" }, { "q": "Quando usar while em vez de for?", "o": ["Quando o código tiver input.", "Quando a repetição depender de uma condição.", "Quando quisermos imprimir na tela.", "Quando o programa tiver só uma variável."], "t": "per" }, { "q": "Por que duas listas que caminham juntas precisam da mesma ordem?", "o": ["Porque o Python exige ordem alfabética.", "Porque o mesmo índice liga os itens correspondentes.", "Porque o for só aceita listas iguais.", "Porque listas só funcionam com o mesmo tamanho de nome."], "t": "per" }, { "q": "O que é uma variável de estado?", "o": ["Uma variável que nunca muda", "Uma informação que muda durante a interação, como os pontos", "Uma variável que só existe dentro de funções", "O nome do estado onde o programa roda"], "t": "mc" }, { "q": "Onde a variável pontos deve ser criada em um quiz?", "o": ["Antes do loop", "Dentro do loop", "Depois do loop", "Dentro do if"], "t": "mc" }, { "q": "Qual estrutura é mais indicada para percorrer todos os itens de uma lista de perguntas?", "o": ["if", "else", "while com condição desconhecida", "for"], "t": "mc" }, { "q": "O que resposta.strip().lower() faz?", "o": ["Soma os pontos do jogador", "Converte o texto em número", "Tira os espaços das pontas e deixa tudo minúsculo", "Apaga a resposta do usuário"], "t": "mc" }, { "q": "Se pontos == 3 for testado depois de pontos >= 1, o que acontece?", "o": ["O programa dá erro de sintaxe", "A mensagem de pontuação máxima nunca aparece", "O placar é zerado", "O loop se repete para sempre"], "t": "mc" }, { "q": "Escreva o código de um quiz com uma pergunta, que dê ao jogador 2 tentativas para acertar.", "o": null, "t": "ab" }, { "q": "Explique a diferença entre o placar ficar dentro do loop e depois dele. O que muda na tela?", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Do menu ao sistema completo", "frase": "Dados que sobrevivem ao fechar o programa", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Do menu ao sistema completo<\/p><p class=\"frase\">Dados que sobrevivem ao fechar o programa<\/p><\/div><h2>① <b>Partes do sistema:<\/b> <i>Cada uma com seu papel<\/i><\/h2><p><b>Menu:<\/b> Coordena e só chama.<\/p><p><b>Funções:<\/b> Executam as tarefas.<\/p><p><b>Dados:<\/b> As listas guardam as informações.<\/p><p><b>Arquivo:<\/b> Persiste os dados.<\/p><p><b>Catálogo x histórico:<\/b> <code>produtos<\/code> guarda o que a loja vende. <code>vendas<\/code> guarda o que já aconteceu.<\/p><p><b>Memória x arquivo:<\/b> A lista é o agora. O arquivo é o depois. <code>produto[1] = 19.90<\/code> muda só a memória.<\/p><h2>② <b>Arquivos CSV:<\/b> <i>Uma linha por registro<\/i><\/h2><p><b>with open:<\/b> <code>with open(nome, modo, encoding=\"utf-8\") as arquivo:<\/code><\/p><p><b>Modos:<\/b> <code>\"w\"<\/code> sobrescreve, <code>\"a\"<\/code> acrescenta e <code>\"r\"<\/code> lê.<\/p><p><b>CSV:<\/b> Campos separados por <code>;<\/code>, como <code>Caderno;18.50<\/code>.<\/p><p><b>Carregar:<\/b> Ler linha a linha, <code>strip()<\/code> tira o <code>\\n<\/code>, <code>split(\";\")<\/code> separa e <code>float()/int()<\/code> converte. Chame no início do programa.<\/p><p><b>Complemento:<\/b> <code>try/except ValueError<\/code> evita que <code>float(\"abc\")<\/code> quebre o programa.<\/p><pre style=\"height:128px\"><code>def salvar_produtos(produtos):\n    with open(\"produtos.csv\", \"w\", encoding=\"utf-8\") as arquivo:\n        for produto in produtos:\n            arquivo.write(f\"{produto[0]};{produto[1]:.2f}\\n\")<\/code><\/pre><h2>③ <b>Alterar, registrar e cancelar:<\/b> <i>Quem faz o quê<\/i><\/h2><p><b>alterar_produto():<\/b> Localizar → pedir dados → validar → alterar a lista → salvar. Mexe em <code>produtos<\/code> e <code>produtos.csv<\/code>.<\/p><p><b>registrar_venda():<\/b> Só produto que existe e quantidade &gt; 0. Mexe em <code>vendas<\/code> e <code>vendas.csv<\/code>.<\/p><p><b>cancelar_venda():<\/b> Mostrar a lista numerada, validar o número, <code>vendas.pop(numero - 1)<\/code> e regravar.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>Validação:<\/b> Gravar antes de validar (o erro vai para o arquivo).<\/p><p><b>Sem regravar:<\/b> Alterar a lista e esquecer o CSV.<\/p><p><b>Modo errado:<\/b> Usar <code>\"w\"<\/code> quando queria acrescentar.<\/p><p><b>Sem carregar:<\/b> Gravar, mas não chamar <code>carregar_produtos()<\/code> ao abrir.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> O teste definitivo de persistência é fechar o programa, abrir de novo e listar. Se a mudança sumiu, falta gravar depois de alterar ou carregar no início.<\/p>", "qs": [{ "q": "O menu chama uma função que altera uma lista e, em seguida, outra função que lê uma lista diferente. A segunda não encontra informação do item recém-incluído. O que isso mostra?", "o": ["O menu deixou de chamar as funções.", "O fluxo impediu o programa de voltar ao menu.", "As duas listas não foram atualizadas juntas.", "A função de consulta apagou o item cadastrado."], "t": "per" }, { "q": "Em um programa modularizado, qual escolha organiza melhor a alteração de dados e a gravação em arquivo?", "o": ["O menu altera a lista e grava o CSV sozinho.", "O CSV substitui a lista durante toda a execução.", "A função certa altera e grava o arquivo dela.", "Uma função só mexe em produtos, vendas e menu."], "t": "per" }, { "q": "Em um programa que usa listas em memória e arquivos, por que salvar o arquivo depois de uma alteração?", "o": ["Para reabrir o menu com outra opção.", "Para criar uma nova lista em memória.", "Para manter a mudança nas próximas execuções.", "Para apagar dados antigos do programa."], "t": "per" }, { "q": "Qual a diferença entre catálogo e histórico na Papelaria?", "o": ["Catálogo é o que a loja vende; histórico é o que já foi vendido", "Os dois guardam exatamente os mesmos dados", "Catálogo só existe em arquivo; histórico só em memória", "Catálogo guarda clientes; histórico guarda senhas"], "t": "mc" }, { "q": "Qual modo de abertura apaga o conteúdo e escreve de novo?", "o": ["\"a\"", "\"r\"", "\"w\"", "\"x\""], "t": "mc" }, { "q": "Em uma linha \"Caderno;18.50\", o que linha.strip().split(\";\") devolve?", "o": ["\"Caderno18.50\"", "[\"Caderno\", \"18.50\"]", "[\"Caderno;18.50\"]", "18.50"], "t": "mc" }, { "q": "Depois de alterar um produto, o que falta para a mudança continuar ao reabrir?", "o": ["Chamar mostrar_menu()", "Fechar o terminal", "Criar uma nova lista vazia", "Salvar a lista no arquivo CSV"], "t": "mc" }, { "q": "Quando carregar_produtos() deve ser chamada?", "o": ["No início do programa", "Só quando o usuário sair", "Depois de cada print", "Nunca, o Python carrega sozinho"], "t": "mc" }, { "q": "Descreva, em ordem, os passos da função alterar_produto, do momento em que o usuário digita o nome até a gravação.", "o": null, "t": "ab" }, { "q": "O usuário alterou o preço do Caderno, fechou o programa e o preço antigo voltou. Quais podem ser as causas?", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Organizar e apresentar o projeto", "frase": "Funcionar não basta", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Organizar e apresentar o projeto<\/p><p class=\"frase\">Funcionar não basta<\/p><\/div><h2>① <b>Legibilidade:<\/b> <i>Código que outra pessoa entende<\/i><\/h2><p><b>Por quê:<\/b> Código difícil de ler torna qualquer mudança lenta e arriscada.<\/p><p><b>Nome de função:<\/b> Deve dizer a tarefa principal. Se ela faz cinco coisas, o nome esconde quatro.<\/p><p><b>Nome no índice:<\/b> <code>nome = produto[0]<\/code> e <code>preco = produto[1]<\/code> dispensam lembrar posições.<\/p><p><b>Responsabilidade única:<\/b> Cada função faz uma coisa bem definida.<\/p><h2>② <b>Refatoração:<\/b> <i>Melhorar sem mudar o comportamento<\/i><\/h2><p><b>Refatorar:<\/b> Melhorar a organização sem mudar o que o programa faz. Trecho repetido vira função.<\/p><p><b>Funções de apoio:<\/b> Devolvem com <code>return<\/code>, não imprimem. Quem chamou decide o que fazer.<\/p><p><b>Exemplos:<\/b> <code>formatar_produto(nome, preco)<\/code> monta o texto, <code>buscar_produto(produtos, nome)<\/code> devolve o produto ou <code>None<\/code>, <code>validar_preco(texto)<\/code> devolve o número ou <code>None<\/code>.<\/p><pre style=\"height:320px\"><code>def buscar_produto(produtos, nome):\n    for produto in produtos:\n        if produto[0].lower() == nome.lower():\n            return produto\n    return None\n\ndef consultar_produto(produtos):\n    nome = input(\"Nome do produto: \").strip()\n    produto = buscar_produto(produtos, nome)\n    if produto is None:\n        print(\"Produto não encontrado.\")\n    else:\n        print(formatar_produto(produto[0], produto[1]))<\/code><\/pre><h2>③ <b>Testes, revisão e apresentação:<\/b> <i>Fechar o projeto<\/i><\/h2><p><b>Testes:<\/b> Planeje antes (mínimo 6), com casos válidos e de erro. Anote se o resultado foi o esperado.<\/p><p><b>Checklist:<\/b> Cadastrar, consultar, alterar, registrar venda, cancelar venda, ver ranking, fechar e reabrir.<\/p><p><b>Revisão em pares:<\/b> Nomes claros? Repetições? Comentários úteis? Funciona? Dê 2 sugestões específicas.<\/p><p><b>Apresentação:<\/b> Cerca de 3 min explicando o funcionamento, não lendo código.<\/p><h2>④ <b>Erros comuns:<\/b> <i>Fique de olho<\/i><\/h2><p><b>Repetição:<\/b> Criar a função nova e manter a lógica antiga repetida.<\/p><p><b>print na função de apoio:<\/b> Colocar <code>print<\/code> dentro de <code>buscar_produto()<\/code>.<\/p><p><b>Muitas mudanças:<\/b> Mudar várias coisas de uma vez sem testar.<\/p><p><b>Feedback vazio:<\/b> Dizer só \"está bom\" na revisão.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Refatore uma coisa por vez e rode os mesmos testes depois de cada mudança. Se o resultado mudou, a refatoração alterou o comportamento: volte e corrija.<\/p>", "qs": [{ "q": "O que mais ajuda outra pessoa a entender um programa simples que já funciona?", "o": ["Acrescentar o maior número possível de opções no menu.", "Esconder várias tarefas atrás de um nome curto.", "Usar nomes que descrevem a tarefa resumidamente.", "Copiar o mesmo trecho em todo lugar para “garantir”."], "t": "per" }, { "q": "As funções consultar_produto() e listar_produtos() exibem cada produto do mesmo jeito, repetindo código. Qual é a melhor solução?", "o": ["Criar uma função formatar_produto() e chamá-la nas duas.", "Excluir uma das duas funções do programa.", "Copiar o trecho de exibição em cada função separadamente.", "Deixar como está, já que o programa funciona."], "t": "per" }, { "q": "Uma equipe encontrou a mesma lógica de busca de produto em várias funções. Qual mudança representa melhor uma refatoração?", "o": ["Copiar a lógica para nova função e manter as antigas.", "Unir todas as funções do sistema em uma função maior.", "Alterar o menu para que a busca aconteça só uma vez.", "Criar uma função de busca e usá-la onde necessário."], "t": "per" }, { "q": "O que é refatorar?", "o": ["Adicionar novas funções ao sistema", "Melhorar a organização sem mudar o comportamento", "Reescrever tudo em outra linguagem", "Apagar os testes do programa"], "t": "mc" }, { "q": "Qual nome de função é mais claro?", "o": ["f1()", "fazer_coisas()", "calcular_media_vendas()", "teste2()"], "t": "mc" }, { "q": "O que buscar_produto(produtos, nome) deve devolver quando não encontra?", "o": ["None", "Uma mensagem com print", "O primeiro produto da lista", "Um novo produto vazio"], "t": "mc" }, { "q": "O que significa responsabilidade única?", "o": ["Só uma pessoa pode alterar o código", "O programa só pode ter uma função", "Cada arquivo só pode ter uma linha", "Cada função faz uma coisa bem definida"], "t": "mc" }, { "q": "Qual é um bom comentário em uma revisão em pares?", "o": ["Está bom", "Não gostei", "A função salvar pode ser dividida em duas partes", "Faz de novo"], "t": "mc" }, { "q": "Monte 3 casos de teste para a Papelaria. Para cada um, diga a ação e o resultado esperado.", "o": null, "t": "ab" }, { "q": "Encontre uma repetição que poderia existir no sistema da Papelaria e explique como uma função resolveria isso.", "o": null, "t": "ab" }] }] }, { "id": "mdbd", "sigla": "MDBD", "nome": "Modelagem e Desenvolvimento de Banco de Dados", "cor": "#b4470f", "semanas": [{ "n": 22, "tema": "Introdução aos bancos NoSQL", "frase": "Não só SQL", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Introdução aos bancos NoSQL<\/p><p class=\"frase\">Não só SQL<\/p><\/div><h2>① <b>O que é NoSQL:<\/b> <i>Distribuído e flexível<\/i><\/h2><p><b>NoSQL:<\/b> Not Only SQL. Guarda grandes volumes de forma distribuída (vários servidores) e flexível (sem esquema fixo). Não substitui o relacional: os dois convivem.<\/p><p><b>Por que surgiu:<\/b> Escalar ficou caro, os dados ficaram variados (posts, fotos, logs), há muita leitura e escrita e usuários no mundo todo.<\/p><p><b>Tipos de dado:<\/b> Estruturado = tabela. Semiestruturado = JSON. Não estruturado = foto, áudio, texto livre.<\/p><h2>② <b>Os 4 tipos:<\/b> <i>Cada um com sua vocação<\/i><\/h2><p><b>Chave-valor:<\/b> Redis, DynamoDB. Sessão, carrinho, cache.<\/p><p><b>Documento:<\/b> MongoDB, CouchDB. Catálogo, perfis, posts.<\/p><p><b>Colunas:<\/b> Cassandra, HBase. Big Data, IoT, cliques, logs.<\/p><p><b>Grafo:<\/b> Neo4j, Neptune. Redes sociais, recomendação, fraude.<\/p><p><b>SQL x NoSQL:<\/b> Esquema fixo x flexível. Cresce vertical x horizontal. Consistência forte (ACID) x muitas vezes eventual. FK + JOIN x embutir ou guardar o ID.<\/p><h2>③ <b>Arquitetura distribuída:<\/b> <i>Vários servidores, um sistema<\/i><\/h2><p><b>Nó e cluster:<\/b> Cada servidor é um nó. Juntos formam o cluster. Ganho: menor latência e alta disponibilidade.<\/p><p><b>Escala:<\/b> Vertical = mais CPU/RAM na mesma máquina. Horizontal = mais máquinas dividindo dados e carga.<\/p><p><b>Replicação:<\/b> Cópias dos MESMOS dados em vários nós. Síncrona confirma após copiar (segura). Assíncrona copia depois (rápida).<\/p><p><b>Sharding:<\/b> DIVIDE os dados entre os nós.<\/p><p><b>Consistência eventual:<\/b> Os nós podem divergir por instantes, mas chegam ao mesmo valor.<\/p><h2>④ <b>Modelar em NoSQL:<\/b> <i>Embutir ou referenciar?<\/i><\/h2><p><b>Embutir:<\/b> Quando o dado é lido junto e pertence ao \"pai\". Ex: itens dentro do pedido.<\/p><p><b>Referenciar:<\/b> Guardar só o ID quando é compartilhado ou cresce sem limite. Ex: <code>cliente_id<\/code> no pedido.<\/p><p><b>Arquitetura híbrida:<\/b> Pedidos e pagamentos no relacional. Cliques e catálogo no NoSQL.<\/p><pre style=\"height:192px\"><code>db.Pedidos.insertOne({              // a coleção nasce no primeiro insert\n  pedido_id: 1,\n  cliente_id: 1,                    // só referência\n  status: \"Processando\",\n  itens: [ { produto_id: 101, quantidade: 2,\n             preco_unitario: 3500.00 } ]   // embutido\n})<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> Antes de escolher o banco, pergunte: como esse dado vai ser lido e o que não pode dar errado? Dinheiro e estoque → relacional. Volume e formatos variados → NoSQL. Sistemas grandes costumam combinar os dois.<\/p>", "qs": [{ "q": "Qual é a principal vantagem de uma arquitetura distribuída em bancos de dados NoSQL para uma empresa global?", "o": ["Maior consistência dos dados em todos os nós.", "Melhor latência e disponibilidade em várias regiões.", "Menor necessidade de infraestrutura e servidores.", "Eliminação completa de falhas de hardware."], "t": "per" }, { "q": "A escalabilidade horizontal, característica dos bancos NoSQL, envolve principalmente:", "o": ["Adicionar novos servidores para distribuir dados e carga.", "Aumentar a capacidade de um único servidor.", "Reduzir o número de cópias de dados no sistema.", "Remover automaticamente dados desatualizados."], "t": "per" }, { "q": "Qual das seguintes abordagens de escalabilidade seria mais eficaz para lidar com o aumento do volume de dados e usuários da DataConnect?", "o": ["Escalabilidade vertical.", "Replicação síncrona.", "Escalabilidade horizontal.", "Escalabilidade em camadas."], "t": "per" }, { "q": "O que significa NoSQL?", "o": ["Sem nenhum uso de SQL", "Not Only SQL (não só SQL)", "Novo SQL", "Banco sem dados estruturados"], "t": "mc" }, { "q": "Qual tipo de banco NoSQL é mais indicado para redes sociais e recomendações?", "o": ["Chave-valor", "Colunas", "Documento", "Grafo"], "t": "mc" }, { "q": "Qual a diferença entre replicação e sharding?", "o": ["Replicação copia os dados; sharding divide os dados", "Replicação divide os dados; sharding copia os dados", "As duas apagam dados antigos", "As duas só existem em bancos relacionais"], "t": "mc" }, { "q": "Aumentar a memória e o processador do mesmo servidor é:", "o": ["Sharding", "Escala horizontal", "Escala vertical", "Consistência eventual"], "t": "mc" }, { "q": "Em um pedido no MongoDB, quando faz sentido embutir os itens?", "o": ["Quando os itens são usados por mil coleções", "Quando são sempre lidos junto com o pedido", "Quando crescem sem limite", "Nunca, o MongoDB não permite"], "t": "mc" }, { "q": "Para um aplicativo de delivery, escolha um dado que deve ficar em banco relacional e outro que pode ficar em NoSQL. Justifique.", "o": null, "t": "ab" }, { "q": "Explique com um exemplo do dia a dia o que é consistência eventual.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Ferramentas e tecnologias NoSQL", "frase": "Instalar e dar os primeiros comandos", "html": "<div data-flow><h1
