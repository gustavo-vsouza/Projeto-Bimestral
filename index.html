uais ignoram e onde desistem. Assim as decisões saem dos fatos, e não do achismo.<\/p><p><b>Ferramentas:<\/b> O Firebase Analytics rastreia eventos personalizados (você escolhe o que contar, como “agendou consulta”), monta funis e separa usuários em grupos. O Google Play Console mostra desempenho, taxa de erros, ANRs (quando a tela congela e aparece “o app não está respondendo”) e as avaliações. O App Store Connect faz o mesmo no iPhone: uso, crashes e retenção. O Mixpanel monta funis e painéis. O Instabug recebe relatos de bugs direto dos usuários, com print da tela.<\/p><p><b>Funil de uso:<\/b> É o caminho que o usuário faz até concluir uma tarefa, passo a passo, mostrando quantos chegam a cada etapa. Ele aponta exatamente onde as pessoas desistem.<\/p><pre style=\"height:96px\"><code>Abriu o app ........ 1000 usuários\nFez login .......... 580  (42% desistiram aqui)\nAgendou consulta ... 510<\/code><\/pre><p class=\"ex\"><b>Lendo o funil:<\/b> a maior queda está no login. No caso ConsultaJá, o Google Play Console mostrou que essa tela demorava 3,5 s para abrir. Depois de otimizar, a conclusão dos agendamentos subiu 18%.<\/p><p><b>Tipos de métrica:<\/b> Técnicas (tempo de carregamento, falhas por aparelho, memória), de comportamento (tempo de uso, telas mais acessadas, abandono) e de negócio (conversão, retenção, churn e LTV).<\/p><p><b>Caminho da melhoria:<\/b> Dado (onde está o problema?) → hipótese (por que acontece?) → plano (o que mudar?) → aplicar (como testar?) → medir (funcionou?).<\/p><h2>② <b>Suporte ao usuário:<\/b> <i>Canal direto com quem usa<\/i><\/h2><p><b>Ferramentas:<\/b> O Help Desk (Zendesk, Freshdesk) organiza os pedidos de ajuda em <i>tickets<\/i>, como as senhas de atendimento de um banco, para nenhum se perder. O Live Chat (Intercom, Tawk.to) é a conversa na hora, dentro do app. O chatbot com IA responde sozinho as dúvidas repetidas. A base de conhecimento reúne tutoriais e perguntas frequentes para o usuário se resolver sozinho.<\/p><p><b>Automação:<\/b> Dá para criar gatilhos, como “ticket com a palavra emergência vai para o topo da fila”, ou ligar o chatbot ao banco do app para responder na hora “sua consulta é dia 22/03, às 14h”.<\/p><p><b>SLA:<\/b> É uma promessa de prazo de atendimento, como “responder em até 1 hora em horário comercial”. Ela deixa claro para o usuário o que esperar e para a equipe qual meta cumprir.<\/p><p><b>Atender bem:<\/b> Empatia (mostrar que entendeu o problema), foco na solução (“vamos resolver assim”, e não “isso acontece porque...”), tom respeitoso e respostas-modelo adaptadas a cada caso, para não soar como robô.<\/p><p class=\"ex\"><b>Indicadores do suporte:<\/b> tempo médio de resposta; FCR, se o problema foi resolvido no primeiro contato; CSAT, a nota de satisfação depois do atendimento; e NPS, o quanto o usuário recomendaria o app para um amigo.<\/p><h2>③ <b>Ciclo de vida do app:<\/b> <i>Do lançamento à despedida<\/i><\/h2><p><b>As fases:<\/b> Como um ser vivo, o app passa por fases. No lançamento, busca os primeiros usuários. No crescimento, melhora rápido com o feedback. Na maturidade, o número de usuários estabiliza e o foco é manter quem já usa. No declínio, os usuários vão embora e é hora de renovar ou encerrar.<\/p><p><b>Planejar atualizações:<\/b> Lançar versões num ritmo combinado (quinzenal ou mensal), com uma meta clara em cada uma, como “reduzir o tempo do login em 15%”, e validar com teste A/B ou grupo beta antes de liberar para todos.<\/p><p><b>Descontinuar:<\/b> Às vezes uma função precisa sair, porque quase ninguém usa e manter custa caro. Uma função sem bugs, mas pouco usada, provavelmente está em declínio. Para retirar sem revolta: ver quem ainda usa, avisar com pelo menos 30 dias de antecedência explicando o motivo, oferecer uma alternativa e desligar aos poucos.<\/p><h2>④ <b>Melhoria contínua:<\/b> <i>Feedback vira evolução<\/i><\/h2><p><b>Fontes:<\/b> Avaliações nas lojas, redes sociais, tickets de suporte, entrevistas com usuários, testes A/B e formulários depois de uma tarefa.<\/p><p><b>Priorizar:<\/b> Atenda primeiro o que aparece mais vezes, o que causa mais estrago, o que combina com a estratégia do app e o que gera mais valor pelo esforço que dá.<\/p><p><b>Ciclo PDCA:<\/b> Planejar (o que melhorar e por quê) → Executar (fazer a mudança) → Verificar (medir se melhorou) → Agir (manter o que funcionou e aprender para o próximo ciclo). E volta ao começo.<\/p><p><b>Medir o resultado:<\/b> Menos tempo para concluir tarefas, mais conversão, menos tickets no suporte, mais retenção e NPS maior. No ConsultaJá, um filtro por plano de saúde, pedido havia meses, reduziu em 27% o tempo de agendamento.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Toda melhoria começa e termina num número: meça antes de mudar, meça depois e só mantenha o que melhorou de verdade.<\/p>", "qs": [{ "q": "Qual ferramenta permite rastrear eventos personalizados?", "o": ["Google Play Console", "Firebase Analytics", "App Store Connect", "Instabug"], "t": "per" }, { "q": "Por que analisar o desempenho de um app é importante?", "o": ["Para reduzir o uso de memória do celular.", "Para melhorar o visual do aplicativo.", "Para entender o uso e tomar boas decisões.", "Para evitar que o app seja desinstalado."], "t": "per" }, { "q": "O que o Instabug permite fazer?", "o": ["Criar relatórios de retenção e funis.", "Fazer segmentações por tipo de usuário.", "Coletar feedbacks e rastrear bugs.", "Analisar eventos em dispositivos iOS."], "t": "per" }, { "q": "O que um funil de uso mostra?", "o": ["Em qual etapa os usuários abandonam o app", "A cor preferida dos usuários", "O tamanho do arquivo do app", "O preço da conta de desenvolvedor"], "t": "mc" }, { "q": "Qual tipo de ferramenta organiza tickets de suporte?", "o": ["Editor de imagens", "Help Desk", "Compilador", "Banco vetorial"], "t": "mc" }, { "q": "O que é um SLA no suporte?", "o": ["Um tipo de chatbot", "Uma linguagem de programação", "Um acordo de nível de serviço, como responder em até 1 h", "Uma tela de login"], "t": "mc" }, { "q": "O que o Google Play Console oferece para análise?", "o": ["Edição de vídeos promocionais", "Criação de código automático", "Pagamento dos influenciadores", "Dados de desempenho, taxa de erros e feedbacks"], "t": "mc" }, { "q": "Por que comunicar a descontinuação de uma função?", "o": ["Para deixar o app mais lento", "Para manter a confiança dos usuários", "Porque a loja pede um vídeo novo", "Para aumentar o tamanho do app"], "t": "mc" }, { "q": "No caso ConsultaJá, os pedidos de ajuda aumentaram e as respostas estão demorando. Proponha duas melhorias no suporte.", "o": null, "t": "ab" }, { "q": "Descreva um ciclo de melhoria para um app: qual dado analisaria, que ação faria e como mediria o sucesso.", "o": null, "t": "ab" }] }] }];
        const L = 'ABCD'; const app = document.getElementById('app');
        const S = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { } } };
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const key = (m, n) => 'resp-' + m.id + '-' + n;

        function route() {

        function home() {
            app.innerHTML = `<header class="top"><h1>Atividades do Técnico em Desenvolvimento de Sistemas</h1><p>Escolha a pasta da sua matéria. Dentro dela estão as semanas, com a lousa e a atividade.</p></header>
 <nav class="folders" aria-label="Matérias">${DATA.map(m => `<a class="folder" style="--c:${m.cor}" data-sigla="${m.sigla}" href="#${m.id}"><strong>${esc(m.nome)}</strong><span>${m.semanas.length} semanas: ${m.semanas[0].n} a ${m.semanas[m.semanas.length - 1].n}</span></a>`).join('')}</nav>`;
        }
        function pasta(m) {
            app.innerHTML = `<nav class="crumbs"><a href="#">Pastas</a><span>/</span><span>${m.sigla}</span></nav><header class="top"><h1>${esc(m.nome)}</h1></header>
 <nav class="weeks" aria-label="Semanas" style="--c:${m.cor}">${m.semanas.map(w => { const d = countDone(m, w); return `<a class="week" href="#${m.id}-${w.n}"><b class="n">Sem. ${w.n}</b><span class="t"><strong>${esc(w.tema)}</strong><small>${esc(w.frase)}</small></span><span class="chip ${d === w.qs.length ? 'done' : ''}">${d}/${w.qs.length}</span></a>` }).join('')}</nav>`;
            window.scrollTo(0, 0);
        }
        function semana(m, w, tab) {
            app.innerHTML = `<nav class="crumbs"><a href="#">Pastas</a><span>/</span><a href="#${m.id}">${m.sigla}</a><span>/</span><span>Semana ${w.n}</span></nav>
 <div class="tabs" role="tablist"><button id="t-lousa" role="tab" aria-selected="${tab === 'lousa'}">Lousa</button><button id="t-ativ" role="tab" aria-selected="${tab === 'atividade'}">Atividade</button></div><div id="view"></div>`;
            document.getElementById('t-lousa').onclick = () => { location.hash = m.id + '-' + w.n };
            document.getElementById('t-ativ').onclick = () => { location.hash = m.id + '-' + w.n + '-atividade' };
            const v = document.getElementById('view');
            if (tab === 'lousa') { v.innerHTML = `<article class="paper">${w.html}</article>`; return }
            atividade(m, w, v);
        }
        function atividade(m, w, v) {
            const k = key(m, w.n); const r = S.get(k, {}); const who = S.get('aluno', { nome: '', turma: '' });
            const qHtml = (q, i) => q.t === 'ab'
                ? `<fieldset class="q" id="q${i}"><legend></legend><label class="f" for="a${i}"><span class="enun"><span class="num">${i + 1}.</span>${esc(q.q)}</span></label><textarea id="a${i}" data-i="${i}">${esc(r[i] || '')}</textarea></fieldset>`
                : `<fieldset class="q" id="q${i}"><legend></legend><div class="enun"><span class="num">${i + 1}.</span>${esc(q.q)}</div>${q.o.map((o, j) => `<label class="opt"><input type="radio" name="r${i}" value="${j}" data-i="${i}" ${String(r[i]) === String(j) ? 'checked' : ''}><b>${L[j]})</b><span>${esc(o)}</span></label>`).join('')}</fieldset>`;
            const sec = (t, note, a, b) => `<h3 class="sec">${t}</h3>${note ? `<p class="sec-note">${note}</p>` : ''}${w.qs.slice(a, b).map((q, i) => qHtml(q, i + a)).join('')}`;
            v.innerHTML = `<form id="form" class="wrap" novalidate style="max-width:none">
 <div class="card who"><label class="f" for="nome">Seu nome completo<input type="text" id="nome" autocomplete="name" value="${esc(who.nome)}"></label><label class="f" for="turma">Turma<input type="text" id="turma" placeholder="Ex.: 2º A" value="${esc(who.turma)}"></label></div>
 ${sec('Pause e Responda', 'Perguntas das aulas da semana.', 0, 3)}${sec('Questões da semana', '', 3, 8)}${sec('Com suas palavras', 'Escreva sua resposta. Não vale copiar da lousa.', 8, 10)}
 <div id="out"></div>
 <div class="bar"><span id="prog"></span><button type="button" class="copy" id="copy">Copiar Atividade</button></div></form>`;
            const prog = () => { document.getElementById('prog').textContent = countDone(m, w) + ' de ' + w.qs.length + ' respondidas' }; prog();
            const form = document.getElementById('form');
            const save = e => { const t = e.target; if (t.dataset.i === undefined) return; const c = S.get(k, {}); c[t.dataset.i] = t.value; mem[t.dataset.i] = t.value; S.set(k, c); document.getElementById('q' + t.dataset.i).classList.remove('miss'); prog() };
            const mem = Object.assign({}, r);
            form.addEventListener('change', save); form.addEventListener('input', save);
            ['nome', 'turma'].forEach(id => document.getElementById(id).addEventListener('input', () => S.set('aluno', { nome: document.getElementById('nome').value, turma: document.getElementById('turma').value })));
            document.getElementById('copy').onclick = () => {
                const out = document.getElementById('out'); const nome = document.getElementById('nome').value.trim(), turma = document.getElementById('turma').value.trim();
                const miss = w.qs.map((q, i) => i).filter(i => { const x = mem[i]; return x === undefined || String(x).trim() === '' });
                document.querySelectorAll('.miss').forEach(e => e.classList.remove('miss')); miss.forEach(i => document.getElementById('q' + i).classList.add('miss'));
                if (!nome || !turma || miss.length) {
                    const faltas = []; if (!nome) faltas.push('seu nome'); if (!turma) faltas.push('sua turma'); if (miss.length) faltas.push((miss.length > 1 ? 'as questões ' : 'a questão ') + miss.map(i => i + 1).join(', '));
                    out.innerHTML = `<div class="msg bad" role="alert"><strong>Ainda falta preencher</strong>${esc(faltas.join(', '))}.</div>`;
                    out.scrollIntoView({ block: 'center' }); return
                }
                const txt = [`ATIVIDADE SEMANAL - ${m.nome.toUpperCase()}`, `Semana ${w.n}: ${w.tema}`, `Aluno(a): ${nome}`, `Turma: ${turma}`, `Data: ${new Date().toLocaleDateString('pt-BR')}`, ''];
                w.qs.forEach((q, i) => { txt.push(`${i + 1}. ${q.q}`); if (q.t === 'ab') txt.push('Resposta: ' + String(mem[i]).trim()); else { const j = +mem[i]; txt.push(`Resposta: ${L[j]}) ${q.o[j]}`) } txt.push('') });
                const text = txt.join('\n');
                const done = () => { out.innerHTML = `<div class="msg ok" role="status"><strong>Atividade copiada!</strong>Agora cole e envie na plataforma Educação Profissional, como registro de aula da semana feita.</div>`; out.scrollIntoView({ block: 'center' }) };
                const fail = () => { out.innerHTML = `<div class="msg bad" role="alert"><strong>Não consegui copiar sozinho</strong>Selecione o texto abaixo, copie e envie na plataforma Educação Profissional, como registro de aula da semana feita.</div><textarea id="fallback" readonly aria-label="Texto da atividade"></textarea>`; const f = document.getElementById('fallback'); f.value = text; f.focus(); f.select() };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail); else fail();
            };
        }
        window.addEventListener('hashchange', route); route();
    </script>

</body>

</html>
