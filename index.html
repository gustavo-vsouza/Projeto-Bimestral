reaproveita o código. Workspace separa os ambientes. Juntos: um código, vários ambientes.<\/p><h2>③ <b>Stack completa:<\/b> <i>Tudo numa única execução<\/i><\/h2><p><b>Stack 2-tier:<\/b> Uma aplicação real precisa de várias peças juntas: a rede (VPC e sub-redes, onde tudo vai \"morar\"), o compute (servidores com AutoScaling, que aumentam ou diminuem conforme o acesso), o ALB (balanceador de carga, que distribui os acessos entre os servidores) e o banco (RDS, banco de dados gerenciado pela AWS). \"2-tier\" quer dizer duas camadas: aplicação e dados.<\/p><p><b>Dependências:<\/b> Algumas peças só podem existir se outras existirem antes. A rede vem primeiro, porque servidores, balanceador e banco precisam de um lugar para ficar. O ALB depende do compute (precisa saber para quais servidores mandar os acessos). O banco depende só da rede.<\/p><p class=\"ex\"><b>Analogia:<\/b> construir uma casa: primeiro o terreno e a fundação (rede), depois os cômodos (compute e banco) e, por último, a recepção que distribui as visitas (ALB).<\/p><p><b>Conexão:<\/b> Os módulos conversam por saídas e entradas. Um módulo entrega um dado (output) e outro o recebe como variável. Exemplo: a rede entrega o identificador da sub-rede; o compute usa esse dado para saber onde criar os servidores.<\/p><p><b>Ordem:<\/b> Não é preciso decorar a ordem: lendo as dependências, o Terraform descobre sozinho o que criar primeiro. Um único <code>apply<\/code> sobe a stack inteira. Se um módulo falhar, o que depende dele não é criado.<\/p><p class=\"alerta\"><b>Cuidado:<\/b> decorar \"rede → compute → alb → banco\" não adianta. Mais importante que a sequência é entender quem depende de quem.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Nunca pule o plan. Ele mostra o que será criado, alterado ou destruído antes de acontecer. Infraestrutura em arquivo é infraestrutura que dá para revisar, repetir e versionar.<\/p> ", "qs": [{ "q": "Qual comando do Terraform mostra o que será criado antes da aplicação real?", "o": ["terraform destroy", "terraform plan", "terraform output", "terraform validate"], "t": "per" }, { "q": "Ao usar módulos e workspaces no Terraform, qual combinação ajuda mais a evitar repetição e a separar dev de prod?", "o": ["Copiar arquivos para cada ambiente.", "Usar módulo e mudar só comentários.", "Deixar tudo em um único bloco.", "Criar módulo e usar workspaces."], "t": "per" }, { "q": "Ao montar uma stack completa com módulos no Terraform, qual prática ajuda mais a garantir organização e escalabilidade?", "o": ["Colocar tudo em um único arquivo.", "Copiar código para cada recurso.", "Separar em módulos com responsabilidades.", "Criar arquivos sem padrão definido."], "t": "per" }, { "q": "O que é Infraestrutura como Código (IaC)?", "o": ["Programar aplicativos para celular", "Descrever a infraestrutura em arquivos de texto executáveis", "Instalar servidores só por telas gráficas", "Escrever manuais em PDF"], "t": "mc" }, { "q": "No Terraform, o que define ONDE a infraestrutura será criada?", "o": ["O provider", "O resource", "O output", "O comentário"], "t": "mc" }, { "q": "Qual é a ordem correta dos comandos do Terraform?", "o": ["apply → plan → init", "plan → init → apply", "init → plan → apply", "init → apply → plan"], "t": "mc" }, { "q": "O que é um módulo no Terraform?", "o": ["Um tipo de servidor físico", "Um arquivo de senhas", "Um comando para apagar recursos", "Uma peça reutilizável com um grupo de recursos"], "t": "mc" }, { "q": "Na stack 2-tier, o ALB depende de quem?", "o": ["Apenas do banco", "Do compute, pois precisa de destino", "De ninguém", "Do workspace de dev"], "t": "mc" }, { "q": "Explique por que o terraform plan é comparado a conferir o carrinho antes de pagar.", "o": null, "t": "ab" }, { "q": "Sua empresa precisa criar um ambiente de homologação igual ao de produção. Como você faria usando Terraform, sem duplicar código?", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Docker Fundamentals", "frase": "Empacotar, isolar e limitar", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Docker Fundamentals<\/p><p class=\"frase\">Empacotar, isolar e limitar<\/p><\/div><h2>① <b>Namespaces e cgroups:<\/b> <i>Isolar e limitar<\/i><\/h2><p><b>Contêiner:<\/b> Um pacote com a aplicação e tudo o que ela precisa para rodar: bibliotecas, configurações e as versões certas de cada coisa. Como o pacote vai junto, a aplicação roda igual no notebook do dev, no servidor de teste e em produção. É o fim do \"funciona na minha máquina\". O Docker é a ferramenta mais usada para criar e rodar contêineres.<\/p><p class=\"ex\"><b>Analogia:<\/b> o contêiner de navio. Não importa o que tem dentro, o guindaste do porto carrega todos do mesmo jeito. Diferente de uma máquina virtual, o contêiner usa o mesmo sistema operacional do servidor, por isso é leve e sobe em segundos.<\/p><p><b>O desafio:<\/b> Vários contêineres dividem o mesmo servidor. Para não virar bagunça, o sistema operacional precisa garantir duas coisas: que um não enxergue nem mexa no outro (isolamento) e que nenhum use os recursos todos sozinho (limites).<\/p><p><b>Namespaces:<\/b> Cuidam do isolamento. Cada contêiner recebe a sua própria \"visão\" do sistema: seus processos, sua rede, seus usuários e seus arquivos. Para ele, é como se estivesse sozinho na máquina.<\/p><p class=\"ex\"><b>Analogia:<\/b> cada pessoa da casa no seu quarto, de porta fechada. Ninguém mexe nas coisas do outro.<\/p><p><b>cgroups (control groups):<\/b> Cuidam dos limites. Definem quanto de CPU, memória e outros recursos cada contêiner pode consumir. Assim, um contêiner com defeito que começa a gastar tudo não derruba os vizinhos.<\/p><p class=\"ex\"><b>Analogia:<\/b> a internet da casa dividida em cotas: cada um tem a sua parte e ninguém consome a banda inteira.<\/p><p><b>Teste rápido:<\/b> Falou em limite de memória ou de CPU → cgroups. Falou em separar ou em enxergar só o seu (rede, processos, arquivos) → namespaces. Isolar e limitar são coisas diferentes, e o contêiner precisa das duas.<\/p><h2>② <b>Imagem enxuta:<\/b> <i>Multi-stage, slim e distroless<\/i><\/h2><p><b>Imagem:<\/b> O molde do contêiner. A imagem é o arquivo com tudo empacotado; o contêiner é a imagem rodando (como a receita e o bolo). Uma imagem grande ocupa espaço, demora para baixar, atrasa o deploy e carrega mais coisas que podem ser atacadas: a chamada superfície de ataque.<\/p><p class=\"ex\"><b>Exemplo:<\/b> uma imagem padrão de Node.js passa de 1 GB. As versões enxutas ficam abaixo de 200 MB.<\/p><p><b>Slim:<\/b> Versão \"magra\" da imagem: tira pacotes desnecessários do sistema, mas mantém as ferramentas básicas. É um bom equilíbrio entre tamanho e compatibilidade.<\/p><p><b>Distroless:<\/b> Vai além: tira até o terminal (shell) e o instalador de pacotes. Sobra só o necessário para a aplicação rodar. Se um invasor conseguir entrar, não encontra ferramentas para usar. Ideal para produção com foco em segurança.<\/p><p><b>Multi-stage:<\/b> Um Dockerfile (a \"receita\" da imagem) com várias etapas. A primeira usa uma imagem completa para compilar a aplicação, cheia de compiladores e arquivos temporários. A última começa limpa e copia só o resultado pronto. Tudo o que foi usado para construir fica para trás.<\/p><p class=\"ex\"><b>Lendo o exemplo:<\/b> a etapa build instala e compila com o Node completo; a etapa final é distroless e recebe só a pasta pronta (dist).<\/p><pre style=\"height:224px\"><code>FROM node:20 AS build\nWORKDIR /app\nCOPY . .\nRUN npm install &amp;&amp; npm run build\n\nFROM gcr.io/distroless/nodejs20-debian12\nCOPY --from=build /app/dist /app\nCMD [\"/app/server.js\"]<\/code><\/pre><h2>③ <b>Compose, redes e logs:<\/b> <i>Vários contêineres juntos<\/i><\/h2><p><b>Vários serviços:<\/b> Uma aplicação real quase nunca roda sozinha: precisa de banco de dados, cache, fila de mensagens. Cada serviço fica no seu próprio contêiner, e todos precisam subir juntos e conversar entre si.<\/p><p><b>Docker Compose:<\/b> Descreve todos esses contêineres num único arquivo: quais serviços existem, que portas usam, onde guardam dados (volumes) e como se conectam (redes). Com um comando, o ambiente inteiro sobe. Ajuda a deixar o ambiente do dev parecido com o de produção.<\/p><p class=\"ex\"><b>Lendo o exemplo:<\/b> há dois serviços: app (construído a partir do código, na porta 3000) e banco (imagem pronta do PostgreSQL).<\/p><pre style=\"height:160px\"><code>services:\n  app:\n    build: .\n    ports: [\"3000:3000\"]\n  banco:\n    image: postgres:16<\/code><\/pre><p><b>Rede bridge:<\/b> Rede interna que o Compose cria para os contêineres do mesmo ambiente conversarem entre si, isolados do resto da máquina. O app chama o banco pelo nome do serviço (ex.: \"banco\"), sem precisar decorar um endereço IP, que pode mudar a cada vez que o ambiente sobe.<\/p><p><b>Logs:<\/b> O \"diário\" de cada contêiner: mensagens de inicialização, erros e falhas de conexão. Com vários serviços, os logs dizem qual parte do sistema está com problema.<\/p><p><b>Onde olhar:<\/b> Comece pelos dois lados da conversa que falhou. App não acessa o banco → logs do app (ele tentou conectar?) e do banco (recebeu? recusou?). Cache subiu, mas não é usado → logs do app e do cache.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> No multi-stage, a etapa de build pode ser bagunçada, mas a imagem final tem que sair limpa, leve e segura. Isolar (namespaces) e limitar (cgroups) são coisas diferentes, e o contêiner precisa das duas.<\/p> ", "qs": [{ "q": "Qual afirmação descreve melhor a diferença entre namespaces e cgroups?", "o": ["Namespaces apagam arquivos; cgroups criam rede.", "Namespaces isolam; cgroups controlam recursos.", "Namespaces substituem Docker; cgroups substituem Linux.", "Namespaces e cgroups fazem exatamente a mesma coisa."], "t": "per" }, { "q": "Qual é uma vantagem de usar multi-stage e imagens distroless?", "o": ["Aumentar a quantidade de ferramentas no contêiner.", "Guardar todos os arquivos temporários do build.", "Misturar build e execução na mesma etapa.", "Deixar a imagem menor e com menos itens desnecessários."], "t": "per" }, { "q": "Qual é uma função do Docker Compose?", "o": ["Substituir completamente o sistema operacional.", "Impedir comunicação entre serviços.", "Organizar vários contêineres em um mesmo ambiente.", "Apagar automaticamente todos os logs."], "t": "per" }, { "q": "Qual recurso do Linux limita o uso de memória de um contêiner?", "o": ["Namespaces", "cgroups", "Compose", "Distroless"], "t": "mc" }, { "q": "Um contêiner não consegue ver os processos de outro. Isso é papel de:", "o": ["Namespaces", "cgroups", "Logs", "Volumes"], "t": "mc" }, { "q": "O que uma imagem distroless retira?", "o": ["A aplicação", "O código compilado", "O terminal e o instalador de pacotes", "As variáveis do sistema"], "t": "mc" }, { "q": "Por que imagens grandes são um problema?", "o": ["Porque rodam só em celulares", "Porque não aceitam logs", "Porque não podem ter rede", "Porque atrasam o deploy e aumentam a superfície de ataque"], "t": "mc" }, { "q": "Como o app acessa o banco dentro da rede bridge do Compose?", "o": ["Pelo IP público da internet", "Pelo pendrive do servidor", "Pelo nome do serviço", "Por uma planilha compartilhada"], "t": "mc" }, { "q": "O app não consegue acessar o banco em um ambiente com Docker Compose. Descreva como você investigaria o problema.", "o": null, "t": "ab" }, { "q": "Explique a vantagem do multi-stage com uma comparação do dia a dia.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Kubernetes Essentials", "frase": "Você descreve o que quer", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Kubernetes Essentials<\/p><p class=\"frase\">Você descreve o que quer<\/p><\/div><h2>① <b>Arquitetura:<\/b> <i>Quem decide e quem executa<\/i><\/h2><p><b>Kubernetes:<\/b> Com o Compose, organizamos alguns contêineres numa máquina. Mas e quando são centenas, espalhados em dezenas de servidores, e precisam continuar no ar mesmo se um servidor quebrar? O Kubernetes é um orquestrador: automatiza deploy, escala, recuperação de falhas e gerenciamento de contêineres num cluster (conjunto de servidores que trabalham como se fossem um só).<\/p><p class=\"ex\"><b>Analogia:<\/b> um maestro. Ele não toca nenhum instrumento, mas decide quem toca o quê e quando.<\/p><p><b>Control Plane (Master):<\/b> O \"cérebro\" do cluster. Guarda o estado de tudo, decide em qual servidor cada aplicação vai rodar e fica vigiando se tudo está como deveria. A documentação atual usa só o nome Control Plane.<\/p><p><b>Workers:<\/b> Os servidores que fazem o trabalho pesado: rodam os pods com as aplicações. Recebem as ordens do Control Plane e executam.<\/p><p class=\"ex\"><b>Analogia:<\/b> num evento da escola, o Control Plane é a comissão organizadora e os Workers são as equipes que montam as barracas.<\/p><p><b>kube-API:<\/b> A porta de entrada do cluster e o único canal oficial de pedidos. Tudo passa por ela: os comandos da equipe, os manifestos e até a comunicação entre as partes internas.<\/p><p><b>Pod:<\/b> A menor unidade que o Kubernetes executa. Envolve um ou mais contêineres que rodam juntos e compartilham rede e armazenamento. O Kubernetes não gerencia contêineres soltos: gerencia pods.<\/p><p><b>Declarativo:<\/b> Em vez de dar ordens passo a passo (\"suba um contêiner, agora outro, esse caiu, suba de novo\"), você escreve um manifesto descrevendo o estado desejado (\"quero sempre 3 cópias do app\"). O Kubernetes compara o desejado com o atual o tempo todo e corrige a diferença sozinho.<\/p><p class=\"ex\"><b>Analogia:<\/b> o ar-condicionado com termostato. Você diz \"quero 23 °C\" e ele liga e desliga sozinho para manter; você não fica controlando o motor.<\/p><p><b>Caminho de um acesso:<\/b> Usuário → Ingress (porta de entrada do tráfego que vem de fora) → Service (endereço fixo da aplicação) → Pods (onde o app roda de verdade).<\/p><h2>② <b>Deployment, Service e ConfigMap:<\/b> <i>Manter, acessar e configurar<\/i><\/h2><p><b>Stateless:<\/b> Aplicação que não guarda dados importantes dentro do próprio contêiner; eles ficam num banco ou serviço externo. Se um pod cai e outro sobe no lugar, nada se perde. Por isso combina com o Kubernetes: dá para trocar, multiplicar e atualizar pods à vontade.<\/p><p class=\"ex\"><b>Exemplos:<\/b> APIs simples, frontends web e serviços de login que guardam os dados num banco externo.<\/p><p><b>Deployment:<\/b> O objeto que cuida dos pods de uma aplicação. Nele você declara quantas réplicas (cópias) quer e qual versão rodar. Se um pod falha, o Deployment cria outro; se você muda a versão, ele coordena a troca.<\/p><p class=\"ex\"><b>Lendo o exemplo:<\/b> <code>replicas: 3<\/code> é o estado desejado. Se um dos três pods cair, o Kubernetes sobe outro para voltar a três.<\/p><pre style=\"height:160px\"><code>apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: meu-app\nspec:\n  replicas: 3     # estado desejado: 3 cópias<\/code><\/pre><p><b>Service:<\/b> Pods nascem e morrem o tempo todo, e cada pod novo ganha um endereço diferente. O Service dá à aplicação um endereço fixo e distribui os acessos entre os pods saudáveis que estiverem rodando naquele momento.<\/p><p class=\"ex\"><b>Analogia:<\/b> o número da central de atendimento é sempre o mesmo, mesmo que os atendentes mudem a cada turno.<\/p><p><b>ConfigMap:<\/b> Guarda configurações fora da imagem: porta, URL de um serviço, nome do ambiente. Para mudar uma configuração não é preciso reconstruir a imagem; basta alterar o ConfigMap. Assim, a mesma imagem serve para dev e para prod.<\/p><p><b>Rolling update:<\/b> Atualização gradual: os pods da versão nova sobem aos poucos, enquanto os da versão antiga são desligados. A aplicação não sai do ar durante a troca.<\/p><p><b>Rollback:<\/b> Se a versão nova der problema, volta-se rapidamente para a anterior. É o \"desfazer\" da atualização.<\/p><h2>③ <b>Escala e rollout:<\/b> <i>Ajustar à carga<\/i><\/h2><p><b>Escalar:<\/b> Ajustar a quantidade de réplicas (pods) à carga. Muita gente acessando ao mesmo tempo → mais pods para dividir o trabalho. Pouco acesso → menos pods, para não pagar por servidor parado.<\/p><p><b>Escala manual:<\/b> A equipe define o número de réplicas. Funciona quando a carga é conhecida e previsível.<\/p><p class=\"ex\"><b>Exemplo:<\/b> uma loja sabe que na Black Friday o acesso triplica e deixa 9 réplicas prontas na véspera.<\/p><p><b>HPA (Horizontal Pod Autoscaler):<\/b> Escala automática. Observa métricas como uso de CPU e de memória e ajusta a quantidade de pods sozinho: CPU alta → mais pods; CPU baixa → menos pods. É \"horizontal\" porque aumenta a quantidade de pods, e não o tamanho de cada um.<\/p><p class=\"ex\"><b>Exemplo:<\/b> num app de delivery, os pedidos disparam no almoço e no jantar e o HPA sobe pods; de madrugada, ele reduz.<\/p><p><b>Rollout:<\/b> O processo de publicar uma nova versão em etapas, trocando os pods aos poucos (é o rolling update na prática). Durante o rollout, acompanhe: os pods novos subiram? O app continua respondendo? As métricas continuam saudáveis? Se não, rollback.<\/p><p><b>Escalar ≠ rollout:<\/b> Escalar muda a quantidade de pods, mantendo a mesma versão. Rollout troca a versão, mantendo a mesma quantidade. São coisas diferentes, que podem até acontecer ao mesmo tempo.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> No Kubernetes você descreve o que quer, não cada passo. Pod caiu? O Deployment recria. Pods mudaram? O Service continua no mesmo endereço. Mudou configuração? Fica no ConfigMap, não na imagem.<\/p> ", "qs": [{ "q": "No Kubernetes, o que faz um manifesto declarativo?", "o": ["Apaga automaticamente o cluster.", "Substitui a necessidade da kube-API.", "Descreve o estado desejado do recurso.", "Cria somente máquinas virtuais."], "t": "per" }, { "q": "Qual recurso do Kubernetes é mais indicado para guardar configurações separadas do código da aplicação?", "o": ["Pod", "Service", "Node", "ConfigMap"], "t": "per" }, { "q": "Qual é a principal função do HPA no Kubernetes?", "o": ["Ajustar automaticamente a quantidade de pods.", "Criar apenas máquinas virtuais.", "Substituir todos os services do cluster.", "Impedir atualizações da aplicação."], "t": "per" }, { "q": "Qual é a menor unidade executável do Kubernetes?", "o": ["Cluster", "Node", "Pod", "Service"], "t": "mc" }, { "q": "Quem escolhe onde cada aplicação vai rodar?", "o": ["Os usuários finais", "O Control Plane", "O ConfigMap", "O navegador"], "t": "mc" }, { "q": "Qual objeto mantém 3 cópias do app e recria pods que falham?", "o": ["Ingress", "ConfigMap", "Secret de log", "Deployment"], "t": "mc" }, { "q": "O que o Service oferece?", "o": ["Um endereço estável, mesmo com pods sendo trocados", "Uma imagem Docker menor", "Um backup do banco de dados", "Um novo cluster a cada acesso"], "t": "mc" }, { "q": "Qual a diferença entre escalar e rollout?", "o": ["São a mesma coisa", "Escalar troca a versão; rollout muda a quantidade", "Escalar muda a quantidade de pods; rollout troca a versão", "Os dois apagam o cluster"], "t": "mc" }, { "q": "Explique com suas palavras o que é o modelo declarativo do Kubernetes e dê um exemplo.", "o": null, "t": "ab" }, { "q": "Em um site de vendas na Black Friday, por que usar HPA em vez de escala manual?", "o": null, "t": "ab" }] }, { "n": 25, "tema": "SRE, SLI/SLO e error budget", "frase": "Confiabilidade virou número", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">SRE, SLI/SLO e error budget<\/p><p class=\"frase\">Confiabilidade virou número<\/p><\/div><h2>① <b>SRE e toil:<\/b> <i>Automatizar em vez de apagar incêndio<\/i><\/h2><p><b>SRE (Site Reliability Engineering):<\/b> Engenharia de confiabilidade: área criada no Google que trata a operação de sistemas como um problema de engenharia. Em vez de depender de gente apagando incêndio, usa programação, automação e monitoramento para manter o sistema estável, rápido e disponível. Também define metas de confiabilidade e conduz a resposta a incidentes.<\/p><p><b>DevOps x SRE:<\/b> Têm relação, mas não são a mesma coisa. DevOps é a cultura que melhora como o software é entregue (colaboração, esteira, deploy frequente). SRE cuida de o software continuar funcionando bem depois da entrega, com metas e números.<\/p><p class=\"ex\"><b>Na prática:<\/b> o DevOps garante que a nova versão do app chegue rápido ao cliente. O SRE garante que, na sexta à noite, com mil pedidos por minuto, o app aguente.<\/p><p><b>Toil:<\/b> Trabalho operacional manual, repetitivo, sempre igual e que poderia ser automatizado. Não é qualquer \"trabalho chato\": é aquele que cresce junto com o sistema e não deixa nada melhor depois de feito.<\/p><p class=\"ex\"><b>Exemplos:<\/b> reiniciar o mesmo serviço todo dia de manhã, corrigir o mesmo erro toda semana, conferir os mesmos alertas um por um.<\/p><p><b>Limite de 50%:<\/b> O Google recomenda que um SRE gaste no máximo metade do tempo com toil. O resto vai para automação e melhorias que evitam os problemas. Quanto mais toil, menos tempo sobra para melhorar, e mais toil aparece: é um ciclo vicioso.<\/p><p><b>Caso:<\/b> uma fintech vê as APIs de pagamento ficarem lentas e caírem em datas promocionais. Contratar mais gente para o plantão resolve? Não: mais gente apagando incêndio não deixa o sistema mais confiável, só aumenta o número de pessoas reagindo. Problema recorrente pede solução estrutural: automatizar, corrigir a causa e, se preciso, pausar lançamentos para estabilizar.<\/p><h2>② <b>SLI, SLO e SLA:<\/b> <i>Medir, definir meta, prometer<\/i><\/h2><p><b>Por que medir:<\/b> \"O sistema está bom\" é opinião. Rápido para quem? Estável quanto? Para cuidar da confiabilidade, ela precisa virar um número que qualquer pessoa consegue conferir.<\/p><p><b>SLI (Service Level Indicator):<\/b> O indicador: o que você mede de fato, o comportamento real do serviço. Exemplos: a porcentagem de requisições respondidas corretamente, ou a porcentagem respondida em até 300 ms (latência = tempo de resposta).<\/p><p><b>SLO (Service Level Objective):<\/b> O objetivo: a meta da equipe para aquele indicador. Exemplo: \"99,9% das requisições devem ser respondidas corretamente no mês\". O time decide o SLO a partir do que o negócio precisa.<\/p><p><b>SLA (Service Level Agreement):<\/b> O acordo: a promessa em contrato com o cliente, normalmente com multa ou desconto se não for cumprida. Costuma ser mais folgado que o SLO, para o time ter margem antes de quebrar o contrato.<\/p><p class=\"ex\"><b>Juntando os três:<\/b> o SLI medido no mês foi 99,95%; o SLO interno é 99,9% (meta batida); o SLA prometido ao cliente é 99,5%.<\/p><p class=\"alerta\"><b>Cuidado:<\/b> não confunda SLI com SLO. O SLI é o que aconteceu; o SLO é o que a equipe quer que aconteça. Num dia de uma loja online com 10.000 requisições:<\/p><pre style=\"height:64px\"><code>10.000 requisições, 9.990 corretas  →  SLI = 99,9%\n9.850 em até 300 ms                  →  SLI de latência = 98,5%<\/code><\/pre><h2>③ <b>Error budget:<\/b> <i>A margem de falha permitida<\/i><\/h2><p><b>Error budget (orçamento de erro):<\/b> Se a meta é 99,9%, o 0,1% que sobra é a margem de falha permitida. A conta é 100% − SLO. Enquanto o time gasta menos que essa margem, o sistema continua cumprindo a meta.<\/p><p><b>Em minutos:<\/b> Um mês de 30 dias tem 43.200 minutos. 0,1% disso dá 43,2 minutos. Ou seja: o serviço pode ficar até 43,2 minutos fora do ar no mês e ainda cumprir o SLO.<\/p><p><b>Por que não 100%?:<\/b> Nenhum sistema é perfeito, e uma meta de 100% faria qualquer mudança parecer arriscada demais: nada novo seria lançado. A margem é um espaço controlado para inovar, testar e errar pouco.<\/p><p><b>Política (error budget policy):<\/b> O budget só serve se orientar decisões. A equipe combina antes o que fazer conforme o consumo, com gatilhos claros e verificáveis:<\/p><p><b>Faixa verde (até 50%):<\/b> Os lançamentos (releases) seguem normalmente.<\/p><p><b>Faixa amarela (50% a 100%):<\/b> Releases com mais revisão e cautela, e prioridade para reduzir riscos.<\/p><p><b>Faixa vermelha (acima de 100%):<\/b> O budget estourou. Congelar os releases que não forem emergenciais e focar em estabilidade até o serviço voltar ao SLO.<\/p><p class=\"ex\"><b>Calculando o consumo:<\/b> divida os minutos fora do ar pelo budget (43,2 min) e veja a faixa.<\/p><pre style=\"height:64px\"><code>32 min consumidos de 43,2 min  ≈ 74%  →  faixa amarela\n47 min consumidos de 43,2 min  ≈ 109% →  faixa vermelha<\/code><\/pre><p class=\"dica\"><b>Dica de ouro:<\/b> O error budget transforma a briga \"lançar rápido x não quebrar\" numa decisão com dados. Sobrou budget? Dá para inovar. Acabou? Estabilidade primeiro. Toil alto é sinal de que falta automação, não de que falta gente.<\/p> ", "qs": [{ "q": "O que melhor representa toil em SRE?", "o": ["Planejamento de interface do sistema.", "Trabalho repetitivo e manual na operação.", "Criação de identidade visual.", "Troca de linguagem de programação."], "t": "per" }, { "q": "Quando a equipe define que 99,9% das requisições devem funcionar corretamente, isso representa o quê?", "o": ["Um tipo de deploy", "Um alerta manual", "Um log de erro", "Um SLO"], "t": "per" }, { "q": "Se um serviço tem SLO mensal de 99,9%, o error budget representa o quê?", "o": ["O total de deploys do mês.", "O número de incidentes resolvidos.", "A margem aceitável de falha.", "O tempo médio de um release."], "t": "per" }, { "q": "O que é um SLI?", "o": ["Um indicador que mede o comportamento real do serviço", "Um contrato com multa", "Um servidor de backup", "Uma equipe de plantão"], "t": "mc" }, { "q": "Qual destes é um exemplo de toil?", "o": ["Criar um script de automação", "Definir um novo SLO", "Reiniciar o mesmo serviço na mão toda semana", "Estudar um novo framework"], "t": "mc" }, { "q": "Com SLO de 99,5%, qual é o error budget?", "o": ["0,05%", "0,5%", "5%", "99,5%"], "t": "mc" }, { "q": "De 20.000 requisições, 19.900 foram corretas. Qual é o SLI?", "o": ["95%", "98,5%", "99%", "99,5%"], "t": "mc" }, { "q": "O budget mensal estourou (acima de 100%). Qual decisão a política indica?", "o": ["Lançar mais funções", "Ignorar e seguir normalmente", "Congelar releases não emergenciais e focar em estabilidade", "Mudar a meta para 0%"], "t": "mc" }, { "q": "Com SLO de 99,9% em um mês de 30 dias, a equipe teve 30 min de indisponibilidade. Em qual faixa ela está? Mostre a conta.", "o": null, "t": "ab" }, { "q": "Dê um exemplo de toil na sua rotina (escola, casa ou projeto) e explique como poderia automatizá-lo.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "DevSecOps: segurança integrada ao pipeline", "frase": "Segurança desde o começo", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">DevSecOps: segurança integrada ao pipeline<\/p><p class=\"frase\">Segurança desde o começo<\/p><\/div><h2>① <b>Shift-left e SAST:<\/b> <i>Antes do merge<\/i><\/h2><p><b>DevSecOps:<\/b> DevOps + Sec (segurança). Em vez de a segurança ser uma etapa no fim do projeto, feita por outra equipe, ela entra na esteira e vira responsabilidade de todo o time.<\/p><p><b>Shift-left security:<\/b> Imagine a linha do tempo do projeto: à esquerda, planejar e programar; à direita, testar e publicar. Shift-left é empurrar a segurança para a esquerda, ou seja, verificar desde o início. Uma falha encontrada enquanto o código é escrito custa minutos para corrigir; encontrada em produção, pode custar dados vazados, multa e reputação.<\/p><p class=\"ex\"><b>Analogia:<\/b> revisar o trabalho do grupo enquanto ele é feito, em vez de descobrir um erro grave na última olhada antes de apresentar.<\/p><p><b>SAST (teste estático):<\/b> Ferramenta que lê o código-fonte sem executar o programa, procurando padrões perigosos: funções inseguras, falhas conhecidas e dados sensíveis expostos. Ferramentas comuns: SonarQube e Bandit.<\/p><p class=\"ex\"><b>Exemplo:<\/b> um dev deixa a senha do banco de dados escrita direto no código. O SAST aponta \"possível credencial exposta\" na linha exata.<\/p><p><b>SAST no PR:<\/b> O Pull Request (PR) é o pedido para juntar suas alterações ao código principal; o merge é a junção em si. Com o SAST na esteira, a análise roda sozinha a cada PR e bloqueia o merge até a falha ser corrigida. O PR vira também uma revisão de segurança.<\/p><p><b>Scan de dependências:<\/b> Seu projeto usa bibliotecas feitas por outras pessoas. Se uma delas tem uma falha conhecida, o seu sistema herda essa falha. O scan compara as bibliotecas usadas com listas de vulnerabilidades e avisa qual atualizar.<\/p><p><b>DAST (teste dinâmico):<\/b> O oposto do SAST: não lê o código, testa a aplicação rodando, por fora, como um atacante faria. Envia entradas estranhas para os formulários e tenta acessar o que não devia.<\/p><p class=\"ex\"><b>Analogia:<\/b> o SAST lê a receita procurando ingrediente estragado; o DAST prova o bolo pronto.<\/p><h2>② <b>Segurança do contêiner:<\/b> <i>Imagem e runtime<\/i><\/h2><p><b>Isolado ≠ seguro:<\/b> O contêiner isola a aplicação, mas, se a imagem já vem com componentes vulneráveis ou se ele roda com permissões demais, o risco continua lá dentro.<\/p><p><b>CVE (Common Vulnerabilities and Exposures):<\/b> Uma vulnerabilidade conhecida e registrada numa lista pública, com um código de identificação. Se uma CVE está na lista, os atacantes também a conhecem.<\/p><p><b>Scan da imagem:<\/b> Ferramentas como o Trivy abrem a imagem, listam todos os pacotes que estão dentro e comparam com a lista de CVEs. O resultado mostra quais vulnerabilidades existem e em quais pacotes, antes do deploy.<\/p><p><b>Severidade:<\/b> Cada vulnerabilidade recebe um nível: CRITICAL (crítica), HIGH (alta), MEDIUM (média) e LOW (baixa). Não dá para corrigir tudo ao mesmo tempo, então a severidade define a ordem: as críticas vêm primeiro.<\/p><p class=\"ex\"><b>Lendo o resultado:<\/b> neste scan, a equipe começa pela vulnerabilidade crítica e depois corrige as duas altas.<\/p><pre style=\"height:64px\"><code>trivy image minha-app:1.0\n# 5 vulnerabilidades: CRITICAL 1, HIGH 2, MEDIUM 2<\/code><\/pre><p><b>Hardening:<\/b> \"Blindar\" o sistema: reduzir vulnerabilidades e permissões desnecessárias para que, mesmo se algo der errado, o estrago seja pequeno. No contêiner, isso acontece em dois lugares:<\/p><p><b>Na imagem:<\/b> antes de o contêiner existir: usar uma imagem base enxuta (slim ou distroless), remover dependências que não são usadas e atualizar os componentes vulneráveis que o scan apontou.<\/p><p><b>No runtime:<\/b> enquanto o contêiner roda: não executar como root (o administrador), limitar privilégios e revisar portas e permissões expostas. Se um invasor entrar, encontra o mínimo de poder possível.<\/p><p class=\"alerta\"><b>Cuidado:<\/b> o scan só encontra o problema. Segurança de verdade = imagem corrigida + execução com o mínimo de privilégio.<\/p><h2>③ <b>DAST e IaC scanning:<\/b> <i>App rodando e infraestrutura<\/i><\/h2><p><b>OWASP ZAP:<\/b> Ferramenta gratuita de DAST, mantida pela comunidade de segurança web. Navega pela aplicação em execução, mapeia as páginas e tenta ataques comuns, gerando alertas com o nível de risco.<\/p><p class=\"ex\"><b>Exemplo:<\/b> alerta de risco médio: Cross-Site Scripting (XSS) na página de login. A decisão é investigar, e não ignorar.<\/p><p><b>XSS (Cross-Site Scripting):<\/b> Falha em que a página aceita um texto digitado pelo usuário e o exibe sem tratar. Um atacante digita código malicioso no lugar do texto, e esse código roda no navegador de quem abrir a página, podendo roubar a sessão (o login) da vítima.<\/p><p><b>Checkov:<\/b> Faz com os arquivos de infraestrutura (como os do Terraform) o que o SAST faz com o código: lê antes de criar e aponta configurações inseguras.<\/p><p class=\"ex\"><b>Exemplo:<\/b> resultado \"falhou: armazenamento S3 permite leitura pública\". Qualquer pessoa na internet poderia baixar os arquivos. Corrigir no arquivo antes do <code>apply<\/code> leva um minuto; depois de um vazamento, o custo é muito maior.<\/p><p><b>Camadas:<\/b> Cada ferramenta olha uma camada diferente: código (SAST), bibliotecas (scan de dependências), imagem (Trivy), infraestrutura (Checkov) e app rodando (ZAP). Juntas, cobrem o caminho todo, do commit à produção.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Cada ferramenta olha uma camada. Uma não substitui a outra, nenhuma garante zero vulnerabilidades e nenhuma dispensa revisão humana. Quanto mais cedo a falha aparece, mais barato é corrigir.<\/p> ", "qs": [{ "q": "Qual é a principal vantagem de usar SAST no Pull Request?", "o": ["Substituir todo teste manual.", "Encontrar falhas antes do merge.", "Apagar dependências inseguras sozinho.", "Publicar direto em produção."], "t": "per" }, { "q": "Qual ação mais ajuda na redução do risco em segurança de contêiner já no início do processo?", "o": ["Aumentar o tamanho da imagem.", "Rodar tudo como root.", "Ignorar CVEs baixos e altos juntos.", "Escanear a imagem e revisar privilégios."], "t": "per" }, { "q": "Quando a equipe usa ZAP e Checkov no mesmo pipeline, qual é a principal vantagem?", "o": ["Substituir todo tipo de teste.", "Garantir que não existam vulnerabilidades.", "Verificar tanto a aplicação quanto a infraestrutura.", "Eliminar a necessidade de revisão humana."], "t": "per" }, { "q": "O que significa shift-left security?", "o": ["Fazer segurança só depois do deploy", "Aplicar segurança desde o início do desenvolvimento", "Mover os servidores de lugar", "Trocar a linguagem do projeto"], "t": "mc" }, { "q": "O que o SAST analisa?", "o": ["O código-fonte, sem executar o programa", "Apenas a aplicação rodando", "O consumo de energia do servidor", "A velocidade da internet"], "t": "mc" }, { "q": "O que é uma CVE?", "o": ["Uma ferramenta de deploy", "Um tipo de banco de dados", "Uma vulnerabilidade conhecida e registrada publicamente", "Um comando do Docker"], "t": "mc" }, { "q": "Qual ferramenta encontra um bucket S3 público em um arquivo Terraform antes da criação?", "o": ["OWASP ZAP", "Trivy", "Grafana", "Checkov"], "t": "mc" }, { "q": "O que é hardening?", "o": ["Aumentar a imagem do contêiner", "Dar mais permissões a todos", "Reduzir vulnerabilidades e permissões desnecessárias", "Apagar os logs do sistema"], "t": "mc" }, { "q": "Um dev deixou uma senha escrita no código. Explique como o SAST no Pull Request ajudaria nessa situação.", "o": null, "t": "ab" }, { "q": "Por que rodar um scan de imagem não significa que o contêiner está seguro?", "o": null, "t": "ab" }] }] }, { "id": "pm", "sigla": "PM", "nome": "Programação Mobile", "cor": "#b3216a", "semanas": [{ "n": 22, "tema": "Configurações iniciais para publicação", "frase": "Preparar o app para as lojas", "html": "<div data-flow><h1>Semana 22<\/h1><p class=\"tema\">Configurações iniciais para publicação<\/p><p class=\"frase\">Preparar o app para as lojas<\/p><\/div><h2>① <b>Contas e regras das lojas:<\/b> <i>Antes de tudo, um cadastro<\/i><\/h2><p><b>Conta de desenvolvedor:<\/b> Ninguém publica um app sem antes se cadastrar como desenvolvedor na loja. É como tirar a licença antes de abrir uma barraca na feira: a loja precisa saber quem é o responsável, para quem mandar avisos e para quem pagar se o app for vendido. No Android, o cadastro é no <i>Google Play Console<\/i>, o painel onde você envia o app, acompanha as métricas e recebe o dinheiro. Na Apple, é o <i>Apple Developer Program<\/i>, que libera o Xcode, o TestFlight e o App Store Connect.<\/p><p><b>Quanto custa:<\/b> O Google cobra uma taxa única: pagou uma vez, a conta é sua para sempre. A Apple cobra todo ano: se parar de pagar, os apps saem da loja. Use um e-mail só do projeto, e não o pessoal, porque a conta pode passar para outra pessoa da equipe no futuro.<\/p><p><b>Individual ou empresa:<\/b> Na Apple, a conta individual mostra o seu nome na loja. A conta de empresa mostra o nome da empresa, mas exige o D-U-N-S Number, um número que identifica empresas no mundo todo, uma espécie de CNPJ internacional.<\/p><p><b>Regras (políticas):<\/b> Cada loja tem um regulamento, e um revisor confere se o app cumpre. No Google Play, o app não pode ter conteúdo de ódio, violência ou pornografia e só pode pedir as permissões que realmente usa. Na Apple, o app precisa funcionar sem bugs, seguir o guia visual da empresa (Human Interface Guidelines) e não pode ser cópia de outro app.<\/p><p class=\"ex\"><b>Por que pedir permissão a mais reprova?<\/b> Imagine um app de lista de tarefas pedindo a sua localização. Para que ele precisa saber onde você está? A loja pensa igual: permissão sem motivo parece espionagem. Foi por isso que o app FitPro foi rejeitado no Google Play: pedia localização sem usar.<\/p><p><b>Política de privacidade:<\/b> É um texto que explica, em linguagem clara, quais dados o app coleta, para que usa e como protege. É obrigatória quando o app coleta dados do usuário. No iOS, o motivo de usar câmera, microfone ou localização também precisa ser escrito no arquivo <code>Info.plist<\/code>, e é essa frase que aparece na janelinha “Permitir acesso?”.<\/p><h2>② <b>Assinatura e pacote:<\/b> <i>O lacre e a caixa do app<\/i><\/h2><p><b>Assinatura digital:<\/b> Funciona como o lacre de um remédio: prova quem fabricou e mostra que ninguém abriu a caixa no caminho. Quando você envia o app, ele vai assinado com uma chave secreta que só você tem. Nas próximas versões, a loja confere se a assinatura é a mesma. Se for diferente, recusa, porque poderia ser alguém tentando se passar por você.<\/p><p><b>Android:<\/b> A chave fica num arquivo chamado <i>keystore<\/i>, ou o próprio Google guarda a chave final (assinatura gerenciada). O app vai no formato AAB (Android App Bundle), obrigatório desde 2021: em vez de mandar um pacote igual para todo mundo, o Google monta a versão certa para cada celular, e o download fica menor.<\/p><p><b>iOS:<\/b> No lugar do keystore entram os certificados. O de <i>Development<\/i> serve para testar no seu iPhone; o de <i>Distribution<\/i>, para publicar. O <i>provisioning profile<\/i> é a lista de convidados: diz em quais aparelhos o app pode ser instalado durante os testes.<\/p><p><b>Identidade do app:<\/b> O <i>package<\/i> (Android) ou <i>bundleIdentifier<\/i> (iOS) é o “CPF” do app na loja e não pode mudar depois de publicado. Se mudar, a loja entende que é outro app, e quem já tinha instalado nunca recebe a atualização.<\/p><pre style=\"height:128px\"><code>\"version\": \"1.0.0\",\n\"android\": { \"package\": \"br.edu.exemplo.estudamais\" },\n\"ios\": { \"bundleIdentifier\": \"br.edu.exemplo.estudamais\" }\n\neas build -p android     # gera o AAB assinado<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> esse trecho fica no <code>app.json<\/code> de um projeto Expo. <code>version<\/code> é o número que o usuário vê na loja. <code>package<\/code> e <code>bundleIdentifier<\/code> são o “CPF”, escrito como um endereço de site ao contrário. O comando <code>eas build<\/code> compila o projeto na nuvem e devolve o AAB já assinado.<\/p><h2>③ <b>Página da loja:<\/b> <i>A vitrine que convence a baixar<\/i><\/h2><p><b>Ícone:<\/b> É a primeira coisa que a pessoa vê, antes até do nome. Um ícone borrado passa a ideia de app malfeito, e muita gente nem clica. Google: 512 × 512 px em PNG. Apple: 1024 × 1024 px, sem fundo transparente.<\/p><p><b>Capturas de tela:<\/b> Respondem à pergunta “o que esse app faz?”. Mostre as telas principais com dados de exemplo caprichados e faça versões para cada aparelho que o app suporta, celular e tablet. Imagem genérica, ou tirada das redes sociais sem adaptar, pode ser recusada.<\/p><p><b>Vídeo:<\/b> É opcional, mas ajuda muito. No Google Play você cola um link do YouTube; na App Store, faz o upload direto no App Store Connect. Curto e mostrando o app em uso, nada de propaganda longa.<\/p><p><b>Textos da ficha:<\/b> O nome tem até 30 caracteres nas duas lojas. O Google pede uma descrição curta (80) e uma completa (até 4.000); a Apple pede subtítulo (30) e um campo escondido de palavras-chave (100). Evite “nº 1”, “melhor app” e “GRÁTIS!!!”: promessa exagerada é motivo de rejeição.<\/p><h2>④ <b>Testes e debugging:<\/b> <i>Achar o erro antes do usuário<\/i><\/h2><p><b>Teste beta:<\/b> É liberar o app para um grupo pequeno de pessoas de fora da equipe antes do lançamento, como o ensaio geral antes da peça de teatro. No iOS isso é feito pelo TestFlight; no Android, pelos testes internos ou fechados do Play Console. O Firebase Test Lab é outra coisa: ele roda o app sozinho em vários celulares reais na nuvem, para ver se funciona em modelos que você não tem.<\/p><p><b>Debugging:<\/b> É investigar a causa de um erro. Os <i>logs<\/i> são o diário de bordo do app: mensagens que ele vai registrando enquanto roda e que mostram onde as coisas pararam. A depuração remota deixa você acompanhar o app rodando num celular de verdade ligado ao computador. Corrija primeiro o que é crítico, como travar ou perder dados, e depois o resto.<\/p><p><b>Teste de regressão:<\/b> Depois de corrigir um erro, teste de novo tudo o que já funcionava. Mexer numa tela pode quebrar outra sem você perceber, e a regressão existe para pegar isso antes do usuário.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Guarde o keystore e a senha com backup, fora do repositório. Sem eles você não consegue mais atualizar o seu app.<\/p>", "qs": [{ "q": "Qual é a importância de criar um ícone de aplicação de alta qualidade para as lojas de aplicativos?", "o": ["É o primeiro elemento visual que atrai usuários.", "Só é obrigatório para a App Store, mas não para o Google Play.", "É apenas estético e não afeta a aceitação do app.", "É usado apenas em testes beta, não na versão final."], "t": "per" }, { "q": "O que deve ser priorizado ao criar screenshots para um aplicativo?", "o": ["Mostrar telas com designs atraentes e funcionalidades.", "Usar apenas imagens genéricas, sem conexão com o app.", "Criar screenshots apenas para smartphones, ignorando tablets.", "Reutilizar imagens de redes sociais sem adaptá-las."], "t": "per" }, { "q": "Qual é a principal diferença na submissão de vídeos promocionais para o Google Play e a App Store?", "o": ["O Google Play exige upload direto; a App Store usa links.", "A App Store permite vídeos curtos; o Google Play, de até 10 min.", "No Google Play, o vídeo vai pelo YouTube; na App Store, direto.", "O Google Play não exige vídeos; a App Store exige obrigatoriamente."], "t": "per" }, { "q": "Qual a diferença de cobrança entre as contas de desenvolvedor?", "o": ["Google tem taxa única; Apple tem taxa anual", "As duas são sempre gratuitas", "Google cobra por mês; Apple é gratuita", "As duas cobram por download"], "t": "mc" }, { "q": "Qual formato de publicação é obrigatório no Google Play desde 2021?", "o": ["APK", "IPA", "AAB", "ZIP"], "t": "mc" }, { "q": "O que acontece se você perder o keystore do app?", "o": ["A loja cria outro sozinha", "O app fica mais rápido", "Nada muda", "Você não consegue mais atualizar o app"], "t": "mc" }, { "q": "Qual ferramenta faz testes beta em iOS?", "o": ["Play Console", "TestFlight", "Firebase Analytics", "Gradle"], "t": "mc" }, { "q": "Por que um app pode ser rejeitado por pedir localização?", "o": ["Porque nenhum app pode usar localização", "Porque o ícone está grande", "Porque pediu uma permissão sem realmente usá-la", "Porque a versão começa em 1.0.0"], "t": "mc" }, { "q": "Crie o nome (até 30 caracteres) e a descrição curta (até 80 caracteres) para um app da sua escolha.", "o": null, "t": "ab" }, { "q": "Explique por que o package não pode mudar depois da publicação.", "o": null, "t": "ab" }] }, { "n": 23, "tema": "Preparativos finais para publicação", "frase": "Rápido, seguro e fácil de usar", "html": "<div data-flow><h1>Semana 23<\/h1><p class=\"tema\">Preparativos finais para publicação<\/p><p class=\"frase\">Rápido, seguro e fácil de usar<\/p><\/div><h2>① <b>Performance:<\/b> <i>App lento é app desinstalado<\/i><\/h2><p><b>O que medir:<\/b> Quatro números dizem se o app está pesado: o tempo de carregamento (quanto demora para abrir cada tela), o consumo de memória (quanto espaço ele ocupa enquanto roda), o uso de CPU (quanto o processador trabalha) e o gasto de bateria. Se um deles dispara, o usuário sente: o celular esquenta, a tela engasga e a bateria some.<\/p><p><b>Gargalo:<\/b> É o ponto que segura todo o resto, como o gargalo de uma garrafa, por onde o líquido sai devagar. Em apps, os gargalos mais comuns são um cálculo pesado demais, uma tela com elementos demais para desenhar ou uma chamada de API que traz dados demais pela internet.<\/p><p><b>Profiling:<\/b> É o “exame de sangue” do app. Ferramentas como o Android Profiler e o Xcode Instruments mostram, em tempo real, quanto de memória, CPU e rede cada parte do app está usando, e assim você descobre o gargalo em vez de chutar.<\/p><p><b>Como otimizar:<\/b> <i>Lazy loading<\/i> é carregar só o que aparece na tela, como o feed do Instagram, que traz as fotos de baixo conforme você rola. Comprimir imagens reduz o tamanho do arquivo sem estragar o visual. <i>Cache<\/i> é guardar o que já foi baixado para não buscar de novo, como deixar o material na mochila em vez de voltar em casa todo dia. E a API pode devolver só os campos que a tela usa.<\/p><p class=\"ex\"><b>Exemplo:<\/b> um app que abre carregando 200 imagens de uma vez demora e trava. Com lazy loading ele carrega só as 10 visíveis; com compressão, cada imagem pesa bem menos; com cache, na segunda vez nem precisa baixar.<\/p><h2>② <b>Segurança:<\/b> <i>Achar a falha antes do invasor<\/i><\/h2><p><b>Procurar falhas:<\/b> A análise estática (SonarQube, Checkmarx) lê o código como um corretor ortográfico, só que procurando brechas de segurança. O pentest, ou teste de invasão (OWASP ZAP, Burp Suite), é chamar alguém de confiança para tentar invadir o app de propósito e mostrar onde ele é fraco.<\/p><p><b>Engenharia reversa:<\/b> É desmontar o app pronto para ver como ele foi feito e, às vezes, criar uma cópia alterada. O ProGuard embaralha os nomes do código para dificultar essa leitura, e a assinatura digital denuncia se alguém mexeu no pacote.<\/p><p><b>SQL Injection:<\/b> Acontece quando o app junta o texto digitado pelo usuário direto no comando do banco. Um texto malicioso, digitado no campo certo, vira parte do comando e pode apagar ou vazar dados.<\/p><pre style=\"height:96px\"><code>// valor do usuário vai como parâmetro (?), nunca concatenado\ndb.getFirstAsync('SELECT * FROM materias WHERE id = ?', [id]);\n// Errado: '... WHERE id = ' + id<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> o <code>?<\/code> é um espaço reservado. O banco recebe o comando e o valor separados, então trata o que o usuário digitou sempre como dado, nunca como comando. No jeito errado, o texto digitado é colado no meio do SQL e passa a fazer parte dele.<\/p><p><b>Proteger os dados:<\/b> A criptografia TLS protege os dados no caminho entre o celular e o servidor, como um envelope lacrado. A AES protege o que fica guardado, como um cofre. Senha nunca é guardada como foi digitada: guarda-se o <i>hash<\/i> com <i>salt<\/i> (bcrypt), uma versão embaralhada que não dá para desfazer.<\/p><p><b>Proteger o acesso:<\/b> MFA é pedir duas provas de que é você, como a senha e um código no celular. Tokens OAuth ou JWT funcionam como um crachá com validade: depois do login, o app mostra o crachá em vez de mandar a senha toda hora. <i>Rate limiting<\/i> limita quantas tentativas cada um pode fazer por minuto, o que barra quem tenta adivinhar senhas ou derrubar o servidor (DoS).<\/p><h2>③ <b>Usabilidade:<\/b> <i>Testar com gente de verdade<\/i><\/h2><p><b>O que é:<\/b> É medir se as pessoas conseguem usar o app sem ajuda. Quem programou já sabe onde fica cada botão; o usuário não. Por isso o teste é feito com quem nunca viu o app.<\/p><p><b>Qualitativo e quantitativo:<\/b> Os métodos qualitativos explicam o porquê: entrevistas, grupos focais e observar a pessoa usando, em silêncio, anotando onde ela trava. Os quantitativos mostram o quanto: testes A/B (duas versões, cada uma para um grupo), <i>heatmaps<\/i> (mapa de calor de onde as pessoas tocam na tela) e métricas de uso.<\/p><p><b>Ciclo:<\/b> Planejar o teste → observar → coletar as dificuldades → priorizar as que aparecem mais e atrapalham mais → ajustar → testar de novo.<\/p><h2>④ <b>Build e release:<\/b> <i>Uma esteira automática<\/i><\/h2><p><b>Build:<\/b> É transformar o código em um app instalável. No Android quem faz isso é o Gradle; no iOS, o Xcode Build System. O Fastlane automatiza o caminho até a loja: gera o build, assina, tira as capturas e envia.<\/p><p><b>CI/CD:<\/b> É a esteira de uma fábrica. Na integração contínua (CI), cada mudança enviada ao Git é compilada e testada sozinha; se um teste falha, a esteira para e avisa. Na entrega contínua (CD), o que passou nos testes vira uma versão pronta para publicar. Sem fazer nada na mão, sobra menos espaço para erro humano.<\/p><pre style=\"height:64px\"><code>commit → build → testes → segurança e assinatura → AAB → loja<\/code><\/pre><p><b>Prazo x segurança:<\/b> Achou uma falha grave perto do lançamento? A segurança do usuário vem antes do prazo: corrija o que é crítico e negocie a data.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Antes de publicar, rode o app num celular mais simples. O que trava lá é o que vai virar avaliação negativa.<\/p>", "qs": [{ "q": "Qual estratégia é mais eficaz para melhorar o tempo de resposta de um aplicativo que apresenta lentidão no carregamento de imagens?", "o": ["Implementar compressão de imagens e lazy loading.", "Aumentar a resolução das imagens para melhorar a qualidade.", "Carregar todas as imagens simultaneamente na inicialização do app.", "Desabilitar o caching para garantir que sempre sejam carregadas imagens atualizadas."], "t": "per" }, { "q": "Qual ferramenta ou método é mais indicado para identificar pontos de dificuldade na navegação de um aplicativo durante testes de usabilidade?", "o": ["Heatmaps para identificar áreas de maior interação.", "Testes unitários para validar o funcionamento das funções.", "Testes de performance para medir tempo de resposta.", "Revisão de código para detectar falhas na lógica."], "t": "per" }, { "q": "Qual ferramenta ou prática auxilia na automação do build e release de aplicativos mobile, garantindo um processo de publicação mais seguro e eficiente?", "o": ["Utilizar o Fastlane para automatizar as etapas de build e release.", "Realizar o build manualmente na IDE a cada atualização.", "Ajustar manualmente o código-fonte para cada nova versão.", "Concentrar os esforços apenas em testes de usabilidade."], "t": "per" }, { "q": "O que é lazy loading?", "o": ["Carregar tudo ao abrir o app", "Carregar o conteúdo só quando ele aparece", "Desligar as imagens do aplicativo", "Atrasar o app de propósito"], "t": "mc" }, { "q": "Qual ferramenta mostra o uso de recursos do app Android em tempo real?", "o": ["Android Profiler", "TestFlight", "Fastlane", "ProGuard"], "t": "mc" }, { "q": "Como evitar SQL Injection em uma consulta?", "o": ["Concatenar o texto do usuário na consulta", "Aumentar a memória do banco", "Passar o valor como parâmetro (?)", "Desligar o login do app"], "t": "mc" }, { "q": "Como as senhas devem ser guardadas?", "o": ["Em texto puro", "Em um arquivo público", "No nome da tabela", "Com hash e salt, usando bcrypt"], "t": "mc" }, { "q": "O que é MFA?", "o": ["Um formato de imagem", "Login com mais de um fator, como senha e código", "Um tipo de teste beta", "Uma ferramenta de build"], "t": "mc" }, { "q": "Um app demora para abrir porque carrega 200 imagens de uma vez. Proponha duas otimizações e explique cada uma.", "o": null, "t": "ab" }, { "q": "Explique, com um exemplo simples, o que aconteceria se um app concatenasse o texto do usuário em um comando SQL.", "o": null, "t": "ab" }] }, { "n": 24, "tema": "Submissão e revisão de aplicativos", "frase": "Enviar, responder e melhorar", "html": "<div data-flow><h1>Semana 24<\/h1><p class=\"tema\">Submissão e revisão de aplicativos<\/p><p class=\"frase\">Enviar, responder e melhorar<\/p><\/div><h2>① <b>Submissão:<\/b> <i>Mandar o app para a loja avaliar<\/i><\/h2><p><b>O que é:<\/b> Submeter é enviar o app para a loja revisar antes de liberar para o público. É como entregar um trabalho para o professor corrigir: ele confere se seguiu as regras antes de dar a nota. O processo tem três etapas.<\/p><p><b>1. Preparar:<\/b> Juntar tudo o que vai na página da loja (capturas, vídeo, descrições) e conferir se o app roda bem nos aparelhos, sem lentidão e sem falhas de segurança.<\/p><p><b>2. Enviar:<\/b> Junto com o app vão os metadados, que são as informações sobre ele: o número da versão, o <i>changelog<\/i> (o que mudou) e o link da política de privacidade.<\/p><p><b>3. Revisão e aprovação:<\/b> Um revisor da loja testa o app. Ele pode aprovar, pedir ajustes ou rejeitar. O andamento aparece no Play Console e no App Store Connect, que funcionam como o “rastreio da encomenda”.<\/p><p><b>Boas práticas:<\/b> Documentar cada etapa, fazer revisão cruzada (desenvolvimento, design e QA, o pessoal de testes, olham juntos antes de enviar) e deixar folga no cronograma, porque a revisão pode demorar e pode voltar com pedidos.<\/p><h2>② <b>Feedback da revisão:<\/b> <i>Foi rejeitado. E agora?<\/i><\/h2><p><b>Analisar:<\/b> Leia o motivo com calma e separe os problemas por gravidade (criticidade): o que impede a aprovação vem primeiro. Veja também se há um padrão, como várias queixas ligadas à segurança.<\/p><p><b>Responder:<\/b> Reconheça o que foi apontado, diga o que vai fazer e em quanto tempo. Ignorar, discutir ou demorar só atrasa a publicação. Transparência gera confiança com o revisor.<\/p><p><b>Implementar e acompanhar:<\/b> Corrija, faça testes de regressão para garantir que a correção não quebrou outra coisa e reenvie. Depois, acompanhe se o problema sumiu de verdade.<\/p><p class=\"ex\"><b>Exemplo de resposta ao revisor:<\/b> “Obrigado pela análise. Removemos a permissão de câmera, que não era usada pelo app, e atualizamos a política de privacidade. A nova versão 1.0.1 já foi enviada.”<\/p><h2>③ <b>Correções em produção:<\/b> <i>Quando o app já está no ar<\/i><\/h2><p><b>Produção:<\/b> É o app que já está na loja, nas mãos dos usuários. Um erro ali afeta gente de verdade, então a primeira tarefa é descobrir rápido o que está acontecendo.<\/p><p><b>Identificar:<\/b> Ferramentas como Firebase Crashlytics, Sentry e New Relic funcionam como a caixa-preta de um avião: registram cada travamento (crash) com o aparelho, a versão e a linha de código onde aconteceu. Somam-se a isso as reclamações dos usuários e as métricas, como um tempo de resposta que de repente aumentou.<\/p><p><b>Corrigir:<\/b> Primeiro reproduzir o erro num ambiente de teste (fazer acontecer de novo, de propósito). Depois isolar a causa com os logs, revisar a solução em equipe e lançar um <i>patch<\/i>, uma correção pequena e focada. Antes de liberar, testes de regressão com ferramentas como Jest (JavaScript), Espresso (Android) ou XCTest (iOS).<\/p><p class=\"ex\"><b>Em crise:<\/b> se um app de banco começar a cobrar duas vezes (débito duplicado), não dá para esperar a correção perfeita. Coloca-se o sistema em modo de manutenção, faz-se o <i>rollback<\/i> (desfazer as cobranças erradas) e avisa-se os usuários com transparência.<\/p><h2>④ <b>Próxima versão:<\/b> <i>Escolher o que fazer primeiro<\/i><\/h2><p><b>Coletar ideias:<\/b> Ideias vêm dos usuários, da equipe, do mercado e dos concorrentes. Ferramentas como Miro e Trello ajudam a juntar tudo num lugar só, para nenhuma ideia se perder.<\/p><p><b>Matriz impacto × esforço:<\/b> Para cada ideia, pergunte: quanto ela ajuda o usuário (impacto) e quanto trabalho dá (esforço)? Muito impacto e pouco esforço: fazer já. Muito impacto e muito esforço: planejar. Pouco impacto e pouco esforço: se sobrar tempo. Pouco impacto e muito esforço: evitar.<\/p><pre style=\"height:64px\"><code>Fazer já: lembrete de prova        Planejar: sincronizar com a nuvem\nSe sobrar tempo: temas de cor      Evitar: rede social interna<\/code><\/pre><p><b>Planejar:<\/b> As ideias escolhidas viram um <i>roadmap<\/i>, um mapa com o que entra em cada versão e quando. Scrum ou Kanban organizam o trabalho em ciclos curtos, para entregar aos poucos e ajustar no caminho.<\/p><p><b>Deploy x release:<\/b> <i>Deploy<\/i> é colocar o código novo no ar; <i>release<\/i> é liberar a função para o usuário ver. É como montar a loja nova (deploy) e só depois abrir as portas (release). Dá para fazer o deploy hoje e a release semana que vem.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Ao ser rejeitado, leia o motivo, corrija só o que foi pedido e explique a correção no campo de comentários ao revisor.<\/p>", "qs": [{ "q": "Qual é o principal objetivo da análise de feedback em revisões de aplicativos?", "o": ["Identificar falhas e priorizar ações corretivas.", "Coletar apenas dados quantitativos sem interpretação.", "Ignorar opiniões divergentes da equipe.", "Responder automaticamente aos feedbacks sem avaliação."], "t": "per" }, { "q": "Qual é a estratégia mais eficaz para responder aos revisores de forma transparente e construtiva?", "o": ["Ignorar os feedbacks negativos e focar apenas os positivos.", "Adiar respostas e evitar novas perguntas.", "Reconhecer os pontos e propor um plano.", "Implementar mudanças sem comunicar os revisores."], "t": "per" }, { "q": "Qual etapa é fundamental na implementação de melhorias baseadas nos feedbacks dos revisores?", "o": ["Realizar testes de regressão e monitorar os resultados das correções.", "Submeter o app sem checar mudanças.", "Apenas atualizar a documentação, sem alterar o código.", "Deixar só uma equipe cuidar da melhoria."], "t": "per" }, { "q": "Qual ferramenta monitora falhas de um app em produção?", "o": ["Miro", "Firebase Crashlytics", "Trello", "Gradle"], "t": "mc" }, { "q": "Por que fazer testes de regressão antes de reenviar um app?", "o": ["Porque a correção de uma tela pode quebrar outra", "Porque a loja exige um vídeo novo", "Porque deixam o ícone melhor", "Porque substituem a política de privacidade"], "t": "mc" }, { "q": "Na matriz impacto × esforço, o que fazer com algo de alto impacto e pouco esforço?", "o": ["Evitar", "Deixar para quando sobrar tempo", "Fazer já", "Apagar do roadmap"], "t": "mc" }, { "q": "Qual a diferença entre deploy e release?", "o": ["São a mesma coisa", "Deploy é o nome do app; release é o ícone", "Release vem sempre antes de escrever o código", "Deploy coloca o código no ar; release libera a função ao usuário"], "t": "mc" }, { "q": "Em uma crise como débito duplicado, qual é a resposta adequada?", "o": ["Esperar os usuários reclamarem mais", "Manutenção, rollback e aviso aos usuários", "Apagar as avaliações negativas", "Lançar uma nova função de marketing"], "t": "mc" }, { "q": "Seu app foi rejeitado por pedir acesso à câmera sem usar. Escreva a mensagem que enviaria ao revisor depois de corrigir.", "o": null, "t": "ab" }, { "q": "Classifique na matriz impacto × esforço duas ideias para um app escolar e justifique.", "o": null, "t": "ab" }] }, { "n": 25, "tema": "Estratégias de marketing para aplicativos", "frase": "Ser encontrado e medir o resultado", "html": "<div data-flow><h1>Semana 25<\/h1><p class=\"tema\">Estratégias de marketing para aplicativos<\/p><p class=\"frase\">Ser encontrado e medir o resultado<\/p><\/div><h2>① <b>ASO:<\/b> <i>Ser encontrado dentro da loja<\/i><\/h2><p><b>O que é:<\/b> ASO (App Store Optimization) é deixar a página do app na loja pronta para aparecer nas buscas e convencer a pessoa a baixar. É o mesmo raciocínio do Google, só que dentro da Play Store e da App Store: quem aparece no topo da busca ganha a maior parte dos downloads.<\/p><p><b>Palavras-chave:<\/b> São os termos que as pessoas digitam na busca da loja. Quem procura um app de estudos escreve “agenda escolar” ou “pomodoro”, não “Estuda+”. Pesquise quais termos o seu público usa, coloque os mais importantes no título e na descrição e revise de tempos em tempos, porque as buscas mudam.<\/p><p><b>Descrição:<\/b> Deve dizer em poucas linhas o que o app resolve. Comece pelo benefício (“organize suas provas”), mostre o que o diferencia e use tópicos curtos, porque ninguém lê um parágrafo enorme no celular.<\/p><p><b>Concorrentes:<\/b> Benchmarking é estudar os apps parecidos com o seu: que palavras usam, o que os usuários elogiam e o que reclamam. As reclamações dos outros são oportunidades para você se diferenciar.<\/p><pre style=\"height:96px\"><code>Título: Estuda+: Planner de Estudos (27/30)\nCurta:  Organize matérias, provas e tempo de estudo com Pomodoro. (56/80)\nChaves: planner de estudos, agenda escolar, pomodoro, organizar provas<\/code><\/pre><p class=\"ex\"><b>Lendo a ficha:<\/b> o número entre parênteses é quantos caracteres foram usados do limite. O título junta nome e benefício, e a descrição curta já traz duas palavras-chave (“provas”, “Pomodoro”) sem parecer forçada.<\/p><h2>② <b>Marketing digital:<\/b> <i>Falar com o público certo<\/i><\/h2><p><b>Canal:<\/b> Escolha onde anunciar pelo perfil de quem vai usar o app. Estudantes estão mais no Instagram e no TikTok; profissionais, no LinkedIn; quem já está procurando algo, no Google Ads. Anunciar para todo mundo gasta dinheiro mostrando o app para quem nunca vai baixar.<\/p><p><b>Campanha:<\/b> Comece pelo objetivo (mais downloads? mais uso? tornar a marca conhecida?), mostre o benefício e conte uma história (<i>storytelling<\/i>): “a Ana estava atrasada em tudo até organizar as provas no app”. História prende mais que lista de funções.<\/p><p><b>KPIs:<\/b> São os indicadores que dizem se a campanha deu certo. Taxa de conversão: de quem viu, quantos baixaram. CPA (custo por aquisição): quanto custou cada novo usuário. ROI: quanto voltou para cada real investido.<\/p><p class=\"ex\"><b>Fazendo a conta:<\/b> a campanha custou R$ 500 e trouxe 250 downloads. O CPA é R$ 500 ÷ 250 = R$ 2 por usuário. Se outra campanha trouxe usuários a R$ 5 cada, a primeira foi mais eficiente.<\/p><p><b>Teste A/B:<\/b> Mostrar duas versões de um anúncio (A e B) para grupos diferentes e ver qual dá mais resultado. Assim a decisão vem dos dados, não da opinião de quem gostou mais.<\/p><h2>③ <b>Redes sociais:<\/b> <i>Conversar, não só anunciar<\/i><\/h2><p><b>Persona:<\/b> É um retrato do usuário típico: idade, rotina, o que gosta, onde passa o tempo. Ex.: “estudante do ensino médio, 16 anos, usa TikTok e Instagram, se perde nas datas de prova”. Com a persona definida, fica fácil escolher a rede e o jeito de falar.<\/p><p><b>Conteúdo:<\/b> Varie os formatos (vídeos curtos, infográficos, posts, stories) e eduque, não só venda: dicas de estudo trazem mais gente que “baixe nosso app”.<\/p><p><b>Engajamento:<\/b> Curtidas, comentários, compartilhamentos e alcance mostram se o conteúdo está funcionando. Veja também os melhores horários de postar e use enquetes para ouvir os seguidores.<\/p><h2>④ <b>Métricas:<\/b> <i>Medir para decidir<\/i><\/h2><p><b>Ferramentas:<\/b> Google Analytics, Firebase Analytics e Mixpanel registram o que os usuários fazem no app: quais telas abrem, quanto tempo ficam, onde desistem. Os dashboards (painéis) juntam tudo em gráficos.<\/p><p><b>Downloads não bastam:<\/b> Retenção é quantos continuam usando depois de dias; churn é quantos abandonam; LTV é quanto um usuário gera ao longo do tempo. Um app com muitos downloads e retenção baixa tem um problema: as pessoas baixam, não gostam e vão embora.<\/p><p><b>Ajustar:<\/b> Junte números e opiniões, separe os usuários em grupos (segmentar) e mude o que não funciona: canal, mensagem ou a própria tela. Meça de novo em ciclos curtos, semana a semana.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Escolha a métrica pelo objetivo: crescer → downloads e CPA. Manter usuários → retenção, churn e LTV.<\/p>", "qs": [{ "q": "Qual é a principal vantagem de selecionar as plataformas de marketing de acordo com o perfil do público-alvo?", "o": ["Garante a viralização dos anúncios automaticamente.", "Aumenta o alcance geral, independentemente do perfil.", "Otimiza o investimento e atinge usuários com maior potencial de conversão.", "Minimiza a necessidade de analisar os resultados da campanha."], "t": "per" }, { "q": "Na criação de campanhas para aplicativos, qual dos seguintes elementos é mais essencial para garantir uma comunicação eficaz?", "o": ["Um orçamento elevado.", "A definição de objetivos claros e a utilização de storytelling.", "O uso de jargões técnicos sem adaptação ao público.", "A exclusividade de um único formato de anúncio."], "t": "per" }, { "q": "Qual é a principal função dos KPIs (Key Performance Indicators) na análise de campanhas digitais para aplicativos?", "o": ["Medir a eficácia das ações e orientar ajustes para melhorar os resultados.", "Garantir que todas as campanhas tenham o mesmo desempenho.", "Servir apenas para justificar o orçamento da campanha.", "Eliminar a necessidade de testes A/B."], "t": "per" }, { "q": "O que significa ASO?", "o": ["Otimização do app na loja", "Análise de sistema operacional", "Armazenamento seguro online", "Atualização sem ocorrência"], "t": "mc" }, { "q": "Qual é a métrica mais adequada para saber se os usuários continuam usando o app?", "o": ["Número de cliques no anúncio", "Tamanho do ícone", "Retenção", "Quantidade de hashtags"], "t": "mc" }, { "q": "O que é CPA?", "o": ["Conta padrão do aplicativo", "Custo por aquisição", "Código para atualização", "Capturas por aparelho"], "t": "mc" }, { "q": "Para que serve um teste A/B?", "o": ["Testar o app em dois idiomas obrigatórios", "Trocar a conta de desenvolvedor", "Aprovar o app nas duas lojas", "Comparar duas versões e ficar com a melhor"], "t": "mc" }, { "q": "Um app tem muitos downloads, mas quase ninguém volta a usar. O que isso indica?", "o": ["A campanha não precisa de ajustes", "Há um problema de retenção a investigar", "O app está pronto e não precisa mudar", "O ASO precisa ser desligado"], "t": "mc" }, { "q": "Crie uma ficha ASO para um app da sua escolha: título, descrição curta e quatro palavras-chave.", "o": null, "t": "ab" }, { "q": "Defina a persona de um app de estudos e diga qual rede social você usaria para divulgá-lo. Justifique.", "o": null, "t": "ab" }] }, { "n": 26, "tema": "Planejamento de lançamento", "frase": "Lançar não é o fim", "html": "<div data-flow><h1>Semana 26<\/h1><p class=\"tema\">Planejamento de lançamento<\/p><p class=\"frase\">Lançar não é o fim<\/p><\/div><h2>① <b>Cronograma:<\/b> <i>Sete fases até o app sair<\/i><\/h2><p><b>Por que planejar:<\/b> Lançar um app tem muitas tarefas que dependem umas das outras: não dá para divulgar o que ainda não foi testado, nem testar o que ainda não foi feito. Sem cronograma, o marketing anuncia uma data que o desenvolvimento não consegue cumprir.<\/p><p><b>As fases:<\/b> Planejamento (objetivo, público e orçamento) → desenvolvimento das funções básicas → teste alfa → teste beta → pré-lançamento → lançamento → pós-lançamento. O app não “acaba” no lançamento: a última fase é acompanhar e corrigir.<\/p><p><b>Alfa x beta:<\/b> O teste alfa é feito pela própria equipe, dentro de casa, para achar os erros grosseiros. O teste beta é feito por um grupo pequeno de pessoas de fora, que usam o app como usuários de verdade e encontram problemas que a equipe não vê.<\/p><p><b>Ferramentas:<\/b> Trello, Asana e Jira organizam as tarefas. O gráfico de Gantt, feito por exemplo no Microsoft Project, mostra cada tarefa como uma barra no calendário e deixa visível o que depende do quê.<\/p><p><b>Prazos:<\/b> Coloque margem de segurança, porque sempre surge um imprevisto, e marque checkpoints, pontos de conferência para ver se está no ritmo. Se o prazo for impossível, lance um MVP (produto mínimo viável): só o essencial funcionando, e o resto chega nas próximas versões.<\/p><pre style=\"height:128px\"><code>13/11  0.1.0        abas + CRUD\n19/11  0.2.0        modo foco\n27/11  0.3.0        estatísticas\n04/12  1.0.0-rc.1   beta com colegas\n11/12  1.0.0        Demo Day<\/code><\/pre><p class=\"ex\"><b>Lendo o cronograma:<\/b> é o plano do Estuda+, o app de exemplo do projeto bimestral. Cada linha tem data, versão e o que entra nela. O <code>rc.1<\/code> (release candidate) é a versão candidata, testada pelos colegas no beta antes da versão final.<\/p><h2>② <b>Pré-lançamento:<\/b> <i>Criar expectativa antes do dia D<\/i><\/h2><p><b>Expectativa:<\/b> Um app lançado em silêncio passa despercebido. Antes do lançamento, crie uma página de pré-cadastro (landing page) para avisar quando sair, um vídeo teaser de 10 a 30 segundos e, se der, uma demonstração ao vivo.<\/p><p><b>Promoções:<\/b> Acesso antecipado, desconto para quem se cadastra antes e gamificação (desafios e sorteios). Em jogos é comum o pré-registro dar um item exclusivo no lançamento.<\/p><p><b>Feedback antecipado:<\/b> Um beta fechado, formulários e uma comunidade no Telegram ou no Discord trazem opiniões antes de todo mundo baixar. Os <i>early adopters<\/i>, os primeiros usuários, viram divulgadores e ajudam a achar falhas.<\/p><h2>③ <b>Influenciadores:<\/b> <i>Credibilidade vale mais que número<\/i><\/h2><p><b>Por que funcionam:<\/b> As pessoas confiam mais na recomendação de alguém que acompanham do que num anúncio. O influenciador empresta a credibilidade dele ao app.<\/p><p><b>Como escolher:<\/b> Primeiro o assunto: para um app de alimentação saudável, um nutricionista; para um app de inglês, um professor de idiomas. Depois o engajamento, que vale mais que o número de seguidores.<\/p><p class=\"ex\"><b>Exemplo:<\/b> um perfil com 1 milhão de seguidores e quase nenhum comentário pode vender menos que um professor com 20 mil seguidores que respondem, perguntam e confiam no que ele indica.<\/p><p><b>Formatos e medição:<\/b> O influenciador pode testar o app e contar o que achou, fazer conteúdo patrocinado, propor um desafio ou fazer uma live. Para saber quem trouxe resultado, dê a cada um um cupom ou link próprio e conte os downloads de cada código.<\/p><h2>④ <b>Feedback pós-lançamento:<\/b> <i>Ouvir, separar e agir<\/i><\/h2><p><b>Ouvir:<\/b> O usuário fala em vários lugares: avaliações nas lojas, suporte, redes sociais, comunidades e pesquisas dentro do app.<\/p><p><b>Separar:<\/b> Nem toda mensagem pede a mesma ação. Bug é urgente; sugestão vai para a lista de ideias; dúvida que se repete mostra que falta explicação no app; elogio mostra o que manter. Ferramentas de análise de sentimentos e sistemas como Zendesk e Freshdesk ajudam a organizar.<\/p><p><b>Agir e responder:<\/b> Priorize pelo que atrapalha mais gente, corrija, publique o changelog e responda as avaliações com educação, mesmo as grosseiras.<\/p><p class=\"ex\"><b>Respondendo uma avaliação:<\/b> “O app trava ao abrir. Péssimo!” → “Sentimos muito! Já identificamos o travamento e a correção sai na próxima atualização. Se precisar de ajuda agora, fale com a gente pelo suporte no app.”<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Lançar não é o fim: reserve tempo no cronograma para o pós-lançamento e corrija o que os primeiros usuários encontrarem.<\/p>", "qs": [{ "q": "Qual das seguintes etapas NÃO faz parte de um cronograma de lançamento de aplicativos?", "o": ["Planejamento.", "Testes beta.", "Fase de manutenção pós-lançamento.", "Desenvolvimento de hardware."], "t": "per" }, { "q": "Qual ferramenta é mais indicada para criar um cronograma visual com prazos e dependências?", "o": ["Slack", "Microsoft Project", "Google Docs", "GitHub"], "t": "per" }, { "q": "Como evitar atrasos no cronograma de lançamento de um aplicativo?", "o": ["Usar uma ferramenta de gestão e definir checkpoints regulares.", "Definir prazos flexíveis e abrir mão de monitoramento.", "Evitar comunicação frequente para não sobrecarregar a equipe.", "Focar somente o marketing e ignorar os testes do produto."], "t": "per" }, { "q": "Qual a diferença entre teste alfa e teste beta?", "o": ["Alfa é interno; beta é com um grupo restrito de usuários", "Alfa é depois do lançamento; beta é antes do código", "Os dois são feitos só pela loja", "Alfa é para iOS; beta é para Android"], "t": "mc" }, { "q": "Qual recurso mostra prazos e dependências de forma visual?", "o": ["Hashtag", "Changelog", "Gráfico de Gantt", "Keystore"], "t": "mc" }, { "q": "O que deve pesar mais na escolha de um influenciador?", "o": ["O maior número de seguidores", "O engajamento e o nicho alinhado ao app", "A quantidade de carros que ele tem", "O tamanho do nome de usuário"], "t": "mc" }, { "q": "Quem são os early adopters?", "o": ["Os revisores da loja", "Os concorrentes do app", "Os donos da plataforma", "Os primeiros usuários do app"], "t": "mc" }, { "q": "O que fazer se o prazo de lançamento for impossível?", "o": ["Cortar os testes", "Publicar com bugs críticos", "Lançar um MVP e melhorar depois", "Desistir do projeto"], "t": "mc" }, { "q": "Escreva uma resposta educada para a avaliação: \"O app trava ao abrir. Péssimo!\".", "o": null, "t": "ab" }, { "q": "Monte um mini cronograma do seu projeto com pelo menos três entregas e suas datas.", "o": null, "t": "ab" }] }, { "n": 27, "tema": "Gerenciamento de versões e atualizações", "frase": "Evoluir sem quebrar", "html": "<div data-flow><h1>Semana 27<\/h1><p class=\"tema\">Gerenciamento de versões e atualizações<\/p><p class=\"frase\">Evoluir sem quebrar<\/p><\/div><h2>① <b>Git:<\/b> <i>Uma máquina do tempo para o código<\/i><\/h2><p><b>Controle de versão:<\/b> Sem ele, a equipe troca arquivos por WhatsApp, um sobrescreve o trabalho do outro e ninguém sabe qual é a versão certa. O Git guarda cada mudança com autor, data e descrição, como um histórico de “salvar jogo”: se algo quebrar, dá para voltar a um ponto que funcionava. GitHub, GitLab e Bitbucket guardam esse histórico na nuvem para toda a equipe.<\/p><pre style=\"height:160px\"><code>git init\ngit add .\ngit commit -m \"adiciona aba de estatísticas\"\ngit checkout -b nova-feature\ngit push origin main\ngit revert &lt;commit&gt;<\/code><\/pre><p class=\"ex\"><b>Lendo o código:<\/b> <code>init<\/code> começa o histórico na pasta do projeto. <code>add<\/code> escolhe o que vai ser salvo e <code>commit<\/code> salva, com uma mensagem dizendo o que mudou. <code>checkout -b<\/code> cria uma branch, uma cópia paralela para trabalhar sem mexer no principal. <code>push<\/code> envia para a nuvem. <code>revert<\/code> desfaz um commit criando um novo, sem apagar o histórico.<\/p><p><b>Por que usar branch:<\/b> Se todo mundo edita direto no <code>main<\/code>, a mudança de um quebra a tela do outro sem ninguém perceber. Com branches, cada um trabalha na sua cópia, pede revisão (<i>pull request<\/i>) e só depois junta ao principal (<i>merge<\/i>).<\/p><h2>② <b>Versionamento semântico:<\/b> <i>O número da versão conta uma história<\/i><\/h2><p><b>MAJOR.MINOR.PATCH:<\/b> Cada número tem um significado. Olhando 2.3.1, o 2 é a versão grande, o 3 indica funções novas e o 1, correções. Só de ver o número, a equipe e o usuário sabem o tamanho da mudança.<\/p><p><b>Qual número sobe:<\/b> Mudança que quebra o que existia, como uma interface toda nova: sobe o MAJOR (2.3.1 → 3.0.0). Função nova sem quebrar nada: sobe o MINOR (2.3.1 → 2.4.0). Só correção de bug: sobe o PATCH (2.3.1 → 2.3.2). Quando um número sobe, os da direita voltam a zero.<\/p><p><b>Changelog:<\/b> É o diário das versões: lista, em linguagem simples, o que foi adicionado, alterado e corrigido em cada uma.<\/p><pre style=\"height:96px\"><code>## [1.0.0] — 11/12/2026\n### Corrigido\n- Busca agora espera 300 ms de pausa antes de consultar.<\/code><\/pre><h2>③ <b>Atualizações:<\/b> <i>Mudar aos poucos e com segurança<\/i><\/h2><p><b>Incremental:<\/b> Em vez de uma versão gigante a cada ano, pequenas melhorias e correções com frequência. Se algo der errado, é fácil achar o que causou, porque mudou pouca coisa.<\/p><p><b>Feature flag:<\/b> É um interruptor dentro do app que liga ou desliga uma função sem lançar versão nova na loja. Com o Firebase Remote Config, se a função nova der problema, você desliga de longe em minutos.<\/p><p><b>Canary release:<\/b> É liberar a versão primeiro para poucos usuários, por exemplo 5%. O nome vem dos canários que mineiros levavam para a mina: se algo estivesse errado, o canário dava o aviso antes de todos. Se os 5% não tiverem problemas, libera para o resto.<\/p><p><b>Testes:<\/b> Antes de liberar, testes de regressão (o que funcionava continua?), de integração (o app ainda conversa bem com a API?) e de compatibilidade (funciona em celulares antigos?).<\/p><p class=\"ex\"><b>Atualização de segurança:<\/b> se descobrirem uma falha grave, como um login que deixa entrar na conta de outra pessoa, o patch corrige só a falha, passa por testes e a atualização vira obrigatória. Os usuários são avisados da importância de atualizar, sem detalhes de como a falha funciona, para não ensinar o ataque.<\/p><h2>④ <b>Comunicação:<\/b> <i>Contar o que mudou<\/i><\/h2><p><b>Canais:<\/b> Notificação dentro do app, a seção “Novidades” da loja (as <i>release notes<\/i>), e-mail, redes sociais e FAQ. Para a equipe, Slack ou Teams.<\/p><p><b>Reduzir resistência:<\/b> Toda mudança de tela incomoda no começo. Explique o que melhorou e por quê, mostre capturas das novidades, ofereça um tutorial rápido no app e, se der, um período para alternar entre a versão antiga e a nova.<\/p><p><b>Medir a reação:<\/b> Pesquisas no app, avaliações nas lojas e métricas de adoção, que mostram quantos já atualizaram e se estão usando as funções novas.<\/p><p class=\"dica\"><b>Dica de ouro:<\/b> Versão nova deu problema? Primeiro conter (git revert ou feature flag), depois corrigir com calma.<\/p>", "qs": [{ "q": "Qual é o principal objetivo de uma atualização incremental em um aplicativo móvel?", "o": ["Substituir completamente a versão anterior do aplicativo.", "Implementar melhorias e correções sem grandes mudanças.", "Redesenhar a interface do usuário de forma radical.", "Alterar todo o código do aplicativo de uma só vez."], "t": "per" }, { "q": "Qual das ferramentas abaixo é ideal para ativar ou desativar funcionalidades sem precisar lançar uma nova versão do app?", "o": ["Firebase Remote Config", "Google Play Console", "GitHub", "Android Studio"], "t": "per" }, { "q": "O que são Feature Flags em apps?", "o": ["Etiquetas visuais para organizar o código.", "Mecanismos para ativar/desativar funções.", "Alertas automáticos para detectar falhas.", "Regras da App Store sobre apps inseguros."], "t": "per" }, { "q": "Na versão 2.3.1, qual número muda ao lançar uma função nova?", "o": ["O 2 (MAJOR)", "O 3 (MINOR)", "O 1 (PATCH)", "Nenhum deles"], "t": "mc" }, { "q": "Qual seria a próxima versão de 2.3.1 após uma correção de bug?", "o": ["2.3.2", "2.4.0", "3.0.0", "2.3.1.1"], "t": "mc" }, { "q": "O que é canary release?", "o": ["Publicar para todos ao mesmo tempo", "Apagar a versão anterior", "Liberar primeiro para poucos usuários", "Trocar o ícone do app"], "t": "mc" }, { "q": "O que é um changelog?", "o": ["O histórico de senhas", "Um gráfico de cronograma", "Uma política de privacidade", "A lista do que mudou em cada versão"], "t": "mc" }, { "q": "Como comunicar uma atualização de segurança?", "o": ["Publicar todos os detalhes da falha", "Não avisar ninguém", "Avisar os usuários sem expor detalhes da falha", "Mudar o nome do app"], "t": "mc" }, { "q": "Escreva as release notes de uma atualização com uma correção e uma função nova, em tom amigável. Indique o número da versão.", "o": null, "t": "ab" }, { "q": "Explique por que todo mundo editar direto no main é um problema e como as branches ajudam.", "o": null, "t": "ab" }] }, { "n": 28, "tema": "Análise de desempenho e melhoria contínua", "frase": "Dados guiam a evolução", "html": "<div data-flow><h1>Semana 28<\/h1><p class=\"tema\">Análise de desempenho e melhoria contínua<\/p><p class=\"frase\">Dados guiam a evolução<\/p><\/div><h2>① <b>Análise de desempenho:<\/b> <i>Entender como o app é usado<\/i><\/h2><p><b>Por que analisar:<\/b> Depois de publicado, o app é usado de jeitos que a equipe não imaginou. Os dados mostram quais funções as pessoas adoram, q
